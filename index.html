<\/td><td>因為那奧祕<\/td><td>保羅慣用來指神的奧祕；這裡是倒影<\/td><\/tr><tr><td>ἤδη ἐνεργεῖται<\/td><td>ēdē energeitai<\/td><td>已經在運行<\/td><td>追蹤四 ἐνέργεια 的第一站<\/td><\/tr><tr><td>τῆς ἀνομίας<\/td><td>tēs anomias<\/td><td>不法的<\/td><td>與「奧祕」被拆開，放在句末<\/td><\/tr><tr><td>ὁ κατέχων ἄρτι<\/td><td>ho katechōn arti<\/td><td>那攔阻者現在<\/td><td>陽性：一個位格，或一個代表<\/td><\/tr><tr><td>ἕως ἐκ μέσου γένηται<\/td><td>heōs ek mesou genētai<\/td><td>直到從中間被挪開<\/td><td>直譯「從中間出去」<\/td><\/tr><\/table>","gram":"<p><strong>2:7 的字序很講究。<\/strong>τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας（to gar mystērion ēdē energeitai tēs anomias）：「奧祕」在句首，「不法的」被拆到句末，中間夾著 ἤδη ἐνεργεῖται（ēdē energeitai），「已經在運行」。強調落在「已經」上：大罪人還沒顯露，他的原理已經在工作。<\/p><p>μυστήριον（mystērion） 在保羅書信裡，幾乎都指神隱藏、如今顯明的計畫——歌羅西書講義講過，那奧祕就是「基督在你們心裡成了有榮耀的盼望」（西 1:27）。這裡卻有一個「不法的奧祕」：撒但也有它隱藏的工作，模仿神的作法。ἐνεργεῖται（energeitai） 是追蹤四的第一站，下一站是 2:9「撒但的運動」，再下一站是 2:11 神送去的「生發錯誤的心」，最後在 2:17 落到「善行」。<\/p><p>後半句 μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται（monon ho katechōn arti heōs ek mesou genētai） 省略了動詞，要從上文補「攔阻著」。μόνον（monon）「只是」把前半句的威脅圍了一道籬笆。ἐκ μέσου γένηται（ek mesou genētai） 直譯「從中間出去」，是挪開的慣用語；主詞是攔阻者，不是不法的人。被誰挪開？經文沒有說，各家照 2:6 的讀法各自補上。<\/p>","exp":"<p>「因為那不法的隱意已經發動，只是現在有一個攔阻的，等到那攔阻的被除去」（2:7）。這一節有兩個時間：「已經」和「現在」。已經：不法不是遙遠的未來，保羅寫信的時候就在運行。現在：它被攔著，還不能完全露面。我們就活在這兩個字中間——邪惡真實，但不是無限。<\/p><p>這一節把整段的鏡頭從未來拉回現在。保羅不是在預告一個將來才需要擔心的人，他是在說：那個「高抬自己」的原理，今天就在運行。約翰說「現在已經有好些敵基督的出來了」（約壹 2:18），是同一個觀察。所以等候主的人不必盯著新聞找那一位，該警醒的是今天在自己身上運行的那一點點不法。<strong>不法的奧祕，在我不肯被任何人管的那一刻，就已經發動了。<\/strong><\/p><p>但這一節的重心不在恐懼，在那個「只是」。邪惡的工作有一個「直到」，攔阻者有一個「現在」。以弗所書講義講過屬靈爭戰：我們與執政的、掌權的爭戰，但不是在平手的戰場上。神把籬笆設在哪裡，邪惡就到哪裡為止。帖撒羅尼迦人在逼迫中可以知道：今天加在他們身上的惡，也在這道籬笆之內。<\/p>"},{"a":8,"z":8,"star":3,"grk":"<p lang=\"grc\">καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος Ἰησοῦς ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,<\/p>","lit":"<p>那時那不法者必被顯露出來，主耶穌要用他口中的氣除滅他，並用他降臨的顯現使他失效；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀποκαλυφθήσεται ὁ ἄνομος<\/td><td>apokalyphthēsetai ho anomos<\/td><td>那不法者必被顯露<\/td><td>未來被動；和合本「不法的人」<\/td><\/tr><tr><td>ἀνελεῖ<\/td><td>anelei<\/td><td>除滅<\/td><td>賽 11:4 七十士譯本同字；RP 作 ἀναλώσει<\/td><\/tr><tr><td>τῷ πνεύματι τοῦ στόματος αὐτοῦ<\/td><td>tō pneumati tou stomatos autou<\/td><td>用他口中的氣<\/td><td>πνεῦμα：氣、風、靈<\/td><\/tr><tr><td>καταργήσει<\/td><td>katargēsei<\/td><td>使失效<\/td><td>保羅愛用的字：使之歸於無有<\/td><\/tr><tr><td>τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ<\/td><td>tē epiphaneia tēs parousias autou<\/td><td>用他降臨的顯現<\/td><td>一節三個「顯」：追蹤一的高峰<\/td><\/tr><\/table>","gram":"<p><strong>2:8 是一個關係子句的開頭，一路連到 2:12。<\/strong>καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος（kai tote apokalyphthēsetai ho anomos）：大罪人終於顯露，可是同一個句子還沒結束，ὃν ὁ κύριος Ἰησοῦς ἀνελεῖ（hon ho kyrios Iēsous anelei） 就接上來了——他出場和他被除滅，寫在同一口氣裡。一節裡有三個「顯」字：ἀποκαλυφθήσεται（apokalyphthēsetai）、ἐπιφανείᾳ（epiphaneia）、παρουσίας（parousias）。大罪人有他的「顯露」，主耶穌有「降臨的顯現」：顯現對顯露，光一照，影子就沒了。<\/p><p>τῷ πνεύματι τοῦ στόματος αὐτοῦ（tō pneumati tou stomatos autou） 化用賽 11:4，「以嘴裡的氣殺戮惡人」（賽 11:4）。七十士譯本作 ἐν πνεύματι διὰ χειλέων ἀνελεῖ ἀσεβῆ（en pneumati dia cheileōn anelei asebē），動詞相同。在以賽亞書，這是從耶西的根所發的那一位王；保羅直接寫出他的名字：ὁ κύριος Ἰησοῦς（ho kyrios Iēsous）。保羅沒有標明引用，所以本講義說「化用」「這使我們想起」，不說「應驗」。καταργήσει（katargēsei） 是保羅愛用的動詞，意思是「使之失效、歸於無有」，他也用它說死亡最後被廢掉。<\/p><blockquote><p>◆ 經文鑑別 2:8：SBLGNT 作 ἀνελεῖ（除滅；早期抄本多作此讀，拼法略有出入），RP 與拜占庭傳統作 ἀναλώσει（消耗、吞滅）。本講義判斷：取 ἀνελεῖ（anelei）。它正是賽 11:4 七十士譯本的字，保羅的耳朵裡就是這句經文；改成 ἀναλώσει（analōsei），反而失去了與以賽亞書的回聲。和合本「滅絕」兩讀都說得通。另，RP 無「耶穌」，和合本跟批判本作「主耶穌」。<\/p><\/blockquote><p><strong>千禧年三觀<\/strong>對 2:8 的時間各有安排：歷史前千禧年派與時代論前千禧年派認為主降臨廢掉不法者之後，接著有一千年的國度；無千禧年派認為主這一次降臨就結束歷史，一千年是象徵教會時代；後千禧年派認為福音先大大興旺，主在千禧年之後降臨。三派在福音派之內，都相信 2:8 這一幕必然發生，而且是主耶穌親自做的。<\/p>","exp":"<p>「那時這不法的人必顯露出來。主耶穌要用口中的氣滅絕他，用降臨的榮光廢掉他」（2:8）。從全卷地勢的最低點 2:4，走四節就到了 2:8，高度從谷底一下拉到接近山頂。這就是保羅多出來的第三筆：主口中的氣。<\/p><p>這場勝利簡單到沒有戲劇性。沒有三百回合的大戰，沒有雙方勢均力敵的拉鋸。大罪人花了整整一節爬上神的殿，主耶穌只吹了一口氣。他的「降臨」本身就是審判：他一出現，那個自稱是神的就失效了。像一盞燈打開，黑暗不需要被說服，只是不在了。<\/p><p>這一節要讀到 2:2 去。帖撒羅尼迦人怕的是那一天，保羅給他們看那一天的結局。<strong>知道結局的人不會被過程嚇倒。<\/strong>看一場已經知道比分的比賽，中間落後幾分，你不會跳起來；你會安靜看完。所以末日的事講得再多，落點都只有一個：不要驚慌。<\/p><p>以賽亞描寫的是從耶西的根所發的那一位王：「以口中的杖擊打世界，以嘴裡的氣殺戮惡人」（賽 11:4）。保羅把這位王的名字寫了出來：主耶穌。他不必拿武器，他說話、他呼氣，就是審判。帖撒羅尼迦人等候的，正是這一位。<\/p><p>321 說「讓耶穌作王」，在全卷沒有比這一節更短的畫面：真正的王一口氣就勝了。又說「無己戰勝撒但」，這一節讓我們看見它的根：<strong>不是因為我們比撒但強，是因為我們躲在一位一口氣就能勝的主後面。<\/strong>我們不必自己去找大罪人、對付大罪人，那不是我們的位子。我們的位子是站穩，主的位子是得勝。回到本位的人，反而最平安。<\/p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">οὗ ἐστιν ἡ παρουσία κατʼ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους<\/p><p lang=\"grc\">καὶ ἐν πάσῃ ἀπάτῃ ἀδικίας τοῖς ἀπολλυμένοις, ἀνθʼ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·<\/p>","lit":"<p>那人的降臨是照著撒但的運行，帶著一切的能力，和虛謊的神蹟與奇事，<\/p><p>並帶著一切不義的詭詐，向那些正在滅亡的人；因為他們沒有接受那對真理的愛，好叫他們得救。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἡ παρουσία<\/td><td>hē parousia<\/td><td>那人的降臨<\/td><td>連「降臨」這個字都被冒用<\/td><\/tr><tr><td>κατʼ ἐνέργειαν τοῦ Σατανᾶ<\/td><td>kat' energeian tou Satana<\/td><td>照著撒但的運行<\/td><td>追蹤四<\/td><\/tr><tr><td>σημείοις καὶ τέρασιν ψεύδους<\/td><td>sēmeiois kai terasin pseudous<\/td><td>虛謊的神蹟與奇事<\/td><td>神蹟為謊言服務<\/td><\/tr><tr><td>ἀπάτῃ ἀδικίας<\/td><td>apatē adikias<\/td><td>不義的詭詐<\/td><td>與 2:3 ἐξαπατήσῃ 同字根<\/td><\/tr><tr><td>τοῖς ἀπολλυμένοις<\/td><td>tois apollymenois<\/td><td>那些正在滅亡的<\/td><td>現在分詞：過程，還沒有定局<\/td><\/tr><tr><td>τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο<\/td><td>tēn agapēn tēs alētheias ouk edexanto<\/td><td>沒有接受對真理的愛<\/td><td>δέχομαι：接待客人<\/td><\/tr><tr><td>εἰς τὸ σωθῆναι αὐτούς<\/td><td>eis to sōthēnai autous<\/td><td>好叫他們得救<\/td><td>那份愛原是為救他們而來<\/td><\/tr><\/table>","gram":"<p><strong>2:9 用 οὗ（hou） 接上 2:8，主詞仍是那不法者。<\/strong>οὗ ἐστιν ἡ παρουσία κατʼ ἐνέργειαν τοῦ Σατανᾶ（hou estin hē parousia kat' energeian tou Satana）：保羅給他用了 παρουσία（parousia） 這個字——全卷留給主耶穌「降臨」的字。他有他的降臨，是仿冒品。來源是 ἐνέργειαν τοῦ Σατανᾶ（energeian tou Satana），撒但的運行，追蹤四的第二站。<\/p><p>ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους（en pasē dynamei kai sēmeiois kai terasin pseudous）：能力、神蹟、奇事三個字，正是新約形容主耶穌與使徒作為的三個字（徒 2:22 也是這一組）。ψεύδους（pseudous） 可以只修飾奇事，也可以管三樣；不論哪一種，意思都是：這些作為為謊言服務。<strong>神蹟本身不證明真理。<\/strong><\/p><p>2:10 ἐν πάσῃ ἀπάτῃ ἀδικίας τοῖς ἀπολλυμένοις（en pasē apatē adikias tois apollymenois）：ἀπάτη（apatē） 與 2:3 ἐξαπατήσῃ（exapatēsē） 同字根，欺騙的線一路延續。τοῖς ἀπολλυμένοις（tois apollymenois） 是現在分詞，「正在滅亡的人」，是一個過程。原因由 ἀνθʼ ὧν（anth' hōn） 帶出：τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο（tēn agapēn tēs alētheias ouk edexanto）。注意不是「沒有接受真理」，是「沒有接受對真理的愛」；δέχομαι（dechomai） 是迎接客人的字。最後 εἰς τὸ σωθῆναι αὐτούς（eis to sōthēnai autous） 表目的：那份愛真理的心，本來是要送給他們、叫他們得救的。這一節是 2:11 的前提，次序不可顛倒。<\/p>","exp":"<p>〔太〕太 24:24（馬太福音講義第 24 章）<\/p><p>主耶穌早已說過：「因為假基督、假先知將要起來，顯大神蹟、大奇事，倘若能行，連選民也就迷惑了」（太 24:24）。保羅說的是同一件事：「這不法的人來，是照撒但的運動，行各樣的異能、神蹟，和一切虛假的奇事」（2:9）。撒但不是用醜陋的東西騙人，是用看起來最屬靈的東西。他連「降臨」這個字都要偷去用。<\/p><p>這對今天很實際。一則末日訊息附上一段「神蹟見證」，一位自稱先知的人說他的預言「應驗過」，人就容易放下察驗。可是 2:9 說，神蹟可以是謊言的工具。<strong>分辨的標準不是「有沒有能力」，是「合不合真理」。<\/strong>所以保羅在 2:15 叫他們回到所領受的教訓，不是回到最近一次看見的奇事。<\/p><p>然後是全段最要緊的一句：「因他們不領受愛真理的心，使他們得救」（2:10）。人被騙，不是因為不夠聰明，是因為不愛真理。真理有時候不舒服，謊言常常很好聽；一個人如果只想聽好聽的，再明白的真理擺在面前，他也會繞過去。可是請看句子的最後幾個字：「使他們得救」。那份愛真理的心，是神原本要給的禮物。<strong>門是開著的，是人沒有接。<\/strong>這使我們想起保羅另一句話：「他願意萬人得救，明白真道」（提前 2:4）。讀 2:11 之前，一定要先讀到這裡。<\/p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">καὶ διὰ τοῦτο πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,<\/p><p lang=\"grc\">ἵνα κριθῶσιν πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες τῇ ἀδικίᾳ.<\/p>","lit":"<p>也因為這個緣故，神給他們送去迷惑的運行，叫他們相信那謊言，<\/p><p>好叫一切沒有信真理、反而喜悅不義的人，都被審判。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>καὶ διὰ τοῦτο<\/td><td>kai dia touto<\/td><td>也因為這個緣故<\/td><td>指回 2:10：先不領受愛真理的心<\/td><\/tr><tr><td>πέμπει<\/td><td>pempei<\/td><td>送去<\/td><td>現在式；RP 作未來式 πέμψει<\/td><\/tr><tr><td>ἐνέργειαν πλάνης<\/td><td>energeian planēs<\/td><td>迷惑的運行<\/td><td>追蹤四第三站：與 2:9 同一個字<\/td><\/tr><tr><td>εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει<\/td><td>eis to pisteusai autous tō pseudei<\/td><td>叫他們相信那謊言<\/td><td>有冠詞：那一個謊言<\/td><\/tr><tr><td>ἵνα κριθῶσιν<\/td><td>hina krithōsin<\/td><td>好叫他們被審判<\/td><td>審判在選擇之後<\/td><\/tr><tr><td>εὐδοκήσαντες τῇ ἀδικίᾳ<\/td><td>eudokēsantes tē adikia<\/td><td>喜悅不義<\/td><td>根在喜好，不在頭腦<\/td><\/tr><\/table>","gram":"<p><strong>2:11 由 καὶ διὰ τοῦτο（kai dia touto） 起頭，「也因為這個緣故」——這個緣故就是 2:10。<\/strong>次序在原文是鎖死的：先是人「不領受愛真理的心」（2:10），然後才是 πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης（pempei autois ho theos energeian planēs）。神的動作是對人的選擇的回應，不是起點。πέμπει（pempei） 是現在式（SBLGNT），RP 作未來式 πέμψει（pempsei），意思差別不大。<\/p><p>ἐνέργειαν πλάνης（energeian planēs） 用的是 2:9「撒但的運動」同一個字。同一股迷惑的力量，在 2:9 從撒但的角度看，在 2:11 從神的主權看：撒但在運行，神沒有失去掌管，祂讓人自己選擇的東西臨到他身上。這和羅馬書的語言幾乎一樣：人「將神的真實變為虛謊」（羅 1:25），於是三次「神任憑他們」（羅 1:24、26、28；希臘文 παρέδωκεν αὐτοὺς ὁ θεὸς（paredōken autous ho theos））。τῷ ψεύδει（tō pseudei） 有冠詞，羅 1:25 也有：那一個謊言，就是人可以代替神。<\/p><p>2:12 兩個不定過去分詞對排：οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες τῇ ἀδικίᾳ（hoi mē pisteusantes tē alētheia alla eudokēsantes tē adikia）。我們以為「不信真理」的反面是「信謊言」，保羅寫的卻是「喜悅不義」。<strong>問題的根不在頭腦，在喜好；不是想錯了，是愛錯了。<\/strong><\/p><p>神學讀法有二：① 強調神主動的審判，神真的「送去」迷惑，是對已經拒絕真理的人的司法判決（許多改革宗釋經者）；② 強調神的任憑，神收回攔阻，把人自己選的交還給他（許多循道衛理宗與福音派釋經者）。兩種讀法都承認 2:10 在先，都不說神隨意叫人沉淪。<\/p>","exp":"<p>「故此，神就給他們一個生發錯誤的心，叫他們信從虛謊」（2:11）。這是全章最容易被講歪的一節。有人用它說：神早就決定某些人要被騙，所以他們沒救了；也有人拿它來論斷離開教會的人：「他走了，就是神給了他錯誤的心。」兩種講法都跳過了前一節。<\/p><p>次序是這樣的：先有一份禮物送到門口，「愛真理的心」，目的是「使他們得救」（2:10）；人不開門，「不領受」；然後神尊重他的選擇，讓他得到他要的，「信從虛謊」。這使我們想起羅馬書：「神任憑他們」（羅 1:24）。<strong>神把人自己選的交還給他。<\/strong>這不是神設下陷阱，是神讓人拒絕的後果成為真實。<\/p><p>2:12 再把根挖出來：他們不是「不信真理」之後剛好「信了謊言」，而是「倒喜愛不義」。愛錯了，信就跟著錯。這也是 321 說有己的根：人不是不知道，是不想要。所以真正的保護不是更多的末日知識，是一顆愛真理的心——寧可聽見不舒服的真話，也不要舒服的謊言。<\/p><p>一位正在懷疑、正在掙扎的人讀到這兩節，該聽見的不是「你完了」，而是「門還開著」。神的心意寫在 2:10 的最後幾個字：「使他們得救」；彼得也說，主「不願有一人沉淪，乃願人人都悔改」（彼後 3:9）。還在掙扎的人，正是還沒有關門的人。何況緊接著的 2:13，保羅就說「但我們」——鏡頭轉向蒙愛的人。<\/p>"},{"a":13,"z":13,"star":3,"grk":"<p lang=\"grc\">Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,<\/p>","lit":"<p>但我們該常常為你們感謝神，被主所愛的弟兄們，因為神揀選了你們作初熟的果子（另一讀：從起初），以致得救，在聖靈的成聖裡，也在對真理的信裡；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἡμεῖς δὲ<\/td><td>Hēmeis de<\/td><td>但我們<\/td><td>全卷樞紐：鏡頭從沉淪者轉到蒙愛者<\/td><\/tr><tr><td>ὀφείλομεν εὐχαριστεῖν<\/td><td>opheilomen eucharistein<\/td><td>我們該感謝<\/td><td>欠債式的感謝，與 1:3 同<\/td><\/tr><tr><td>ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου<\/td><td>adelphoi ēgapēmenoi hypo kyriou<\/td><td>被主所愛的弟兄們<\/td><td>完成被動：被愛，而且一直被愛<\/td><\/tr><tr><td>εἵλατο<\/td><td>heilato<\/td><td>揀選、選取<\/td><td>αἱρέομαι；新約只用三次<\/td><\/tr><tr><td>ἀπαρχὴν<\/td><td>aparchēn<\/td><td>初熟的果子<\/td><td>SBLGNT；另一讀 ἀπʼ ἀρχῆς「從起初」<\/td><\/tr><tr><td>ἐν ἁγιασμῷ πνεύματος<\/td><td>en hagiasmō pneumatos<\/td><td>在聖靈的成聖裡<\/td><td>和合本「被聖靈感動，成為聖潔」<\/td><\/tr><tr><td>πίστει ἀληθείας<\/td><td>pistei alētheias<\/td><td>對真理的信<\/td><td>追蹤二翻轉：2:12 不信真理<\/td><\/tr><\/table>","gram":"<p><strong>2:13 用 Ἡμεῖς δὲ（Hēmeis de） 起頭，強調的代名詞放在句首：「但我們」。<\/strong>2:3--12 是沉淪者的世界——欺騙、虛謊、定罪；這一個 δὲ（de） 把鏡頭轉到「主所愛的弟兄們」。ὀφείλομεν εὐχαριστεῖν（opheilomen eucharistein） 與 1:3 相同，「我們欠著要感謝」：不是冷淡的公式，是還不完的債。<\/p><p>ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου（adelphoi ēgapēmenoi hypo kyriou）：ἠγαπημένοι（ēgapēmenoi） 是完成被動分詞，被愛而且持續在被愛的狀態裡。前書說「被神所愛的弟兄啊」（帖前 1:4），這裡說「主所愛的」，主就是主耶穌。這使我們想起摩西為便雅憫的祝福：「耶和華所親愛的必同耶和華安然居住」（申 33:12）——舊約「耶和華所親愛的」，保羅寫成「主所愛的」。<\/p><blockquote><p>◆ 經文鑑別 2:13：SBLGNT、NA28 與 WH 作 εἵλατο ὑμᾶς ὁ θεὸς ἀπαρχὴν（heilato hymas ho theos aparchēn），「神揀選你們作初熟的果子」；Treg、NIV、RP 作 ἀπʼ ἀρχῆς（ap' archēs），「從起初」，和合本「他從起初揀選了你們」跟的是這一讀。古抄本以大寫字母連寫，兩讀只差最後一個字母。支持「初熟」的理由：保羅常用這個字，例如以拜尼土「是歸基督初結的果子」（羅 16:5）；他講永恆的揀選，習慣說「創立世界以前」（弗 1:4），不說「從起初」。支持「從起初」的理由：帖撒羅尼迦人並不是馬其頓第一批信主的人，腓立比在先；而且全句講揀選，「從起初」順理成章。本講義判斷：兩讀幾乎勢均力敵，略傾向 SBLGNT 的「初熟的果子」——他們是神在那地的第一批收成，保證後面還有；但經文照和合本「從起初」講不算錯，兩個意思都在保羅的神學裡。App 原文欄照 SBLGNT，並加註和合本所跟的讀法。<\/p><\/blockquote><p>εἵλατο（heilato） 是 αἱρέομαι（haireomai），新約只用三次，強調主動地「挑出來」。揀選之後是兩個 ἐν（en） 片語的方式：ἐν ἁγιασμῷ πνεύματος（en hagiasmō pneumatos），直譯「在聖靈的成聖裡」，和合本「被聖靈感動，成為聖潔」是解釋性譯法；καὶ πίστει ἀληθείας（kai pistei alētheias），「在對真理的信裡」。神的揀選與人的相信寫在同一句裡，保羅不覺得需要調和（揀選與人的責任，回指以弗所書第 1 章議題）。ἀληθείας（alētheias） 在 2:10、12 是被拒絕的，到這裡被相信：追蹤二在這一節翻了過來。<\/p>","exp":"<p>「主所愛的弟兄們哪，我們本該常為你們感謝神；因為他從起初揀選了你們，叫你們因信真道，又被聖靈感動，成為聖潔，能以得救」（2:13）。全卷地勢的第二高點就在這裡，緊接在全章最暗的十節之後。<\/p><p>想像一個人在浪裡，前面十節，保羅把浪有多大都說了：背叛、不法、撒但的運行、虛假的奇事、信從虛謊的人。然後他說：「但我們」。<strong>2:1--12 讓人知道浪有多大，2:13--15 讓人知道船是誰的。<\/strong>帖撒羅尼迦人怕自己被留下、被錯過，保羅的回答不是一個日期，是一句話：你們是被主所愛的，神揀選了你們。<\/p><p>這一節也是全卷「搖動與堅固」的轉折點：2:2 是被搖動的心，2:13 是被揀選的人。一個人的穩定，不是從自己的感覺來，是從「被愛」這個完成式來——主愛了，而且一直愛著。浪會來，消息會來，這一個完成式不會被改寫。<\/p><p>不論讀「從起初」還是「初熟的果子」，安慰都一樣深。從起初：在一切消息出現以前，神已經選定了你，一則群組訊息改不了這件事。初熟的果子：你們是神在這座城裡的第一把收成，後面還有更多。一間只建立了幾個星期、被逼迫的教會，竟被稱為神收成的開端。<\/p><p>揀選在這裡不是拿來辯論的題目，是拿來安定人心的錨。而且它不是抽象的：神透過兩件事落實揀選——「被聖靈感動，成為聖潔」，和「因信真道」。321 說「聖靈是我的引導」，這一節說聖靈的工作是使人成聖；2:2 那個自稱「有靈」卻叫人驚慌的，不是這位聖靈。<strong>真正從聖靈來的，會把人帶向聖潔和真理，不會把人帶向恐慌。<\/strong><\/p>"},{"a":14,"z":14,"star":1,"grk":"<p lang=\"grc\">εἰς ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.<\/p>","lit":"<p>他藉著我們的福音呼召你們到這裡，為要得著我們主耶穌基督的榮耀。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εἰς ὃ<\/td><td>eis ho<\/td><td>到這裡<\/td><td>指 2:13 整個得救的過程<\/td><\/tr><tr><td>ἐκάλεσεν<\/td><td>ekalesen<\/td><td>呼召了<\/td><td>不定過去：那三個安息日的那一次<\/td><\/tr><tr><td>διὰ τοῦ εὐαγγελίου ἡμῶν<\/td><td>dia tou euangeliou hēmōn<\/td><td>藉著我們的福音<\/td><td>神的呼召，透過人的口<\/td><\/tr><tr><td>εἰς περιποίησιν δόξης<\/td><td>eis peripoiēsin doxēs<\/td><td>為要得著榮耀<\/td><td>περιποίησις：得著、歸為己有<\/td><\/tr><\/table>","gram":"<p><strong>2:14 用 εἰς ὃ（eis ho） 接續 2:13。<\/strong>ὃ（ho） 是中性關係代名詞，指的不是某一個字，是上一節整個得救的過程：揀選、成聖、相信。ἐκάλεσεν（ekalesen） 是不定過去式，指一次的事件——就是保羅在帖撒羅尼迦傳福音的那幾週。διὰ τοῦ εὐαγγελίου ἡμῶν（dia tou euangeliou hēmōn），「藉著我們的福音」：呼召的是神，傳的是人。<\/p><p>εἰς περιποίησιν δόξης（eis peripoiēsin doxēs）：περιποίησις（peripoiēsis） 是「得著、歸為己有」，前書說神「預定我們藉著我們主耶穌基督得救」（帖前 5:9），用的是同一個字。這裡要得著的是「我們主耶穌基督的榮光」，回接 1:10、12 的「得榮耀」。揀選、呼召、榮耀，排成一條線，與「所召來的人又稱他們為義；所稱為義的人又叫他們得榮耀」（羅 8:30）是同一個次序。<\/p>","exp":"<p>「神藉我們所傳的福音召你們到這地步，好得著我們主耶穌基督的榮光」（2:14）。2:13 講神在永恆裡的揀選，2:14 把它落到一個具體的日子：幾個月前，幾個外地人走進會堂，講了三個安息日的耶穌。<strong>神永恆的計畫，透過一次普通的傳福音臨到他們。<\/strong><\/p><p>這對受驚的教會很重要。他們可以回頭看：我們是怎樣信主的？不是因為一個異象或一則轉傳的消息，是因為有人把福音講清楚了。那個起點是真的，終點也會是真的：「好得著我們主耶穌基督的榮光」。<\/p><p>第 1 章說主要「在他聖徒的身上得榮耀」（1:10），這裡說聖徒要得著主的榮光。榮耀是雙向的，這是全卷「榮」的那一個姿勢：抬頭。一個知道自己被呼召去得著榮耀的人，不必怕被一則消息拿走甚麼。終點已經寫好，路上的浪只是浪。<\/p>"},{"a":15,"z":15,"star":2,"grk":"<p lang=\"grc\">ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε διʼ ἐπιστολῆς ἡμῶν.<\/p>","lit":"<p>所以，弟兄們，你們要站住，並且要抓緊那些傳下來的教訓，就是你們被教導的，無論是藉著言語，或是藉著我們的書信。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἄρα οὖν<\/td><td>ara oun<\/td><td>所以<\/td><td>雙重推論詞：全段的結論<\/td><\/tr><tr><td>στήκετε<\/td><td>stēkete<\/td><td>你們要站住<\/td><td>現在命令式：持續站著；對照 2:2「動心」<\/td><\/tr><tr><td>κρατεῖτε τὰς παραδόσεις<\/td><td>krateite tas paradoseis<\/td><td>抓緊那些傳下來的<\/td><td>παράδοσις 全卷第一次；3:6 再出現<\/td><\/tr><tr><td>ἃς ἐδιδάχθητε<\/td><td>has edidachthēte<\/td><td>你們被教導的<\/td><td>已經交付、已經領受的<\/td><\/tr><tr><td>εἴτε διὰ λόγου εἴτε διʼ ἐπιστολῆς ἡμῶν<\/td><td>eite dia logou eite di' epistolēs hēmōn<\/td><td>或藉著言語，或藉著我們的書信<\/td><td>對照 2:2 的「言語」與冒名的「書信」<\/td><\/tr><\/table>","gram":"<p><strong>2:15 用 ἄρα οὖν（ara oun） 收束整段<\/strong>，兩個推論詞疊在一起，「所以，因此」：從 2:1 到 2:14 的一切，結論就是這兩個命令。<\/p><p>στήκετε（stēkete） 是現在命令式，「繼續站著」。它和 2:2 的 σαλευθῆναι（saleuthēnai） 正好相反：一個是被浪打歪，一個是腳站定。追蹤三在這裡從「搖動」翻成「堅固」。κρατεῖτε（krateite） 是「抓緊、握住不放」。τὰς παραδόσεις（tas paradoseis） 是「傳下來的東西」，全卷第一次出現，3:6 再出現。保羅用這個字是正面的，指使徒交付的福音內容；主耶穌批評法利賽人時用同一個字是負面的，「你們為甚麼因著你們的遺傳犯神的誡命呢」（太 15:3）。同一個字，分別在於源頭：是使徒交付的，還是人加上的。<\/p><p>εἴτε διὰ λόγου εἴτε διʼ ἐπιστολῆς ἡμῶν（eite dia logou eite di' epistolēs hēmōn）：「言語」與「書信」兩個字，2:2 剛剛出現過。2:2 是一個 λόγος（logos）、一封「好像出於我們」的書信；2:15 是真的言語、ἡμῶν（hēmōn）「我們的」書信。保羅用同一組字，把假的和真的並排放著。3:17 他還會親筆簽名，讓人可以核對。<\/p><p>「口傳的」今天在哪裡，有兩種立場：<strong>聖傳<\/strong>——天主教與東正教主張使徒的口傳教訓延續在教會的聖傳裡，與聖經並列；<strong>惟獨聖經<\/strong>——改教傳統主張使徒的口傳教訓已經寫進新約，聖經是唯一無誤的最終權威，教會傳統有價值，但在聖經之下。本講義站在惟獨聖經的立場，同時尊重持守聖傳的弟兄姊妹（立場五）。<\/p>","exp":"<p>「所以，弟兄們，你們要站立得穩，凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守」（2:15）。本章的章題就在這裡。第 1 章的姿勢是抬頭，第 2 章的姿勢是站穩。<\/p><p>站穩靠甚麼？不是靠一張更準確的末日圖表，是靠「所領受的教訓」。帖撒羅尼迦人被一則消息搖動，保羅叫他們回到已經領受的東西，不是追下一則消息。<strong>新消息不能拿來檢驗舊教訓，舊教訓要拿來檢驗新消息。<\/strong>今天，使徒「信上寫的」就在我們手裡，就是聖經。這就是 321 說的「聖經是我的準則」：任何預言、異象、轉傳，都拿去對那個筆跡。<\/p><p>但這一節也最容易被誤用。2:15 的「教訓」是使徒的教訓，不是教會的規矩、宗派的傳統，也不是牧者或領袖個人的話。拿這一節要求會眾對講台上的每一句話「都要堅守」，就是把人的話放到使徒的位子上，正好是 2:4 那個坐錯位子的毛病的小版本。<\/p><p>真正的堅守反而鼓勵查考。帖撒羅尼迦的下一站是庇哩亞，那裡的人「甘心領受這道，天天考查聖經，要曉得這道是與不是」（徒 17:11）。一個站得穩的人不怕問問題，因為他知道自己站在甚麼上面。會問、會查、會對筆跡的教會，才不會被下一則「主的日子已經到了」推倒。<\/p>"},{"a":16,"z":17,"star":1,"grk":"<p lang=\"grc\">Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ θεὸς ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,<\/p><p lang=\"grc\">παρακαλέσαι ὑμῶν τὰς καρδίας καὶ στηρίξαι ἐν παντὶ ἔργῳ καὶ λόγῳ ἀγαθῷ.<\/p>","lit":"<p>但願我們的主耶穌基督自己，和神我們的父，就是那愛了我們、在恩典中賜下永遠的安慰和美好盼望的，<\/p><p>安慰你們的心，並在一切善工和善言上堅固你們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Αὐτὸς δὲ ὁ κύριος<\/td><td>Autos de ho kyrios<\/td><td>但主自己<\/td><td>3:16 同樣的開頭<\/td><\/tr><tr><td>ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς<\/td><td>ho agapēsas hēmas kai dous<\/td><td>那愛了我們並賜下的<\/td><td>不定過去：已經做成的事<\/td><\/tr><tr><td>παράκλησιν αἰωνίαν<\/td><td>paraklēsin aiōnian<\/td><td>永遠的安慰<\/td><td>對照 1:9「永遠沉淪」<\/td><\/tr><tr><td>ἐλπίδα ἀγαθὴν ἐν χάριτι<\/td><td>elpida agathēn en chariti<\/td><td>在恩典中美好的盼望<\/td><td>盼望的來源是恩典<\/td><\/tr><tr><td>παρακαλέσαι<\/td><td>parakalesai<\/td><td>願他安慰<\/td><td>單數祈願式<\/td><\/tr><tr><td>στηρίξαι<\/td><td>stērixai<\/td><td>願他堅固<\/td><td>單數；對照 2:2「動心」<\/td><\/tr><\/table>","gram":"<p><strong>2:16--17 是一句禱告。<\/strong>Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ θεὸς ὁ πατὴρ ἡμῶν（Autos de ho kyrios hēmōn Iēsous Christos kai theos ho patēr hēmōn）：Αὐτὸς（Autos）「親自」放在句首，3:16 會用同一個字開頭。這裡主耶穌排在父神之前，在保羅的祝福裡並不常見。<\/p><p>更值得注意的是動詞：兩位主詞，接的卻是單數的 παρακαλέσαι（parakalesai） 和 στηρίξαι（不定過去祈願式，「願他安慰、願他堅固」）。前書也有同樣的寫法（帖前 3:11）。保羅沒有寫一篇論文說耶穌與父同等，他在禱告的文法裡就把兩位放在同一個動詞下面——這是初代教會的基督論。<\/p><p>ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς（ho agapēsas hēmas kai dous） 是不定過去分詞，愛與賜都是已經做成的事。賜下的是 παράκλησιν αἰωνίαν（paraklēsin aiōnian），「永遠的安慰」，全卷第二個「永遠」，正好對著 1:9 的 ὄλεθρον αἰώνιον（olethron aiōnion）「永遠沉淪」。στηρίξαι（stērixai） 是追蹤三的「堅固」端；ἐν παντὶ ἔργῳ καὶ λόγῳ ἀγαθῷ（en panti ergō kai logō agathō） 的 ἔργῳ（ergō），讓 2:9 撒但的「運行」在這裡回到「善行」，並預告 3:13 的「行善」。<\/p>","exp":"<p>第 2 章不是結束在一張圖表上，是結束在一句禱告上。保羅講完了大罪人、攔阻的、虛假的奇事，最後沒有說「所以你們要準備好」，而是為他們求：「安慰你們的心，並且在一切善行善言上堅固你們」（2:17）。<\/p><p>全卷有兩個「永遠」。一個是「永遠沉淪，離開主的面和他權能的榮光」（1:9），一個是「永遠的安慰」。<strong>地獄最深的痛是沒有神，天堂最深的福是被神愛。<\/strong>這個安慰不是一種情緒，是「那愛我們」的父已經賜下的東西，在恩典裡，不在我們的表現裡。<\/p><p>被搖動的心，要被安慰，也要被堅固。注意堅固的地方：「善行善言」，就是一般的日子裡，好好做事、好好說話。保羅把會眾的眼睛從末日拉回今天的廚房和工作桌，第 3 章就要講這件事。一個被主安慰的人，不會急著轉傳末日訊息，他會安靜地把今天的工做好。這一章從「不要驚慌」開始，在「主親自安慰」裡停下；到 3:16，保羅還要再說一次：「願賜平安的主隨時隨事親自給你們平安」（3:16）。<\/p>"}],"3":[{"a":1,"z":2,"star":1,"grk":"<p lang=\"grc\">Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,<\/p><p lang=\"grc\">καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.<\/p>","lit":"<p>至於其餘的，弟兄們，你們要為我們禱告，好叫主的話奔跑並且得榮耀，正如也在你們那裡一樣，<\/p><p>並且好叫我們被救出來，脫離那些出格的和邪惡的人；因為不是眾人都有那信。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Τὸ λοιπόν<\/td><td>To loipon<\/td><td>至於其餘的<\/td><td>轉入信的最後一部分，不是「最後一句」<\/td><\/tr><tr><td>προσεύχεσθε<\/td><td>proseuchesthe<\/td><td>你們要禱告<\/td><td>現在式命令：持續地為我們禱告<\/td><\/tr><tr><td>τρέχῃ<\/td><td>trechē<\/td><td>奔跑<\/td><td>主的話像一個跑者<\/td><\/tr><tr><td>δοξάζηται<\/td><td>doxazētai<\/td><td>得榮耀<\/td><td>被動：榮耀是旁人看見而歸給神的<\/td><\/tr><tr><td>ῥυσθῶμεν<\/td><td>rhysthōmen<\/td><td>我們被救出來<\/td><td>被動：救的是神<\/td><\/tr><tr><td>ἀτόπων<\/td><td>atopōn<\/td><td>不在其位、出格的<\/td><td>a＋topos：沒有位置、亂了位<\/td><\/tr><\/table>","gram":"<p><strong>3:1--2 是一個禱告請求，兩個 ἵνα（hina） 子句說出兩件要禱告的事：一件為道，一件為人。<\/strong><\/p><p>Τὸ λοιπόν（To loipon） 在保羅筆下常是「至於其餘的」，帶出信的最後一段，不一定是最後一句（腓立比書講義第 3 章講過同一個詞）。προσεύχεσθε（proseuchesthe） 是現在式命令，περὶ ἡμῶν（peri hēmōn） 放在動詞後面：剛被保羅代禱的教會（1:11；2:16--17），現在被請來為保羅代禱。<\/p><p>第一個 ἵνα（hina）：ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται（ho logos tou kyriou trechē kai doxazētai）。主詞不是宣教士，是「主的道」；動詞 τρέχῃ（trechē） 是「奔跑」，把道擬人化成一位跑者，這使我們想起詩 147:15 神的話頒行最快。καθὼς καὶ πρὸς ὑμᾶς（kathōs kai pros hymas） 是回憶：道已經在帖撒羅尼迦跑過一次。第二個 ἵνα（hina）：ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων（rhysthōmen apo tōn atopōn kai ponērōn anthrōpōn）。ἀτόπων（atopōn） 字面是「沒有位置的」，出格、亂來；πονηρῶν（ponērōn） 是邪惡，下一節的 τοῦ πονηροῦ（tou ponērou） 就從這個字接下去。<\/p><p>句尾 οὐ γὰρ πάντων ἡ πίστις（ou gar pantōn hē pistis） 以 γάρ（gar） 給理由。ἡ πίστις（hē pistis） 帶冠詞，可指「信心」，也可指「那信仰」；兩種讀法意思相近：不是人人都接受福音。這半句是全卷的鉸鏈，下一節立刻用 πιστὸς（pistos） 接住。<\/p>","exp":"<p><strong>「請你們為我們禱告，好叫主的道理快快行開，得著榮耀」（3:1）——保羅請一間只認識他三個安息日的教會為他禱告。<\/strong><\/p><p>第 2 章的大浪剛過，第 3 章第一句不是命令，是請求。屬靈父親向孩子說：為我禱告。這不是客套。一位使徒承認自己需要一群受逼迫、剛信主的人代禱，這本身就是一種謙卑：服事的人也在浪裡。<\/p><p>他求的第一件事不是自己平安，是「主的道理快快行開」。主角是道，不是保羅。華人教會為宣教士代禱，常常只求「出入平安、身體健康」；保羅教我們先求道能跑起來、主得榮耀，再求工人被保護。兩件都要求，次序不要倒過來。<\/p><p>第二件事很實際：「也叫我們脫離無理之惡人的手；因為人不都是有信心。」（3:2）保羅寫信時在哥林多，那裡正有人在會堂裡抗拒、毀謗（徒 18:6）。「無理」是出格：不講理、不按牌理。保羅沒有假裝這些人不存在，也沒有罵他們；他把他們交在禱告裡。<\/p><p>「人不都是有信心」是一句平靜的事實。傳福音的人會遇見不信的人，這不代表道失敗了。這半句話把我們的眼睛從人身上移開，預備聽見下一節：人的信會短缺，主的信實不會。<\/p>"},{"a":3,"z":3,"star":3,"grk":"<p lang=\"grc\">πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.<\/p>","lit":"<p>但主是信實的，他要堅固你們，並且看守你們脫離那惡者（或作：那惡）。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πιστὸς δέ ἐστιν ὁ κύριος<\/td><td>pistos de estin ho kyrios<\/td><td>但主是信實的<\/td><td>πιστὸς 放句首，緊貼 3:2 的 πίστις<\/td><\/tr><tr><td>στηρίξει<\/td><td>stērixei<\/td><td>他要堅固<\/td><td>未來式；2:17 στηρίξαι 的應許兌現<\/td><\/tr><tr><td>φυλάξει<\/td><td>phylaxei<\/td><td>他要看守<\/td><td>像守城的兵站崗<\/td><\/tr><tr><td>ἀπὸ τοῦ πονηροῦ<\/td><td>apo tou ponērou<\/td><td>脫離那惡者／凶惡<\/td><td>陽性或中性兩讀；cu89t 註腳「或譯：脫離凶惡」<\/td><\/tr><\/table>","gram":"<p><strong>3:2--3 是一個刻意的文字鉸鏈：οὐ γὰρ πάντων ἡ πίστις（ou gar pantōn hē pistis）· πιστὸς δέ ἐστιν ὁ κύριος（pistos de estin ho kyrios）——「信」字剛說完人的短缺，下一個字就是主的信實。<\/strong><\/p><p>πιστὸς（pistos） 放在句首強調，δέ（de） 表示轉折：人那一邊靠不住，主這一邊靠得住。後面兩個未來式動詞 στηρίξει（stērixei）、φυλάξει（phylaxei） 是主做的兩件事。στηρίξει（stērixei） 回應 2:17「並且在一切善行善言上堅固你們」（2:17）的 στηρίξαι（stērixai）：那裡是禱告，這裡是確信；也與 2:2 的 σαλευθῆναι（被搖動）對照，構成全卷「搖動與堅固」的線。<\/p><p><strong>ἀπὸ τοῦ πονηροῦ（apo tou ponērou） 有兩種讀法<\/strong>，cu89t 正文作「脫離那惡者」，註腳作「或譯：脫離凶惡」。屬格 τοῦ πονηροῦ（tou ponērou） 在字形上可以是陽性，也可以是中性。<strong>陽性讀法<\/strong>：指「那惡者」撒但；理由是 2:9 剛提過「撒但的運動」，保羅也常把撒但稱為具位格的敵人（弗 6:16 稱「那惡者」）。<strong>中性讀法<\/strong>：指一切「凶惡」，包括 3:2 那些 πονηρῶν（ponērōn） 的惡人與他們帶來的禍患。這使我們想起太 6:13 主禱文 ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ（rhysai hēmas apo tou ponērou），同一組字，和合本在那裡譯作「救我們脫離凶惡」（太 6:13）。<\/p><p>本講義照和合本正文讀作「那惡者」，同時承認中性讀法，兩者並不衝突：背後是惡者，前面是凶惡的人與事。屬靈爭戰的全面討論見以弗所書立場四，本卷不重開。<\/p>","exp":"<p><strong>「但主是信實的，要堅固你們，保護你們脫離那惡者。」（3:3）這是全卷的錨。<\/strong><\/p><p>一艘船在浪裡，錨不是掛在船上的人身上，是扎在海底的石頭裡。3:2 剛說「人不都是有信心」，保羅沒有接著說「所以你們要更有信心」，而是說「但主是信實的」。我們站得穩，不是因為我們的信心很大，是因為我們所信的那一位不會變。<\/p><p>這一節的三個動詞，主詞都是主：主是信實的、主要堅固、主要保護。第 2 章叫教會「站立得穩」（2:15），第 3 章說出真正在撐的是誰。這也解開了一個常見的焦慮：我怕自己撐不到底。保羅的答案是：撐到底的是主。<\/p><p>「那惡者」是真實的。保羅沒有把屬靈的黑暗講成心理作用；2:9 說撒但有它的「運動」。但他也沒有叫教會去研究惡者、追著惡者打。他只是說：主會保護你們脫離他。正如主禱文教門徒求「救我們脫離凶惡」（太 6:13），焦點不在惡有多大，而在那位救我們的主。害怕惡者的人會越看越怕，仰望主的人會越看越穩。<\/p><p>今天的帖撒羅尼迦人，可能是被群組消息嚇到、被職場的不義欺壓、被自己的軟弱拖累的人。這一節不叫他們假裝沒事，也不叫他們咬牙硬撐，只把他們的眼睛轉向一件事實：主是信實的。321 說焦點在耶穌，不在自己、不在別人、不在環境；這一節正是那個焦點。人的信心有高有低，主的信實沒有起伏；我們今天站得住，明天也站得住，因為撐住我們的不是我們。<\/p>"},{"a":4,"z":5,"star":2,"grk":"<p lang=\"grc\">πεποίθαμεν δὲ ἐν κυρίῳ ἐφʼ ὑμᾶς, ὅτι ἃ παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.<\/p><p lang=\"grc\">ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.<\/p>","lit":"<p>我們在主裡對你們有把握：我們所吩咐的，你們正在做，也將要做。<\/p><p>願主把你們的心修直、引進神的愛裡，也引進基督的忍耐裡（原文無「學」字）。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πεποίθαμεν<\/td><td>pepoithamen<\/td><td>我們有把握<\/td><td>完成式：已經建立、至今不變的信任<\/td><\/tr><tr><td>ἐν κυρίῳ<\/td><td>en kyriō<\/td><td>在主裡<\/td><td>把握的根據在主，不在教會的表現<\/td><\/tr><tr><td>κατευθύναι<\/td><td>kateuthynai<\/td><td>願他修直<\/td><td>祈願語氣；把路修直、清除障礙<\/td><\/tr><tr><td>εἰς τὴν ἀγάπην τοῦ θεοῦ<\/td><td>eis tēn agapēn tou theou<\/td><td>進入神的愛<\/td><td>愛神／神的愛兩讀<\/td><\/tr><tr><td>εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ<\/td><td>eis tēn hypomonēn tou Christou<\/td><td>進入基督的忍耐<\/td><td>和合本加「學」字；原文無<\/td><\/tr><\/table>","gram":"<p><strong>3:4--5 先說人的順從，再說主的引導：πεποίθαμεν（pepoithamen） 是保羅的信任，κατευθύναι（kateuthynai） 是保羅的祈願。<\/strong><\/p><p>πεποίθαμεν δὲ ἐν κυρίῳ ἐφʼ ὑμᾶς（pepoithamen de en kyriō eph' hymas）：保羅對教會有把握，但這把握是 ἐν κυρίῳ（en kyriō），在主裡；他信任的不是帖撒羅尼迦人的意志力，是在他們裡面做工的主。ἃ παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε（ha parangellomen kai poieite kai poiēsete） 用了現在式與未來式兩個動詞，為 3:6 以後的「吩咐」鋪路：παραγγέλλομεν（parangellomen） 這個字在本章出現四次（3:4、6、10、12）。<\/p><p>3:5 的 κατευθύναι（kateuthynai） 是不定過去式祈願語氣，字面是「把路修直」；帖前 3:11 保羅求神修直他回到帖撒羅尼迦的路，用的是同一個字。受詞是 τὰς καρδίας（tas kardias），路修直的地方是心。<\/p><p>兩個 εἰς（eis） 片語都有屬格，各有兩讀。<strong>εἰς τὴν ἀγάπην τοῦ θεοῦ（eis tēn agapēn tou theou）<\/strong>：受格讀法是「愛神」（和合本）；主格讀法是「神的愛」，把心引進神對我們的愛裡。<strong>εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ（eis tēn hypomonēn tou Christou）<\/strong>：和合本譯「並學基督的忍耐」，<strong>原文沒有「學」字<\/strong>，直譯是「進入基督的忍耐」；可以指基督自己受苦時的忍耐（我們效法），也可以指基督所賜、在我們裡面的忍耐。本講義兩讀並存：先是神的愛與基督的忍耐臨到我們，然後才是我們愛神、學基督。ὑπομονήν（hypomonēn） 也回應 1:4 的 ὑπομονῆς（hypomonēs）：全卷的忍耐從教會開始，在基督身上結束。<\/p>","exp":"<p><strong>「願主引導你們的心，叫你們愛神，並學基督的忍耐！」（3:5）在下達任何吩咐之前，保羅先為他們的心禱告。<\/strong><\/p><p>3:6 以後是本卷最嚴肅的一段：吩咐、遠離、記下。可是在這之前，保羅先寫了兩節柔軟的話：「我們靠主深信，你們現在是遵行我們所吩咐的，後來也必要遵行。」（3:4）他對大多數人是信任的。紀律不是從懷疑開始，是從信任開始。<\/p><p>「引導」是修路。一條山路長滿雜草、落石擋道，修路的人把它清出來，人才走得過去。心也一樣：被消息嚇過、被逼迫傷過的心，路是彎的。保羅求主親自修，因為人修不直人的心。<\/p><p>修直之後通往兩個地方：神的愛與基督的忍耐。和合本說「學基督的忍耐」，原文只說「基督的忍耐」。這個差別很寶貴：忍耐不先是一門要學的功課，而是一個要進去的地方。基督在十字架上的忍耐已經完成了，我們是被引進去，在那裡學。321 說耶穌是我的榜樣；這一節補一句：榜樣也是我的住處。<\/p><p>對一個等候主再來的教會，這是很合宜的禱告。末日消息讓人急，忍耐讓人慢下來。急的人容易驚慌，也容易不做工；被引進基督忍耐裡的人，今天會照常起床、上班、愛人。這就把我們帶到下一段的工作問題。<\/p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν παρελάβοσαν παρʼ ἡμῶν.<\/p>","lit":"<p>弟兄們，我們在我們主耶穌基督的名裡吩咐你們：要你們收回自己，遠離每一個不按隊形而行、不照著他們從我們所領受的傳統而行的弟兄。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Παραγγέλλομεν<\/td><td>Parangellomen<\/td><td>我們吩咐<\/td><td>軍中傳令的字；本章第二次<\/td><\/tr><tr><td>ἐν ὀνόματι τοῦ κυρίου<\/td><td>en onomati tou kyriou<\/td><td>在主的名裡<\/td><td>權柄出於主，不出於保羅個人<\/td><\/tr><tr><td>στέλλεσθαι<\/td><td>stellesthai<\/td><td>收回、保持距離<\/td><td>中間語態：自己收斂、退後一步<\/td><\/tr><tr><td>ἀτάκτως περιπατοῦντος<\/td><td>ataktōs peripatountos<\/td><td>不按隊形而行<\/td><td>軍隊用語：脫隊；帖前 5:14 同字根<\/td><\/tr><tr><td>παράδοσιν<\/td><td>paradosin<\/td><td>傳統、教訓<\/td><td>使徒交付的；2:15 同字<\/td><\/tr><tr><td>παρελάβοσαν<\/td><td>parelabosan<\/td><td>他們領受了<\/td><td>人稱異文：他們／你們<\/td><\/tr><\/table>","gram":"<p><strong>3:6 是本章第一個正式的「吩咐」，也是 3:6--15 這個單元的總綱：對象、方式、標準都在這一節。<\/strong><\/p><p>Παραγγέλλομεν（Parangellomen） 是軍中傳令的字，配上 ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ（en onomati tou kyriou hēmōn Iēsou Christou），權柄來源寫明是主，不是保羅自己。στέλλεσθαι（stellesthai） 是中間語態，原意是收起帆、收斂自己：吩咐的對象是教會，要教會自己退後一步、保持距離，不是要教會去處置那人。ἀτάκτως περιπατοῦντος（ataktōs peripatountos） 的 ἀτάκτως（ataktōs） 原是軍隊用語，指不守隊形、脫隊的士兵；帖前 5:14 保羅已經說過要警戒 τοὺς ἀτάκτους（tous ataktous），同一個字根。前書一句話，後書十節：小事沒處理，就變成大事。<\/p><p><strong>經文鑑別：παρελάβοσαν（parelabosan） 的人稱。<\/strong>SBLGNT 與 NA28 作 παρελάβοσαν（parelabosan）「他們所領受的」，這是第三人稱複數的罕見字尾，抄寫者容易改成常見形；WH、Treg 與 NIV 所據的讀法作 παρελάβετε（parelabete）「你們所領受的」；RP 拜占庭本作 παρέλαβον（parelabon）「他們所領受的」（常見字尾）。三個讀法中兩個是「他們」，可見「他們」有很好的抄本支持，而罕見字尾 παρελάβοσαν（parelabosan） 較可能是原貌，被改成較順的形式。和合本「從我們所受的教訓」沒有標人稱，讀起來最接近「你們」。<strong>本講義照 SBLGNT 讀作「他們」<\/strong>：指那些不按規矩的人自己也領受過這教訓；兩種讀法意思相同——這不是新規矩，是他們早已聽過的使徒教訓。<\/p><p>παράδοσιν（paradosin） 與 2:15 的 παραδόσεις（paradoseis） 同字：標準是使徒所交付的教訓，不是任何地方教會自訂的規矩。<\/p>","exp":"<p><strong>「凡有弟兄不按規矩而行，不遵守從我們所受的教訓，就當遠離他。」（3:6）這一節要和 3:15 一起讀，3:6--15 是一個單元。<\/strong><\/p><p>先看對象。他是「弟兄」，3:15 也說他是「弟兄」；整段紀律從頭到尾沒有把他踢出家門。他的問題是「不按規矩而行」：脫隊。隊伍在行軍，有人停下來不走，還在隊伍裡到處走動、干擾別人。3:11 會說清楚他在做甚麼：不做工，專管閒事。對象不是有疑問的人，不是意見不同的人，也不是軟弱跌倒、正在掙扎的人。<\/p><p>再看標準：「從我們所受的教訓」。這是使徒的教訓，今天就寫在聖經裡；它不是教會的內規、不是某個宗派的傳統，也不是領袖個人的喜好。保羅在下一節馬上指著自己的生活說「你們自己原知道」，他給的標準是公開、可以查驗的。帖撒羅尼迦的下一站庇哩亞，那裡的人「天天考查聖經」（徒 17:11）；堅守使徒的教訓，正是鼓勵會眾打開聖經察驗，而不是禁止提問。<\/p><p>最後看方式：「遠離他」。原文是收起帆、自己退後一步。這不是驅逐、不是公告、不是叫全教會去對付他；是不再配合他脫隊的生活。下面幾節會一層一層說清楚：為甚麼要這樣（3:7--10），他到底做了甚麼（3:11），對他說甚麼（3:12），教會自己怎樣不喪志（3:13），以及這一切的界線（3:14--15）。<\/p><p>「奉主耶穌基督的名」放在這裡，是一個保護。紀律的權柄在主，不在執行紀律的人；所以執行的人也要在主面前交帳，不能把紀律當成自己的武器，更不能把自己的意見包裝成「主的吩咐」。<\/p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">αὐτοὶ γὰρ οἴδατε πῶς δεῖ μιμεῖσθαι ἡμᾶς, ὅτι οὐκ ἠτακτήσαμεν ἐν ὑμῖν<\/p><p lang=\"grc\">οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλʼ ἐν κόπῳ καὶ μόχθῳ νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·<\/p>","lit":"<p>因為你們自己知道應當怎樣效法我們，因為我們在你們中間沒有脫隊，<\/p><p>也沒有白白地從任何人那裡吃餅，而是在勞苦和艱難中，夜裡和白天做工，為要不加重擔在你們任何一人身上；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>μιμεῖσθαι<\/td><td>mimeisthai<\/td><td>效法、模仿<\/td><td>3:9 再出現一次<\/td><\/tr><tr><td>οὐκ ἠτακτήσαμεν<\/td><td>ouk ētaktēsamen<\/td><td>我們沒有脫隊<\/td><td>與 3:6 ἀτάκτως 同字根<\/td><\/tr><tr><td>δωρεὰν ἄρτον ἐφάγομεν<\/td><td>dōrean arton ephagomen<\/td><td>白白吃餅<\/td><td>不付代價地讓人供養<\/td><\/tr><tr><td>ἐν κόπῳ καὶ μόχθῳ<\/td><td>en kopō kai mochthō<\/td><td>在勞苦與艱難中<\/td><td>兩個近義字疊用；帖前 2:9 同組<\/td><\/tr><tr><td>ἐπιβαρῆσαί<\/td><td>epibarēsai<\/td><td>加重擔<\/td><td>做工的目的：不成為人的負擔<\/td><\/tr><\/table>","gram":"<p><strong>3:7--8 以 γάρ（gar） 給 3:6 理由：不是一條規定，是一個榜樣。<\/strong><\/p><p>αὐτοὶ γὰρ οἴδατε（autoi gar oidate） 把證據交給讀者自己：你們看過我們怎樣生活。πῶς δεῖ μιμεῖσθαι ἡμᾶς（pōs dei mimeisthai hēmas） 的 δεῖ（dei） 是「必須、應當」。ὅτι οὐκ ἠτακτήσαμεν ἐν ὑμῖν（hoti ouk ētaktēsamen en hymin） 用 ἀτακτέω（atakteō） 的動詞，與 3:6 ἀτάκτως（ataktōs） 同字根：「我們在你們中間沒有脫隊。」<\/p><p>3:8 以 οὐδὲ（oude）…ἀλλʼ（all'） 形成對照：δωρεὰν ἄρτον ἐφάγομεν παρά τινος（dōrean arton ephagomen para tinos） 是「白白吃人的餅」，ἐν κόπῳ καὶ μόχθῳ νυκτὸς καὶ ἡμέρας ἐργαζόμενοι（en kopō kai mochthō nyktos kai hēmeras ergazomenoi） 是另一面。νυκτὸς καὶ ἡμέρας（nyktos kai hēmeras） 是屬格，表示「在夜裡和白天的時段中」，不一定是不眠不休，而是工作分布在晝夜之間。這一句與帖前 2:9 幾乎逐字相同，說明這是帖撒羅尼迦人親眼見過的事。<\/p><p>關鍵在目的子句 πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν（pros to mē epibarēsai tina hymōn）：做工的目的是「免得叫你們一人受累」。重點在別人的負擔，不在保羅的業績；這個目的子句決定了怎樣讀「晝夜做工」。<\/p>","exp":"<p>〔背景〕徒 17:1--9；徒 18:1--4（使徒行傳講義第 17、18 章）<\/p><p><strong>「也未嘗白吃人的飯，倒是辛苦勞碌，晝夜做工，免得叫你們一人受累。」（3:8）保羅在帖撒羅尼迦是一個有手藝的工人。<\/strong><\/p><p>本系列使徒行傳講義第 17 章講過：保羅在帖撒羅尼迦只講了三個安息日，就因暴民圍了耶孫的家而連夜離開。那幾個星期，他白天大概在作坊裡，晚上或空檔才傳道。第 18 章到了哥林多，路加告訴我們他的手藝：「保羅因與他們同業，就和他們同住做工」（徒 18:3），他們是製造帳棚的。寫這封信時，保羅正在哥林多，手上可能還有皮革的味道。<\/p><p>為甚麼這樣做？經文給的理由是「免得叫你們一人受累」。帖撒羅尼迦教會窮，又在逼迫中；保羅不願讓這群人再多一個要養的人。他做工是愛的表達，不是苦修的證明。帖前 2:9 用同一句話回憶這件事，可見教會記得很清楚。<\/p><p>這一節<strong>不是過勞的榜樣<\/strong>。華人教會很容易把「晝夜做工」聽成「越累越屬靈」，把同工的身體與家庭都燒在服事裡。保羅的理由正好相反：他做工是為了不成為別人的重擔。若一個同工的過勞把重擔轉嫁給配偶、孩子或醫院，那就背離了 3:8 的目的。本系列歌羅西書講義的立場四講過：無己不是苦待己身；保羅也說那些「苦待己身」的規條毫無功效（西 2:23）。<\/p><p>回到 3:6--15 這個單元：3:6 說有人脫隊，3:7--8 說使徒沒有脫隊。不按規矩的人吃別人的飯，使徒寧可自己辛苦也不讓人受累。對照的不是勤勞與懶惰的性格，是兩種對待別人愛心的方式：一個消費它，一個保護它。<\/p>"},{"a":9,"z":9,"star":2,"grk":"<p lang=\"grc\">οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλʼ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.<\/p>","lit":"<p>不是因為我們沒有權柄，而是為要把我們自己作一個模子給你們，好叫你們效法我們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὐχ ὅτι<\/td><td>ouch hoti<\/td><td>不是說<\/td><td>先擋住誤會<\/td><\/tr><tr><td>ἐξουσίαν<\/td><td>exousian<\/td><td>權柄、權利<\/td><td>有權利被供養<\/td><\/tr><tr><td>τύπον<\/td><td>typon<\/td><td>模子、印記<\/td><td>打下去留下形狀的模子<\/td><\/tr><tr><td>ἑαυτοὺς τύπον δῶμεν ὑμῖν<\/td><td>heautous typon dōmen hymin<\/td><td>把我們自己給你們作模子<\/td><td>給出去的是「自己」<\/td><\/tr><\/table>","gram":"<p><strong>3:9 用 οὐχ ὅτι（ouch hoti）…ἀλλʼ ἵνα（all' hina） 先否定、再說明：保羅有權柄，卻選擇不用。<\/strong><\/p><p>οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν（ouch hoti ouk echomen exousian） 是雙重否定，意思是「我們當然有權柄」。ἐξουσίαν（exousian） 指被教會供養的正當權利；保羅在林前 9 章花了一整章論證這權利，並引主的話說傳福音的人可以靠福音養生（林前 9:14）。所以 3:8 的做工不是因為他沒有資格支薪。<\/p><p>ἀλλʼ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν（all' hina heautous typon dōmen hymin）：τύπον（typon） 是模子、印記，原指打擊留下的痕跡；ἑαυτοὺς（heautous） 是受詞，保羅給出去的是「我們自己」，一個活的範本。εἰς τὸ μιμεῖσθαι ἡμᾶς（eis to mimeisthai hēmas） 與 3:7 首尾呼應，這三節被「效法」包起來。<\/p><p>本講義的立場（立場四）：不以 3:8--9 反對傳道人支薪，也不以此要求所有傳道人帶職；保羅自己在不同處境用不同做法。<\/p>","exp":"<p><strong>「這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們。」（3:9）放下權柄的人，才能成為模子。<\/strong><\/p><p>想像一位父親，有權叫孩子做家事，也可以只是發號施令。但他選擇自己先捲起袖子，把碗洗好、地掃好。孩子學到的不只是「要做家事」，而是「爸爸是這樣做的」。3:9 的 τύπος（typos） 就是這樣的模子：保羅把自己壓進帖撒羅尼迦人的生活裡，留下一個看得見的形狀。<\/p><p>這一節常被拿去辯論傳道人該不該支薪。經文自己說得很清楚：保羅「有權柄」。教會供養傳道人是聖經的原則；保羅在帖撒羅尼迦選擇不用，是因為那裡有人正在吃別人的飯，他必須用身體示範另一種生活。帶職與全職都可以是忠心的，判斷在處境與目的，不在哪一種比較屬靈。<\/p><p>回到 3:6--15：不按規矩的人有一種「權利感」，覺得弟兄姊妹的愛心理所當然該養他；保羅有真實的權柄，卻放在一邊。兩者的距離，就是這一段要醫治的地方。<\/p><p>這正是 321 說的「謙卑是放下權力回到本位」：不是沒有權力，是有權力卻不抓住它，回到僕人的位置。驕傲的人爭取自己應得的，謙卑的人放下自己應得的，好讓別人得益處。一位不用權柄的使徒，給教會留下的影響，比用盡權柄更深。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<p lang=\"grc\">καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.<\/p>","lit":"<p>因為我們在你們那裡的時候，也一直把這件事吩咐你們：若有人不願意做工，他也不要吃。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὅτε ἦμεν πρὸς ὑμᾶς<\/td><td>hote ēmen pros hymas<\/td><td>我們在你們那裡的時候<\/td><td>回到三個安息日的日子<\/td><\/tr><tr><td>παρηγγέλλομεν<\/td><td>parēngellomen<\/td><td>我們一直吩咐<\/td><td>未完成式：不是說一次，是反覆說<\/td><\/tr><tr><td>οὐ θέλει<\/td><td>ou thelei<\/td><td>不願意、不肯<\/td><td>意願，不是能力<\/td><\/tr><tr><td>ἐργάζεσθαι<\/td><td>ergazesthai<\/td><td>做工<\/td><td>erg- 字族；本章的主線<\/td><\/tr><tr><td>μηδὲ ἐσθιέτω<\/td><td>mēde esthietō<\/td><td>也不要吃<\/td><td>第三人稱命令<\/td><\/tr><\/table>","gram":"<p><strong>3:10 是本卷最常被斷章取義的一節。關鍵在一個動詞：θέλει（thelei）——「不肯」，不是「不能」。<\/strong><\/p><p>καὶ γάρ（kai gar） 接續 3:7--9 的理由：除了榜樣，還有口頭的吩咐。ὅτε ἦμεν πρὸς ὑμᾶς（hote ēmen pros hymas） 指保羅在帖撒羅尼迦的短短幾週。παρηγγέλλομεν（parēngellomen） 是未完成式，表示當時一再地吩咐：這是一開始就教過的，不是後來為了懲罰誰才發明的條款。<\/p><p>εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω（ei tis ou thelei ergazesthai mēde esthietō）：條件子句的動詞是 θέλει（thelei），意思是「願意、想要」；οὐ θέλει（ou thelei） 就是「不願意、不肯」。保羅沒有寫「若有人不能做工」，也沒有寫「若有人沒有工作」。和合本譯「不肯」，正確地抓住了這個意願的面向。本講義依此把 3:10 的對象界定為有能力、有機會，卻選擇不做工、讓別人養的人。<\/p><p>μηδὲ ἐσθιέτω（mēde esthietō） 是第三人稱命令，形式簡潔，像一句當時流行的格言。它是對教會共同飯桌的安排（初代教會常一起吃飯、彼此供應），不是對政府社會政策的條文。<\/p><p>為甚麼有人不肯做工？這裡問的是不肯，不是不能。學界有三說，本講義放在下一段（3:11）的原文解析並陳。<\/p>","exp":"<p>〔背景〕徒 17:1--4（使徒行傳講義第 17 章）<\/p><p><strong>「若有人不肯做工，就不可吃飯。」（3:10）原文的動詞是「不肯」，不是「不能」。<\/strong><\/p><p>這一句是保羅在帖撒羅尼迦那三個安息日裡就教過的。那是一間剛成立、有窮人也有富人的教會，大家在一張桌子上吃飯。有人發現：不做工也有飯吃。保羅說：那張桌子是愛心擺出來的，不肯工作的人不應該坐在那裡把它吃空。這句話保護的，是那些用辛苦錢擺桌子的弟兄姊妹。<\/p><p>所以它<strong>不是<\/strong>給下面這些人的：找不到工作的失業者、病中或病後體力不支的人、身心障礙的人、年老的人、在家照顧孩子或長輩的人、全職的主婦。他們不是「不肯」，是「不能」，或是在做一份沒有薪水的工。把 3:10 拿來羞辱他們，是把經文從它的目的拔出來。他們不在 3:10 裡面；他們在「你們眾人彼此相愛的心也都充足」（1:3）裡面。<\/p><p>保羅在別處說得更清楚：做工不只為了養活自己，也是為了「就可有餘分給那缺少的人」（弗 4:28）；他也吩咐教會照顧那些真無倚靠的寡婦，好使教會能夠救濟她們（提前 5:3--16）。同一位保羅說「不肯做工的不可吃飯」，也說「不能做工的，教會要供應」。兩句話一起讀，才是保羅；只讀一句，就成了別人。這一節也不是反對一切社會救助的經文。<\/p><p>放回 3:6--15 這個單元：3:10 回答的是為甚麼要遠離那脫隊的人（3:6），而下一節會說他其實很忙（3:11），3:15 會說他仍是弟兄。只讀 3:10，就會變成一把刀；讀完整段，它是一隻要把人拉回隊伍的手。<\/p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·<\/p><p lang=\"grc\">τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ Χριστῷ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.<\/p>","lit":"<p>因為我們聽見有些人在你們中間不按隊形而行，甚麼都不做，卻在別人的事上做個不停；<\/p><p>對這樣的人，我們在主耶穌基督裡吩咐並勸勉，要他們帶著安靜做工，吃他們自己的餅。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀκούομεν<\/td><td>akouomen<\/td><td>我們聽說<\/td><td>現在式：消息還在傳來<\/td><\/tr><tr><td>μηδὲν ἐργαζομένους<\/td><td>mēden ergazomenous<\/td><td>甚麼都不做<\/td><td>erg- 字族<\/td><\/tr><tr><td>περιεργαζομένους<\/td><td>periergazomenous<\/td><td>到處忙、管閒事<\/td><td>加了 peri：在周圍做工<\/td><\/tr><tr><td>παραγγέλλομεν καὶ παρακαλοῦμεν<\/td><td>parangellomen kai parakaloumen<\/td><td>我們吩咐並勸勉<\/td><td>命令旁邊放了勸勉<\/td><\/tr><tr><td>μετὰ ἡσυχίας<\/td><td>meta hēsychias<\/td><td>帶著安靜<\/td><td>對「專管閒事」的回答<\/td><\/tr><tr><td>τὸν ἑαυτῶν ἄρτον<\/td><td>ton heautōn arton<\/td><td>自己的餅<\/td><td>對照 3:8 白吃人的飯<\/td><\/tr><\/table>","gram":"<p><strong>3:11 是一個文字遊戲：μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους（mēden ergazomenous alla periergazomenous）——「甚麼都不做，卻到處在做」。<\/strong><\/p><p>περιεργαζομένους（periergazomenous） 是 ἐργάζομαι（ergazomai） 加上字首 peri，字面是「在周圍做工」，引申為多管閒事、忙別人的事。這些人不是閒著，是忙錯了地方。ἀκούομεν（akouomen） 是現在式，消息仍在傳來；τινας（tinas） 只說「有些人」，保羅沒有點名。<\/p><p><strong>他們為甚麼不做工？三說並陳。<\/strong>①<strong>末世狂熱說<\/strong>：第 2 章有人說「主的日子現在到了」（2:2），既然主已經要來，何必工作？這說與本卷脈絡最貼近。②<strong>倚賴恩主說<\/strong>：羅馬社會有恩主與門客的制度，窮人依附富人過活；有些人信主後把教會的富裕弟兄當成新的恩主。③<strong>看輕勞動說<\/strong>：希臘文化視體力勞動為奴隸的事，自由人不屑做手工。三說可以同時成立；共同點是：<strong>他們把別人的愛心當成自己的收入<\/strong>。本講義不把原因定於一說。<\/p><p>3:12 τοῖς δὲ τοιούτοις（tois de toioutois） 直接轉向這些人。παραγγέλλομεν καὶ παρακαλοῦμεν（parangellomen kai parakaloumen） 兩個動詞並列：本章第四次「吩咐」，旁邊第一次放上「勸勉」。μετὰ ἡσυχίας（meta hēsychias） 與 περιεργαζομένους（periergazomenous） 對照；τὸν ἑαυτῶν ἄρτον（ton heautōn arton） 與 3:8 的 δωρεὰν ἄρτον（dōrean arton） 對照。這是帖前 4:11「親手做工」的再說一次。<\/p>","exp":"<p><strong>「甚麼工都不做，反倒專管閒事」（3:11）——他們不是太閒，是太忙。<\/strong><\/p><p>這是一幅很熟悉的畫面。有人整天在群組裡轉傳消息、評論誰對誰錯、追蹤某個末日預言的最新解讀，卻沒有時間把手上的工作做好。保羅用一個字的差別就把他畫出來：不做工，卻到處做工。錯誤的末世觀，在帖撒羅尼迦落成兩種人：一種嚇得不敢動（2:2），一種乾脆不做事、到處管別人（3:11）。<\/p><p>保羅開的藥方很平凡：「要安靜做工，吃自己的飯。」（3:12）沒有屬靈的大道理，只有三件事：安靜、做工、吃自己的。安靜是對「管閒事」的回答；做工是對「不肯」的回答；吃自己的飯是對「白吃人的飯」的回答。真盼望主來的人，今天會好好上班。帖前 4:11 早就說過「親手做工，正如我們從前所吩咐你們的」（帖前 4:11）。<\/p><p>注意語氣：「吩咐、勸戒」。保羅對這些脫隊的人，命令旁邊放了勸勉。他沒有說「把他們趕出去」，而是直接對他們說話，叫他們回到隊伍。3:6--15 是一個挽回的單元：3:6 叫教會保持距離，3:12 卻是保羅親自伸手。<\/p><p>這一節也對另一種華人文化說話。「安靜做工」不是拚搏到底、也不是躺平不動。拚的人需要聽見「安靜」，躺的人需要聽見「做工」。安靜做工的人，不以產值證明自己，也不讓別人替自己背重擔；他知道自己是誰，所以不必到處去管別人是誰。<\/p>"},{"a":13,"z":13,"star":1,"grk":"<p lang=\"grc\">ὑμεῖς δέ, ἀδελφοί, μὴ ἐγκακήσητε καλοποιοῦντες.<\/p>","lit":"<p>但你們，弟兄們，行善不要灰心喪志。<\/p>","key":"","gram":"<p><strong>3:13 以 ὑμεῖς δέ（hymeis de） 轉向全教會：前面是對脫隊者，這裡是對一直在隊伍裡走的人。<\/strong><\/p><p>ὑμεῖς δέ（hymeis de）, ἀδελφοί（adelphoi） 把主詞放在句首強調：至於你們。μὴ ἐγκακήσητε（mē enkakēsēte） 是禁止語氣的不定過去式假設語氣，意思是「不要開始灰心」。同一個字出現在加 6:9 的 μὴ ἐγκακῶμεν（mē enkakōmen），和合本那裡譯「不可喪志」。字義是在壞的處境中洩氣、軟下來、放棄。<\/p><p>καλοποιοῦντες（kalopoiountes） 是現在分詞「行善」，新約只此一見，由 καλός（好）與 ποιέω（做）合成。在本段脈絡裡，行善包括 3:12 的安靜做工，也包括供應那些需要幫助的人。章題「你們行善不可喪志」就出自這一節。<\/p>","exp":"<p><strong>「弟兄們，你們行善不可喪志。」（3:13）等候主的人最常見的病，不是懶，是累。<\/strong><\/p><p>這一節對著 3:6--12 的另一群人說話：那些一直在做工、一直在擺桌子、一直在供應別人的人。他們看見有人白吃飯、專管閒事，很容易心裡想：我這樣做到底有甚麼用？保羅知道他們累了。「不可喪志」這句話本身就承認：行善的人會喪志。<\/p><p>這一節不是鞭子。一個服事到倦怠的同工，需要的首先是休息、陪伴，必要時是專業的協助，而不是聽見有人引這一節說「你怎麼可以灰心」。主耶穌自己對疲累的門徒說「你們來，同我暗暗地到曠野地方去歇一歇」（可 6:31）。服事倦怠不是屬靈失敗；休息是為了不喪志。<\/p><p>加 6:9 給了理由：「我們行善，不可喪志；若不灰心，到了時候就要收成。」（加 6:9）收成有時候，不是每天。放回 3:6--15，這一節夾在「吩咐」與「紀律」中間，提醒處理問題的人：別讓少數人的脫隊，偷走大多數人的善行。<\/p>"},{"a":14,"z":15,"star":3,"grk":"<p lang=\"grc\">Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, μὴ συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·<\/p><p lang=\"grc\">καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.<\/p>","lit":"<p>若有人不順從我們藉著這封信所說的話，這個人你們要給他作記號，不要和他混在一起，好叫他回頭看自己而羞愧；<\/p><p>可是不要把他當作仇敵看待，而要把他當作弟兄來勸戒。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὐχ ὑπακούει<\/td><td>ouch hypakouei<\/td><td>不順從<\/td><td>現在式：持續地不聽<\/td><\/tr><tr><td>διὰ τῆς ἐπιστολῆς<\/td><td>dia tēs epistolēs<\/td><td>藉著這封信<\/td><td>標準是使徒的書信<\/td><\/tr><tr><td>σημειοῦσθε<\/td><td>sēmeiousthe<\/td><td>給他作記號<\/td><td>與 3:17 σημεῖον 同字根<\/td><\/tr><tr><td>μὴ συναναμίγνυσθαι<\/td><td>mē synanamignysthai<\/td><td>不和他混在一起<\/td><td>減少一般的交往<\/td><\/tr><tr><td>ἐντραπῇ<\/td><td>entrapē<\/td><td>回頭看自己而羞愧<\/td><td>被動；自己轉身看，不是被眾人羞辱<\/td><\/tr><tr><td>μὴ ὡς ἐχθρὸν ἡγεῖσθε<\/td><td>mē hōs echthron hēgeisthe<\/td><td>不要當仇敵看待<\/td><td>紀律的底線<\/td><\/tr><tr><td>νουθετεῖτε ὡς ἀδελφόν<\/td><td>noutheteite hōs adelphon<\/td><td>當弟兄勸戒<\/td><td>帖前 5:14 同一個動詞<\/td><\/tr><\/table>","gram":"<p><strong>3:14--15 是一個不可拆開的句子：3:14 以 ἵνα ἐντραπῇ（hina entrapē） 收尾，3:15 以 καί（kai） 接上——紀律的方式與界線同在一句話裡。<\/strong><\/p><p>Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς（Ei de tis ouch hypakouei tō logō hēmōn dia tēs epistolēs）：條件句的動詞是現在式，指持續地不順從。標準是 τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς（tō logō hēmōn dia tēs epistolēs），使徒在這封信裡寫的話；不是領袖的個人意見，也不是教會的內規。<\/p><p>τοῦτον σημειοῦσθε（touton sēmeiousthe） 用 σημειόω（sēmeioō），新約只此一見，意思是「標記、注意」；它與 3:17 的 σημεῖον（sēmeion） 同字根。<strong>教會記下一個人，是為了挽回；保羅記下自己的名字，是為了保護。<\/strong>μὴ συναναμίγνυσθαι αὐτῷ（mē synanamignysthai autō） 是「不要混在一起」，林前 5:9、11 用同一個字，指一般的社交往來，不是斷絕一切關係。<\/p><p>ἵνα ἐντραπῇ（hina entrapē） 是目的子句。ἐντρέπω（entrepō） 字面是「轉向裡面」，引申為回頭看自己而羞愧；它是被動不定過去式，主詞是那個人自己。羞愧發生在他心裡，不是由眾人在他身上製造出來。<\/p><p>3:15 用 μὴ（mē）…ἀλλά（alla） 形成對照：μὴ ὡς ἐχθρὸν ἡγεῖσθε（mē hōs echthron hēgeisthe）, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν（alla noutheteite hōs adelphon）。ἡγεῖσθε（hēgeisthe） 是「看待」，管的是心裡的眼光；νουθετεῖτε（noutheteite） 是「勸戒」，原意是把道理放進心裡，帖前 5:14 對 τοὺς ἀτάκτους（tous ataktous） 用的正是這個動詞。這使我們想起太 18:15--17 主耶穌所說挽回弟兄的步驟。<\/p>","exp":"<p><strong>「若有人不聽從我們這信上的話，要記下他，不和他交往，叫他自覺羞愧。」（3:14）緊接著就是：「但不要以他為仇人，要勸他如弟兄。」（3:15）這兩節永遠要一起讀。<\/strong><\/p><p>紀律有四個界線，都在這兩節裡。<strong>對象<\/strong>：不聽從使徒「信上的話」、而且持續不肯回轉的人；放在本段，就是 3:6、3:11 那位不肯做工、專管閒事的弟兄。不是提出疑問的人，不是有不同意見的人，也不是離開教會的人。<strong>方式<\/strong>：「記下他，不和他交往」，是減少一般的交往，不再配合他的生活方式；不是公開點名、不是在群組裡截圖公告、不是切斷他與家人的關係，更不是封鎖一個已經離開的人。<strong>目的<\/strong>：「叫他自覺羞愧」，原文是他自己回頭看自己；不是叫眾人一起羞辱他。<strong>底線<\/strong>：「但不要以他為仇人，要勸他如弟兄」，他仍是弟兄，教會仍要對他說話。<\/p><p>一個家庭裡，有個成年的孩子拒絕工作，天天在家裡惹事。智慧的父母不會把他鎖在門外，也不會在親戚面前羞辱他；但他們會停止替他付所有的帳，讓他看見自己的處境。父母退後一步，是為了讓孩子轉身；他們仍然每週打電話給他。3:14--15 就是這樣的愛。主耶穌在太 18:15 說：「他若聽你，你便得了你的弟兄」（太 18:15）。紀律的成功，是得回弟兄，不是贏了一場爭論。<\/p><p>歷史上，「不和他交往」曾被用來控制成員、拆散家庭，成了冷暴力。那些做法都略過了 3:15。321 說人比事重要：紀律處理的是一件事，但對象是一個人，而且是弟兄。整個 3:6--15 單元從「弟兄」開始（3:6），也在「弟兄」結束（3:15）；中間保羅一面說不肯做工的人不可吃飯——是不肯，不是不能（3:10），一面親自勸他們安靜做工（3:12），也提醒全教會不可喪志（3:13）。這是一個要把脫隊的人帶回隊伍的單元，不是一個要把人清出隊伍的程序。<\/p>"},{"a":16,"z":18,"star":3,"grk":"<p lang=\"grc\">Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.<\/p><p lang=\"grc\">Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.<\/p><p lang=\"grc\">ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν<\/p>","lit":"<p>願平安的主自己，隨時、在每一樣方式上，把平安賜給你們。主與你們眾人同在。<\/p><p>這問安是我保羅親手寫的，這就是每一封信裡的記號；我是這樣寫的。<\/p><p>我們主耶穌基督的恩典與你們眾人同在。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης<\/td><td>Autos de ho kyrios tēs eirēnēs<\/td><td>平安的主自己<\/td><td>Αὐτὸς 放句首：主親自<\/td><\/tr><tr><td>δῴη<\/td><td>dōē<\/td><td>願他賜<\/td><td>祈願語氣<\/td><\/tr><tr><td>διὰ παντὸς ἐν παντὶ τρόπῳ<\/td><td>dia pantos en panti tropō<\/td><td>隨時、在每一樣方式上<\/td><td>時間與方式兩個「全部」<\/td><\/tr><tr><td>σημεῖον<\/td><td>sēmeion<\/td><td>記號<\/td><td>與 3:14 σημειοῦσθε 同字根<\/td><\/tr><tr><td>οὕτως γράφω<\/td><td>houtōs graphō<\/td><td>我是這樣寫的<\/td><td>筆跡可以被核對<\/td><\/tr><tr><td>μετὰ πάντων ὑμῶν<\/td><td>meta pantōn hymōn<\/td><td>與你們眾人<\/td><td>3:16、18 兩次<\/td><\/tr><\/table>","gram":"<p><strong>3:16 以 Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης（Autos de ho kyrios tēs eirēnēs） 開頭，與 2:16 Αὐτὸς δὲ ὁ κύριος ἡμῶν（Autos de ho kyrios hēmōn） 的開頭相同：保羅兩次把話交還給「主自己」。<\/strong><\/p><p>帖前 5:23 的結尾是「賜平安的神」，這裡是 ὁ κύριος τῆς εἰρήνης（ho kyrios tēs eirēnēs）「平安的主」，主耶穌站在神的位置上。δῴη（dōē） 是祈願語氣。διὰ παντὸς ἐν παντὶ τρόπῳ（dia pantos en panti tropō） 用兩個 πᾶς（pas）：διὰ παντός（dia pantos） 是時間上的「一直」，ἐν παντὶ τρόπῳ（en panti tropō） 是方式上的「每一樣」。τρόπῳ（tropō） 與 2:3「人不拘用甚麼法子，你們總不要被他誘惑」（2:3）的 τρόπον（tropon） 同字：迷惑人的有各種法子，賜平安的主也有各種方式。ὁ κύριος μετὰ πάντων ὑμῶν（ho kyrios meta pantōn hymōn） 沒有動詞，和合本補的「常」是小字。<\/p><p>3:17 Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου（Ho aspasmos tē emē cheiri Paulou）：保羅平常口述、由書記代筆，到結尾才親手寫問安。ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ（ho estin sēmeion en pasē epistolē）· οὕτως γράφω（houtōs graphō） 是對 2:2「冒我名的書信」的回應。<strong>作者問題<\/strong>：部分近代學者主張帖後是後人託名，理由之一正是 3:17 太強調真偽；傳統立場（本講義所持，立場五）回應：正因 2:2 已有人冒名，保羅才需要在這裡附上筆跡。<\/p><p>3:18 與帖前 5:28 幾乎相同，只多了 πάντων（pantōn）。SBLGNT 正文沒有「阿們」。<\/p>","exp":"<p><strong>「願賜平安的主隨時隨事親自給你們平安！」（3:16）一封寫給驚慌者的信，最高點是平安。<\/strong><\/p><p>這封信從浪開始：逼迫加重、消息亂傳、教會有人脫隊。它沒有在答案、時間表或紀律條文上結束，而是在一個人身上結束：主自己。平安不是一個環境，是一位親自來的主。「隨時隨事」把所有的縫都補上了：沒有一個時刻、沒有一種處境，是他給不了平安的。<\/p><p>「願主常與你們眾人同在」（3:16），「眾人」值得停下來。這封信的祝福裡，包括 3:14 那位被記下的弟兄。紀律沒有把他從祝福裡劃掉；3:18 又說一次「眾人」。教會可以與一個人保持距離，但不能把他從禱告裡除名。<\/p><p>然後保羅拿起筆：「凡我的信都以此為記，我的筆跡就是這樣。」（3:17）2:2 有人冒他的名寫信，說主的日子到了。保羅的對策很樸素：認得我的筆跡。今天使徒的筆跡就是聖經。群組裡的末日訊息、自稱得了啟示的人、轉了十手的見證，都拿去對一對這筆跡；不合的，就不必動心。也正因如此，教會的規矩與領袖的話，都要放在這筆跡底下被察驗。<\/p><p>全卷的最後一個詞是「眾人」，最後一筆是使徒的筆跡，最後留給所有人的禮物是恩典：「願我們主耶穌基督的恩常與你們眾人同在！」（3:18）主是信實的（3:3），所以行善的人可以不喪志（3:13）；主親自賜平安（3:16），所以不必驚慌；真理有筆跡可對（3:17），所以站得穩。從浪到錨，從錨到平安，這就是一個等候主的人走路的樣子。<\/p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《在他聖徒的身上得榮耀》"],["p","弟兄姊妹平安，今天我們一起讀帖撒羅尼迦後書第一章。"],["p","今天我想一開口，就問你一個問題。半夜睡不著的時候，你可能問過。"],["q","如果神是公義的，為甚麼受苦的總是我們？"],["p","那個在公司裡搶你功勞的人，升職了。"],["p","那個騙走你父母養老錢的人，換了一個名字，又開了一間公司。"],["p","那個在學校裡天天欺負你孩子的同學，一點事也沒有。"],["p","而你，一個禮拜天也沒有缺席，禱告了一年又一年。"],["p","事情卻沒有變。有時候，還更糟。"],["q","神啊，你看見了嗎？"],["p","如果你心裡有過這一句，請你不要覺得自己不屬靈。"],["p","因為今天這一章，就是寫給問這一句話的人的。"],["p","收信的，是帖撒羅尼迦的一群信徒。"],["p","使徒行傳講義第十七章講過，這間教會是怎樣出生的。"],["p","保羅在那裡，只講了三個安息日。大約一個月。"],["p","有人信了。接著，就有人眼紅了。"],["q","一群市井匪類，在城裡鼓譟，闖進耶孫的家。"],["p","找不到保羅，就把耶孫拖到地方官面前。罪名很重："],["q","「這些人都違背凱撒的命令，說另有一個王耶穌」（徒 17:7）"],["p","當天夜裡，弟兄們把保羅和西拉送出城。"],["p","一間剛出生一個月的教會，屬靈的父母就被趕走了。"],["p","留下來的人，走不了。他們的家就在這裡。"],["p","幾個月以後，保羅寫第二封信。逼迫沒有停，還在加重。"],["p","我相信那時候，他們心裡也有同一個問題。"],["p","保羅沒有說：不要問。他一個字一個字地回答。"],["p","這一章有三個詞：忍，公，榮。"],["p","我們沿著它走三步：患難中的忍耐，伸冤在神，名在你們身上得榮耀。"],["q","第一步：患難中的忍耐。"],["p","保羅、西拉、提摩太，三個一起被趕出城的人，現在一起寫信。"],["p","這間教會有兩個地址：一個在帖撒羅尼迦，一個在父神和主耶穌的裡面。"],["q","浪打得到城裡，打不到父的手裡。"],["p","然後，保羅開口第一件事，不是安慰，也不是責備。是感謝。"],["q","「弟兄們，我們該為你們常常感謝神，這本是合宜的」（1:3）"],["p","「我們該」，原文是 ὀφείλομεν。這是欠債的字。"],["p","神做了事，我們欠他一句謝謝。"],["p","神做了甚麼？保羅說，你們的信心格外增長，彼此相愛的心也都充足。"],["p","「格外增長」，是長過了頭。「充足」，是滿到溢出來。"],["p","一般人被逼到牆角，會縮起來，各顧各的。"],["p","這一群人沒有。逼迫越重，他們的愛越往外流。"],["q","「甚至我們在神的各教會裡為你們誇口，都因你們在所受的一切逼迫患難中，仍舊存忍耐和信心。」（1:4）"],["p","請你聽「仍舊」這兩個字。"],["p","浪已經在打，而且還沒有停。船還在。"],["p","保羅沒有說他們的苦結束了。也沒有說他們很勇敢，一點都不怕。"],["p","他說，他們「存」。"],["p","「忍耐」這個字，原文是 ὑπομονῆς。"],["p","它由兩個字根合成：在底下，留下來。"],["q","忍耐不是不痛。是痛著，還留下來。"],["p","像一個母親守在孩子的病床邊，三天三夜。"],["p","她不是不累，不是不怕。她只是不走。"],["p","所以如果你這一陣子撐得很辛苦，你沒有失敗。"],["p","你還坐在禮拜堂裡，你今天還打開聖經，這就是「仍舊」。"],["p","保羅還說：我們在神的各教會裡為你們誇口。"],["p","受苦的人常覺得自己很丟臉。在神的家裡，他們的忍耐卻被看見，被傳講。"],["p","好，現在保羅要正面回答那個問題了。"],["q","「這正是神公義判斷的明證，叫你們可算配得神的國；你們就是為這國受苦。」（1:5）"],["p","照我們的直覺，好人受苦，正好證明神不公義。"],["p","保羅卻說，這正是神公義判斷的明證。"],["p","「明證」，原文 ἔνδειγμα，是指給人看、看得見的證據。"],["p","證據是甚麼？請你看清楚：不是逼迫本身。"],["p","是在逼迫裡，還站著的那一群人。"],["p","一群剛信主的人，被圍、被告、被排擠，竟然信心長、愛心滿。"],["p","這不是人自己撐得出來的。是神在他們裡面做工。"],["q","你還站著，就是神正在看顧的證據。"],["p","神在保守你，就表示他看見了，他站在你這一邊，他也會把事情做完。"],["p","還有一個詞很容易聽歪：「配得」。"],["p","好像受夠了苦，才換得到天國的門票。"],["p","原文是被動的，「被算為配得」。是神宣告，不是人掙來的。"],["q","受苦不是入場費。受苦是一張照片，照出你已經屬於哪一國。"],["p","苦沒有因此變輕。可是你不再被它定義。"],["p","可是弟兄姊妹，講到這裡，你心裡可能還有半句話沒有說出口。"],["p","好，我站得住，我也願意忍。"],["q","那麼，欺負我的那個人呢？"],["p","保羅聽見了這半句話。下一節，他就回答。"],["q","第二步：伸冤在神。"],["q","「神既是公義的，就必將患難報應那加患難給你們的人」（1:6）"],["p","「既是」，原文 εἴπερ。不是「萬一神是公義的話」。"],["p","是說：神既然是公義的，這件事就一定會發生。"],["p","可是這一節，也是最容易被讀錯的一節。"],["p","錯讀的方向是：「等著瞧吧，那些欺負我們的人，將來會很慘。」"],["p","這樣讀，經文就變成了復仇的快感。"],["p","再往前一步，就變成詛咒仇敵的許可證。"],["p","請你留意，這一句還沒有讀完。保羅一口氣接下去："],["q","「也必使你們這受患難的人與我們同得平安。」（1:7）"],["p","在原文，這兩節是同一個動詞，帶著兩組人。"],["p","一組是壓人的，一組是被壓的。同一個「壓」字，連用了三次。"],["p","「同得平安」，原文是 ἄνεσιν。意思是鬆開。"],["p","弓弦鬆下來，囚犯鬆了綁，病人終於能喘一口氣，都用這個字。"],["q","審判的目的，不是出一口氣，是把壓在你身上的重量拿開。"],["p","請你想像一間教室。"],["p","一個孩子被同學壓在地上，一隻手按著他的背。"],["p","這個孩子最需要的是甚麼？"],["p","不是看見那個同學也被人壓在地上打一頓。"],["p","是有一位老師走進來，把那隻手從他的背上拿開，扶他起來。"],["p","第六節和第七節的重心，在後半句。"],["p","神審判，是為了把受苦的人接出來。"],["p","保羅還說「與我們」。他把自己也算在被壓的人裡面。"],["p","那麼，受了欺負的人，今天要怎麼辦？"],["q","「親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19）"],["p","伸冤在神。這一句話，要分兩半來聽。"],["q","伸冤在神，所以我不必報仇。"],["p","我不必在群組裡把他的事一講再講，好讓所有人都站到我這邊。"],["p","報仇的擔子太重，人背不起。那是神的位子。"],["q","伸冤在神，所以我也不必假裝沒事。"],["p","有人受了傷來找牧者，聽到的卻是：「交給神吧，不要再提了。」"],["p","弟兄姊妹，「交給神」不是「不准說」。"],["p","神既然要審判，就表示那件事是真的錯了。"],["p","你不必替傷害你的人說「沒關係」。有關係。神說有關係。"],["p","所以我要很清楚地說幾句話。"],["p","如果你正在受暴力，受詐騙，受性侵害，受職場的霸凌，"],["p","請你說出來。找一位信得過的人，求助，報警，尋求法律的保護。"],["p","這些都是正當的。這不是不信，也不是不屬靈。"],["p","保羅在同一封羅馬書，緊接著就說到在上掌權的："],["q","「他是神的用人，是伸冤的」（羅 13:4）"],["p","把最後的審判交給神，和今天向人求助，並不衝突。"],["p","不報仇，是把劍放下。求公道，是把門打開。兩件事可以一起做。"],["p","那麼神要在甚麼時候做完這件事？保羅說："],["q","「那時，主耶穌同他有能力的天使從天上在火焰中顯現」（1:7）"],["q","這浪，有終點。"],["p","「顯現」這個字，原文的意思是揭開帷幕。"],["p","主耶穌自己說過：那日子，那時辰，沒有人知道。"],["p","所以我們不算日子。我們只知道：那一天一定來，而且是主親自來。"],["p","還有一個細節，請你不要錯過。"],["p","第八節說，施行報應的，是主耶穌自己。"],["p","那一位為罪人死在十字架上的，就是將來坐在審判位上的那一位。"],["p","這讓審判不再冷冰冰。"],["p","審判在他手裡，比在任何人手裡都安全。"],["p","包括，比在我們自己手裡，更安全。"],["p","然後，我們來到全章地勢最低的一節。"],["q","「他們要受刑罰，就是永遠沉淪，離開主的面和他權能的榮光。」（1:9）"],["p","這一節，常常被拿來嚇人。"],["p","可是請你記得，它是寫給誰的。寫給受逼迫的人，讓他們知道惡不會永遠得逞。"],["p","它不是一根講台上用來嚇人的鞭子。"],["p","這一節最重的字，不是「火」。是「面」。"],["p","原文 προσώπου，就是一個人的臉。"],["q","沉淪最深的地方，是離開主的面。"],["p","聖經裡最大的福氣，是見主的面。啟示錄最後一章說："],["q","「也要見他的面」（啟 22:4）"],["p","最深的失落，就是永遠離開那一張臉。"],["p","一個人一生都對神說：「不要管我。」"],["p","最後，神尊重了他的選擇。這是第九節最沉重的地方。"],["p","永遠沉淪是永遠受苦，還是被消滅，歷代教會有不同的讀法。"],["p","本講義站在傳統的讀法，也承認另一種讀法的，是福音派裡的弟兄。議題頁有細講。"],["p","這件事不該動搖你的信心。該被動搖的，是我們對失喪的人的冷漠。"],["p","所以我們不用地獄嚇孩子，也不拿火湖當管教的工具。"],["p","在喪禮上，在探訪裡，我們也不替任何一位過世的人，斷言他永遠的結局。"],["p","那是神的位子，不是我們的。"],["p","而且，讀第九節，一定要同時讀第二章第十六節。"],["p","整封信，「永遠」這個字只出現兩次。一個在這裡：永遠沉淪。"],["p","另一個在第二章："],["q","「但願我們主耶穌基督和那愛我們、開恩將永遠的安慰並美好的盼望賜給我們的父神」（2:16）"],["q","一個是永遠的沉淪，一個是永遠的安慰。"],["p","神寫這封信，不是為了第一個「永遠」，是為了第二個。"],["p","所以傳福音不是嚇人進天堂。是邀請人回到神的面前。"],["p","請你聽，第九節谷底，第十節就跳上山頂。"],["q","「這正是主降臨、要在他聖徒的身上得榮耀、又在一切信的人身上顯為希奇的那日子。」（1:10）"],["p","上一節，是離開他的面。這一節，是他來到他百姓中間。"],["p","請你留意，主的榮耀照在哪裡？"],["p","不在天上的雲彩裡。在「他聖徒的身上」。"],["p","一群被趕出會堂、被告官、只學了一個月真理的人，竟然站到了最後。"],["p","畫家的榮耀，不掛在他的簽名上。掛在畫上。"],["q","我們，就是那一幅畫。"],["p","今天被人看輕的，那一天被人驚奇。"],["p","你真正的價值，不由欺負你的人來定。"],["p","保羅寫到這裡，還忍不住插了一句。"],["q","「我們對你們作的見證，你們也信了。」（1:10）"],["p","他好像怕他們以為，「一切信的人」是指別人，指更屬靈的人。"],["p","所以特別回頭說：包括你們。"],["p","信，不在乎信了多久。在乎你信的是誰。"],["p","保羅的眼睛，看到了最遠的地方。主從天上顯現的那一天。"],["p","可是他沒有停在那裡做夢。他的眼睛，馬上收回到今天。"],["q","第三步：名在你們身上得榮耀。"],["q","「因此，我們常為你們禱告，願我們的神看你們配得過所蒙的召」（1:11）"],["p","「因此」，是接著那一天說的。既然那一天一定來，所以今天我們禱告。"],["p","末世觀對了，果子不是更會算日子，不是更會轉傳末日的訊息。"],["p","是更會禱告，更想今天活得配得上。"],["p","「配得過」，又是那個字。這一章，第三次了。"],["p","可是請你留意，是誰「看」你配得？是神。"],["p","呼召是神先給的。保羅求的，是神自己來確認、來成全。"],["p","像一個孩子，一出生就有了家裡的姓。"],["p","父母還會一路陪著他，長成配得上這個姓的人。"],["q","蒙召是一次的。配得過所蒙的召，是一生的。"],["p","保羅求的第二件事：「又用大能成就你們一切所羨慕的良善和一切因信心所做的工夫」。"],["p","你心裡想做的善，你手上因信心在做的工，神都用大能把它做完。"],["p","做工的是我們，成全的是神。"],["p","你不必靠自己硬撐到過勞。做得成的，是他的大能。"],["p","目標在哪裡？請你聽第十二節。"],["q","「叫我們主耶穌的名在你們身上得榮耀，你們也在他身上得榮耀，都照著我們的神並主耶穌基督的恩。」（1:12）"],["p","「得榮耀」，原文 ἐνδοξασθῇ，和第十節是同一個字。"],["p","主的名，今天就可以在你身上得榮耀。"],["p","在哪裡？在你被冤枉的時候，不還手，也不裝沒事。"],["p","在你很想在群組裡反擊的時候，先把手機放下，去禱告。"],["p","在你又累又苦的時候，仍舊去關心坐在你旁邊的那一位。"],["p","可是保羅多說了半句。"],["q","你們也在他身上得榮耀。"],["p","榮耀是雙向的。"],["p","榮耀耶穌，不是把人踩扁，好把他抬高。"],["p","耶穌得榮耀的地方，人也一起被抬起來。"],["p","像月亮照亮夜空。光是太陽的。可是月亮自己，也因此被看見了。"],["p","最後一句，把一切釘在根上：都照著恩。"],["p","在受苦中被算為配得，是恩。善行能夠成全，是恩。"],["p","這一章從恩惠起頭，也在恩典收尾。"],["p","經文講完了，我們才回頭看一看自己。"],["p","國度321空中團契常說一句話：讓人作人，讓神作神。"],["p","伸冤，是神的位子。我回到人的位子。"],["p","受了傷，就承認受傷。能求助，就求助。"],["p","我做不了的那一份，留給那一位一定會來的主。"],["p","想自己報仇，是離開本位，伸手去抓神的權柄。"],["p","假裝沒事，是連人的位子也不肯站。兩邊都不是回到本位。"],["p","321 也說：讓耶穌得著一切的榮耀。"],["p","第十二節告訴我們，這句話不會把人壓扁。"],["p","因為他得榮耀的地方，你也在他身上得榮耀。"],["p","弟兄姊妹，我們回到一開始的那個問題。"],["q","如果神是公義的，為甚麼受苦的總是我們？"],["p","保羅沒有一件一件解釋：為甚麼是你，為甚麼是現在。"],["p","他給的不是一個答案。他給的是一張臉。"],["p","那一位要從天上顯現的主，你知道他是誰嗎？"],["p","他自己，就是那位最無辜、卻受苦最深的人。"],["p","被人誣告，被人鞭打，被人吐唾沫，被人釘在十字架上。"],["p","使徒彼得這樣形容那時候的他："],["q","「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（彼前 2:23）"],["p","你聽見了嗎？伸冤在神，他自己先走過。"],["p","他沒有報仇。他也沒有假裝沒事。他把自己交託給那位公義的父。"],["p","然後，父叫他從死裡復活。"],["p","所以有一天，他來的時候，他不是一位遠遠站著的審判官。"],["p","他是一位手上有釘痕的主。他知道被壓在地上是甚麼滋味。"],["p","第九節說，有人要永遠離開他的面。"],["p","可是對每一個投靠他的人，那一天是另一幅畫。"],["q","那一張臉，會轉過來，向著你。"],["p","他要把壓在你背上的那隻手拿開，把你扶起來。"],["p","然後，他的榮耀，要從你身上照出來。"],["p","所以，不必更怕那一天。也不必更佩服誰。"],["p","只要更愛這一位，抬起頭來，等他。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，把那個你一直放在心裡的名字，帶到神面前。"],["p","對主說：主啊，伸冤在你。我不報仇，我也不假裝沒事。"],["p","第二件，如果你正在受傷害，請你找一位信得過的人，說出來。"],["p","如果你身邊有一個正在受苦的弟兄姊妹，請你像保羅一樣，替他向神感謝，也去告訴他："],["p","你的忍耐，神看見了，我們也看見了。"],["p","浪還在打。可是這浪有終點，終點是榮耀。"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《你們要站立得穩》"],["p","弟兄姊妹平安，今天我們一起讀帖撒羅尼迦後書第二章。"],["p","我想先請你回想一則訊息。你的手機裡，大概也收到過。"],["q","「末日快到了，你看這些兆頭！」"],["p","後面通常有好幾個驚嘆號。再後面，是一長串的新聞。"],["p","哪裡地震了，哪裡打仗了，哪一種新東西出來了。"],["p","最後一行，常常是紅色的字：請轉給你愛的人。"],["p","轉來的人，多半是好心。他真的怕你沒有準備好。"],["p","收到的人呢？多半是害怕。"],["p","這種訊息，每隔幾年就轉一次。名字會換，日子會換，口氣不換。"],["p","每一次，都有人因為它辭了工作，賣了房子，和家人鬧翻。"],["p","然後那個日子過去了。轉的人不再提，怕的人也不好意思再提。"],["p","今天我想把這句話，放在帖撒羅尼迦後書第二章旁邊，對一對。"],["p","帖撒羅尼迦人聽到的，不是「快到了」。是「已經到了」。"],["p","而保羅回信的第一句話，不是「你看這些兆頭」。"],["q","是「不要輕易動心，也不要驚慌」。"],["p","這一章有三個詞：驚，氣，錨。"],["p","我們沿著它走三步：一則消息，一口氣，站穩。"],["q","第一步：一則消息。"],["p","先想一想這間教會的處境。"],["p","保羅在那裡，只講了三個安息日，就被暴民趕走了。"],["p","留下一群剛信主幾個星期的人。逼迫一天比一天重。"],["p","保羅在前一封信裡說過，主的日子要像夜間的賊一樣來。"],["p","然後，有一天，消息傳進來了。主的日子，已經到了。"],["p","請你站在他們的位子上想。"],["p","賊既然已經來過，主卻沒有來接我們。"],["p","那我們是不是……被留下了？"],["p","被搖動的，不只是一張時間表。是「我還是不是屬他的」。"],["p","保羅怎麼回？他沒有先更正日期。他先提醒他們，要見的是誰。"],["q","「弟兄們，論到我們主耶穌基督降臨和我們到他那裡聚集，」（2:1）"],["p","主的降臨，和我們的聚集。保羅把這兩件事放在一起講。"],["p","那一天，不是把你丟下的日子。是把你招聚到他那裡的日子。"],["p","那一天的次序怎麼排，被提在前還是在後，各派讀法不同，議題頁有細講。"],["p","可是沒有一派說：主來了，卻把屬他的人忘了。"],["p","然後就是全卷的那一句命令。"],["q","「我勸你們：無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌。」（2:2）"],["p","請你聽「動心」這兩個字。原文是 σαλευθῆναι。"],["p","它是講船的。一條船被浪打得左右搖晃。"],["p","後面還跟著三個字：從理智。意思是被一個浪，從你清醒的地方打出去。"],["p","「輕易」，原文是很快地。"],["p","所以保羅不是說，你們永遠不可以有感覺。"],["p","他是說：不要被第一個浪，就打離了你的心思。"],["p","收到訊息，心裡一跳，這是人。一跳就轉出去，這就是很快地被搖動了。"],["p","「驚慌」這個字，原文是 θροεῖσθαι。保羅不是自己發明的。"],["p","主耶穌在橄欖山上，門徒問他末日的兆頭，他說："],["q","「總不要驚慌」（太 24:6）"],["p","同一個字。使徒處理末日恐慌，沒有新招。只是把主的話再說一次。"],["p","再看那三個來源：有靈，有言語，有冒我名的書信。"],["p","有靈，就是「有一位弟兄得了異象」。"],["p","有言語，就是「聽說某某講的」。"],["p","有冒我名的書信，就是群組裡那一則，不知道誰寫的，卻掛了一個大名字。"],["p","所以聖靈的感動，也要被察驗。保羅在前一封信就說了："],["q","「但要凡事察驗」（帖前 5:21）"],["p","從聖靈來的，不怕被察驗。"],["p","還有一個字，請你帶回家。「現在到了」，原文是一個完成式：ἐνέστηκεν。"],["p","已經到了。你已經錯過了。你落後了，要趕快。"],["p","假訊息最常用的，就是這一種口氣。"],["p","所以下一次，那則訊息進到你的手機，先不要急著轉。"],["p","先慢一點，問一句："],["q","它把我帶到主耶穌面前，還是帶到恐懼面前？"],["p","接著保羅說，那日子以前，還有兩件事要先發生。"],["q","「因為那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來。」（2:3）"],["p","請你留意，保羅給他們的，不是一張倒數計時表。"],["p","是兩個路標。路標的用處，是讓人知道：還沒到，不必慌。"],["p","然後保羅說了一句，我很喜歡的話。"],["q","「我還在你們那裡的時候，曾把這些事告訴你們，你們不記得嗎？」（2:5）"],["p","這不是責備，是喚醒。他們不是沒學過。是一則消息進來，把學過的蓋住了。"],["p","所以保羅不再教新東西。他只說：想起來。"],["p","可是講到這裡，有一個人站了出來，就是那個大罪人。"],["p","這一段，是全本新約最難讀的地方之一。"],["q","第二步：一口氣。"],["q","「他是抵擋主，高抬自己，超過一切稱為神的和一切受人敬拜的，甚至坐在神的殿裡，自稱是神。」（2:4）"],["p","請你看這四級梯子。"],["p","先是抵擋，站到神的對面。再是高抬，把自己抬過一切。"],["p","然後是坐下，坐進神的殿裡。最後是開口：我就是神。"],["p","可是這條路，聖經第一頁就有了。蛇對人說："],["q","「你們便如神能知道善惡」（創 3:5）"],["p","大罪人不是一個新發明，是人類最古老的那個念頭，長到了盡頭。"],["p","讀到這一節，最大的試探是甚麼？"],["p","是馬上要替他找一張臉。"],["p","兩千年來，這張臉被貼過很多次。貼在某一位君王身上，某一位領袖身上，"],["p","某一個宗教，某一種新的科技。"],["q","每一次都貼錯了。每一次，都有人因此受傷。"],["p","所以今天，我不在這個講台上替任何人、任何政權、任何宗教、任何科技貼這張臉。"],["p","保羅自己也沒有貼。"],["p","那麼這一節，是拿來做甚麼的？請你看第七節。"],["q","「因為那不法的隱意已經發動，只是現在有一個攔阻的，等到那攔阻的被除去，」（2:7）"],["p","已經發動。不是將來才開始。保羅寫信的那一天，就在動了。"],["p","在哪裡動？在每一個不肯讓神作主的心裡。"],["q","2:4 不是一張通緝令。2:4 是一面鏡子。"],["p","我不會坐進耶路撒冷的聖殿。可是我可能在家裡，坐上神的位子。"],["p","我說了算。我的時間表，就是神的時間表。我的判斷，不容任何人質疑。"],["p","不法的隱意，在我不肯被任何人管的那一刻，就已經發動了。"],["q","讀完這一節，該問的不是「他是誰」，是「我今天坐在哪裡」。"],["p","好，回到第六節。保羅說，有一個攔阻的。"],["q","「現在你們也知道，那攔阻他的是甚麼，是叫他到了的時候才可以顯露。」（2:6）"],["p","攔阻的是誰？讀經的人猜了兩千年。"],["p","有人說是羅馬帝國，有人說是政府和法治，有人說是聖靈和教會。"],["p","也有人說是福音的傳揚，是天使長，是神自己的主權。"],["p","每一種讀法，都有一批敬虔的弟兄姊妹。他們都是弟兄。"],["p","可是請你聽保羅的口氣：你們也知道。"],["p","帖撒羅尼迦人知道，因為保羅當面講過。我們手上，少了那一頁筆記。"],["p","最誠實的回答，只有一句："],["q","他們知道。我們不知道。"],["p","可是這一個「不知道」，正是治末日恐慌最好的藥。"],["p","人害怕，常常是因為以為自己必須知道一切。"],["p","信心卻是：我不知道，但我認識那位知道的。"],["p","主耶穌自己，替這件事畫了一條線。"],["q","「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道」（太 24:36）"],["p","連子都說不知道。"],["p","所以任何一張推算到年份的圖表，不論畫得多漂亮，都已經越過了主耶穌畫的那條線。"],["p","攔阻的名字我們不知道，可是這個字的動作很清楚：邪惡被攔著。"],["p","大罪人想出來，要等「到了的時候」。"],["p","那個時候，是他的；可是那個時候，不是他定的。"],["p","像一隻被鍊子拴著的狗。叫得再兇，鍊子有多長，不在牠手裡。"],["p","惡看起來沒有邊。其實有一條線。畫線的，不是惡人。"],["p","然後，請你聽第八節。從全卷最低的 2:4，只走四節。"],["q","「那時這不法的人必顯露出來。主耶穌要用口中的氣滅絕他，用降臨的榮光廢掉他。」（2:8）"],["p","前面鋪了那麼久：背叛，不法，梯子，聖殿。"],["p","我以為會有一場大戰，打三百回合，難分難解。"],["p","沒有。"],["q","大罪人花了整整一節，爬上神的殿。主耶穌只吹了一口氣。"],["p","「滅絕」，原文是 ἀνελεῖ。保羅是從以賽亞書借來的。"],["q","「以口中的杖擊打世界，以嘴裡的氣殺戮惡人」（賽 11:4）"],["p","他不必拿武器。他一呼氣，就是審判。"],["p","他一出現，那個自稱是神的，就失效了。"],["p","像你走進一間黑屋子，按下開關。黑暗不必被說服，它只是不在了。"],["p","所以這一節，一定要回頭讀第二節。"],["p","帖撒羅尼迦人怕的，是那一天。保羅給他們看那一天的結局。"],["p","看一場已經知道比分的球賽，中間落後幾分，你不會跳起來。"],["p","你會安靜地看完。"],["q","我們不知道攔阻的是誰，但我們知道誰掌權。"],["q","我們不知道那日子是哪一天，但我們知道那一天的結局。"],["p","第九節說，他會行神蹟奇事。撒但騙人，不用醜陋的東西，用看起來最屬靈的東西。"],["p","所以分辨的標準，不是「有沒有能力」，是「合不合真理」。"],["p","然後是全段最要緊的一句。請你一定要先聽這一句，再聽下一句。"],["q","「並且在那沉淪的人身上行各樣出於不義的詭詐；因他們不領受愛真理的心，使他們得救。」（2:10）"],["p","人為甚麼被騙？不是因為不夠聰明。是因為不愛真理。"],["p","請你再看這一句最後四個字：使他們得救。"],["p","那一份愛真理的心，是神原本要送的禮物。"],["q","禮物送到了門口。是人沒有開門。"],["p","讀到這裡，我們才可以讀下一節。"],["q","「故此，神就給他們一個生發錯誤的心，叫他們信從虛謊，」（2:11）"],["p","這是全章最容易被講歪的一節。"],["p","有人用它說：神早就決定某些人要被騙，他們沒救了。"],["p","也有人拿它來說一位離開教會的人：他走了，就是神給了他錯誤的心。"],["p","兩種講法，都跳過了前一節。"],["p","次序是這樣的：先有禮物，人不收；然後神尊重他的選擇，讓他得到他要的。"],["q","「神任憑他們」（羅 1:24）"],["p","神把人自己選的，交還給他。"],["p","所以今天如果有一位正在懷疑、正在掙扎的人，坐在這裡，"],["p","你從這兩節該聽見的，不是「你完了」。是「門還開著」。"],["p","還在掙扎的人，正是還沒有關門的人。"],["p","前面十二節，保羅把浪有多大，全都說了。"],["p","然後，第十三節的頭兩個字，整個畫面翻過來了。"],["q","第三步：站穩。"],["p","這兩個字是：但我們。原文是 Ἡμεῖς δὲ。"],["q","「主所愛的弟兄們哪，我們本該常為你們感謝神；因為他從起初揀選了你們」（2:13）"],["p","保羅一句「但我們」，把我們帶進另一個世界：被愛的人的世界。"],["q","前面十節，讓你知道浪有多大。這一節，讓你知道船是誰的。"],["p","帖撒羅尼迦人怕甚麼？怕自己被留下，被錯過。"],["p","保羅的回答，不是一個日期。是一個稱呼：主所愛的。"],["p","浪會來，消息會來。這一個完成式，不會被一則群組訊息改寫。"],["p","「從起初」這三個字，古抄本只差一個字母，也可以讀成「初熟的果子」。"],["p","兩種讀法，安慰一樣深。"],["p","從起初：在一切消息出現以前，神已經選定了你。"],["p","初熟的果子：一間才建立幾個星期、被逼迫的小教會，竟是神在那座城裡收成的開端。"],["p","這一節後半說：被聖靈感動，成為聖潔。請你把它和第二節放在一起。"],["p","第二節有一個「靈」，叫人驚慌。第十三節的聖靈，叫人聖潔。"],["q","真從聖靈來的，會把人帶向聖潔和真理，不會把人帶向恐慌。"],["p","再下一節說，神是藉著傳福音召他們的。"],["p","不是一個異象，也不是一則轉傳的消息。"],["p","是幾個外地人走進會堂，講了三個安息日的耶穌。"],["p","所以，保羅才說出這一章的題目。"],["q","「所以，弟兄們，你們要站立得穩，凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守。」（2:15）"],["p","「站立得穩」，原文是 στήκετε。"],["p","站穩靠甚麼？不是靠一張更準確的末日圖表。"],["p","是靠「所領受的」。保羅沒有叫他們去追下一則消息，他叫他們回到已經領受的。"],["q","新消息，不能拿來檢驗舊教訓。舊教訓，要拿來檢驗新消息。"],["p","請你聽那兩個字：信上寫的。"],["p","第二節有一封冒名的信。第十五節，是真的那一封。"],["p","今天，使徒信上寫的，就在我們手裡。就是這一本聖經。"],["p","可是這一節，我也要很小心地講。因為它也很容易被用錯。"],["p","這裡的「教訓」，是使徒的教訓。"],["p","不是教會的規矩，不是某個宗派的傳統，也不是牧師或哪一位領袖個人的話。"],["p","如果有人拿這一節，要你對講台上每一句話「都要堅守」，不准問，"],["p","那就是把人的話，放到了使徒的位子上。"],["p","那正是第四節那個坐錯位子的毛病，一個小一號的版本。"],["p","保羅離開帖撒羅尼迦，下一站是庇哩亞。那裡的人是這樣聽道的："],["q","「天天考查聖經，要曉得這道是與不是」（徒 17:11）"],["q","站得穩的人，不怕問問題。因為他知道自己站在甚麼上面。"],["p","最後，這一章結束在一個禱告上。"],["q","「但願我們主耶穌基督和那愛我們……的父神，」（2:16）"],["p","這一句原文的頭兩個字，是：他自己。主自己。"],["p","而且很奇妙，主耶穌和父神兩位，後面用的動詞是單數。"],["p","好像在說：安慰你的，是同一雙手。"],["q","「安慰你們的心，並且在一切善行善言上堅固你們。」（2:17）"],["p","再看主堅固人的地方：善行善言。"],["p","就是普通的日子裡，好好做事，好好說話。"],["p","保羅把我們的眼睛，從末日拉回今天的廚房和工作桌。"],["p","被主安慰的人，不急著轉傳末日訊息。他會安靜地，把今天的工做好。"],["p","講到這裡，我們才可以回頭說一說，國度321空中團契常講的幾句話。"],["p","我們常說：焦點在耶穌，不在自己、不在別人、不在環境。"],["p","讀完這一章，我想加一句："],["q","也不在末日的時間表。"],["p","我們也常說：驕傲，是離開本位抓住權力，想要代替神。"],["p","全本聖經，把這句話畫得最濃的，就是第四節那一張梯子。"],["p","所以無己，不是去找出大罪人。那不是我們的位子。"],["p","無己，是從那張梯子上，自己走下來，讓耶穌作王。"],["p","這不是因為我們比撒但強。是因為我們躲在一位一口氣就能勝的主後面。"],["p","我們的位子是站穩。主的位子是得勝。回到本位的人，反而最平安。"],["p","也許今天這裡，有人曾經被這樣的訊息傷過。"],["p","你為了一個日子，放下了工作，或者跟家人吵翻了。後來那個日子過去了。"],["p","我想對你說：你不必羞愧。你是因為愛主，才那麼在意。"],["p","你需要的是陪伴，不是嘲笑。教會欠你的，是一雙接住你的手。"],["p","弟兄姊妹，我們回到開頭那一則訊息。"],["q","「末日快到了，你看這些兆頭！」"],["p","保羅讀完這一章，大概會把它改成這樣："],["q","主一定會來。不要輕易動心，也不要驚慌。"],["p","你不必看兆頭。你要看的，是一個人。"],["p","那一位，一口氣就勝了。那一位，從起初就揀選了你。"],["q","船穩不穩，不看浪多大。看錨扣在誰身上。"],["p","所以你不必更怕世界，也不必更佩服誰算得準。只要更愛這一位。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，下一次收到這種訊息，先不要轉。先停三秒，問："],["p","它讓我更愛主，還是更害怕？它讓我站穩，還是驚慌？"],["p","第二件，打開你的聖經，讀一讀「信上寫的」。讓舊的教訓，去檢驗新的消息。"],["p","這就是一個等候主的人，站穩的樣子。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《你們行善不可喪志》"],["p","弟兄姊妹平安，今天我們一起讀帖撒羅尼迦後書第三章。"],["p","星期一早上，六點四十五分，枕頭旁邊的手機響了。"],["p","你伸出手，在螢幕上一滑。再睡十分鐘。"],["p","十分鐘以後，它又響了。"],["p","這一次，你沒有馬上關掉。你躺在那裡，看著天花板。"],["p","這幾年，有兩個詞，很多人都聽過。"],["q","一個叫「內捲」。一個叫「躺平」。"],["p","內捲，就是大家拚命往裡擠。加班加到半夜，誰也不敢先停。"],["p","躺平，就是乾脆不擠了。反正怎麼拚都一樣，那我就躺著。"],["p","一邊是累到不敢停，一邊是累到不想動。"],["p","那個躺在床上看天花板的人，也許是你，也許是我。"],["p","他是基督徒。一個念頭悄悄冒出來：主若快來了，我這麼拚做甚麼？"],["p","另一個念頭緊跟著：可是我若不拚，下個月吃甚麼？"],["q","然後，他把腳放到地上，坐了起來。"],["p","今天，我想陪你看這一刻。按掉鬧鐘，又起床的那一刻。"],["p","兩千年前，帖撒羅尼迦的教會，也有人聽說主的日子到了，就按掉鬧鐘，不再起來。"],["p","也有人一直在起床，一直在做工，一直在擺那張大家一起吃飯的桌子，做到快撐不住了。"],["p","保羅這封信的最後一章，就是寫給這兩種人的。"],["q","「弟兄們，你們行善不可喪志。」（3:13）"],["p","這一章有三個詞：禱，工，安。"],["p","我們沿著它走三步：主是信實的，安靜做工，勸他如弟兄。"],["q","第一步：主是信實的。"],["q","「弟兄們，我還有話說：請你們為我們禱告，好叫主的道理快快行開，得著榮耀，正如在你們中間一樣，」（3:1）"],["p","請你留意，保羅寫到最後一章，第一句不是命令，是請求。"],["p","聽這句話的，是一間只聽他講過三個安息日的教會。"],["p","服事的人，也在浪裡。"],["p","他先求的是：主的道理，快快行開。"],["p","「行開」，原文 τρέχῃ，就是跑。道，被寫成一位跑者。"],["p","我們為傳道人禱告，常常只求出入平安、身體健康。"],["p","這當然要求。可是保羅先求道能跑起來，再求工人被保護。"],["q","「也叫我們脫離無理之惡人的手；因為人不都是有信心。」（3:2）"],["p","「無理」，原文是出格的意思。不在其位，不按牌理。"],["p","然後，他平平地說了一句：人不都是有信心。"],["p","而且請你聽，這半句話最後一個字，是「信」。"],["p","下一句的第一個字，也是「信」。"],["q","「但主是信實的，要堅固你們，保護你們脫離那惡者。」（3:3）"],["p","原文這兩句緊緊貼在一起。前一句說人的 πίστις，信心。後一句一開口就是 πιστὸς，信實。"],["p","人的信，會短缺。主的信實，不會。"],["p","一艘船在浪裡，錨不是綁在船員的腰上，是扎在海底的石頭裡。"],["p","保羅沒有說：人不都有信心，所以你們要更有信心。"],["p","他說：但主是信實的。"],["p","這一節有三個動詞，主詞全部是主。主是信實的，主要堅固，主要保護。"],["p","弟兄姊妹，你是不是常常怕，怕自己撐不到底？"],["p","保羅的回答是：撐到底的，是主。"],["p","「那惡者」，和合本旁邊有一個小註：或譯，脫離凶惡。"],["p","原文兩種讀法都通：那個惡者，或是凶惡。"],["p","不管是哪一種，保羅只說：主會保護你們。"],["q","盯著惡的人，越看越怕。仰望主的人，越看越穩。"],["p","然後，在下面那幾句很重的吩咐之前，保羅先說了兩句很軟的話。"],["q","「我們靠主深信，你們現在是遵行我們所吩咐的，後來也必要遵行。」（3:4）"],["p","等一下我們會讀到紀律。可是請你先記住："],["p","紀律不是從懷疑開始，是從信任開始。"],["q","「願主引導你們的心，叫你們愛神，並學基督的忍耐！」（3:5）"],["p","「引導」，原文 κατευθύναι，意思是把路修直。"],["p","被末日消息嚇過的心，被逼迫傷過的心，路是彎的。"],["p","修直了，通到哪裡？兩個地方：神的愛，和基督的忍耐。"],["p","和合本說「學基督的忍耐」。其實原文沒有「學」字，只說基督的忍耐。"],["q","忍耐不先是一門功課，是一個地方。"],["p","基督的忍耐，已經在十字架上走完了全程。我們是被引進去，在那裡面學。"],["p","321 說，耶穌是我的榜樣。這一節再補一句：榜樣，也是我的住處。"],["p","一個被引進基督忍耐裡的人，星期一早上，會怎樣？"],["p","他會起床。"],["p","於是保羅的筆，從禱告，轉到了工作。"],["q","第二步：安靜做工。"],["q","「弟兄們，我們奉主耶穌基督的名吩咐你們，凡有弟兄不按規矩而行，不遵守從我們所受的教訓，就當遠離他。」（3:6）"],["p","這一段，從第六節一直到第十五節，是一整個單元。"],["p","「吩咐」，原文 Παραγγέλλομεν，是軍中傳令的字。這一章保羅用了四次。"],["p","「不按規矩而行」，原文 ἀτάκτως，也是軍隊的字：脫隊。"],["p","請你想像一支隊伍在行軍。有一個人停下來，不走了。"],["p","他是誰？經文說，他是「弟兄」。"],["p","一直到第十五節，保羅還叫他弟兄。整段紀律，沒有把他踢出家門。"],["p","標準是甚麼？「從我們所受的教訓」。"],["p","這是使徒的教訓。今天，它就寫在聖經裡。"],["p","所以我要很清楚地說：它不是教會的內規，不是某個宗派的傳統，也不是哪一位領袖的話。"],["p","包括今天站在台上的我。"],["p","帖撒羅尼迦的下一站是庇哩亞，那裡的人天天考查聖經。"],["p","堅守使徒的教訓，是鼓勵你打開聖經察驗，不是禁止你發問。"],["p","然後是方式：「遠離他」。原文是收起帆，自己退後一步。"],["p","不是驅逐，不是公告，是不再配合他脫隊的生活。"],["p","為甚麼要這樣？保羅指著自己。"],["q","「也未嘗白吃人的飯，倒是辛苦勞碌，晝夜做工，免得叫你們一人受累。」（3:8）"],["q","帖撒羅尼迦，一間作坊。油燈底下，一雙手在縫皮革。"],["p","使徒行傳告訴我們，保羅的手藝，是製造帳棚。"],["p","寫這封信的時候，他人在哥林多，手上大概還有皮革的味道。"],["q","這一節，不是過勞的榜樣。"],["p","華人很會拚，很容易把「晝夜做工」聽成：越累越屬靈。"],["p","請你再聽一次，保羅自己給的理由：免得叫你們一人受累。"],["p","他做工，是為了不成為別人的重擔。"],["p","如果一個人的過勞，最後把重擔轉給了他的配偶、他的孩子、醫院的病床，"],["p","那就正好走到了第八節的反面。"],["p","我們在歌羅西書講過：無己，不是苦待己身。"],["q","「這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們。」（3:9）"],["p","請你聽這個「並不是」。保羅有權柄。他可以被教會供養。"],["p","在哥林多前書，他說得很清楚：傳福音的，可以靠著福音養生。"],["p","所以這一節不是反對傳道人支薪，也不是說帶職的比全職的屬靈。"],["p","「榜樣」，原文 τύπον，是模子，是壓下去留下的印。"],["p","這就是 321 說的，謙卑是放下權力，回到本位。"],["p","不是沒有權力。是有，卻不抓住。"],["p","然後，就是那一句。"],["q","「我們在你們那裡的時候，曾吩咐你們說，若有人不肯做工，就不可吃飯。」（3:10）"],["p","關鍵在一個動詞：θέλει。願意，想要。"],["q","是「不肯」，不是「不能」。"],["p","保羅沒有寫：若有人不能做工。也沒有寫：若有人找不到工作。"],["p","那時候教會的飯桌，是弟兄姊妹用辛苦錢擺出來的。"],["p","保羅說：有能力、有機會，卻不肯做工的，不要坐在那裡把它吃空。"],["p","這句話保護的，是那些擺桌子的人。"],["p","所以弟兄姊妹，請你聽清楚，這一節不是給下面這些人的。"],["p","投了一百封履歷、還沒有回音的人。"],["p","生病的人，病好了還沒有力氣的人。"],["p","身心障礙的人。年老的人。"],["p","在家照顧孩子、照顧長輩，一做就是十年，沒有一分薪水的人。"],["p","他們不是「不肯」。他們是「不能」，或者，他們正在做一份沒有薪水的工。"],["q","他們不在第十節裡面。他們在「你們眾人彼此相愛的心」（1:3）裡面。"],["p","同一位保羅，在以弗所書說，做工是為了"],["q","「就可有餘分給那缺少的人」（弗 4:28）"],["p","他也吩咐教會，要照顧那些真無倚靠的寡婦。"],["p","不肯做工的，不可吃飯；不能做工的，教會要供應。"],["q","兩句一起讀，才是保羅。只讀一句，就成了別人。"],["p","所以這一節，也不能拿來反對一切對軟弱的人的救助。"],["p","如果今天早上，你的鬧鐘沒有響，因為你已經失業半年了，"],["p","請你聽我說：這一節沒有在罵你。這個教會的桌子，有你的位子。"],["p","那麼，那位不肯做工的人，整天在做甚麼？"],["q","「因我們聽說，在你們中間有人不按規矩而行，甚麼工都不做，反倒專管閒事。」（3:11）"],["p","原文這裡，是一個文字遊戲。"],["p","「做工」是 ἐργαζομένους。「管閒事」是 περιεργαζομένους，同一個字，前面加上「周圍」。"],["q","甚麼工都不做，卻在周圍到處做工。"],["p","他不是太閒。他是太忙。忙錯了地方。"],["p","一個人在群組裡轉了一整天的消息：誰說主哪一年要來，誰又得罪了誰。"],["p","手機一直在亮，手上的工一直沒動。"],["p","保羅開的藥，很平凡。"],["q","「我們靠主耶穌基督吩咐、勸戒這樣的人，要安靜做工，吃自己的飯。」（3:12）"],["p","請你先聽語氣：吩咐，勸戒。命令旁邊，放了勸勉。"],["p","然後是三件很平凡的事：安靜，做工，吃自己的飯。"],["p","安靜，是對「管閒事」的回答。"],["p","做工，是對「不肯」的回答。"],["p","吃自己的飯，是對「白吃人的飯」的回答。"],["p","現在，請你回到那個星期一早上的鬧鐘。"],["p","內捲的人，需要聽見「安靜」。你的價值不在你的產值。你不必拚到半夜，才算一個人。"],["p","躺平的人，需要聽見「做工」。工作不是證明，是恩典，也是愛人的方式。"],["q","真盼望主來的人，今天會好好上班。"],["p","因為主是信實的，所以我可以安安靜靜地，把今天的工做好。"],["p","可是這一段，還有第三種人。"],["p","他不是脫隊的人，也不是管閒事的人。"],["p","他是那個一直在擺桌子的人。"],["p","看久了，心裡難免冒出一句：我這樣做，到底有甚麼用？"],["p","保羅轉過身，對他說了一句話。"],["q","「弟兄們，你們行善不可喪志。」（3:13）"],["p","「喪志」，原文 ἐγκακήσητε，是在壞的處境裡洩了氣，軟下來，想放棄。"],["p","請你留意：「不可喪志」這句話本身，就承認了一件事。"],["q","行善的人，會喪志。"],["p","保羅知道你累了。"],["p","所以這一節不是鞭子。"],["p","一位服事到倦怠的同工，最需要的，先是休息，是陪伴，有時候是專業的協助。"],["p","主耶穌自己，對累壞了的門徒說："],["q","「你們來，同我暗暗地到曠野地方去歇一歇。」（可 6:31）"],["p","服事倦怠，不是屬靈失敗。休息，正是為了不喪志。"],["q","「我們行善，不可喪志；若不灰心，到了時候就要收成。」（加 6:9）"],["p","收成有時候。不是每天。"],["p","所以星期一早上，那個按掉鬧鐘、又坐起來的人，他不是英雄。"],["p","他只是一個被主的信實撐著，今天再走一步的人。"],["p","可是那位脫隊的弟兄呢？"],["p","擺桌子的人不喪志了，那個不肯回來的人，教會要怎麼辦？"],["q","第三步：勸他如弟兄。"],["q","「若有人不聽從我們這信上的話，要記下他，不和他交往，叫他自覺羞愧。」（3:14）"],["p","請你不要在這裡停。"],["p","停在這裡，它就成了冷暴力、公開點名、切斷家人、封鎖離開的人的藉口。"],["p","所以保羅不讓我們停。下一節，緊緊接上。"],["q","「但不要以他為仇人，要勸他如弟兄。」（3:15）"],["p","紀律有四條界線，全部在這兩節裡。"],["p","先看對象。是不聽從使徒信上的話，而且一直不肯回轉的人。"],["p","放在這一段，就是那位不肯做工、專管閒事的弟兄。"],["p","不是提出疑問的人。不是意見不同的人。也不是離開教會的人。"],["p","再看方式。「不和他交往」，原文是不混在一起。"],["p","減少一般的來往，不再配合他的生活。"],["p","不是公開點名，不是在群組裡截圖，不是叫他的家人跟他斷絕關係。"],["p","再看目的。「叫他自覺羞愧」，原文 ἐντραπῇ，是轉過身，回頭看自己。"],["p","是他自己回頭看。不是叫眾人一起羞辱他。"],["p","最後是底線。他仍是弟兄。教會仍要對他說話。"],["p","想像一個家庭。一個成年的孩子，有能力工作卻不肯做，天天在家裡惹事。"],["p","智慧的父母，不會把他鎖在門外，也不會在親戚面前羞辱他。"],["p","可是他們會停下來，不再替他付所有的帳，讓他看見自己的處境。"],["p","他們退後一步，是為了讓他轉身。"],["q","退後一步，是為了讓他轉身；不是為了讓他消失。"],["p","主耶穌說，弟兄得罪你，你就去，單獨跟他說。"],["q","「他若聽你，你便得了你的弟兄」（太 18:15）"],["p","紀律的成功，不是贏了一場爭論，是得回一個弟兄。"],["p","「記下他」的「記」，和三節以後「以此為記」的「記」，原文同一個字根。"],["p","教會記下一個人，是為了挽回他。保羅記下自己的名字，是為了保護教會。"],["p","這就是 321 說的，人比事重要。"],["p","紀律處理的是一件事。可是對象是一個人，而且是弟兄。"],["p","然後，保羅寫到了這封信的最後幾句。"],["q","「願賜平安的主隨時隨事親自給你們平安！願主常與你們眾人同在！」（3:16）"],["p","一封寫給驚慌的人的信，最高的地方，是平安。"],["p","請你聽「親自」。原文 Αὐτὸς，主自己。"],["p","給平安的，不是一張正確的末世圖表，不是一個解決了的問題，是主自己。"],["p","沒有一個時刻，沒有一種處境，是他給不了平安的。"],["p","星期一早上六點四十五分，也在裡面。"],["p","「眾人」，包括第十四節那位被記下的弟兄。"],["p","教會可以和一個人保持距離，可是不能把他從禱告裡除名。"],["p","然後，保羅從代筆的人手上，接過了筆。"],["q","「我－保羅親筆問你們安。凡我的信都以此為記，我的筆跡就是這樣。」（3:17）"],["p","有人冒他的名寫過信。保羅的對策很樸素：認得我的筆跡。"],["p","今天，使徒的筆跡，就在我們手上。就是這本聖經。"],["p","群組裡轉來的末日消息，自稱得了啟示的人，轉了十手的見證。"],["p","拿去對一對這筆跡。不合的，就不必動心。"],["p","教會的規矩、傳統、領袖的話，包括今天這篇講道，也都要放在這筆跡底下，被察驗。"],["p","弟兄姊妹，我們回到那個鬧鐘。"],["q","星期一，六點四十五分。手機又響了。"],["p","這一次，請你聽這一章的四句話。"],["q","「但主是信實的」（3:3）"],["p","你的信心今天也許很小。可是撐住你的，不是你。"],["q","「你們行善不可喪志」（3:13）"],["p","你會累。主知道你累。累了就歇一歇，然後再走一步。"],["q","「願賜平安的主隨時隨事親自給你們平安」（3:16）"],["p","今天辦公室裡、病房裡、廚房裡的那些事，沒有一件在他的平安以外。"],["q","「我的筆跡就是這樣」（3:17）"],["p","今天會有很多聲音進到你的手機。你知道該拿甚麼去對。"],["p","可是請你再想一想，第五節那幾個字：基督的忍耐。"],["p","這一章叫我們不可喪志。可是真正一步也沒有喪志的，是基督自己。"],["p","他背著十字架，一路走到底，沒有半路停下來。"],["p","新約有一封信，正是把他的忍耐，和我們的灰心，放在一起說："],["q","「那忍受罪人這樣頂撞的，你們要思想，免得疲倦灰心。」（來 12:3）"],["p","所以你今天能起床，不是因為你夠堅強。"],["p","是因為有一位，已經為你走完了全程。現在，他又親自來，把平安放在你手裡。"],["q","「願我們主耶穌基督的恩常與你們眾人同在！」（3:18）"],["p","國度321空中團契常說：焦點在耶穌，不在自己，不在別人，不在環境。"],["p","這封信再加一句：也不在末日的時間表。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，鬧鐘響的時候，坐起來以前，先輕輕說一句：主是信實的。"],["p","然後，安安靜靜地，把今天的工做好。不管那份工，有沒有薪水。"],["p","第二件，想一位已經很久沒有消息的弟兄姊妹。"],["p","不要在群組裡討論他。打一通電話給他。"],["p","讓他知道：你仍是我的弟兄。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——一間被末日消息嚇到的受逼迫教會，這封信為甚麼寫？","r":"1:3--5；2:1--2；3:6--12","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前議題「書信的處境與原則」），本卷補述：一間只待了三個安息日就失去父母的教會，被一則「主的日子已經到了」的消息推得搖晃。帖撒羅尼迦後書常被當成一份末世預言的資料庫來讀，人一翻開就直奔 2:3–8，想從裡面排出時間表、找出大罪人；也有人只記得 3:10 一句話，把全卷讀成一份工作倫理守則。這封信為甚麼寫、寫給一間怎樣的教會、今天的帖撒羅尼迦在哪裡，必須在開卷講定，全卷三章的落點才不會被末日的煙霧蓋住。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：保羅寫信給特定地區、特定年代、遇到特定問題的教會；讀信的人要先找出他的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：帖撒羅尼迦人遇到甚麼？保羅從福音推出甚麼原則？今天這原則落在哪裡？<\/p><p>本卷要補的只有一段：<strong>帖撒羅尼迦教會是保羅只待了很短時間就被趕走的教會。<\/strong>保羅在那裡的會堂「一連三個安息日」（徒 17:2）講道，接著暴民闖進耶孫的家，弟兄們連夜把保羅和西拉送走（〔背景〕徒 17:5–10）。這是一間根基最短、逼迫最早的教會——前書說他們「受了本地人的苦害」（帖前 2:14），後書開頭說逼迫還在加重：「在所受的一切逼迫患難中，仍舊存忍耐和信心」（1:4）。<\/p><p>然後，一則消息進來了：「無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌」（2:2）。同時，教會裡有人「甚麼工都不做，反倒專管閒事」（3:11）。<strong>經文問的是：這封信的處境到底是甚麼？是一場教義論戰、一股末世狂熱，還是一間被嚇壞了的小教會？今天的讀者要把它放在哪一間教會裡讀？<\/strong><\/p>"],["錯誤教導說（處境是一套需要被駁倒的末世神學）","","<p>認為這封信背後有一套成形的錯誤教導：有人主張主的日子已經以某種屬靈的方式來到了，就像後來提摩太後書說有人「說復活的事已過，就敗壞好些人的信心」（提後 2:18）。所以帖後的主體是一篇末世論的辯駁文，2:3–12 是保羅給出的正統時間表，用來駁倒對方。這派的優點是認真看待 2:2 的「冒我名的書信」——的確有人在教導，而且借用了使徒的權威。<\/p><p><strong>難處：<\/strong>信裡完全沒有點出這些教導者的名字，也沒有像加拉太書那樣長篇逐條辯駁；保羅的回應不是「他們教錯了甚麼」，而是「不要輕易動心，也不要驚慌」——他處理的是人的心，不是一套學說。而且若把 2:3–12 讀成一張完整的時間表，就會忽略 2:5–6 保羅自己說的：他口頭講過的那一頁，信裡沒有寫出來。把一封安慰信讀成一張圖表，正是這封信要防備的。<\/p>"],["末世狂熱說（處境是一群以為主明天就來、於是不做工的人）","","<p>認為全卷的線索是把第 2 章和第 3 章連起來讀：有人相信主的日子已經到了，於是放下工作，等著主來，靠別的信徒養活，還到處「專管閒事」——第 3 章的不做工，就是第 2 章末世狂熱的果子。這派的優點是把全卷讀成一體，而且有前書作旁證：前書已經勸他們「親手做工」（帖前 4:11）、「要警戒不守規矩的人」（帖前 5:14），到後書問題擴大了。<\/p><p><strong>難處：<\/strong>保羅在第 3 章並沒有把不做工和末世論直接連起來，他提出的理由是效法使徒的榜樣、不叫人受累（3:7–9），而不是「主還沒有來」；學界對不做工的原因還有倚賴恩主、輕看勞動等說法（見議題「做工、懶惰與教會紀律」）。末世狂熱可能是原因之一，但若把它當成唯一的鑰匙，就容易把第 3 章的人一律講成「迷信末日的人」，而忽略了今天許多不在末日狂熱裡、卻一樣脫隊的人。<\/p>"],["逼迫與恐慌說（處境是一間在苦難裡被一則消息推倒的小教會）","","<p>認為這封信最核心的處境是逼迫加上恐慌。一間只受教幾個星期就失去使徒的教會，正在受苦；受苦的人最容易相信「這就是那最後的大災難」——既然苦到這個地步，主的日子一定已經到了，而我們竟然還在這裡，是不是被撇下了？於是 1:3–12 先處理苦難的意義，2:1–12 處理消息，2:13–3:5 處理他們的心，3:6–15 處理被恐慌打亂的生活。保羅的語氣從頭到尾是安定：「但主是信實的，要堅固你們，保護你們脫離那惡者」（3:3）。<\/p><p><strong>難處：<\/strong>這派重建的心理處境，經文沒有逐字寫出來，是從 2:2 的兩個動詞「動心」「驚慌」和全卷的安慰語氣推出來的；若講得太滿，也可能忽略 2:2 背後確實有人在借使徒之名說話。所以這個讀法要與錯誤教導說的觀察並用：有人在傳，有人在怕——傳的人要被分辨，怕的人要被安慰。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補一段：這封信的處境不是異端，是恐慌。<\/strong>一間根基最短、逼迫最早的教會，被一則借著屬靈經驗、傳言與冒名信件傳進來的消息推得搖晃。保羅離開前教過他們末世的事——「我還在你們那裡的時候，曾把這些事告訴你們，你們不記得嗎？」（2:5）——<strong>但一間根基短的教會，最容易被一則消息推倒。<\/strong>本講義以「逼迫與恐慌」為框架，吸收另外兩說的觀察：有人在傳錯誤的消息，有人因此打亂了生活；但保羅寫信的目的，是叫人站穩，不是贏一場論戰。<\/p><p>所以全卷三章，是等候主的三個姿勢：<strong>榮<\/strong>——在逼迫裡抬頭，看見主要「在他聖徒的身上得榮耀」（1:10）；<strong>穩<\/strong>——在消息裡站定，「所以，弟兄們，你們要站立得穩」（2:15）；<strong>行<\/strong>——在今天往前走，「弟兄們，你們行善不可喪志」（3:13）。<\/p><p><strong>今天的帖撒羅尼迦，就是每一個用手機轉傳「末日訊息」的華人群組。<\/strong>全卷三章的落點，都照這一條量：一個等候主的人，怎樣在今天的群組、職場、教會與受欺負的處境裡，不驚慌、站得穩、安靜地把今天的工做好？<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，知道這封信的處境，正是一種安慰。這封信不是寫給一間根基深厚、教義齊全的教會，是寫給一間只學了幾個星期、就要在逼迫裡自己站住的教會。保羅沒有責備他們怎麼這麼容易被嚇到，他先說「我們該為你們常常感謝神」（1:3），因為他們「仍舊存忍耐和信心」（1:4）。<\/p><p>如果你也曾經被一則末日訊息嚇到、睡不著、想轉傳給所有家人，帖撒羅尼迦後書是寫給你的。<strong>使徒對一群被嚇壞的初信者說的第一句重話，不是「你們怎麼這麼無知」，而是「不要輕易動心，也不要驚慌」（2:2）；最後一句是「願賜平安的主隨時隨事親自給你們平安」（3:16）。<\/strong><\/p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。帖撒羅尼迦後書的處境不是異端，是恐慌：一間根基最短、逼迫最早的教會，被一則「主的日子已經到了」的消息推得搖晃。全卷三章是等候主的三個姿勢：榮（抬頭）、穩（站定）、行（往前走）。今天的帖撒羅尼迦，就是每一個轉傳末日訊息的華人群組。","care":"牧養底線：講「今天的帖撒羅尼迦」時，不嘲笑轉傳末日訊息的長輩，也不在台上念出某個群組、某位弟兄姊妹轉來的訊息——轉傳的人多半不是惡意，是害怕、是愛家人。席上也會有初信的人、剛受洗的人，他們像帖撒羅尼迦人一樣根基還短，需要的是被扶著站穩，不是被笑「這麼容易被騙」。還要想到正在受逼迫、受排擠的人，尤其是在家裡因為信主而受壓力的弟兄姊妹：先對他們講 1:3–4，保羅為他們的忍耐感謝神。"},{"id":"ISS00_2","t":"主的日子、被提與大罪人——我們能知道那日子嗎？大罪人與攔阻的是誰？","r":"1:7--10；2:1--12","ch":[],"why":"二、主必親自、可見地再來；那日子沒有人知道；各派被提與千禧年觀並陳、都是弟兄；不算日子、不點名——本講義的全卷立場之二（本卷新立）。這是本卷最重要的一題，因為 2:1–12 是全本新約最難解的段落之一，也是教會歷史上被用來算日子、指認敵基督最多的段落：每一個世代都有人替大罪人找到一張臉，每一次都錯了，每一次都傷了人。主的日子是甚麼、那日子以前會發生甚麼、大罪人與攔阻的是誰、被提在甚麼時候、教會該怎樣面對這些不同的讀法，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，論到我們主耶穌基督降臨和我們到他那裡聚集」（2:1），有人說「主的日子現在到了」（2:2）。保羅回答：「因為那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來」（2:3）；又說「現在你們也知道，那攔阻他的是甚麼，是叫他到了的時候才可以顯露」（2:6）。<strong>經文問的是：主的日子已經到了嗎？那日子以前會發生甚麼？大罪人是誰？攔阻的是誰？我們會在大災難前被提嗎？<\/strong><\/p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、主一定會回來<\/strong>：「主耶穌同他有能力的天使從天上在火焰中顯現」（1:7）——看得見、有榮耀、一次的。<strong>二、那日子還沒有到<\/strong>：2:2 的「現在到了」是假消息，2:3 說那日子以前必有某些事。<strong>三、邪惡會增長，但被管著<\/strong>：「那不法的隱意已經發動」（2:7），可是大罪人要「到了的時候才可以顯露」——連他出場的時間都不由他定。<strong>四、邪惡會被主輕易結束<\/strong>：「主耶穌要用口中的氣滅絕他，用降臨的榮光廢掉他」（2:8）——最大的浪，一口氣就平了。<strong>五、保羅寫這些的目的是安定<\/strong>：前面是「不要輕易動心，也不要驚慌」（2:2），後面是「所以，弟兄們，你們要站立得穩」（2:15）。<\/p><p>還有一件決定性的事：「我還在你們那裡的時候，曾把這些事告訴你們，你們不記得嗎？」（2:5）<strong>帖撒羅尼迦人知道攔阻的是誰，我們不知道。<\/strong>保羅口頭講過的那一頁，信裡沒有寫出來；奧古斯丁讀到這裡，坦白說他完全不知道保羅指的是甚麼。<\/p>"],["千禧年三大觀（前千禧年、無千禧年、後千禧年）","","<p>這一題的大框架，是怎樣讀「一千年」（〔背景〕啟 20 章）與主再來的先後。<strong>前千禧年<\/strong>認為主先再來，然後在地上作王一千年；其中又分<strong>歷史前千禧年<\/strong>（早期教父多有此說，近代如賴德 George Ladd）與<strong>時代論前千禧年<\/strong>（十九世紀以來，強調以色列與教會的分別，對華人教會影響很深）。<strong>無千禧年<\/strong>認為一千年是象徵，指從基督升天到再來的整個教會時代，基督現在已經在天上作王（奧古斯丁以來的主流，許多改革宗、路德宗教會持守）。<strong>後千禧年<\/strong>認為福音會廣傳，世界在教會時代末期進入一段長久的興盛，然後主再來（清教徒與十九世紀的宣教運動常見）。<\/p><p><strong>難處：<\/strong>三派各有經文的根據，也各有不容易安放的經文：前千禧年要解釋為甚麼新約大多數經文只說一次再來、一次審判；無千禧年要解釋啟 20 章「頭一次的復活」為甚麼是屬靈的；後千禧年要面對 2:3「離道反教」、2:7「不法的隱意已經發動」這種邪惡增長的圖畫。<strong>而三派都相信主必親自、看得見地再來，都在福音派之內。<\/strong>帖撒羅尼迦後書本身沒有提到一千年，任何一派都不能拿這卷書證明自己、否定別人。<\/p>"],["被提四說（災前、災中、忿怒前、災後）","","<p>2:1「我們到他那裡聚集」，就是前書說的「必和他們一同被提到雲裡，在空中與主相遇」（帖前 4:17），各派都同意；爭的是時間。<strong>災前被提<\/strong>：教會在七年大災難開始前被提，主的降臨分兩段——先為教會在空中，後與教會一同降臨地上（時代論前千禧年派，也是許多華人教會最熟悉的一說）；理由之一是神應許教會「脫離將來忿怒」（帖前 1:10）。<strong>災中被提<\/strong>：教會在大災難中途被提（少數前千禧年派）。<strong>忿怒前被提<\/strong>：教會經歷敵基督的逼迫，但在神的忿怒傾倒以前被提（近代部分前千禧年學者）。<strong>災後被提<\/strong>：主只有一次降臨，教會在災難之後迎接他，像城裡的人出城迎接來訪的君王，再一同進城（歷史前千禧年派；無千禧年與後千禧年派也把聚集放在主唯一一次的降臨）。<\/p><p><strong>難處：<\/strong>災前說的難處正在本章：保羅告訴帖撒羅尼迦人，在聚集以前，大罪人要先顯露（2:1–3），這讀起來像是教會會看見他；災前說的回應是 2:1–3 講的是「主的日子」而不是被提本身，或把 2:3 的「離道」讀成「離去」（字義的延伸，多數學者不接受）。災後說的難處是要解釋「脫離將來忿怒」的應許怎樣在災難中成就；災中說與忿怒前說則要說明中途的界線在經文哪裡。<strong>四說都相信主必親自、看得見地再來，都是主內的弟兄姊妹。<\/strong><\/p>"],["大罪人與「殿」的讀法（末日一位具體人物、歷史原型、兩者兼有）","","<p>「他是抵擋主，高抬自己，超過一切稱為神的和一切受人敬拜的，甚至坐在神的殿裡，自稱是神」（2:4）。<strong>一、末日一位具體的人物<\/strong>：約翰一書稱為「那敵基督的」（這使我們想起約壹 2:18），在主再來以前出現，被主親自滅絕（2:8）。<strong>二、歷史上一再出現的原型<\/strong>：保羅的用語這使我們想起但 11:36「自高自大，超過所有的神」；在他之前有安提阿古四世在聖殿設立外邦祭壇，在他的時代有皇帝卡利古拉要把自己的像立在耶路撒冷聖殿——大罪人是一種一再重演的姿態。<strong>三、前兩者兼有<\/strong>：原型一再出現，最後有一位總結者。至於「殿」，有人讀為將來重建的耶路撒冷聖殿，有人讀為比喻——坐上神的位子（這使我們想起結 28:2），也有人讀為教會（保羅曾用同一個字 ναός 指教會）。<\/p><p><strong>難處：<\/strong>每一種讀法都只能從 2:3–10 有限的描寫往外推。歷史上，各個時代都有人把大罪人指認為當時的敵對者——某位皇帝、某個政權、某個教會體制、某位領袖、某種新科技，甚至彼此敵對的群體互相指認；<strong>每一次都錯了，每一次都傷了人。<\/strong>本講義陳列讀法，但不轉述任何一次指認，也不把任何一次指認當成某一派的標記。約翰的提醒是另一個方向：「現在已經有好些敵基督的出來了」（約壹 2:18）——那個高抬自己的靈，不只在末日的某一個人身上。<\/p>"],["「攔阻的」的讀法（帝國與法治、聖靈、福音的傳揚、天使、神自己）","","<p>2:6 用中性的「那攔阻他的」（τὸ κατέχον），2:7 換成陽性的「一個攔阻的」（ὁ κατέχων）。各家讀法：<strong>一、羅馬帝國與皇帝<\/strong>（教父最常見的讀法：中性指帝國，陽性指皇帝；保羅若明寫出來，對帝國是危險的話）；<strong>二、政府與法治的普遍原則<\/strong>（這使我們想起羅 13 章：掌權者是神的用人，限制惡的蔓延）；<strong>三、聖靈<\/strong>（中性的「靈」與陽性的「他」正好對應；災前被提說常用，認為聖靈隨教會被提而「被除去」）；<strong>四、福音的傳揚與保羅本人<\/strong>（福音要先傳遍天下，末期才來）；<strong>五、天使長米迦勒<\/strong>（這使我們想起但 12:1）；<strong>六、神自己的主權<\/strong>。<\/p><p><strong>難處：<\/strong>每一說都有一兩條漂亮的理由，也都有說不通的地方：羅馬帝國早已滅亡，大罪人卻沒有隨之出現；聖靈「被除去」很難與聖靈永遠與信徒同在的應許相合；福音傳揚說要解釋為甚麼保羅說「從中」被除去；米迦勒說在新約沒有直接證據；神自己說又難以解釋為甚麼神要「被除去」。<strong>決定性的仍是 2:5–6：他們知道，我們不知道。<\/strong>承認我們手上少了一頁筆記，比假裝有一張完整的圖表更忠於經文。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：站在各派共同的核心——主必親自、看得見地再來；那日子沒有人知道；在那日子以前，邪惡會增長，但被管著，而且主一口氣就結束它；教會要站穩。<\/strong>那日子的界線，是主耶穌自己劃的：「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道」（太 24:36）。本卷 2:1–12 與太 24 章的橄欖山講論平行——「免得有人迷惑你們」（太 24:4）、「總不要驚慌」（太 24:6）——那是主耶穌自己的話，可以講滿。<\/p><p><strong>不替各教會決定千禧年與被提時間。<\/strong>第 2 章的原文解經把千禧年三觀、被提四說、大罪人、殿、攔阻者的各家讀法全部公平陳列，每一種寫明「誰這樣讀」，不寫「誰讀錯」；講台只講共同核心，一句帶過，指向這一頁。<\/p><p><strong>不算日子、不點名（紅線一）。<\/strong>不推算主再來的年份；任何現存的人物、政黨、國家、宗教、教派、科技（晶片、疫苗、條碼、數位貨幣、人工智慧）都不在講台上被指認為大罪人、敵基督或獸。講台的落點一句：<strong>我們不知道攔阻的是誰，但我們知道誰掌權；我們不知道那日子是哪一天，但我們知道那天的結局。<\/strong><\/p><p><strong>2:4 是一面鏡子，不是一張通緝令。<\/strong>「抵擋主，高抬自己」是聖經對有己最濃縮的一幅畫，與 321「驕傲是離開本位抓住權力，想要代替神」逐字相合；而保羅說「那不法的隱意已經發動」（2:7）——在我裡面也是。所以讀 2:4，先照自己：我心裡哪一個位子，是我自己坐上去、不肯讓主坐的？屬靈爭戰與「那惡者」（3:3）回指以弗所書立場四。<\/p>"],["【四】這件事該不該影響你的信心","","<p><strong>被提的時間與千禧年觀，不該。<\/strong>各派都是主內的弟兄姊妹，都相信主必再來；你可以在不確定攔阻的是誰、不確定自己屬於哪一說的情況下，完全確定主會回來。<strong>「主必再來」，該。<\/strong>這是歷代信經的一部分——「他將來必從那裡降臨，審判活人死人」；天使在橄欖山上也這樣說：「這離開你們被接升天的耶穌，你們見他怎樣往天上去，他還要怎樣來」（徒 1:11）。<\/p><p>這一題要讀完的人，不是更會排時間表，而是更平安地等候主。<strong>2:4 的大罪人有多可怕，2:8 的主就有多輕易<\/strong>——四節之間，從全卷地勢的最低點走到幾乎最高點。我們不是靠猜中答案得平安，是靠躲在一位一口氣就能勝的主後面。<\/p>"]],"con":[],"say":"本講義的全卷立場：主必親自、看得見地再來；那日子沒有人知道（太 24:36）；那日子以前邪惡會增長，但被管著，主一口氣就結束它。千禧年三觀、被提四說、大罪人與攔阻者的各家讀法公平陳列，各派都是弟兄，本講義不替教會決定。不算日子、不點名；2:4 先照自己。我們不知道攔阻的是誰，但我們知道誰掌權；我們不知道那日子是哪一天，但我們知道那天的結局。","care":"牧養底線：不用末日恐嚇人（紅線二）——講完這一題，會眾是更平安地等候主，還是更害怕世界？不說「時候不多了，再不怎樣就來不及」，不鼓吹囤糧、逃離城市，不轉傳也不背書未經查證的末日訊息（分辨的方法見議題「真假訊息、使徒的教訓與聖經的權威」）。對曾經因末日預言受傷的人要特別溫柔：有人曾經因為某一則預言賣了房子、辭了工作、離開家人，也有孩子在被提的圖畫裡長大，夜裡醒來找不到父母就以為自己被撇下了——他們需要的是陪伴，不是嘲笑，也不是一句「那是你自己沒讀懂」。持不同被提觀的弟兄姊妹同坐一席，不讓任何一位覺得自己是次等的信徒。"},{"id":"ISS00_3","t":"神的公義審判與永遠沉淪——慈愛的神為甚麼報應？地獄是甚麼？","r":"1:5--10；2:10--12","ch":[],"why":"三、神的公義是給受苦者的安慰；伸冤在神，所以不必報仇，也不必假裝沒事；永刑說與條件不朽說並陳，不採普救論——本講義的全卷立場之三（本卷新立）。1:6–9 是新約講審判最直接的段落之一，也是最容易被講歪的：有人讀出復仇的快感，用它詛咒仇敵；有人用「交給神」叫受害者閉嘴；有人用地獄嚇孩子、在喪禮上斷言別人的結局；也有人讀到 2:11「神就給他們一個生發錯誤的心」，就以為神隨意叫人沉淪。這些都必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「神既是公義的，就必將患難報應那加患難給你們的人，也必使你們這受患難的人與我們同得平安」（1:6–7）；「他們要受刑罰，就是永遠沉淪，離開主的面和他權能的榮光」（1:9）；「故此，神就給他們一個生發錯誤的心，叫他們信從虛謊」（2:11）。<strong>經文問的是：基督徒可以盼望壞人受報應嗎？「永遠沉淪」是甚麼？神真的會讓人沉淪嗎？神「給他們一個生發錯誤的心」是甚麼意思？<\/strong><\/p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、神的公義是安慰，不是威脅<\/strong>：1:5–7 是寫給受苦的人的——「既是」（εἴπερ）不是假設，是前提：你們的苦，神看見了。<strong>二、審判與平安同時發生<\/strong>：報應和「同得平安」在同一個句子裡——審判的目的是把受苦的人接出來。<strong>三、沉淪的核心是關係<\/strong>：「離開主的面」——這使我們想起賽 2:10「躲避耶和華的驚嚇和他威嚴的榮光」，保羅把以賽亞書裡耶和華的位置給了主耶穌。<strong>四、沉淪的原因是人自己的選擇<\/strong>：「因他們不領受愛真理的心，使他們得救」（2:10），「使一切不信真理、倒喜愛不義的人都被定罪」（2:12）。<strong>五、神的心意是拯救<\/strong>：2:10 那個「使他們得救」，是神原本要給的；接著 2:13–14 是神揀選、呼召、要人得著榮光。<\/p>"],["永遠有知覺的刑罰（永刑說）","","<p>認為「永遠沉淪」是一種永遠持續、有知覺的與神隔絕。理由：1:9 的「永遠」（αἰώνιος）與「永生」是同一個字，主耶穌把兩者並排說：「這些人要往永刑裡去；那些義人要往永生裡去」（太 25:46）——永生有多長，永刑就有多長；「離開主的面」讀起來是一種持續的狀態，不是一瞬間的消失。這是奧古斯丁以來教會的傳統讀法，絕大多數福音派與天主教都持守。<\/p><p><strong>難處：<\/strong>這個讀法最常被誤用成恐嚇的工具——用火湖的圖畫嚇孩子、在佈道會上用恐懼逼人決志，反而讓人以為神是一位等著折磨人的神。它也要回答一個真誠的問題：有限的罪，為甚麼有永遠的後果？持守這說的神學家多半回答：罪的嚴重在於得罪的是永遠的神，而且離開神的人並沒有停止離開。這回答是嚴肅的，但需要用眼淚講，不能用恐嚇講。<\/p>"],["條件不朽說／滅絕說","","<p>認為 1:9 的 ὄλεθρος 是「毀壞、毀滅」，「永遠」指的是結果——一次的毀滅，永遠不能逆轉——而不是一個永遠進行的過程；人的不朽不是天生的，是神賜給得救的人的。這說在福音派之內是少數立場，部分福音派學者持守，斯托得（John Stott）曾表示傾向；基督復臨安息日會也持這說。這派的優點是認真看待聖經大量「滅亡」「毀滅」的用語，也試著回答永刑說面對的那個真誠問題。<\/p><p><strong>難處：<\/strong>它要解釋為甚麼主耶穌把永刑與永生並排、用同一個「永」字；也要解釋 ὄλεθρος 在新約不必然是「不存在」——保羅在別處用這個字時，人並沒有消失。而且「離開主的面」讀起來更像一種狀態，而不是一個事件。<strong>本講義不採用這說，但承認它在福音派之內，不以異端稱之。<\/strong><\/p>"],["普救論（最後萬人都得救）","","<p>認為神的愛最後會勝過一切，所有人——甚至所有受造之物——終究都會得救；審判是暫時的、是為了煉淨，不是永遠的。這派的心志是好的：它認真看待神「願意萬人得救」的心，也不願意相信神所愛的人會永遠失落。教會歷史上有少數教父曾經有過類似的盼望，近代也有一些神學家主張。<\/p><p><strong>難處：<\/strong>它與帖撒羅尼迦後書直接衝突。1:9 說「永遠沉淪」，2:10–12 說人因為「不領受愛真理的心」而被定罪——保羅在同一封信裡兩次說到有人最後不在主面前。若萬人終必得救，1:8 的「不聽從我主耶穌福音」就失去了它的分量，傳福音的急迫也不見了。<strong>本講義不採用普救論。<\/strong>這與前兩說不同：前兩說爭的是沉淪的形式，普救論否定的是沉淪本身。<\/p>"],["「報應」的兩種讀法（同態報復，還是伸冤在神）","","<p>1:6 的「報應」（ἀνταποδοῦναι），一種讀法偏向<strong>同態報復<\/strong>：他們怎樣待你，神就怎樣待他們——受苦的信徒可以期待、甚至盼望看見敵人受苦，並以此為安慰。這讀法抓住了一件真的事：經文確實說神要「報應」，神的公義不是一句空話，受害者的苦不會被一筆勾銷。<\/p><p>另一種讀法是<strong>伸冤在神<\/strong>：報應的主詞是神，不是教會；保羅在別處把同一個字根說清楚：「不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19）。所以 1:6 不是給受害者一張詛咒仇敵的許可證，而是給受害者一份自由：我不必自己報仇。<strong>難處<\/strong>在兩邊：同態報復的讀法容易滑進復仇的快感，與「要愛你們的仇敵」相衝突；伸冤在神的讀法若講偏了，又會變成叫受害者閉嘴、不准尋求公道——那同樣違背經文，因為保羅也說掌權的「是神的用人，是伸冤的」（羅 13:4）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：站在歷代教會傳統的讀法（永遠有知覺的刑罰），同時承認條件不朽說是福音派內的少數立場，不以異端稱之；不採用普救論。<\/strong>講台的落點一句：<strong>地獄最深的痛是沒有神；所以傳福音不是嚇人進天堂，是邀請人回到神的面前。<\/strong>全卷「永遠」只出現兩次，方向完全相反：1:9 的「永遠沉淪」與 2:16 的「開恩將永遠的安慰並美好的盼望賜給我們」（2:16）——講一個，一定同時講另一個。<\/p><p><strong>1:6 是給受害者的自由，不是給任何人的詛咒（紅線三）。伸冤在神，所以我不必報仇；伸冤在神，所以我也不必假裝沒事。<\/strong>「伸冤在神」不等於「不求公道」：受到暴力、詐騙、性侵、霸凌的人，尋求法律保護與公權力介入是對的，這正是神設立掌權者的用意（羅 13:4）。<\/p><p><strong>2:11 不是神隨意叫人沉淪（紅線五）。<\/strong>次序是先 2:10「不領受愛真理的心」，後 2:11「生發錯誤的心」——神把人自己選的交還給他，這使我們想起羅馬書三次說「神任憑他們」（羅 1:24）。也不可用 2:11 論斷離開教會或離開信仰的人：那是神的判斷，不是我們的。揀選（2:13）回指以弗所書第 1 章議題；1:5、1:11 的「配得」不是靠行為賺來的，回指加拉太書立場二。<\/p>"],["【四】這件事該不該影響你的信心","","<p><strong>地獄的形式，不該。<\/strong>永刑說與條件不朽說都在福音派之內，爭的是沉淪的形式，不是神的公義，也不是基督的救恩。<strong>神的公義與人的責任，該。<\/strong>它讓受苦的人有盼望——你的苦，神看見了，而且有一天要被翻轉；它也讓傳福音的人有急迫——不是因為害怕，是因為愛。<\/p><p>對正在受欺負的人，這一題最要緊的一句話是 1:7：「也必使你們這受患難的人與我們同得平安」。<strong>審判那一天，神第一件要做的事，不是讓你看仇敵受苦，是把你接出來。<\/strong><\/p>"]],"con":[],"say":"本講義的全卷立場：神的公義是給受苦者的安慰，審判與平安同時發生；沉淪的核心是「離開主的面」。站在歷代教會傳統的讀法（永刑說），承認條件不朽說是福音派內的少數立場、不以異端稱之，不採普救論。伸冤在神，所以我不必報仇，也不必假裝沒事；尋求法律保護與公道是對的。2:11 的次序在 2:10 之後。","care":"牧養底線：不把 1:6–9 講成復仇的快感或詛咒仇敵的許可（紅線三）；不用地獄恐嚇人、不用火湖嚇孩子，不在喪禮與探訪中斷言任何一位已故的人的永遠結局（紅線四）——席上可能正坐著一位剛失去未信主家人的弟兄姊妹。不用「神必報應」「交給神」叫受害者閉嘴：「交給神」不是「不准說」。面對受過暴力、性侵、家暴、霸凌的人，不追問細節、不要求他原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助他尋求法律保護與專業協助。也要留意自己心裡想看見仇敵受苦的那一份痛，先承認它，再交給神。"},{"id":"ISS00_4","t":"做工、懶惰與教會紀律——不肯做工就不可吃飯？不和他交往是排斥嗎？","r":"3:6--15","ch":[],"why":"四、3:10 是給「不肯」的人的，不是給「不能」的人的；紀律的目的是挽回，底線是 3:15「要勸他如弟兄」；無己不是過勞——本講義的全卷立場之四（本卷新立）。「若有人不肯做工，就不可吃飯」是全卷被引用最多、也被誤用最多的一句：有人用它羞辱失業、病弱、身心障礙、年老、在家照顧家人的人，有人用它反對一切社會救助；3:14「不和他交往」被講成冷暴力、公開羞辱、切斷家人、封鎖離開教會的人；3:8「晝夜做工」被講成同工就該過勞。做工、紀律與服事的界線，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「我們在你們那裡的時候，曾吩咐你們說，若有人不肯做工，就不可吃飯」（3:10）；「若有人不聽從我們這信上的話，要記下他，不和他交往，叫他自覺羞愧」（3:14）；保羅自己「辛苦勞碌，晝夜做工，免得叫你們一人受累」（3:8）。<strong>經文問的是：失業的、病的、老的、在家照顧人的怎麼辦？基督徒該支持社會救助嗎？教會紀律是甚麼？會不會變成排斥？傳道人與同工該過勞嗎？<\/strong><\/p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、對象是「不肯」的人<\/strong>：原文 οὐ θέλει——願不願意，不是能不能。<strong>二、他們不是閒著，是忙錯了<\/strong>：「甚麼工都不做，反倒專管閒事」（3:11）；3:6 的「不按規矩而行」（ἀτάκτως）是軍隊用語，指脫隊、不守隊形，不是一般的「懶」。<strong>三、保羅自己做榜樣，不是做規定<\/strong>：「這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們」（3:9）。<strong>四、做工的目的之一是不成為重擔<\/strong>：「免得叫你們一人受累」；保羅在別處還說做工是為了「就可有餘分給那缺少的人」（弗 4:28）。<strong>五、紀律的目的是挽回<\/strong>：3:14 之後緊接著「但不要以他為仇人，要勸他如弟兄」（3:15）——界線與目的同在一節。<\/p
