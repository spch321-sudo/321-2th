>"],["他們為甚麼不做工？（末世狂熱、倚賴恩主、輕看勞動三說）","","<p>學界對帖撒羅尼迦人為甚麼不做工有三說。<strong>一、末世狂熱<\/strong>：主快來了，或主的日子已經到了，何必工作？這說把第 3 章與第 2 章連讀。<strong>二、倚賴恩主<\/strong>：羅馬社會有「恩主與門客」的制度，窮人依附一位富人，每天去問安、替他造勢，換取生活所需；信主以後，有人把教會裡較富裕的弟兄當成新的恩主，白天四處走動，「專管閒事」。<strong>三、希臘文化看輕勞動<\/strong>：在上層社會眼中，親手做工是奴隸與匠人的事。<\/p><p><strong>難處：<\/strong>每一說都只能從經文的少數線索推論；保羅沒有說出原因，只處理了行為。<strong>三說可以同時成立<\/strong>，本講義三說並陳，並指出它們的共同點：<strong>他們把別人的愛心當成自己的收入。<\/strong>這使今天的應用不限於某一種處境——不論是因為屬靈的狂熱、人際的依附，還是覺得某些工作配不上自己，結果都一樣：叫別人受累，自己卻忙著管別人的事。<\/p>"],["3:10 的兩種強調（個人責任派、社會關懷派）","","<p><strong>個人責任派<\/strong>強調工作倫理：神從創造起就叫人做工，工作是尊嚴，不是懲罰；教會的愛心若養成依賴，反而害了人；3:10 是對懶惰最清楚的一句話，教會與社會都應當鼓勵自立。<strong>社會關懷派<\/strong>強調 3:10 只針對「不肯」的人：保羅同一個人也說「人若不看顧親屬，就是背了真道」（提前 5:8），也吩咐教會照顧真為寡婦的人（提前 5:3–16）；聖經從舊約到新約一貫要神的百姓照顧孤兒寡婦與寄居的，所以 3:10 不能拿來反對一切社會救助。<\/p><p><strong>難處：<\/strong>個人責任派若講偏了，就會把「不能」的人也算進「不肯」裡，用 3:10 羞辱正在受苦的人；社會關懷派若講偏了，就會把 3:10 講到沒有牙齒，忘了保羅確實要那些「不肯」的人「安靜做工，吃自己的飯」（3:12）。<strong>兩派其實都同意經文的核心<\/strong>：願意做工的要做工，不能做工的要被照顧。爭的只是重點放在哪一頭。<\/p>"],["教會紀律的三種樣子（正式紀律、牧養關懷、歷史上的濫用）","","<p><strong>正式紀律派<\/strong>：改革宗、長老會、浸信會等傳統，按著太 18:15–17 的步驟——私下指出、帶一兩個人、告訴教會——設立教會紀律的程序，認為這是愛護教會與當事人的必要保護。<strong>牧養關懷派<\/strong>：許多教會不設正式程序，以個別勸勉、陪伴、小組關懷為主，認為 3:15「要勸他如弟兄」本身就是方式；這使我們想起「就當用溫柔的心把他挽回過來」（加 6:1）。<\/p><p><strong>難處：<\/strong>正式紀律若沒有溫柔，就會變成審判庭；牧養關懷若沒有界線，就會讓一個人長期拖累整個群體，而保羅明明要教會「遠離」（3:6）。歷史上也有清楚的濫用：有些群體以「禁絕」對付離開的人，家人不准和他同桌吃飯；有些群體以「不交往」控制成員，誰提出疑問就被孤立。<strong>這些做法都漏掉了 3:15<\/strong>——把他當成了仇人，而不是弟兄。屬靈權柄的界線回指哥林多後書立場三。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:10 是給「不肯」的人的，不是給「不能」的人的（紅線六）。<\/strong>失業、疾病、身心障礙、年老、在家照顧家人、全職主婦——這些人不在 3:10 裡面；他們在「你們眾人彼此相愛的心也都充足」（1:3）裡面。<strong>工作是恩典，不是身分<\/strong>：321「人比事重要」——一個人的價值不在他的產值。華人的「拚」文化需要聽 3:12 的「安靜」，也需要聽歌羅西書立場四：無己不是苦待己身，不是過勞。<\/p><p><strong>紀律的四個界線（紅線七）：<\/strong>① <strong>對象<\/strong>是不聽從使徒教訓、而且不肯回轉的弟兄，不是提出疑問、有不同意見或離開教會的人；② <strong>方式<\/strong>是減少一般的交往（μὴ συναναμίγνυσθαι），不是公開羞辱、不是點名公告、不是截圖轉傳、不是切斷家人；③ <strong>目的<\/strong>是「叫他自覺羞愧」——ἐντραπῇ 是自己回頭看，不是被眾人羞辱；④ <strong>底線<\/strong>是 3:15：他仍是弟兄。講 3:14，一定讀到 3:15。<\/p><p><strong>3:8「晝夜做工」不是過勞的榜樣。<\/strong>保羅的理由是「免得叫你們一人受累」與「要給你們作榜樣」——他放下的是權利，不是健康。<strong>傳道人的支薪<\/strong>：保羅「有權柄」（3:9）而放下；本講義不以 3:8–9 反對傳道人支薪，也不以此要求傳道人帶職（這使我們想起林前 9:14 保羅自己說傳福音的可以靠福音養生）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：願意做工的要做工，不能做工的要被照顧，犯錯的要被挽回。<\/strong>爭的是重點放在哪一頭、程序要多正式，不是福音本身。<\/p><p>如果你正在失業、正在生病、正在家裡照顧一位需要你的人，聽到 3:10 心裡一緊——這一節不是寫給你的。寫給你的是 3:16：「願賜平安的主隨時隨事親自給你們平安」。如果你曾經被教會用「紀律」傷過，要知道保羅寫紀律的那一節，最後一個字是「弟兄」。<strong>傷你的是人漏掉了 3:15，不是那位要「勸他如弟兄」的主。<\/strong><\/p>"]],"con":[],"say":"本講義的全卷立場：3:10 是給「不肯」（οὐ θέλει）的人的，不是給「不能」的人的；失業、病弱、身心障礙、年老、在家照顧家人的人，不在 3:10 裡面。工作是恩典，不是身分。紀律有四個界線——對象、方式、目的、底線；講 3:14 一定讀到 3:15「要勸他如弟兄」。3:8「晝夜做工」不是過勞的榜樣；不以 3:8–9 反對傳道人支薪。","care":"牧養底線：不用 3:10 羞辱任何正在受苦的人（紅線六）——席上會有剛被裁員的、長期病痛的、身心障礙的、在家照顧失智父母或特殊需要孩子的人，他們聽到這一節最容易縮起來。不追問他為甚麼沒有工作，不說「你要有信心，神必供應」就走開；會後單獨關心，必要時協助轉介就業、醫療或社福資源。不讓「紀律」變成冷暴力或控制（紅線七）：不點名、不公告、不截圖、不封鎖離開的人，不要求家人斷絕往來。也不把「晝夜做工」講成同工就該過勞；服事倦怠的人需要的是休息、陪伴與（必要時）專業協助，不是「行善不可喪志」的責備——3:13 是鼓勵，不是鞭子。"},{"id":"ISS00_5","t":"真假訊息、使徒的教訓與聖經的權威——怎樣分辨「有靈、有言語、有冒我名的書信」？","r":"2:2；2:15；3:14--17","ch":[],"why":"五、站在「惟獨聖經」的立場，尊重聖傳傳統的弟兄姊妹；分辨訊息三問：與筆跡相合嗎、讓我更愛主嗎、讓我站穩嗎——本講義的全卷立場之五（本卷新立）。2:2 的三個來源「有靈、有言語、有冒我名的書信」，就是今天的「有人得了啟示」「有人說」「群組轉傳」；2:15「凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守」又牽涉到口傳教訓今天在哪裡、聖傳與聖經的關係；而「堅守教訓」最容易被拿來壓制提問、要求會眾對領袖的每一句話都順從。分辨的標準與權威的界線，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌」（2:2）；「所以，弟兄們，你們要站立得穩，凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守」（2:15）；「我保羅親筆問你們安。凡我的信都以此為記，我的筆跡就是這樣」（3:17）。<strong>經文問的是：今天怎樣分辨預言、異象、轉傳的訊息？2:15 的「口傳的」今天在哪裡？「堅守教訓」是要堅守甚麼、不是要堅守甚麼？<\/strong><\/p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、假訊息可以借三種外衣<\/strong>：「靈」（屬靈經驗）、「言語」（傳言、講道）、「書信」（冒名的文字）。<strong>二、假訊息常常是「已經到了」<\/strong>：讓人覺得自己落後了、錯過了、要趕快。<strong>三、分辨的標準是「所領受的」<\/strong>：2:15 的「教訓」（παράδοσις）是使徒已經交付的，不是新冒出來的。<strong>四、真教訓可以被驗證<\/strong>：3:17 的簽名，正是對 2:2「冒我名的書信」的回應。<strong>五、分辨的態度是「站穩」，不是「驚慌」<\/strong>：2:2 與 2:15 前後呼應。<\/p>"],["聖傳與聖經並列（天主教與東正教）","","<p>天主教與東正教主張：2:15 的「口傳的」與「信上寫的」並列，說明使徒的教導有兩個管道；口傳的部分在教會裡延續下來，成為教會的聖傳，與聖經一同傳遞神的啟示，並由教會的訓導或公會議來解釋。這派的優點是認真看待 2:15 的字面：保羅確實把口傳與書寫放在一起；而且歷史上，新約正典的確是在教會的傳承裡被辨認、收集出來的，早期教會的信經與崇拜也確實保存了寶貴的信仰內容。<\/p><p><strong>難處（從改教傳統的角度）：<\/strong>2:15 的「口傳的」是保羅當面教過帖撒羅尼迦人的那些事，我們無法確定後世哪一項傳統就是它；而 2:5 本身就顯示，連帖撒羅尼迦人記得的口傳內容（攔阻的是誰），也沒有被可靠地傳下來。<strong>本講義尊重天主教與東正教的弟兄姊妹，不在講台上攻擊（紅線八）<\/strong>；這裡陳列的是神學上的差異，不是對任何人信仰的評斷。<\/p>"],["惟獨聖經（改教傳統）","","<p>改教傳統主張：使徒的口傳教訓，凡是神要教會世世代代持守的，已經寫進新約；<strong>聖經是唯一無誤的最終權威<\/strong>——「聖經都是神所默示的」（提後 3:16）。教會的傳統、信經、歷代的解經有價值，應當被尊重、被參考，但都在聖經之下，要被聖經檢驗。這派最有力的經文證據就在本卷：保羅面對冒名的信，答案是一封可以驗證的信——「我的筆跡就是這樣」。<\/p><p><strong>難處：<\/strong>「惟獨聖經」常被誤解成「惟獨我自己的解釋」——每個人拿著聖經各說各話，結果反而輕看了歷代教會的智慧與群體的察驗。改教家自己並不是這個意思：他們大量引用教父，也重視信經。所以「惟獨聖經」要與謙卑一起持守：聖經是最終的權威，但讀聖經的我不是。<\/p>"],["2:2「有靈」與今天的屬靈經驗（恩賜延續說、恩賜停止說）","","<p><strong>恩賜延續說<\/strong>認為說預言、異象等屬靈恩賜今天仍然運行，但都要被察驗——保羅在前書正是這樣說：「但要凡事察驗；善美的要持守」（帖前 5:21）；約翰也說「一切的靈，你們不可都信，總要試驗那些靈是出於神的不是」（約壹 4:1）。<strong>恩賜停止說<\/strong>認為啟示性的恩賜隨著使徒時代與新約正典的完成而停止，今天神藉著已經寫成的聖經說話，任何聲稱的新啟示都不具同等權威。<\/p><p><strong>難處：<\/strong>延續說若沒有察驗，就會讓「有人得了啟示」成為 2:2 的今天版本；停止說若講偏了，又會一概否定弟兄姊妹真實的屬靈經歷，也容易輕看聖靈今天的引導。<strong>兩派都在福音派之內，而且兩派都同意：任何訊息都不能超過、也不能改寫已經交付的使徒教訓。<\/strong>2:2 的「有靈」提醒的不是禁止，而是察驗。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：站在改教「惟獨聖經」的立場，同時尊重天主教與東正教的弟兄姊妹，不在講台上攻擊（紅線八）。<\/strong>使徒的教訓今天在聖經裡；歷代教會的傳統與信經是寶貴的幫助，但在聖經之下。作者問題站在保羅所寫的傳統立場，託名說的理由與回應見議題「作者、寫作地點與年代」。<\/p><p><strong>今天的 2:2<\/strong>：群組轉傳的末日訊息、自稱得了啟示的「先知」、人工智慧生成的假見證、假名人語錄、假影片。<strong>分辨三問<\/strong>：① 這訊息與聖經的「筆跡」相合嗎？② 它讓我更愛主，還是更害怕？③ 它讓我站穩，還是驚慌？鼓勵會眾像庇哩亞人一樣「天天考查聖經」（徒 17:11）——就在帖撒羅尼迦的下一站。<\/p><p><strong>教會的規矩、宗派的傳統、領袖的話，都不等於使徒的教訓（紅線八）。<\/strong>2:15、3:6、3:14 的「教訓」、「吩咐」、「信上的話」，是使徒交付、今天寫在聖經裡的福音與生活，不能拿來要求會眾對牧者的每一句話「都要堅守」，也不能用「堅守教訓」壓制提問與察驗。321 說「聖經是我的準則」，正是這一條：準則是聖經，不是講台上的人。<\/p>"],["【四】這件事該不該影響你的信心","","<p><strong>作者問題，不該<\/strong>——即使是持託名說的學者，也承認這卷書在正典裡；聖傳與惟獨聖經的差異，也不該叫我們把天主教或東正教的弟兄姊妹看成敵人。<strong>聖經是不是準則，該<\/strong>——這是 321「聖經是我的準則」的根，也是面對一切末日訊息時，能讓人「不要輕易動心，也不要驚慌」的那塊石頭。<\/p><p>保羅對付冒名信的方法，不是叫人去追查是誰寫的，而是叫人認得真的筆跡。<strong>認得真鈔的人，不必研究每一種假鈔。<\/strong>熟悉聖經的人，看到假訊息自然會覺得「這不像他的筆跡」。<\/p>"]],"con":[],"say":"本講義的全卷立場：站在改教「惟獨聖經」的立場——使徒的教訓今天在聖經裡；同時尊重天主教與東正教的弟兄姊妹，不在講台上攻擊。分辨訊息三問：與聖經的筆跡相合嗎？讓我更愛主還是更害怕？讓我站穩還是驚慌？教會的規矩、宗派的傳統、領袖的話，都不等於使徒的教訓；不用「堅守教訓」壓制提問與察驗。","care":"牧養底線：不羞辱曾經相信、轉傳過假訊息或假預言的人——他們多半是因為愛家人、怕來不及；先肯定他願意查證，再陪他一起查經。不在講台上攻擊天主教、東正教或任何教派，也不把持不同屬靈恩賜觀的弟兄姊妹說成異端。最要緊的是保護提問的人：席上會有被「你要順服」「你不堅守教訓」壓過的弟兄姊妹，也會有在某些群體裡被要求把領袖的話當成神的話、因此不敢再信任教會的人。讓他們聽見：提問與察驗本身就是 2:15 與徒 17:11 所稱讚的，不是悖逆。"},{"id":"ISS00_6","t":"作者、寫作地點與年代——保羅親筆，還是後人託名？","r":"1:1；2:2；3:17","ch":[],"why":"全卷通用：作者、寫作地點與年代。帖撒羅尼迦後書是保羅書信中作者問題爭議較多的一卷——有學者認為它的語氣比前書冷、末世觀與前書不同、結構又和前書太相似，於是主張是後人託名；3:17「凡我的信都以此為記」也被拿來討論。另有學者主張後書其實寫在前書之前。這封信是誰寫的、在哪裡寫、與前書的先後關係，會影響全卷怎樣讀 2:2、2:15 與 3:17，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>信的開頭是「保羅、西拉、提摩太寫信給帖撒羅尼迦、在神我們的父與主耶穌基督裡的教會」（1:1），與前書的開頭幾乎一字不差。信裡提到有「冒我名的書信」（2:2），也提到「信上寫的」（2:15），似乎指先前寫過的信；結尾則是「我保羅親筆問你們安。凡我的信都以此為記，我的筆跡就是這樣」（3:17）。<\/p><p>可是讀者也會注意到幾件事：後書的語氣比前書正式，前書那種「我們極力地想法子，很願意見你們的面」的親密感少了；前書說主的日子「好像夜間的賊一樣」，後書卻說那日子以前必有某些事（見議題「帖前與帖後的末世教導矛盾嗎？」）；兩封信的結構與用語又相似得出奇。<strong>經文問的是：這是保羅親筆的第二封信，還是後人借保羅之名寫的？寫於何地、何時？前書與後書，哪一封在先？<\/strong><\/p>"],["保羅所寫的傳統說（寫於哥林多，約主後 50–51 年，前書之後數月）","","<p>教會從二世紀起就把這封信當作保羅的書信接受，早期的正典目錄都收錄它。按照使徒行傳，保羅離開帖撒羅尼迦後經庇哩亞、雅典到哥林多，在那裡「住了一年零六個月」（徒 18:11）；西拉和提摩太從馬其頓來與他會合（〔背景〕徒 18:5），正好對應兩封信都由三人署名。德爾斐出土的迦流銘文，把迦流任亞該亞方伯定在主後 51–52 年，使保羅在哥林多的時間有了錨點。前書寫後不久，帖撒羅尼迦傳來新的消息：逼迫加重、有人說主的日子到了、不做工的問題擴大——於是有了後書。<\/p><p><strong>難處：<\/strong>它要解釋兩封信語氣的差別，與末世教導的不同重點。傳統說的回應是：<strong>兩封信的處境不同<\/strong>——前書處理的是憂傷（睡了的人怎麼辦），後書處理的是驚慌（主的日子已經到了嗎）；語氣較正式，可能因為保羅這次是在糾正一個嚴重的誤會；結構相似，正說明同一個作者在短時間內寫給同一間教會。<\/p>"],["後人託名說（二十世紀以來部分學者）","","<p>二十世紀初以來，部分學者主張帖後是保羅死後，有人模仿前書的結構、借保羅之名寫的，目的是糾正當時教會裡過熱的末世期待。理由有四：一、語氣較冷，缺少前書的溫情；二、末世觀不同，前書說像夜間的賊，後書卻列出先兆；三、結構與用語和前書太相似，像是照著前書改寫；四、3:17「凡我的信都以此為記」像是強調太過——一位真作者何必這樣聲明？這派認真看待了兩封信之間真實存在的差異，不以一句「保羅想到就寫」帶過。<\/p><p><strong>難處：<\/strong>每一個理由都有合理的回應。語氣的差別來自處境；末世觀的兩面在主耶穌自己的橄欖山講論裡就並存（見議題「帖前與帖後的末世教導矛盾嗎？」）；結構相似正合同一作者短時間內的兩封信；而 3:17 的強調，<strong>正是因為 2:2 已經有人冒名<\/strong>——若是後人託名，卻在信裡警告人防備冒名的信，反而自相矛盾。早期教會也一致接受這封信。<strong>本講義陳列，不採用。<\/strong><\/p>"],["後書在先說與同工共筆說","","<p><strong>後書在先說<\/strong>：少數學者主張現在的帖後其實寫在帖前之前。理由是後書的逼迫看起來還在進行中，前書的逼迫像是已經過去；後書 3:17 的簽名說明，若是第一封信才需要特別聲明；而前書「論到時候、日期，不用寫信給你們」（帖前 5:1）像是已經處理過這個題目。<strong>同工共筆說<\/strong>：兩封信都由保羅、西拉、提摩太三人署名，信中多用「我們」；有學者認為語氣與用詞的差異，可能來自西拉或提摩太在寫作中的參與。<\/p><p><strong>難處：<\/strong>後書 2:15 的「信上寫的」最自然是指一封先前寫給他們的信，而那最可能就是前書；前書 2:17–3:6 保羅初別教會的思念與焦慮，也最像第一封信。同工共筆說則難以落實到具體的段落——我們不知道哪一句是誰的手筆。兩說都值得陳列，但都不改變這封信的權威與信息。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：保羅所寫；寫於哥林多，約主後 50–51 年，前書之後數月。<\/strong>託名說的理由與回應、後書在先說、同工共筆說，在第 2、3 章的原文解經與這一頁照實陳列。<\/p><p>理由有三：一、早期教會一致接受，正典目錄都收錄；二、兩封信的差別最好用處境的差別來解釋——前書對憂傷，後書對驚慌；三、3:17 的簽名與 2:2 的冒名彼此呼應，是全卷最強的內證。<strong>講台只講一句：正因為有人冒他的名，保羅才在信末親筆簽名——「我的筆跡就是這樣」。<\/strong><\/p><p>各章碰到作者與年代的問題，一句帶過，回指這裡；保羅在帖撒羅尼迦與哥林多的經過，見本系列使徒行傳講義第 17、18 章。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。即使是持託名說的學者，也承認這卷書在正典裡；爭的是這封信怎樣成形，不是這封信說了甚麼。不論學者怎樣討論，這封信對一群被嚇壞的初信者說的話不會變：「但主是信實的，要堅固你們，保護你們脫離那惡者」（3:3）。<\/p><p>這一題還有一層溫柔：3:17 是全卷最私人的一筆。保羅平常請人代筆，到最後拿起筆來，親手寫下幾個字。<strong>一封寫給驚慌之人的信，最後讓他們看見的，是一個認得出來的筆跡<\/strong>——就像在一片假消息裡，聽見一個熟悉的聲音說：是我，不要怕。<\/p>"]],"con":[],"say":"本講義的判斷：帖撒羅尼迦後書是保羅所寫，寫於哥林多，約主後 50–51 年，前書之後數月。託名說、後書在先說、同工共筆說照實陳列，不迴避。講台只講一句：正因為有人冒他的名（2:2），保羅才在信末親筆簽名（3:17）。這個判斷不影響解經。","care":"這一題容易在查經班裡變成考據課，讓不熟悉學術的弟兄姊妹覺得自己讀不懂聖經；也可能讓剛聽到「有學者說這封信是別人冒名寫的」的年輕人突然不安，覺得連聖經都不可靠。講台上一兩句帶過就好，不要把學者的名字當成炫耀的資本；遇到真心被這些問題困擾的人，會後單獨陪他讀，先肯定他願意誠實發問，再帶他看 2:2 與 3:17 怎樣彼此呼應。"},{"id":"ISS00_7","t":"帖撒羅尼迦城與教會——港口、羅馬自由城、三個安息日，這是一間怎樣的教會？","r":"1:1--4","ch":[],"why":"全卷通用：帖撒羅尼迦城與教會。這是一座港口城、馬其頓的首府、羅馬的自由城，坐落在橫貫東西的大道上；保羅在那裡只待了很短的時間就被趕走，留下一間在逼迫中長大的教會。這座城的政治與宗教處境，解釋了為甚麼逼迫這麼早、這麼重；保羅停留的長短，解釋了為甚麼這間教會這麼容易被一則消息推倒。城與教會的背景，必須在開卷交代清楚，全卷的「逼迫」「消息」「做工」才有血有肉。","pos":[["【一】經文問的是甚麼","","<p>信的開頭說這是「在神我們的父與主耶穌基督裡的教會」（1:1），接著說他們「在所受的一切逼迫患難中，仍舊存忍耐和信心」（1:4）。使徒行傳記載了這間教會的開始：保羅在會堂「一連三個安息日」（徒 17:2）講道，有些猶太人、「許多虔敬的希臘人，尊貴的婦女也不少」（徒 17:4）信了；接著暴民闖進耶孫的家，在地方官面前控告他們：「這些人都違背凱撒的命令，說另有一個王耶穌」（徒 17:7）。<\/p><p>前書又補了一筆：他們「離棄偶像，歸向神，要服事那又真又活的神」（帖前 1:9）——這說明教會裡有許多原本拜偶像的外邦人；保羅也提到自己在他們中間「晝夜做工」（帖前 2:9）。<strong>經文問的是：帖撒羅尼迦是一座怎樣的城？保羅在那裡待了多久？這間教會由甚麼人組成？為甚麼逼迫來得這麼早、這麼重？<\/strong><\/p>"],["自由城與帝國崇拜說（逼迫的根源是政治與宗教的忠誠）","","<p>帖撒羅尼迦是馬其頓省的首府，主後一世紀時人口可觀，有港口，又坐落在橫貫東西的厄納齊雅大道上。羅馬內戰中它站對了邊，被賜予「自由城」的地位——可以自治、由本地的地方官（politarchs）管理，不駐羅馬軍隊。這份特權要靠對羅馬與凱撒的忠誠來維持，城裡有凱撒崇拜、羅馬女神崇拜，也有本地的卡比洛斯崇拜。所以「說另有一個王耶穌」不是一句宗教用語，在這座城裡聽起來是政治上的背叛，會威脅到整座城的特權——這解釋了為甚麼暴民與地方官的反應這麼激烈。<\/p><p><strong>難處：<\/strong>這個重建主要依靠城市史與碑文，經文本身只留下徒 17:6–7 的幾句控告；帖後也沒有直接提到帝國崇拜。若講得太滿，容易把逼迫全部講成政治問題，忽略了前書說的家人、鄰舍的排擠——「你們也受了本地人的苦害」（帖前 2:14）。政治的壓力是背景，日常的排擠才是他們每天面對的。<\/p>"],["三週說（保羅只待了大約三個星期）","","<p>按照徒 17:2 的「一連三個安息日」最直接的讀法，保羅在帖撒羅尼迦只待了大約三個星期，接著就因暴動被迫連夜離開（〔背景〕徒 17:10）。這說的優點是緊貼經文，也最能解釋這封信的處境：一間只受教三個星期的教會，失去了它的屬靈父母，在逼迫裡自己摸索——所以保羅在前書說「我們暫時與你們離別，是面目離別，心裡卻不離別」（帖前 2:17），又急著打發提摩太去「堅固你們」（帖前 3:2）。<\/p><p><strong>難處：<\/strong>三個星期要容納的事似乎太多：保羅說他在他們中間「晝夜做工」（帖前 2:9），腓立比教會還「一次兩次地打發人供給我的需用」（腓 4:16）；而教會裡有許多是從拜偶像歸向神的外邦人，不像是只在會堂裡聽了三個安息日就能聚成的。所以「三個安息日」可能只指他在會堂講道的時間。<\/p>"],["數月說（會堂三週之後，在耶孫家或作坊裡又停留了一段時間）","","<p>認為「三個安息日」是保羅在會堂裡的時間；被會堂拒絕以後，他可能轉到耶孫的家或自己做工的作坊繼續教導，一共停留了兩三個月。這樣才容得下腓立比教會兩次的供給、保羅晝夜做工的見證，以及一間以外邦人為主、從拜偶像轉過來的教會的成形。這說的優點是同時接住了使徒行傳與兩封書信的資料。<\/p><p><strong>難處：<\/strong>使徒行傳沒有直接提到會堂以外的這段時間，數月說是從書信的線索推出來的；而且不論三週還是三個月，這間教會受教的時間都很短，與保羅在哥林多的一年半、在以弗所的近三年相比，差得很遠。<strong>兩說的共同點才是重點：這是一間根基最短、逼迫最早的教會。<\/strong><\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：帖撒羅尼迦是馬其頓省的首府、港口城、羅馬的自由城，對凱撒的忠誠是它的命脈；保羅在會堂講道三個安息日，全部停留時間可能稍長，但總共不過數週到數月。教會以從拜偶像歸向神的外邦人為主，也有猶太人與敬虔的希臘人。<\/strong>三週說與數月說照實陳列，講台不必定案。<\/p><p>講台只講一句：<strong>這是一間根基最短、逼迫最早的教會——在一座要人效忠凱撒的城裡，他們說「另有一個王耶穌」。<\/strong>這解釋了全卷的兩件事：逼迫為甚麼來得這麼早，一則消息為甚麼能把他們推得這麼搖晃。<\/p><p>帖撒羅尼迦的開始見本系列使徒行傳講義第 17 章；下一站庇哩亞人「天天考查聖經」，正是本卷立場五（議題「真假訊息、使徒的教訓與聖經的權威」）分辨訊息的榜樣。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——這一題的歷史背景，反而叫人得安慰。一間只學了幾個星期的教會，在逼迫裡沒有散掉，反而讓保羅說「甚至我們在神的各教會裡為你們誇口」（1:4）。<strong>決定一間教會能不能站住的，不是受教的時間長短，是那一位信實的主<\/strong>——「但主是信實的，要堅固你們」（3:3）。<\/p><p>今天也有許多根基很短的信徒：剛信主就要面對家人的反對，剛受洗就搬到沒有教會的城市，只在網上聚會、沒有人在身邊扶持。帖撒羅尼迦後書是寫給他們的，<strong>短短的根基，在信實的主手裡，也可以站得穩。<\/strong><\/p>"]],"con":[],"say":"本講義的判斷：帖撒羅尼迦是馬其頓省的首府、港口城、羅馬的自由城，對凱撒的忠誠是它的命脈；保羅在會堂講了三個安息日，全部停留不過數週到數月；教會以從拜偶像歸向神的外邦人為主。講台只講一句：這是一間根基最短、逼迫最早的教會——在一座要人效忠凱撒的城裡，他們說「另有一個王耶穌」。","care":"這一題提醒教會想到席上那些「根基很短」的人：初信的、剛受洗的、在家裡是唯一信主的、因為工作或移民來到陌生城市的、只能在網上聚會的弟兄姊妹。不要因為他們懂得少、容易被一則消息嚇到就輕看他們；保羅對這樣的教會先說的是感謝與誇口（1:3–4）。也要想到因信仰在家裡、在職場受壓力的人——他們的「說另有一個王耶穌」，代價可能是家人的冷淡與升遷的機會，需要教會實際的陪伴。"},{"id":"ISS00_8","t":"帖前與帖後的末世教導矛盾嗎？「好像夜間的賊」與「那日子以前，必有……」怎樣並讀？","r":"2:1--3","ch":[],"why":"全卷通用：兩封信並讀——前書防怠慢，後書防躁進。前書說「主的日子來到，好像夜間的賊一樣」，叫人覺得那日子隨時會來、沒有預兆；後書卻說「那日子以前，必有離道反教的事」，好像有先兆可以觀察。這個表面上的張力，是託名說的主要理由之一，也是許多信徒讀兩封信時真實的困惑：到底要隨時預備，還是要先看徵兆？兩封信的末世教導怎樣並讀，必須在開卷講清楚，否則讀者會在兩封信之間來回擺盪。","pos":[["【一】經文問的是甚麼","","<p>前書說：「論到時候、日期，不用寫信給你們，因為你們自己明明曉得，主的日子來到，好像夜間的賊一樣」（帖前 5:1–2）；「人正說『平安穩妥』的時候，災禍忽然臨到他們」（帖前 5:3）。後書說：「人不拘用甚麼法子，你們總不要被他誘惑；因為那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來」（2:3）。<\/p><p>一封說那日子會忽然來到、像賊一樣；一封說那日子以前會先有某些事。<strong>經文問的是：這兩封信矛盾嗎？若不矛盾，該怎樣一起讀？今天的信徒該隨時預備，還是該觀察先兆？<\/strong><\/p>"],["矛盾說（兩封信的末世觀不同，可能不是同一位作者）","","<p>認為前書的末世觀是「迫近而無預兆」，後書的末世觀是「延後而有先兆」，兩者在邏輯上不能並存；這正是部分學者主張後書是託名之作的理由之一：後來的作者面對主遲遲沒有再來，於是借保羅之名寫信，把那日子往後推，並加上一串先兆。這派的優點是誠實面對了兩段經文讀起來的張力，沒有假裝它們一模一樣。<\/p><p><strong>難處：<\/strong>同樣的兩面，在主耶穌自己的橄欖山講論裡就並存：一方面「你們看見先知但以理所說的『那行毀壞可憎的』站在聖地」（太 24:15）——有先兆；另一方面「因為你們想不到的時候，人子就來了」（太 24:44）——像賊一樣。若有先兆與無預兆不能並存，主耶穌自己的講論也要被拆開。而且前書自己也說「弟兄們，你們卻不在黑暗裡，叫那日子臨到你們像賊一樣」（帖前 5:4）——賊的比喻，原本就有對象。<\/p>"],["對象說（像賊一樣，是對不信的人；有先兆，是對警醒的人）","","<p>認為前書的「像賊一樣」主要是對不信的人說的：「人正說『平安穩妥』的時候，災禍忽然臨到他們」——「他們」是第三人稱；接著保羅轉過來對信徒說「你們卻不在黑暗裡」（帖前 5:4）。所以對不警醒的世界，那日子是突然的；對警醒的信徒，那日子不會像賊一樣叫他們措手不及。後書列出那日子以前的事，正是幫助信徒不被假消息驚嚇。<\/p><p><strong>難處：<\/strong>這說解釋了前書內部的轉折，但若講偏了，會讓信徒以為自己能看出時間表、「我們不會被突然臨到」，於是開始觀察新聞、對號入座——那又回到 2:2 的驚慌。而且主耶穌對門徒也說「所以，你們要警醒，因為不知道你們的主是哪一天來到」（太 24:42）——連信徒也不知道日子。所以對象說要和互補說一起讀。<\/p>"],["互補說（前書防怠慢，後書防躁進）","","<p>認為兩封信回應的是兩種不同的處境，所以強調不同的一面。前書的處境是憂傷與可能的鬆懈：睡了的人怎麼辦？我們要怎樣過日子？保羅說那日子會忽然來到，所以「我們不要睡覺像別人一樣，總要警醒謹守」（帖前 5:6）——<strong>防怠慢<\/strong>。後書的處境是驚慌與躁進：有人說主的日子已經到了，人心浮動、有人不做工；保羅說那日子以前還有某些事，所以「不要輕易動心，也不要驚慌」——<strong>防躁進<\/strong>。<\/p><p><strong>難處：<\/strong>互補說要承認，兩封信合起來仍沒有給出一張完整的時間表——保羅口頭講過的那一頁（2:5），我們手上沒有。但這正是互補說的力量所在：兩封信合起來給的不是時間表，而是一種姿態——<strong>不鬆懈，也不驚慌<\/strong>。就像一位遠行的主人吩咐僕人：我隨時會回來，所以不要偷懶；我回來以前還有些事要發生，所以不要聽人說我已經到了就亂跑。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採互補說，並吸收對象說的觀察——兩封信並讀，前書防怠慢，後書防躁進。<\/strong>那日子對不信的世界是突然的；對信徒，那日子雖然也不知道是哪一天，卻不必措手不及。兩封信的張力，與主耶穌在太 24 章的講論同一個形狀：有先兆，也有不知道的日子——<strong>先兆是為了叫人不被騙，不知道日子是為了叫人不鬆懈。<\/strong><\/p><p>所以本講義讀第 2 章時，不把 2:3–8 當成一張可以對照新聞的檢查表，而是當成一份安定人心的保證：那日子還沒有到，到之前的事都被管著，結局已經寫好了。<strong>講台只講一句：前書叫人不要睡著，後書叫人不要亂跑——一個等候主的人，是醒著，也站穩。<\/strong>作者問題回指議題「作者、寫作地點與年代」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩封信表面上的張力，不是聖經自相矛盾，而是同一位牧者對同一間教會在不同時候說的不同的話——就像父母會對貪玩的孩子說「快點，要遲到了」，也會對慌張的孩子說「別急，還來得及」。兩句話都是真的，都是愛。<\/p><p>對今天的我們，兩封信合起來說的是：<strong>不要以為主不會來，也不要相信任何人說他已經算出來了。<\/strong>主耶穌自己作的界線最清楚：「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道」（太 24:36）。知道這一點的人，可以安靜地把今天的工做好。<\/p>"]],"con":[],"say":"本講義的立場：帖前與帖後的末世教導不矛盾，兩封信並讀——前書防怠慢（像夜間的賊，所以要警醒），後書防躁進（那日子以前必有某些事，所以不要驚慌）。這與主耶穌在太 24 章的講論同一個形狀：先兆是為了叫人不被騙，不知道日子是為了叫人不鬆懈。一個等候主的人，是醒著，也站穩。","care":"這一題最容易被拿來在講台上「教人看先兆」，結果會眾回家開始對照新聞、對號入座，夜裡睡不著——那正是後書要醫治的病。講兩封信時，不用「你看現在的世界，是不是越來越像」作開場，也不嘲笑曾經因為某一說而緊張、而鬆懈的弟兄姊妹。對容易焦慮的人，先讀 2:2「不要驚慌」與 3:16；對已經冷淡、覺得主不會來的人，再讀帖前 5:6——同一位主，對不同的人說不同的話。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:3--4；2:13--17；3:16","ch":[],"why":"全卷通用：主必再來；其餘細節不該搖動信心。這一卷的議題頁要陳列許多爭論：千禧年三觀、被提四說、大罪人與攔阻者的六種讀法、永刑與條件不朽、教會紀律的程序、聖傳與惟獨聖經、作者是否託名、兩封信的先後。有些讀者會因此鬆一口氣，有些讀者卻會開始不安：連主怎樣再來都有這麼多說法，我信的到底可不可靠？而帖撒羅尼迦後書本身正是一封寫給「被動搖的人」的信。甚麼可以有不同看法、甚麼不能讓，必須在開卷講清楚。","pos":[["【一】經文問的是甚麼","","<p>帖撒羅尼迦後書有一組貫穿全卷的對照：搖動與堅固。2:2 說「不要輕易動心」（σαλευθῆναι，像被浪推動），2:15 說「你們要站立得穩」（στήκετε），2:17 說「在一切善行善言上堅固你們」，3:3 說「但主是信實的，要堅固你們」。而全卷的鉸鏈在 3:2–3：「因為人不都是有信心。但主是信實的」——信心可能不夠，主的信實卻不會改變。<\/p><p>同時，這封信本身就留下了它不回答的問題：「現在你們也知道，那攔阻他的是甚麼」（2:6）——他們知道，我們不知道。<strong>經文問的是：一封留下這麼多未解之謎的信，要怎樣叫人站穩？甚麼是不能讓的？甚麼是可以有不同看法、可以承認「不知道」的？知道了這麼多爭議以後，信心該建立在哪裡？<\/strong><\/p>"],["完整圖表說（必須有一張完整的末日時間表，信心才站得住）","","<p>認為一位真正信靠聖經的人，應當對末日的每一個環節都有清楚的答案：被提在甚麼時候、大罪人是誰、攔阻的是甚麼、一千年怎樣算；承認「不知道」，就是承認聖經不清楚，信心就會動搖。所以教會應當畫好一張完整的圖表，要信徒照著相信。這派的心志是想給人安全感，也是認真看待經文——帖後確實講了那日子以前的事。<\/p><p><strong>難處：<\/strong>保羅自己沒有給出這張圖表，他說「我還在你們那裡的時候，曾把這些事告訴你們」（2:5），那一頁我們手上沒有。把每一個環節都升格成不能讓的中心，合一就只剩下圖表完全相同的人；而信心若建立在每一格都填對上，任何一格的答案一動，整個信仰就跟著倒——歷史上許多算錯日子的人，最後連主會不會來都不信了。<\/p>"],["爭議即不可靠說（既然甚麼都有爭論，末世就只剩個人意見）","","<p>認為既然學者們連被提的時間、大罪人是誰、地獄的形式、這封信是誰寫的都意見分歧，那就表示聖經在這些事上沒有確定的教導，每個人照自己的感覺讀就好；最好乾脆不談末世，免得引起爭論。這派誠實地面對了爭議的存在，也提醒教會不要假裝一切都很清楚、不要用自己的圖表壓人。<\/p><p><strong>難處：<\/strong>它把爭議的「細節」與爭議的「範圍」混在一起了。千禧年三觀、被提四說爭的是主怎樣再來、在甚麼次序裡再來，沒有一派否認「主耶穌同他有能力的天使從天上在火焰中顯現」（1:7）；永刑說與條件不朽說爭的是沉淪的形式，沒有一派否認神的公義審判。而且帖後明說有要分辨的假消息（2:2）——真理不是可有可無的；不談末世的教會，反而把會眾留給了群組裡的末日訊息。<\/p>"],["中心與邊緣說（福音的中心不能讓，其餘的事可以有不同看法）","","<p>認為帖撒羅尼迦後書本身就劃出了一條線。<strong>不能讓的<\/strong>，是這封信反覆、清楚地說出的事：主必親自、看得見地再來（1:7）；他要「在他聖徒的身上得榮耀」（1:10）；那日子還沒有到，到之前的事都被管著，「主耶穌要用口中的氣滅絕他」（2:8）；神是公義的，要使受患難的人「同得平安」（1:7）；神「從起初揀選了你們」（2:13）；「但主是信實的」（3:3）。<strong>可以有不同看法的<\/strong>，是這中心之外的次序、形式與歷史問題。<\/p><p><strong>難處：<\/strong>中心與邊緣的界線本身有時也會被爭論——有人會說被提的時間就是中心。所以劃線的時候，要以經文自己最清楚、最反覆強調的事為中心，而不是以某一個宗派最在意的事為中心；也要記得，邊緣的事不等於不重要的事——它們常常牽動人的生命（例如議題「神的公義審判與永遠沉淪」、議題「做工、懶惰與教會紀律」），所以要謹慎、溫柔地處理。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採中心與邊緣的讀法，以「主必再來」與「主是信實的」為中心。<\/strong>主必親自、看得見地再來，要在聖徒身上得榮耀；那日子沒有人知道，但結局已經寫好；神是公義的，要把受苦的人接出來；神揀選了我們，主是信實的，要堅固我們——這幾件事各派都同意，兩千年沒有被任何學術爭論動搖。<\/p><p>其餘的事，本講義照鐵律三：先陳列各家、說出各自的難處、再給判斷，並且把判斷的理由講出來；講台與教學場上一句帶過，指向議題頁與「書信的處境與原則」–5。<strong>承認「不知道」不是信心的失敗，是對經文的誠實<\/strong>——2:5–6 的那一頁空白，本講義不替保羅補上。<\/p><p>全卷的地勢最高點是 3:16，引它時一律引全句：「願賜平安的主隨時隨事親自給你們平安！願主常與你們眾人同在」（3:16）。爭議可以留在議題頁裡，這一節要帶回家。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。信心不是建立在「我對每一題都有答案」上，而是建立在那一位信實的主身上：「因為人不都是有信心。但主是信實的，要堅固你們，保護你們脫離那惡者」（3:2–3）。學者的爭論會一直持續下去；但你可以在不知道攔阻的是誰、不確定被提在甚麼時候的情況下，完全確定主會回來，而且他回來的時候，要「在他聖徒的身上得榮耀」——包括你。<\/p><p>這一卷要讀完的人，<strong>不是更會排末日時間表，而是更平安地等候主<\/strong>；不是更想找出誰是大罪人，而是更警醒自己裡面的高抬自己；不是更會論斷不做工的人，而是更願意安靜做好今天的工、去勸那個脫隊的弟兄。<strong>讀完這一卷的人，是更愛主，還是更佩服作者？<\/strong>若是更愛主，爭議就各歸其位了。<\/p>"]],"con":[],"say":"本講義的全卷立場：主必親自、看得見地再來，要在聖徒身上得榮耀；那日子沒有人知道，但結局已經寫好；神是公義的，主是信實的——這些不能讓。千禧年、被提時間、大罪人與攔阻者、地獄的形式、作者與先後，先陳列各家、說出難處、再給判斷，講台一句帶過、指向議題頁與「書信的處境與原則」–5。承認「不知道」不是信心的失敗，是對經文的誠實。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也會有一聽到「學者有爭論」「我們不知道」就不安、覺得教會怎麼甚麼都不確定的人，還有曾經在末日預言、紀律或「堅守教訓」上被教會傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要急著用一堆答案堵住他，先陪他；對第二種人，指給他看 1:7、2:8、3:3 那幾件從來沒有被任何爭議動搖的事；對第三種人，讓他知道傷他的是人錯用了經文，不是那位要「隨時隨事親自給你們平安」的主。疑惑若伴隨長期的失眠、焦慮或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:1「西拉」——原文是西爾瓦努，和合本為甚麼譯作西拉？","r":"1:1--2；徒 15:40；徒 17:4；林後 1:19；彼前 5:12","ch":[1],"why":"帖後 1:1 原文寫的是 Σιλουανὸς（西爾瓦努），使徒行傳卻一路稱他為「西拉」。讀者若對照不同譯本，會發現有的譯作「西拉」，有的音譯作「西爾瓦努」或「息耳瓦諾」，就會問：這是同一個人嗎？和合本是不是改了原文？這一題關係到我們怎樣看譯本，也讓我們看見保羅身邊那位一起被打、一起被趕出城的同伴。","pos":[["【一】經文問的是甚麼","","<p>「保羅、西拉、提摩太寫信給帖撒羅尼迦、在神－我們的父與主耶穌基督裡的教會」（1:1）。原文的第二個名字是 Σιλουανὸς，是一個拉丁名字；使徒行傳第 15 到 18 章的同伴，名字卻是「西拉」。問題有兩層：第一，帖後的西爾瓦努與使徒行傳的西拉是不是同一個人？第二，譯本該照原文音譯，還是統一成讀者熟悉的名字？<\/p>"],["同一人兩個名字說（多數學者）","","<p>大多數學者認為是同一個人：「西拉」是他的閃族名字（或其希臘化的短稱），「西爾瓦努」是他的羅馬名字，就像掃羅又名保羅。證據是：使徒行傳說保羅「揀選了西拉」同去（徒 15:40），一起在腓立比坐監，一起到帖撒羅尼迦和哥林多；而保羅書信在同一段時間、同一些地方提到的同伴，名字都是西爾瓦努（帖前 1:1；林後 1:19）。他又是羅馬公民（徒 16:37），用羅馬名寫信很自然。<\/p><p><strong>難處：<\/strong>新約沒有任何一節明說「西拉又名西爾瓦努」，這是從行程與同伴身分推論出來的；兩個名字在字形上也不是簡單的縮寫關係。<\/p>"],["兩個不同的人說（少數）","","<p>少數意見認為兩個名字指兩位不同的同工，理由是路加與保羅各自一致地使用不同的名字，而路加在別處並不避諱羅馬名。也有人把彼前 5:12 的「西拉」（原文同樣是西爾瓦努）與保羅的同伴分開，認為那是另一位同名的人。<\/p><p><strong>難處：<\/strong>這一說要假設保羅身邊在同一段行程裡，正好有兩位都叫類似名字、卻從不同時出現的同工；使徒行傳的西拉在哥林多出現的時間，與林後 1:19 的西爾瓦努完全重疊，很難說成兩個人。<\/p>"],["【二】譯名的兩種做法","","<p>和合本採取「同一人用同一個譯名」的做法，在書信裡也譯作「西拉」，好讓中文讀者一眼認出這就是使徒行傳裡那位同伴；這是一種解釋性的翻譯，背後已經包含了「同一人說」的判斷。另一種做法是照原文音譯（如「西爾瓦努」），讓讀者看見原文不同，再由註腳說明。兩種做法都忠於原文，只是把解釋放在正文或放在註腳的分別。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採同一人說：西拉就是西爾瓦努，和合本的譯法是合理的解釋性翻譯。<\/strong>這使我們看見一件比名字更重要的事：寫這封信的三個人，正是一起被趕出帖撒羅尼迦的三個人。保羅不是一個人寫信，他有同伴。<\/p><p>作者、寫作地點與帖撒羅尼迦教會的背景，本講義的全卷立場見議題「作者、寫作地點與年代」、議題「帖撒羅尼迦城與教會」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。譯名的差別不是聖經有錯，而是翻譯的人替讀者做了一個判斷；正好提醒我們，讀不同譯本、查原文是被鼓勵的事，像庇哩亞人「天天考查聖經」（徒 17:11）。<\/p><p>對你今天更重要的，是這個名字背後的人：一位被打、坐監、被趕出城，還繼續和保羅一起寫信的同伴。你身邊有這樣的屬靈同伴嗎？<\/p>"]],"con":[],"say":"本講義的立場：帖後 1:1 的西爾瓦努就是使徒行傳的西拉，一人兩名（閃族名與羅馬名）；和合本統一譯作「西拉」是合理的解釋性翻譯。作者與帖撒羅尼迦教會的背景，本講義的全卷立場見議題「作者、寫作地點與年代」、議題「帖撒羅尼迦城與教會」。","care":"會眾席上可能有第一次發現「原文和譯本不一樣」而心裡不安的人，以為聖經被人改過。不要在講台上把這一題講成炫耀原文，也不要笑他大驚小怪；會後陪他看一看譯本怎樣處理人名，讓他知道問問題是好的。也可以藉這一題，邀請孤單服事的同工找一位像西拉那樣的同伴。"},{"id":"ISS01_2","t":"1:3「我們該為你們常常感謝」——感謝是「該」的嗎？","r":"1:3；2:13；帖前 1:2","ch":[1],"why":"保羅說「我們該為你們常常感謝神」，原文 Εὐχαριστεῖν ὀφείλομεν，「該」是欠債、有義務的字，而且 2:13 又出現一次。許多人讀到會不舒服：感謝不是應該出於自願、出於喜樂嗎？被規定的感謝還算感謝嗎？這一題關係到我們怎樣理解敬拜與感恩，也關係到在苦難中「還要感謝」會不會變成另一種壓力。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，我們該為你們常常感謝神，這本是合宜的」（1:3）。保羅用了兩個詞：ὀφείλομεν（我們欠、我們該）與 καθὼς ἄξιόν ἐστιν（這本是合宜的、相稱的）。帖前 1:2 只說「我們為你們眾人常常感謝神」，到後書卻加上「該」字。問題是：這個「該」是在說感謝是一種責任，還是在說甚麼別的？<\/p>"],["禮儀義務說：猶太敬拜的感恩責任","","<p>有學者指出，猶太敬拜傳統常說「我們當感謝」，感恩被看作人對神應盡的本分；早期教會的禱文也延續這種說法。照這一讀法，ὀφείλομεν 是禮儀語言，表示感謝神是受造之物理所當然的本分，不是心情好的時候才做的事。<\/p><p><strong>難處：<\/strong>這說明了字的來源，卻沒有說明保羅為甚麼在後書特別加上它，前書卻沒有；也容易讓人把感謝讀成一條規定，失去裡面的溫度。<\/p>"],["回應謙辭說：帖撒羅尼迦人不敢領受稱讚","","<p>另一些學者認為，帖撒羅尼迦人可能在回信中表示自己不配被稱讚——前書稱讚他們的信心和愛心，他們卻覺得自己仍在逼迫中動搖。保羅於是說：不，這是我們「該」說的，「這本是合宜的」，你們的信心確實格外增長了。照這一讀法，「該」是對自卑的人的堅定肯定。<\/p><p><strong>難處：<\/strong>我們手上沒有帖撒羅尼迦人的回信，這是從語氣推論出來的情境重建，無法證實。<\/p>"],["欠債回應說：神先做了事，人欠他一句謝謝","","<p>還有一種讀法把重點放在字本身：ὀφείλω 是欠債。神在一間受逼迫的教會裡做成了人做不到的事——信心長過了頭，愛心滿出來——所以保羅覺得自己欠神一句謝謝。這不是外加的規定，而是恩典已經發生之後，自然生出的回應。<\/p><p><strong>難處：<\/strong>這一讀法較貼近字義與上下文，但也要小心不要把「欠」講成交易，好像神做了事，人要用感謝還清。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義綜合後兩說：「該」是對恩典的回應，不是對心情的要求。<\/strong>保羅感謝的對象是神，理由是神在帖撒羅尼迦人身上做的事；這個「該」同時是對一群覺得自己不夠好的人的肯定——你們的信心真的長了，我們不感謝神就說不過去。<\/p><p>這也表示：受苦的人不必被要求「為苦難本身感謝」；保羅感謝的不是逼迫，是在逼迫中仍然站著的信心與愛心。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：感謝的對象是神，感謝的理由是神的作為。爭的只是保羅為甚麼特別說「該」。<\/p><p>如果你今天謝不出來，不必假裝。可以先從保羅的眼睛看別人——說出一件神在你身邊某一個人身上做成的事，為那件事感謝。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：1:3 的「該」（ὀφείλομεν）是欠債式的感謝——神先做了事，人自然欠他一句謝謝；它是對恩典的回應，也是對一群自覺不夠好的人的肯定，不是要求受苦的人為苦難本身感謝。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上有正在喪親、失業、生病或被欺負的人，他們最怕聽到的一句話是「凡事都要感謝」。不要用 1:3 要求他們立刻感謝，也不要說「你謝不出來是因為信心不夠」。先陪他把痛說完；可以邀請他和你一起，為一件很小的、神在別人身上做成的事感謝，讓感謝慢慢回來，而不是被逼出來。"},{"id":"ISS01_3","t":"1:5「這正是神公義判斷的明證」——受苦怎麼會是神公義的證據？","r":"1:4--5；腓 1:28；彼前 4:17","ch":[1],"why":"直覺告訴我們：好人受苦，正好證明神不公義。保羅卻說「這正是神公義判斷的明證」。「這」指的是甚麼？是受苦本身，還是受苦中的忍耐？讀錯了，會讓受苦的人以為「我受苦是神在審判我」，也會讓人把一切苦難浪漫化。這一題關係到每一個在苦難中問「神啊，你看見了嗎」的人。","pos":[["【一】經文問的是甚麼","","<p>1:4 說他們「在所受的一切逼迫患難中，仍舊存忍耐和信心」，緊接著 1:5 說：「這正是神公義判斷的明證」。原文 ἔνδειγμα 是一個沒有冠詞、沒有動詞的名詞，與前文並列，指「看得見的證據」。問題是：這個證據指的是前面哪一件事？它證明的「公義判斷」是現在的，還是將來的？<\/p>"],["忍耐信心說：在逼迫中站著，就是證據","","<p>許多解經家認為，ἔνδειγμα 指的是 1:4 的整件事——他們在逼迫中「仍舊存忍耐和信心」。一群剛信主的人能站得住，不是自己撐出來的，是神在他們裡面做工；這就證明神已經判定他們屬於他的國，將來也必公義地施行審判。腓 1:28 有相近的說法：信徒不怕敵人，「這是證明他們沉淪，你們得救」。<\/p><p><strong>難處：<\/strong>這一讀法把重點放在信徒的反應上，要小心不要變成「撐得住才是證據，撐不住就不是」，讓軟弱的人更受壓。<\/p>"],["苦難煉淨說：受苦本身是神現在的審判","","<p>另一種讀法認為，受苦本身就是神現在的公義審判：神藉苦難煉淨他的子民，好叫他們配得神的國，「時候到了，審判要從神的家起首」（彼前 4:17）。這一說接近猶太傳統的看法——義人在今世受管教，將來得安息；惡人今世享福，將來受報。<\/p><p><strong>難處：<\/strong>上下文說他們是「為這國受苦」（1:5），是被人加患難（1:6），不是因為犯錯被神管教；把受苦本身說成審判，容易讓受害者以為神在罰他。<\/p>"],["將來翻轉說：苦難要求一個公義的結局","","<p>還有一種讀法把 1:5 與 1:6–10 連起來：正因為信徒今天無辜受苦，神的公義就要求有一天必須翻轉——加患難的人受報應，受患難的人同得平安。苦難本身不是公義，卻是「神必須是公義的」的理由；1:6 的 εἴπερ（既是）就是這個邏輯的前提。<\/p><p><strong>難處：<\/strong>這一讀法把「明證」講得較抽象，不如前一說貼近 1:4 的具體描述。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採忍耐信心說，並以將來翻轉說補足：明證不是逼迫本身，是在逼迫中仍舊站著的那一群人；而他們的站立，指向一個神必公義翻轉的結局。<\/strong>受苦不是神在罰你；受苦中你還站著，是神正在看顧你的證據。站不太穩的人也在裡面——保羅稱讚的是「仍舊」，不是「很勇敢」。<\/p><p>神的公義審判與受苦者的安慰，本講義的全卷立場見議題「神的公義審判與永遠沉淪」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神看見了受苦的人，神是公義的，結局在他手裡。爭的是保羅指著哪一件事說「明證」。<\/p><p>如果你今天覺得自己撐得很辛苦，你沒有失敗。你還在，就是神沒有放手的記號。<\/p>"]],"con":[],"say":"本講義的立場：1:5 的「明證」不是逼迫本身，是在逼迫中仍舊存忍耐和信心的人；受苦不等於神在審判你，你還站著，正是神看顧你、也必公義翻轉結局的證據。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。","care":"會眾席上有長期病痛、遭遇意外、被欺負、被冤枉的人，他們心裡常有一個聲音：「是不是神在罰我？」不要用 1:5 加重這個聲音，也不要說「你受苦是因為神要煉你，所以要感謝」。先承認他的苦是真的、是不公平的；陪他，不追問原因；若苦難來自暴力或欺壓，協助他尋求保護與專業協助，並在會後單獨關心。"},{"id":"ISS01_4","t":"1:5「叫你們可算配得神的國」——得救要靠「配得」嗎？","r":"1:5；1:11；加 2:16；弗 2:8--9","ch":[1],"why":"「配得神的國」這句話很容易被聽成：受夠了苦、表現夠好，才換得到天國的門票。同一章 1:11 又說「看你們配得過所蒙的召」。這會讓人懷疑：保羅在加拉太書說人稱義是因信，在這裡卻說要配得？這一題關係到因信稱義的確據，也關係到受苦的人會不會把苦難當成功德。","pos":[["【一】經文問的是甚麼","","<p>「這正是神公義判斷的明證，叫你們可算配得神的國；你們就是為這國受苦」（1:5）。原文 καταξιωθῆναι 是被動式不定詞，「被算為配得」。問題是：這個「算」是神宣告一個已經存在的事實，還是神因為人的受苦而給他資格，或是神藉著受苦把人造就成配得的人？<\/p>"],["宣告說：神宣告他們屬於這國","","<p>許多解經家認為 καταξιόω 是宣告性的字：不是「使之配得」，而是「認定、宣告為配得」。神在末日審判時公開宣告：這些人是屬於我國的。他們在逼迫中仍舊存信心，正顯明他們已經屬於這國；受苦不是入場費，是一張照片，照出他們屬於哪一國。這與因信稱義一致。<\/p><p><strong>難處：<\/strong>有人覺得這一說把「配得」講得太輕，好像受苦與成聖都不要緊；也要解釋為甚麼保羅不直接說「宣告為義」。<\/p>"],["造就說：神藉受苦把人造就成配得的人","","<p>另一種讀法認為，神藉著苦難煉淨、造就信徒，使他們在品格上真正與這國相稱。這與「行事為人就當與蒙召的恩相稱」（弗 4:1）同一個方向：得救是恩典，但恩典會在人身上長出與這國相稱的生命。<\/p><p><strong>難處：<\/strong>這一說若講不清楚，很容易滑向「靠受苦成聖、靠成聖得救」，把恩典變成工價；也會讓留在傷害中的人以為忍受越多越配得。<\/p>"],["功德說：受苦累積可以換取的功勞","","<p>歷史上有一種讀法把這節與受苦的功德連在一起：信徒為主受的苦，可以在神面前累積功勞，作為進入天國或得更大賞賜的根據。這種讀法在某些敬虔傳統中流傳，強調受苦的價值。<\/p><p><strong>難處：<\/strong>這與保羅的福音直接衝突——「人稱義不是因行律法，乃是因信耶穌基督」（加 2:16）；1:11 的「配得過」主詞也是神，最後「都照著我們的神並主耶穌基督的恩」（1:12）。本講義不採。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採宣告說，並保留造就說的真理：「被算為配得」是神的宣告，不是人的掙得；恩典會在受苦的人身上長出與這國相稱的生命，但那也是恩典。<\/strong>得救的根據是基督，不是苦難；苦難只是顯明你已經屬於哪一國。因信稱義與「配得」的關係，本講義回指加拉太書立場二；神的公義審判見議題「神的公義審判與永遠沉淪」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而該讓你更穩。如果配得是靠你撐出來的，你永遠不知道自己撐夠了沒有；正因為是神「算」你配得，你可以在軟弱的日子裡仍然確定自己屬於他。<\/p><p>受苦的人不必再問「我苦夠了嗎」，可以問「主啊，你今天在我身上要長出甚麼」。<\/p>"]],"con":[],"say":"本講義的立場：1:5「可算配得」（καταξιωθῆναι，被動式）是神的宣告，不是靠受苦掙來的資格；受苦不是入場費，是照出你已經屬於哪一國的照片。因信稱義與「配得」，本講義回指加拉太書立場二；全卷立場見議題「神的公義審判與永遠沉淪」。","care":"會眾席上有人留在傷害他的關係裡，因為他聽過「越苦越配得」；也有人因為信心軟弱、撐不住而覺得自己不配得救。不要用這一節叫人繼續忍受暴力，也不要用它衡量誰比較屬靈。對前者，清楚告訴他離開危險、尋求保護不會使他失去神的國，並協助他找到專業協助；對後者，陪他讀 1:12「都照著……恩」。"},{"id":"ISS01_5","t":"1:6「就必將患難報應那加患難給你們的人」——基督徒可以盼望壞人受報應嗎？","r":"1:6--7；羅 12:19；啟 6:10；太 5:44","ch":[1],"why":"一個被欺負、被詐騙、被傷害的人讀到 1:6，心裡可能同時有兩種感覺：終於有人替我說話了；可是基督徒不是要愛仇敵嗎，我可以盼望他受報應嗎？這一題若講偏，一頭變成復仇的快感與詛咒，一頭變成用「交給神」叫受害者閉嘴。它關係到每一個受過傷的人怎樣在神面前誠實。","pos":[["【一】經文問的是甚麼","","<p>「神既是公義的，就必將患難報應那加患難給你們的人，也必使你們這受患難的人與我們同得平安」（1:6–7）。原文 ἀνταποδοῦναι 是「回報、償還」；同一個「壓」字（θλῖψις／θλίβω）連用三次：加患難的、患難、受患難的。問題是：保羅寫這句話，是要信徒期待仇敵受苦，還是要告訴受苦的人別的事？基督徒向神呼求公義，與愛仇敵怎樣並存？<\/p>"],["呼求公義說：向神求公義是合法的禱告","","<p>這一說指出，聖經裡有許多向神呼求公義的禱告——詩篇的哀歌，以及殉道者在祭壇下呼喊「你不審判住在地上的人，給我們伸流血的冤，要等到幾時呢」（啟 6:10）。主耶穌也說神「豈不終久給他們伸冤嗎」（路 18:7）。所以受害者向神說「求你施行公義」不是罪，是把自己的怒氣交到正確的地方。<\/p><p><strong>難處：<\/strong>呼求公義與盼望對方受苦之間的界線很細；若不小心，禱告就會變成詛咒，心裡繼續開一場報仇的庭。<\/p>"],["只愛仇敵說：基督徒只該為仇敵祝福","","<p>另一說強調新約的命令：「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44），主在十字架上為釘他的人求赦免。照這一說，基督徒不該盼望任何人受報應，只該盼望他悔改；1:6 是神的事，不是信徒該期待的事。<\/p><p><strong>難處：<\/strong>這一說若講得太快，會叫受害者不准生氣、不准說出傷害，等於用屬靈的話叫他閉嘴；也忽略了保羅自己把 1:6 寫給受苦的人當作安慰。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：基督徒可以向神呼求公義，盼望惡被止住、受害的人被接出來；但不盼望復仇的快感，不詛咒仇敵，並且同時為他的悔改禱告。<\/strong>1:6 一定與 1:7 一起讀——審判的目的是「同得平安」（ἄνεσιν，鬆綁），不是給受害者看一場報仇戲。伸冤在神（羅 12:19），所以我不必報仇，也不必假裝沒事；尋求法律保護與公道是正當的。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神是公義的，報仇不是我們的事，愛仇敵是主的命令。爭的只是受害者心裡那一份對公義的渴望要怎樣安放。<\/p><p>如果你心裡還有怒氣，請不要以為自己不屬靈。把它帶到神面前說出來——那正是把它交給神，而不是吞下去。<\/p>"]],"con":[],"say":"本講義的立場：基督徒可以向神呼求公義，但不求復仇的快感、不詛咒仇敵；1:6 一定接著 1:7 讀，審判是為了把受苦的人鬆綁。伸冤在神，所以不必報仇也不必假裝沒事，尋求法律保護與公道是對的。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。","care":"會眾席上一定有被家暴、被性侵、被霸凌、被詐騙的人，有些傷害就發生在教會裡。不要對他們說「你要饒恕，不然神不饒恕你」，也不要追問細節或要求他立刻原諒；不要用「交給神」叫他閉嘴。先相信他、陪伴他，協助他報警、尋求法律與專業協助，確保他的安全；在會後單獨關心，讓他知道教會站在受害者這一邊。"},{"id":"ISS01_6","t":"1:7「在火焰中顯現」——主再來是看得見的、一次的、全地的事件嗎？","r":"1:7--8；徒 1:11；太 24:27；太 24:36","ch":[1],"why":"1:7 說「主耶穌同他有能力的天使從天上在火焰中顯現」。有人讀成主會分兩次來——先秘密接走信徒，後來才公開顯現；也有人讀成這已經在主後 70 年耶路撒冷被毀時象徵性地應驗了。這一題直接關係到全卷的末日恐慌，也關係到華人教會群組裡轉傳的各種時間表。","pos":[["【一】經文問的是甚麼","","<p>「那時，主耶穌同他有能力的天使從天上在火焰中顯現」（1:7）。原文 ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ，「在主耶穌的顯現（揭開）中」——這個字是揭開帷幕，讓本來隱藏的被看見。問題是：這一次顯現與 2:1 的「降臨」是同一件事嗎？它是可見的、一次的、全地都知道的事件，還是分成階段，或已經應驗了？<\/p>"],["一次可見再來說（歷代教會主流）","","<p>歷代大多數教會認為，主的再來是一次、親自、可見、全地都知道的事件：「這離開你們被接升天的耶穌，你們見他怎樣往天上去，他還要怎樣來」（徒 1:11）；「閃電從東邊發出，直照到西邊；人子降臨也要這樣」（太 24:27）。1:7 的顯現與 2:1、2:8 的降臨是同一件事，那天信徒得平安、惡人受審判同時發生。<\/p><p><strong>難處：<\/strong>這一說要解釋聖經中某些看來分兩面的經文（例如帖前 4:17 的「被提」與這裡的審判顯現）怎樣在同一事件中發生，各家細節仍有不同。<\/p>"],["兩階段說（災前被提）","","<p>時代論傳統中的災前被提說認為：主先秘密降臨空中，把信徒接去（帖前 4:16–17），之後地上經歷大災難，主再與聖徒一同從天上公開顯現、施行審判。照這一說，1:7 的「顯現」指的是第二階段。這一說在華人教會影響很大。<\/p><p><strong>難處：<\/strong>1:7 說受患難的信徒是在主「顯現」那時才「同得平安」，看來信徒在顯現以前仍在患難中；2:1–3 也把「聚集到他那裡」放在那日子的同一組事件裡。持此說的弟兄姊妹有他們的解釋，本講義尊重，但認為較難與本章連讀。<\/p>"],["過去應驗說（主後 70 年）","","<p>過去論者認為，新約許多「主來」的經文，已在主後 70 年耶路撒冷被毀時以審判的方式應驗；部分過去論仍相信將來有一次身體可見的再來，完全過去論則認為再來已經完全過去。<\/p><p><strong>難處：<\/strong>1:7–10 寫的是全地、永遠、在一切信的人身上得榮耀的事件，很難套在一場地方性的戰爭上；完全過去論否認將來的身體再來與復活，與歷代信經不合，本講義不採。部分過去論是福音派內可以討論的讀法。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：主必親自、看得見地再來，1:7 的顯現就是那一天；那天信徒得平安、不聽從福音的人受審判同時發生。<\/strong>被提的時間、千禧年的次序，各派公平陳列，都是弟兄，本講義不替教會決定，也不算日子：「但那日子，那時辰，沒有人知道」（太 24:36）。本講義的全卷立場見議題「主的日子、被提與大罪人」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意最重要的一件事：主耶穌必再來，而且是親自來。爭的是怎麼來、分幾步、甚麼次序。<\/p><p>保羅寫 1:7 不是為了給受苦的人一張時間表，是為了告訴他們：這浪有終點。你不必知道哪一天，只要知道是誰要來。<\/p>"]],"con":[],"say":"本講義的立場：主必親自、看得見地再來，1:7 的顯現就是那一天，那天受苦的人得平安；被提與千禧年各說公平並陳，都是弟兄；不算日子、不點名。本講義的全卷立場見議題「主的日子、被提與大罪人」。","care":"會眾席上可能有從小在災前被提教導中長大、聽到不同讀法就覺得被否定的人，也有被群組裡的末日訊息嚇到睡不著、甚至想囤糧辭職的人。不要在講台上嘲笑任何一派，也不要轉傳或背書任何時間表。對前者，告訴他各派都是弟兄；對後者，陪他讀 2:2「不要輕易動心，也不要驚慌」，帶他回到今天的生活。"},{"id":"ISS01_7","t":"1:8「不認識神和那不聽從……福音的人」——從來沒聽過福音的人怎麼辦？","r":"1:8；羅 2:14--15；徒 4:12；徒 17:30","ch":[1],"why":"1:8 說主要「報應那不認識神和那不聽從我主耶穌福音的人」。許多人立刻想到：那些生在沒有教會的地方、一生沒有聽過耶穌的人呢？還有我那位沒有信主就過世的祖父母？這是佈道與探訪中最常被問到、也最容易傷人的一題，需要謹慎陳列。","pos":[["【一】經文問的是甚麼","","<p>「要報應那不認識神和那不聽從我主耶穌福音的人」（1:8）。原文 τοῖς μὴ εἰδόσι θεὸν 這使我們想起耶 10:25「不認識你的列國」；上下文指的是那些「加患難給你們的人」（1:6）——知道福音、拒絕福音、還逼迫信福音的人。問題是：1:8 能不能直接回答「從來沒有聽過的人」的結局？<\/p>"],["明確信靠說（排他說）","","<p>這一說強調：「除他以外，別無拯救」（徒 4:12），人必須聽見福音、明確信靠基督才能得救，所以傳福音極其迫切。沒有聽過的人，將按著他們所得的普遍啟示與良心受審判（羅 2:14–15），而人人都有罪，需要救主。<\/p><p><strong>難處：<\/strong>這一說忠於基督的獨一性，卻常被講得冷硬，好像神樂意看人沉淪；也較難回答舊約時代未聽聞基督之名的人、夭折的嬰孩等問題。<\/p>"],["按光審判說（包容說）","","<p>另一說同樣相信救恩只在基督裡，但認為神可能藉著基督的工作，拯救一些沒有明確聽過福音、卻按著所得的光回應神的人；神按人所得的亮光審判，「審判全地的主豈不行公義嗎」（創 18:25）。<\/p><p><strong>難處：<\/strong>聖經沒有明說這樣的人存在，這一說是從神的公義與慈愛推論出來的；若講得過頭，容易讓人覺得傳福音不必要。<\/p>"],["普救說","","<p>還有一種看法認為最後所有人都會得救，地獄若存在也是暫時的。持這一說的人重視神的慈愛與「他願意萬人得救」（提前 2:4）。<\/p><p><strong>難處：<\/strong>1:8–9 本身就說有人要「永遠沉淪，離開主的面」；新約一貫把信與不信的結局分開。本講義不採普救論。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：救恩只在基督裡；神按公義審判，也按人所得的光審判；1:8 的對象是拒絕福音、逼迫信徒的人，不是拿來斷言從未聽聞者結局的經文。<\/strong>我們不替神決定任何一個人的結局，但我們確知：神「吩咐各處的人都要悔改」（徒 17:30），所以我們去傳。神的公義審判與永遠沉淪，本講義的全卷立場見議題「神的公義審判與永遠沉淪」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說（普救說以外）都同意：基督是唯一的救主，神是公義的，也是慈愛的。爭的是神怎樣對待從未聽聞的人——聖經沒有說盡的地方，我們不必說盡。<\/p><p>你可以把這一題交給那位「不願有一人沉淪」（彼後 3:9）的神，然後去找一位還沒有聽過的人。<\/p>"]],"con":[],"say":"本講義的立場：救恩只在基督裡；1:8 的對象是拒絕福音、逼迫信徒的人，不用來斷言從未聽聞者或任何已故之人的結局；神按公義、也按人所得的光審判，我們不替神宣判，只負責去傳。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。","care":"會眾席上一定有親人沒有信主就過世的人，他們聽到 1:8 會心痛，甚至不敢問。不要對他們說「你的家人一定在地獄」，也不要為了安慰而保證「他一定得救了」。陪他哀傷，告訴他審判在一位公義又慈愛的主手裡；在喪禮與探訪中，安慰活著的人，不替亡者宣判。"},{"id":"ISS01_8","t":"1:9「永遠沉淪」——地獄是永遠受苦，還是被消滅？","r":"1:9--10；2:16；太 25:46；羅 6:23","ch":[1],"why":"1:9 是新約描寫最終審判最清楚的經文之一：「他們要受刑罰，就是永遠沉淪，離開主的面和他權能的榮光」。歷代教會多讀為有知覺的永刑；近代福音派也有學者主張條件不朽說，認為惡人最終被消滅。這一題關係到我們怎樣認識神的公義與慈愛，也關係到講台會不會用地獄恐嚇人。","pos":[["【一】經文問的是甚麼","","<p>原文 δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου——「他們要付出刑罰：永遠的毀滅，離開主的面」。這一句與賽 2:10、19、21 的七十士譯本幾乎逐字相同（賽 2:10「躲避耶和華的驚嚇和他威嚴的榮光」），以賽亞書裡是「耶和華」，保羅放的是「主」。ἀπὸ προσώπου 有兩種讀法：「離開主的面」（被隔絕），或「從主面前發出」（刑罰由主的面而來）。問題是：ὄλεθρον αἰώνιον 是永遠持續的受苦，還是一次永遠不能挽回的毀滅？<\/p>"],["永刑說（有知覺的永遠刑罰，傳統立場）","","<p>歷代教會的主流讀法認為，惡人在永遠裡有知覺地承受與神隔絕的刑罰。主耶穌說「這些人要往永刑裡去；那些義人要往永生裡去」（太 25:46），同一個「永」字形容兩邊，若永生是永遠存在，永刑也是。ὄλεθρος 在保羅筆下（帖前 5:3）指毀壞、失喪，不一定是不存在；「離開主的面」正是持續的失去。<\/p><p><strong>難處：<\/strong>許多人難以把有限的罪與無限的刑罰放在一起理解；講台上也常把這一說講成恐怖細節，反而遮蓋了經文的核心——關係的失去。<\/p>"],["條件不朽說（滅絕說，福音派內少數立場）","","<p>條件不朽說認為人並非天生不朽，永生是神在基督裡的恩賜；惡人最終被毀滅，不再存在，而這毀滅的結果是永遠的——「罪的工價乃是死」（羅 6:23）。ὄλεθρον αἰώνιον 照字面是「永遠的毀滅」；火的意象常表示焚盡。這一說在近代有好幾位受尊重的福音派學者持守。<\/p><p><strong>難處：<\/strong>啟示錄等經文描寫的「晝夜不得安寧」較難以滅絕解釋；這一說也是教會歷史上的少數立場。本講義不以異端稱之。<\/p>"],["普救說","","<p>普救論主張地獄若存在，最終也會清空，所有人都會與神和好；持這一說的人認為神的愛最後必勝過一切的拒絕，刑罰只是為了矯正，不是永遠的。<\/p><p><strong>難處：<\/strong>1:9 明說「永遠沉淪」，與 1:10 信的人得榮耀形成對比；新約一貫把兩種結局分開。本講義不採普救論。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在歷代教會的永刑說，承認條件不朽說是福音派內的少數立場、不以異端稱之，不採普救論。<\/strong>1:9 的核心不是火，是「離開主的面」——聖經最大的福氣是「也要見他的面」（啟 22:4），最深的失落是永遠失去那一張臉。讀 1:9 一定同時讀 2:16「永遠的安慰並美好的盼望」：全卷兩個「永遠」，神寫這封信是為了第二個。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。永刑說與條件不朽說都同意：不信的結局是真實的、永遠的、無可挽回的，核心是失去神；救恩只在基督裡。爭的是那失去以甚麼形式持續。<\/p><p>這一題該動搖的，不是你的信心，是我們對失喪之人的冷漠。我們不用地獄嚇人，我們邀請人回到主的面前。<\/p>"]],"con":[],"say":"本講義的立場：站在歷代教會的永刑說，承認條件不朽說是福音派內的少數立場、不以異端稱之，不採普救論；1:9 的核心是「離開主的面」，一定與 2:16「永遠的安慰」同讀。不用地獄恐嚇人，不在喪禮斷言亡者結局。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。","care":"會眾席上有小時候被地獄恐嚇過、至今一想到神就害怕的人，也有親人沒有信主就離世、聽到這一節就心碎的人。不要描寫地獄細節嚇人，不要用火湖管教孩子，也不要在喪禮與探訪中斷言任何已故之人的永遠結局。陪伴哀傷的人，讓他知道審判在一位公義又慈愛的主手裡；對受過宗教恐嚇的人，慢慢帶他看見主的面是可以想念的。"},{"id":"ISS01_9","t":"1:11「配得過所蒙的召」——蒙召是一次的事，還是一生的事？","r":"1:11--12；弗 4:1；腓 1:6","ch":[1],"why":"保羅禱告「願我們的神看你們配得過所蒙的召」。有人會問：我已經信主、已經蒙召了，為甚麼還要求神看我配得過？是不是我做得不夠，就會失去呼召？也有人把「蒙召」只理解為全職事奉的呼召。這一題關係到得救的確據，也關係到每一位信徒在今天的工作與生活裡怎樣回應神。","pos":[["【一】經文問的是甚麼","","<p>「因此，我們常為你們禱告，願我們的神看你們配得過所蒙的召，又用大能成就你們一切所羨慕的良善和一切因信心所做的工夫」（1:11）。原文 ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν——主詞是「神」，動詞 ἀξιώσῃ 是「認為配得、使配得」。問題是：τῆς κλήσεως（所蒙的召）是信主那一刻神的呼召，還是一生的使命？「配得過」是末日的宣告，還是今天的造就？<\/p>"],["末日宣告說：那一天神公開認定","","<p>這一說把 1:11 與 1:5、1:10 連起來：「因此」是接著那日子說的，保羅求的是在主顯現的那一天，神公開宣告這些人配得過他們所蒙的召。κλῆσις 在保羅筆下多指神叫人得救、歸入基督的呼召（如林前 1:26），是一次的、神主動的。<\/p><p><strong>難處：<\/strong>這一說若只看末日，容易忽略 1:11 下半句——神「用大能成就」今天的良善與因信心所做的工夫，那是現在進行的事。<\/p>"],["一生成全說：神一路把人造就成配得","","<p>另一說強調 1:11 下半句：神不只在末日宣告，也在今天用大能成就信徒的善意與工作，把他們造就成與呼召相稱的人——「行事為人就當與蒙召的恩相稱」（弗 4:1）；「那在你們心裡動了善工的，必成全這工」（腓 1:6）。<\/p><p><strong>難處：<\/strong>這一說若講不清楚，會讓人以為呼召要靠自己的表現維持，做得不夠就會被收回，滑向以行為保住救恩。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：蒙召是一次的——神叫人歸入基督，不會收回；配得過所蒙的召是一生的——神用大能在人身上成全，直到那一天公開宣告。兩件事的主詞都是神。<\/strong>1:12 把一切釘在根上：「都照著我們的神並主耶穌基督的恩」。這呼召也不只是全職事奉，而是每一位信徒在家庭、職場、教會裡讓主的名得榮耀。因信稱義與「配得」，本講義回指加拉太書立場二；爭議與信心見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而該給你確據。保羅不是威脅帖撒羅尼迦人「做不好就會失去呼召」，是為他們禱告，求神親自成全。今天在你身上動工的，也是同一位神。<\/p><p>你不必靠自己撐到過勞才配得過；你只要把今天手上因信心做的那一份工交給他，讓他用大能做完。<\/p>"]],"con":[],"say":"本講義的立場：蒙召是一次的，配得過所蒙的召是一生的，兩件事的主詞都是神，「都照著我們的神並主耶穌基督的恩」（1:12）；呼召不只是全職事奉，是每一位信徒今天的生活。本講義回指加拉太書立場二；全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上有常常跌倒、懷疑自己是否真的得救的人，也有服事到筋疲力盡、覺得停下來就會失去呼召的同工。不要用 1:11 製造焦慮，說「你不夠好神就不用你」，也不要把呼召講成只屬於傳道人。對前者，陪他讀 1:12 的「恩」；對後者，提醒他無己不是過勞（回指歌羅西書立場四），讓他休息，必要時協助他尋求專業協助。"},{"id":"ISS02_1","t":"2:1「我們到他那裡聚集」——這是被提嗎？被提在大災難之前、之中、之後？","r":"2:1；帖前 4:16--17；太 24:31","ch":[2],"why":"2:1 的「聚集」ἐπισυναγωγή 與帖前 4:17 的「被提」說的是同一件事，各派都同意；爭的是時間——在大災難之前、之中、忿怒之前，還是之後。在華人教會，這一題常常不只是讀經的差異，而是分教會、分小組、甚至分家人的界線；它也直接牽動一個人聽到末日消息時怕不怕「被留下」。值得把各家讀法和理由攤開，讓弟兄姊妹知道彼此都是弟兄。","pos":[["【一】經文問的是甚麼","","<p>保羅說「論到我們主耶穌基督降臨和我們到他那裡聚集」（2:1），一個冠詞把「主的降臨」與「我們的聚集」綁成同一件事的兩面。前一封信他說過，「以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇」（帖前 4:17）；主耶穌也說，他要差遣使者「將他的選民，從四方，從天這邊到天那邊，都招聚了來」（太 24:31），用的是同一個字根。問題是：這一次聚集，在末日的大災難之前、之中，還是之後？經文本身沒有把這個次序寫成一張表。<\/p>"],["災前被提說：教會在大災難開始以前被提","","<p><strong>誰這樣讀：<\/strong>時代論前千禧年派，十九世紀英國的達秘系統化，經司可福串註本與許多神學院傳開，也是許多華人教會最熟悉的一說。理由是：神「不是預定我們受刑」（帖前 5:9），主應許「保守你免去你的試煉」（啟 3:10）；而且若被提可以隨時發生，警醒才有真正的急迫。有些人也把 2:3 的「離道反教」讀成「離去」、把 2:6–7「攔阻的」讀成聖靈與教會，作為支持。<\/p><p><strong>難處：<\/strong>新約沒有一節明說主會先祕密來一次、七年後再來一次；2:1–3 保羅反而說，那日子以前「必有」某些事先發生，帖撒羅尼迦人是要看見這些事的人。「免去試煉」也可以讀成在試煉中被保守，不一定是離開。<\/p>"],["災中被提與忿怒前被提說：教會經過一部分患難","","<p><strong>誰這樣讀：<\/strong>災中被提是少數前千禧年派學者的讀法，把七年分成兩半，教會在中間被提；忿怒前被提是二十世紀後期一些前千禧年作者提出的，主張教會經過敵基督的逼迫，但在神忿怒的審判傾倒以前被提。兩說都想同時接住兩件事：信徒要面對末後的逼迫（2:3–4），而神「不是預定我們受刑」（帖前 5:9）。<\/p><p><strong>難處：<\/strong>兩說都需要把啟示錄的各段精確對應成時間線，才能定出被提的那一刻；這種精確度，經文本身並沒有給，而劃分「患難」與「忿怒」的界線，各家也說法不一。<\/p>"],["災後被提說：主唯一一次的降臨時，教會被招聚","","<p><strong>誰這樣讀：<\/strong>歷史前千禧年派（初期教父多屬此類，二十世紀賴德等學者重新整理），以及無千禧年派與後千禧年派——後兩派不設七年大災難，但同樣把「聚集」放在主唯一一次、看得見的再來。理由是：2:1 把降臨與聚集綁在一起；太 24:29–31 的招聚在「那些日子的災難一過去」之後；帖前 4:17「相遇」一詞常用於出城迎接君王，再陪他進城。<\/p><p><strong>難處：<\/strong>若教會一定要經過大災難，「時刻警醒、隨時預備」的急迫感要怎樣講，需要更多說明；對正在受苦的信徒，這一說也可能帶來更多害怕，講的人要格外溫柔。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不替教會決定被提的時間，講台只講各派共同的核心：主必親自、看得見地再來；那日子沒有人知道；屬他的人一個都不會被忘記。<\/strong>2:1 保羅先講「到他那裡聚集」，正是為了醫治帖撒羅尼迦人「我們是不是被留下了」的害怕——無論你持哪一說，這一句的安慰都一樣。<\/p><p>本講義的全卷立場見議題「主的日子、被提與大罪人」；馬太福音講義第 24 章已處理大災難與那日子，這裡不重寫。<\/p>"],["【四】這件事該不該影響你的信心","","<p>被提的時間不該。四說的持守者都在福音派之內，都相信主必再來、都盼望與主永遠同在；他們是一起等候主的弟兄姊妹。<\/p><p>該影響你的是那一個字：「聚集」。那一天不是把你丟下的日子，是把你招聚到他那裡的日子。今天你能為那一天做的最好準備，不是選對一張圖表，是不停止和弟兄姊妹聚在一起（來 10:25 同字）。<\/p>"]],"con":[],"say":"本講義的立場：被提四說（災前、災中、忿怒前、災後）公平並陳，各派都是弟兄，本講義不替教會決定；講台只講共同核心——主必親自、看得見地再來，那日子沒有人知道，屬他的人必被招聚到他那裡。本講義的全卷立場見議題「主的日子、被提與大罪人」。","care":"會眾席上可能有從小被「被提電影」嚇到、半夜醒來找不到家人就以為自己被留下的人；也可能有因為被提觀不同而離開原來教會、甚至與家人疏遠的人。不要在講台上嘲笑任何一派，也不要用「你會被留下」來催人決志。對害怕的人，陪他讀 2:1 與 2:13：他是主所愛的，主不會忘記他；對因此受傷的人，先接住他，不急著和他辯論時間表。"},{"id":"ISS02_2","t":"2:2「有靈、有言語、有冒我名的書信」——今天怎樣分辨預言、異象與轉傳的末日訊息？","r":"2:2；帖前 5:20--21；約壹 4:1","ch":[2],"why":"帖撒羅尼迦教會被三種來源推倒：有人說得了啟示、有人傳話、有一封掛了使徒名字的信。今天這三樣都還在，而且傳得更快——自稱看見異象的預言、講台上的推算、群組裡掛著名人名字的轉傳文、甚至電腦生成的假語錄。一間教會若沒有分辨的方法，不是被每一則消息推著走，就是乾脆不信任何屬靈經驗；兩頭都會傷人。","pos":[["【一】經文問的是甚麼","","<p>「無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌」（2:2）。保羅沒有說「靈」一定是假的，他在前一封信說「不要藐視先知的講論」（帖前 5:20），接著說「但要凡事察驗」（帖前 5:21）。問題是：今天自稱「有靈」的預言、異象、夢，和群組裡的轉傳訊息，要用甚麼標準分辨？屬靈經驗的地位在哪裡？<\/p>"],["止息派：預言的恩賜已隨使徒時代結束，新啟示一概存疑","","<p><strong>誰這樣讀：<\/strong>許多改革宗與基要派傳統。理由是：使徒與先知是教會的根基（弗 2:20），根基立好了就不再重立；正典已經完成，今天自稱得了新啟示的人，最好的情況是把自己的感受說成神的話，最壞的情況就是 2:2 的「有靈」。這一派讓教會對末日預言有很高的免疫力。<\/p><p><strong>難處：<\/strong>新約沒有明說預言恩賜何時停止；講得太硬，會澆滅真實的屬靈經驗，也讓在禱告中得著感動的弟兄姊妹不敢說出來。帖前 5:20 的「不要藐視」，仍是對教會說的。<\/p>"],["延續派：預言的恩賜今天仍在，但一律要被察驗","","<p><strong>誰這樣讀：<\/strong>五旬節運動與靈恩運動的教會，以及不少福音派的「開放而謹慎」立場。理由是：聖靈的恩賜是為了建立教會，新約沒有設下期限；保羅一面說不要藐視先知的講論，一面說要察驗；也吩咐「其餘的就當慎思明辨」（林前 14:29）。預言在這一派是次於聖經、要被聖經檢驗的。<\/p><p><strong>難處：<\/strong>在實際的教會生活裡，「我得了啟示」常常比聖經更有分量、更難被質疑；歷史上幾乎每一次預言日期的事件，都出自自稱有靈的人。若沒有清楚的察驗程序，開放很容易變成放任。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不在恩賜止息與延續之間替教會決定，但兩派共同的底線必須守住：任何「靈」、任何「言語」、任何「書信」，都在使徒的教訓之下，都要被察驗。<\/strong>察驗三問：這訊息與聖經的「筆跡」相合嗎（3:17）？它讓我更愛主，還是更害怕？它讓我站穩，還是驚慌？<\/p><p>凡是帶著「已經到了」、「你已經落後」、「趕快轉」口氣的末日訊息，先不轉；凡是推算出日期的，按太 24:36 就已經不合。本講義的全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩派都同意：聖經是最終的準則；聖靈不會說出與聖經相反的話；真從聖靈來的，會把人帶向聖潔、真理與平安（2:13）。<\/p><p>你不必害怕每一則訊息，也不必看輕每一份屬靈經驗。你手上已經有「信上寫的」；拿它來量，就夠了。<\/p>"]],"con":[],"say":"本講義的立場：恩賜止息與延續兩派並陳；共同底線是一切「靈」、「言語」、「書信」都在使徒的教訓之下、都要察驗。分辨三問：與聖經的筆跡相合嗎？讓我更愛主還是更害怕？讓我站穩還是驚慌？本講義的全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。","care":"會眾席上可能有曾經順從一個「預言」而辭職、搬家、借錢或與家人決裂的人，也可能有在禱告中真實得著安慰、卻被說成「靈恩過頭」的人。不要在講台上把任何人說成假先知，也不要嘲笑轉傳訊息的長輩——他們多半出於愛與害怕。對受過傷的人，先陪伴，再慢慢一起讀經；若有人因長期恐懼而失眠、焦慮到影響生活，會後單獨關心，必要時協助他尋求專業協助。"},{"id":"ISS02_3","t":"2:3「離道反教」——大規模的背道，還是教會的「離去」？","r":"2:3；太 24:10--12；徒 21:21","ch":[2],"why":"ἡ ἀποστασία 有冠詞，是帖撒羅尼迦人聽過的「那一件」事。它是教會內的大規模背道、世界對神的公然叛逆，還是（少數人主張的）教會從地上「離去」＝被提？這一題牽動整個被提時間的論證，也牽動我們怎樣看待今天教會的冷淡與離開——是把它當成末日倒數的證據，還是當成需要牧養的人。","pos":[["【一】經文問的是甚麼","","<p>「因為那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來」（2:3）。和合本「離道反教」四個字譯的是一個名詞 ἀποστασία，字根是「站開、離開」。這個字在新約另一次出現，是有人說保羅教導猶太人「離棄摩西」（徒 21:21）。問題是：保羅說的「那離開」，離開的是信仰、是神的權柄，還是地面？<\/p>"],["教會內大規模的背道","","<p><strong>誰這樣讀：<\/strong>多數教父、改教家與今天大多數釋經者。理由是：ἀποστασία 在聖經希臘文中常指宗教上的背離；主耶穌在橄欖山也預言，「只因不法的事增多，許多人的愛心才漸漸冷淡了」（太 24:12），又說那時「必有許多人跌倒」。2:9–10 的「虛假的奇事」與「不義的詭詐」，也指向信仰群體內部被迷惑。<\/p><p><strong>難處：<\/strong>每一代教會都有人離開，講台很容易把今天看到的冷淡直接說成「末日背道已經到了」，又落回 2:2 的「已經到了」；經文說的是一件有冠詞、會清楚顯明的事，不是隨時可以對號入座的現象。<\/p>"],["世界對神公然的叛逆","","<p><strong>誰這樣讀：<\/strong>許多近代學者，常與前一說兼採。理由是：這個字在七十士譯本與當時的希臘文中，常指政治或宗教的叛亂，例如以色列人背叛耶和華；而緊接著的大罪人「抵擋主，高抬自己」（2:4），是一場公開向神宣戰的叛逆。照這讀法，「離道反教」不只發生在教會裡，是整個世界秩序對神的反叛，大罪人是它的頂點。<\/p><p><strong>難處：<\/strong>若完全不包括信仰群體內部，2:10「不領受愛真理的心」的警告就少了對教會的分量；所以多數持這說的人，也同時承認教會內會有人隨著叛逆而去。<\/p>"],["教會的「離去」＝被提","","<p><strong>誰這樣讀：<\/strong>少數時代論前千禧年派作者，二十世紀中葉以後提出。理由是：字根有「離開」之意，有冠詞的「那離去」可以指 2:1 剛提到的「聚集」——教會先被提離開，大罪人才顯露；這也與「攔阻的」是聖靈與教會的讀法相連。<\/p><p><strong>難處：<\/strong>ἀποστασία 在新約、七十士譯本與當時文獻中，幾乎都指背叛、背離，沒有用來指「被接走」的例子；連多數時代論學者也不採這一說。本講義列出，是因為它在華人教會的講台上確實有人講。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義取前兩說合讀：「離道反教」是那日子以前一場清楚顯明的背叛——包括信仰群體內的背道與世界對神的公然叛逆；不採「離去＝被提」說。<\/strong>理由是這個字在聖經中一貫的用法，以及 2:3–4 上下文的「抵擋」、「高抬」。<\/p><p>但保羅給的是次序，不是日期；講台不把今天任何現象指認為「那背道已經到了」。本講義的全卷立場見議題「主的日子、被提與大罪人」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。三說都同意：那日子以前，信仰的路不會越來越容易；但主在掌權，2:13 的「但我們」仍然站在那裡。<\/p><p>對你今天最要緊的，不是替這個字定案，是問自己：我有沒有「愛真理的心」（2:10）？身邊有沒有正在漸漸冷淡的人，需要我去找他、陪他？看見人離開，該做的是去找他，不是拿他當末日的證據。<\/p>"]],"con":[],"say":"本講義的立場：「離道反教」取背道與叛逆合讀，是那日子以前一場清楚顯明的背叛；「離去＝被提」說陳列，不採用。保羅給的是次序，不是日期，不把今天任何現象對號入座。本講義的全卷立場見議題「主的日子、被提與大罪人」。","care":"會眾席上可能有家人、配偶或兒女正在離開信仰的人，聽到「末日必有背道」會更絕望，以為那個人已經被定了；也可能有自己正在懷疑、快要走不下去的人。不要把任何一個離開的人說成「末日背道的證據」，也不要在講台上點名哪一間教會、哪一個宗派已經背道。陪那個家人繼續禱告、繼續愛；對正在懷疑的人說：還在掙扎，就是門還開著。"},{"id":"ISS02_4","t":"2:3--4「大罪人」——是一個人、一個體制，還是一再出現的原型？","r":"2:3--5；2:8；約壹 2:18；但 11:36","ch":[2],"why":"這是本章最容易被拿來「替他找一張臉」的一題。兩千年來，大罪人被指認成許多君王、領袖、宗教與發明，每一次都錯了，每一次都傷了人；今天的群組裡仍然常常有人貼上新的名字。把各家讀法和歷史攤開，正是為了讓人不再急著指認，而是回到經文要我們看見的東西。","pos":[["【一】經文問的是甚麼","","<p>保羅說那日子以前，「並有那大罪人，就是沉淪之子，顯露出來」（2:3）。和合本「大罪人」跟的是拜占庭傳統的 ἁμαρτίας（罪），較早的抄本作 ἀνομίας（不法），所以和合本到 2:8 又譯作「不法的人」——兩個名字，指同一位。他「抵擋主，高抬自己……甚至坐在神的殿裡，自稱是神」（2:4）。問題是：他是末日的一個人、歷史上一再出現的一種人，還是一個體制？<\/p>"],["末日一位具體的人物","","<p><strong>誰這樣讀：<\/strong>愛任紐、希坡律陀以來的多數教父，以及今天多數前千禧年派。理由是：經文用的是單數、有冠詞的「那人」，他會「顯露」、會被主「用口中的氣滅絕」（2:8），像是一個在歷史終點出現的真實位格；約翰也說「那敵基督的要來」（約壹 2:18 上半）。<\/p><p><strong>難處：<\/strong>這一說最容易讓人去找「現在是誰」；歷史上幾乎每一個時代都有人把當時的強人說成他，結果全都錯了。經文給的是品格與結局，不是身分證。<\/p>"],["歷史上一再出現的原型","","<p><strong>誰這樣讀：<\/strong>部分歷史批判學者、許多無千禧年派，以及把這段讀成主後一世紀已應驗的「過去派」。理由是：保羅說「那不法的隱意已經發動」（2:7）；在他以前，安提阿古四世曾在耶路撒冷聖殿設立異教祭壇（這使我們想起但 11:36），保羅寫信前十年，皇帝卡利古拉下令把自己的像立進聖殿；之後還有尼祿。約翰也說「現在已經有好些敵基督的出來了」（約壹 2:18）。<\/p><p><strong>難處：<\/strong>若只是原型，2:8 主「用降臨的榮光廢掉他」就很難解釋——經文把他的結局與主的再來綁在一起，像是一個最後的人物。<\/p>"],["一個體制","","<p><strong>誰這樣讀：<\/strong>宗教改革時期，路德、加爾文等改教家，以及後來部分改革宗信條，曾把大罪人指認為教皇制度，理由是「坐在神的殿裡」被讀成在教會裡篡奪基督的位子。<strong>這是一段歷史事實，本講義只陳列，不採用，也不轉述為對天主教弟兄姊妹的攻擊。<\/strong>這段歷史也提醒我們：連最偉大的釋經者，在逼迫與衝突中也會把經文讀成對手的畫像。<\/p><p><strong>難處：<\/strong>經文明說他「自稱是神」，而且是一個「人」、會被主滅絕；把它讀成一個延續多代的體制，與經文的單數位格不合。今天的天主教會與改教後的教會，已在許多地方彼此承認為主內弟兄。<\/p>"],["原型一再出現，最後有一位總結者","","<p><strong>誰這樣讀：<\/strong>許多福音派釋經者，把前兩說合起來讀。理由是：約壹 2:18 同時說「那敵基督的要來」和「現在已經有好些敵基督的出來了」；2:7 的「已經發動」與 2:8 的「必顯露」也並存。不法的原理在每一個世代都有化身，到末後有一位把它推到頂點，然後被主一口氣結束。<\/p><p><strong>難處：<\/strong>這一說最周全，卻也最容易被誤用成「現在的這一位就是最後那一位的前身」；說到「最後一位」是誰，經文仍然沒有給名字。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義取「原型一再出現、最後有一位總結者」的讀法，同時堅守一條線：不點名、不對號入座。<\/strong>任何現存的人物、政權、宗教、教派、科技，都不在講台上被指認為大罪人；歷史上每一次的指認都錯了，而每一次都傷了人。<\/p><p>2:4 在本講義是一面鏡子：抵擋、高抬、坐下、自稱——這條梯子不只在新聞裡，也在每一個不肯讓神作主的心裡。本講義的全卷立場見議題「主的日子、被提與大罪人」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：邪惡會有一個頂點，而那個頂點不是故事的結局——主耶穌一口氣就廢掉他（2:8）。你不必知道他是誰，才能平安。<\/p><p>該影響你的是另一件事：你最想替大罪人找臉的時候，正是最需要照鏡子的時候。「我們不知道攔阻的是誰，但我們知道誰掌權。」<\/p>"]],"con":[],"say":"本講義的立場：大罪人取「原型一再出現、最後有一位總結者」的讀法，各家並陳；改教家指認教皇制度只陳列歷史，不採用。不點名、不對號入座——任何現存的人物、政權、宗教、科技都不在講台上被指認；2:4 先照自己。本講義的全卷立場見議題「主的日子、被提與大罪人」。","care":"會眾席上可能有被「某某就是敵基督」的訊息嚇到不敢去打疫苗、不敢用某種新科技、不敢讓孩子上學的長輩或家長，也可能有來自天主教家庭、聽到「大罪人」就覺得家人被攻擊的人。不要在講台上替大罪人填任何名字，也不要嘲笑害怕的人。陪害怕的人讀 2:8：結局已經寫好；陪來自天主教背景的人看見，本講義陳列那段歷史，是為了避免重蹈指認的錯，不是為了攻擊他的家人。"},{"id":"ISS02_5","t":"2:4「坐在神的殿裡」——耶路撒冷會再建聖殿嗎？","r":"2:4；太 24:15；林前 3:16；結 28:2","ch":[2],"why":"「神的殿」是一座將來重建的耶路撒冷聖殿、一個比喻，還是教會？這一題常常被連到中東的局勢與新聞，讓人把每一則有關耶路撒冷的消息都當成末日倒數；也有人因此把信仰和某一方的政治立場綁在一起。把讀法攤開，可以讓會眾不必靠新聞來決定自己要不要驚慌。","pos":[["【一】經文問的是甚麼","","<p>「甚至坐在神的殿裡，自稱是神」（2:4）。「殿」原文 ναός，指內殿，不是整個聖殿院落；「坐」是王與審判者的姿勢。保羅寫信時，耶路撒冷的第二聖殿仍然存在，主後 70 年才被毀。問題是：保羅指的是一座實體的聖殿（當時的或將來重建的），還是用聖殿的語言畫出「坐上神的位子」，還是指教會？<\/p>"],["將來重建的耶路撒冷聖殿","","<p><strong>誰這樣讀：<\/strong>多數時代論前千禧年派，以及部分歷史前千禧年派。理由是：ναός 在字面上就是聖殿；主耶穌說「你們看見先知但以理所說的『那行毀壞可憎的』站在聖地」（太 24:15）；既然聖殿已於主後 70 年被毀，這一節要應驗，就需要將來重建一座聖殿。<\/p><p><strong>難處：<\/strong>經文本身沒有說聖殿會被重建；這一說也很容易讓人把耶路撒冷的每一則新聞當成末日的計時器，甚至把對某一方的政治支持說成信仰的必然，這已經越過了經文。<\/p>"],["比喻：坐上神的位子、篡奪敬拜","","<p><strong>誰這樣讀：<\/strong>許多改革宗與歷史釋經者；也有學者讀為保羅借用當時聖殿的意象（卡利古拉要把像立進聖殿的事件仍記憶猶新）。理由是：舊約已經用同樣的語言描寫狂傲的君王——「我是神；我在海中坐神之位」（結 28:2），推羅王並沒有真的坐進聖殿；「坐在神的殿裡」是一個完整的畫面：受造的人坐上只屬於神的寶座。<\/p><p><strong>難處：<\/strong>若完全只是比喻，太 24:15「站在聖地」的具體性就較難解釋；這一說也需要說明為甚麼保羅要用這麼具體的語言。<\/p>"],["教會：在神的子民中間篡位","","<p><strong>誰這樣讀：<\/strong>部分教父與改教家。理由是：保羅在別處用同一個 ναός 指信徒群體——「豈不知你們是神的殿，神的靈住在你們裡頭嗎」（林前 3:16）；大罪人坐在神的殿裡，就是在神的子民中間，取代基督的位置，接受只屬於神的順服。<\/p><p><strong>難處：<\/strong>這一讀在歷史上曾被用來指認教會裡的某一個體制或領袖（見議題「2:3--4『大罪人』」），一不小心就成了教會內部互相攻擊的武器；但它也提醒我們，篡位不一定在遠方，也可能在講台上。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不定於一說。三種讀法共同的核心是：一個受造的人，坐上了只屬於神的位子。<\/strong>講台講這個核心，不把中東的任何新聞、任何國家或政權的動向，講成末日倒數的證據（紅線一）。<\/p><p>三種讀法都有一個共同的警告：神的殿是神坐的地方。今天我們是神的殿，那把椅子在我們裡面該給誰坐？本講義的全卷立場見議題「主的日子、被提與大罪人」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。無論殿在哪裡，2:8 都說得一樣清楚：坐上那個位子的人，主耶穌一口氣就廢掉他。你不必盯著耶路撒冷的新聞，才知道誰是王。<\/p><p>你要盯著的，是自己心裡那個殿：今天坐在中間的，是主，還是我？<\/p>"]],"con":[],"say":"本講義的立場：「殿」的三種讀法（將來重建的聖殿、坐上神位的比喻、教會）並陳，不定於一說；共同核心是受造的人坐上只屬於神的位子。不把任何國家、政權或新聞講成末日倒數。本講義的全卷立場見議題「主的日子、被提與大罪人」。","care":"會眾席上可能有人對中東局勢有強烈的政治立場，也可能有人在那一帶有親友、正為戰火擔心。不要把任何一方的苦難講成「預言應驗的好消息」，也不要把政治立場說成信仰的試金石。對擔心親友的人，先為他們的平安禱告；對熱衷新聞解碼的人，溫和地把他帶回 2:8 與 2:15：主掌權，我們站穩。"},{"id":"ISS02_6","t":"2:6--7「攔阻的」——羅馬帝國、政府法治、聖靈與教會、福音，還是神自己？","r":"2:6--8；羅 13:1--4；但 12:1","ch":[2],"why":"奧古斯丁早在第五世紀就坦白說，他不知道保羅在這裡說的是甚麼。可是今天常有人說得十分肯定，並把答案接到被提時間、政局與新聞上。2:6 中性的「那攔阻的」、2:7 陽性的「那攔阻的」，各家讀法相差極大；把它們並排擺出來，承認我們不知道，反而是對抗末日恐慌最好的方法。","pos":[["【一】經文問的是甚麼","","<p>「現在你們也知道，那攔阻他的是甚麼，是叫他到了的時候才可以顯露」（2:6）；「只是現在有一個攔阻的，等到那攔阻的被除去」（2:7）。2:6 是中性的 τὸ κατέχον（一樣東西），2:7 換成陽性的 ὁ κατέχων（一個人）。保羅說「你們也知道」，因為他「還在你們那裡的時候」講過（2:5）。問題是：攔住不法者、讓他暫時不能顯露的，是甚麼、是誰？<\/p>"],["羅馬帝國與皇帝","","<p><strong>誰這樣讀：<\/strong>特土良、屈梭多模等多數教父，是最早、最常見的讀法。理由是：中性指羅馬帝國的秩序，陽性指在位的皇帝；保羅不明寫，可能正是因為在羅馬治下寫「帝國將被除去」太危險。羅馬的法律也確實多次保護了保羅（徒 18:12–17）。<\/p><p><strong>難處：<\/strong>羅馬帝國早已滅亡，大罪人卻沒有隨即顯露；持這說的人需要再延伸成「羅馬式的秩序」，就與下一說合流了。<\/p>"],["政府與法治的普遍原則","","<p><strong>誰這樣讀：<\/strong>許多改革宗與近代釋經者，把羅馬的讀法擴大到一切掌權者對罪惡的約束。理由是：保羅說掌權者「是神的用人，是伸冤的，刑罰那作惡的」（羅 13:4）；法律與秩序本身就是神普遍恩典裡攔阻不法的力量，不法的人（ὁ ἄνομος）正是要打破一切法。<\/p><p><strong>難處：<\/strong>政府本身也常常是不法的來源；而且「法治被除去」要怎樣具體發生，經文沒有說，講的人很容易把某一個國家的政局讀進去。<\/p>"],["聖靈，或聖靈藉著教會","","<p><strong>誰這樣讀：<\/strong>多數主張災前被提的時代論前千禧年派。理由是：中性對應希臘文中性的「靈」（πνεῦμα），陽性指聖靈的位格；只有神的靈有能力攔住撒但的運行；聖靈連同教會被「除去」，就是教會被提，然後大罪人才顯露。<\/p><p><strong>難處：<\/strong>聖靈無所不在，經文其他地方沒有說他會從世上被「除去」；而且保羅若指聖靈，為何不直接寫出，反而說得如此隱晦？這一讀也大大倚賴先接受災前被提的架構。<\/p>"],["福音的傳揚與保羅本人；天使長米迦勒","","<p><strong>誰這樣讀：<\/strong>加爾文讀作福音的傳揚——福音必須先傳遍萬國（這使我們想起太 24:14）；二十世紀庫爾曼等學者讀作宣教的事工，陽性指那位宣教的使徒。另有部分近代學者讀作天使長米迦勒：「保佑你本國之民的天使長米迦勒必站起來」（但 12:1），他在但以理書中正是攔阻敵對勢力的那一位。<\/p><p><strong>難處：<\/strong>保羅不太可能說自己是那個要「被除去」才讓大罪人顯露的人；米迦勒說在帖撒羅尼迦後書本身沒有任何提示，完全倚賴但以理書的背景。<\/p>"],["神自己的主權","","<p><strong>誰這樣讀：<\/strong>部分釋經者，常與其他讀法並用。理由是：不論攔阻的工具是甚麼，終極的攔阻者是神；2:6 的「顯露」是被動語態，「到了的時候」是被指定的時候——那人出場的時間不由他自己定。這也與 2:11 神的主權、2:13 神的揀選一脈相承。<\/p><p><strong>難處：<\/strong>若是神自己，「被除去」的說法很難套在神身上；所以持這說的人，多半說神藉著某種工具攔阻，工具會被挪開，神不會。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不定於一說，誠實地承認：帖撒羅尼迦人知道，因為保羅當面講過；我們不知道，因為我們手上少了那一頁。<\/strong>經文說得清楚的，是另一件事：邪惡被攔著，它出場的時候被指定；主耶穌用口中的氣滅絕他（2:8）。<\/p><p>講台的落點一句：我們不知道攔阻的是誰，但我們知道誰掌權。本講義的全卷立場見議題「主的日子、被提與大罪人」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。「隱祕的事是屬耶和華我們神的；惟有明顯的事是永遠屬我們和我們子孫的」（申 29:29）。攔阻的名字是隱祕的事；主掌權是明顯的事。<\/p><p>承認「不知道」不是信心的失敗，是對經文的誠實。你不必知道誰在攔，才睡得著；你只要認識那一位定時候的主。<\/p>"]],"con":[],"say":"本講義的立場：「攔阻的」六種讀法（羅馬帝國與皇帝、政府法治、聖靈與教會、福音與保羅、米迦勒、神的主權）並陳，不定於一說——帖撒羅尼迦人知道，我們不知道。我們不知道攔阻的是誰，但我們知道誰掌權。本講義的全卷立場見議題「主的日子、被提與大罪人」。","care":"會眾席上可能有人每逢政局變動、法治動盪，就以為「攔阻的被除去了」，焦慮到睡不著；也可能有人用「攔阻的是政府」來為某一個政權背書，或反過來把某一個政權說成要被除去的對象。不要把任何現存的政府、國家或領袖講進這兩節。對焦慮的人，陪他讀 2:6 的「到了的時候」：時候在神手裡；若焦慮已影響生活與睡眠，會後單獨關心，必要時協助他尋求專業協助。"},{"id":"ISS02_7","t":"2:11「神就給他們一個生發錯誤的心」——神叫人信謊言嗎？","r":"2:9--12；羅 1:24--28；提前 2:4","ch":[2],"why":"這是全章最容易被講歪的一節：有人用它說神隨意叫某些人被騙、沉淪；有人用它論斷離開教會的人「神已經任憑他了」；也有人因此懷疑神是不是邪惡的源頭。這一題直接關係到神的性情，也關係到每一位正在懷疑、正在掙扎、或有家人離開信仰的人。","pos":[["【一】經文問的是甚麼","","<p>「故此，神就給他們一個生發錯誤的心，叫他們信從虛謊」（2:11）。「故此」指回前一節：「因他們不領受愛真理的心，使他們得救」（2:10）。2:11 的「生發錯誤的心」原文 ἐνέργειαν πλάνης，與 2:9「撒但的運動」是同一個字。問題是：神是主動把迷惑送給人，還是任憑人得著他自己所選的？神會叫一個本來願意愛真理的人信謊言嗎？<\/p>"],["司法性的審判：神主動送去迷惑，作為對拒絕真理的判決","","<p><strong>誰這樣讀：<\/strong>許多改革宗釋經者。理由是：經文的動詞是「送去」（πέμπει），主詞是神；神的主權連迷惑也管著，這是對已經拒絕真理之人的公義判決——像法老一再硬著心之後，經上說神使他的心剛硬。這一讀強調神沒有失去掌管，連撒但的運行也在他的審判之下。<\/p><p><strong>難處：<\/strong>若講得不小心，會讓人聽成神任意預先決定某些人被騙；必須同時講 2:10 在先，以及「他願意萬人得救，明白真道」（提前 2:4）。<\/p>"],["任憑：神收回攔阻，把人自己選的交還給他","","<p><strong>誰這樣讀：<\/strong>許多循道衛理宗與福音派釋經者，也是屈梭多模等教父的方向。理由是：這與羅馬書的語言幾乎一樣——人「將神的真實變為虛謊」（羅 1:25），於是「神任憑他們」（羅 1:24）。神不是製造謊言的那一位，而是尊重人一再的選擇，讓他得到他要的。<\/p><p><strong>難處：<\/strong>這一讀容易把「送去」講得太輕，好像神只是旁觀；經文確實把主詞給了神，神的審判是真實的，不只是自然的後果。<\/p>"],["容許說：神只是容許撒但迷惑人","","<p><strong>誰這樣讀：<\/strong>部分教父與近代釋經者，常與「任憑說」合流。理由是：2:9 明說迷惑是「照撒但的運動」；聖經有時把神容許的事說成神做的事，是希伯來式的說法，強調神在一切之上掌權，而不是說神是惡的源頭。<\/p><p><strong>難處：<\/strong>2:11 刻意用了與 2:9 同一個字，卻把主詞換成神；若只說「容許」，就把保羅刻意的對照抹平了。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的讀法：2:11 是神對人一再拒絕真理的公義回應，次序鎖在 2:10 之後——先是人「不領受愛真理的心」，然後才是神把人自己選的交還給他。<\/strong>神不是隨意叫人沉淪；那一份愛真理的心，原本就是要「使他們得救」。司法說與任憑說都承認這個次序，本講義兩者兼取其核心。<\/p><p>2:11 不用來論斷任何一位離開教會或正在懷疑的人（紅線五）。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該叫你害怕神，該叫你認真看待真理。神「不願有一人沉淪，乃願人人都悔改」（彼後 3:9）；2:13 緊接著說的，是神揀選、呼召、要人得著榮光。<\/p><p>如果你正在懷疑、正在掙扎，這兩節對你說的不是「你完了」，是「門還開著」。還在掙扎的人，正是還沒有關門的人。<\/p>"]],"con":[],"say":"本講義的立場：2:11 是神對人拒絕真理的公義回應，次序在 2:10「不領受愛真理的心」之後；神的原意是「使他們得救」，不是隨意叫人沉淪。不用 2:11 論斷離開教會或正在懷疑的人。本講義的全卷立場見議題「神的公義審判與永遠沉淪」。","care":"會眾席上可能有兒女、配偶或父母已經離開信仰的人，聽到這一節會害怕「神已經放棄他了」；也可能有自己正陷在懷疑裡、不敢說出口的人。不要說「他走了，就是神任憑他了」，也不要用這一節嚇正在提問的人。陪那位家人繼續為所愛的人禱告；對正在懷疑的人，讓他知道可以把問題帶來，教會不怕他問。若懷疑伴隨長期的無望感，會後單獨關心，必要時協助他尋求專業協助。"},{"id":"ISS02_8","t":"2:13「他從起初揀選了你們」——「從起初」還是「初熟的果子」？揀選與人的責任？","r":"2:13--14；弗 1:4；羅 16:5","ch":[2],"why":"2:13 有一個只差一個字母的經文異文：和合本跟的是 ἀπʼ ἀρχῆς「從起初」，SBLGNT 與 NA28 作 ἀπαρχήν「初熟的果子」。同一節又把神的揀選與人的相信寫在一起，碰到教會兩千年的揀選與自由意志之爭。這一題關係到一個受驚的人能不能確信自己屬主，也關係到「揀選」會不會被用來分出自己人和外人。","pos":[["【一】經文問的是甚麼","","<p>「主所愛的弟兄們哪，我們本該常為你們感謝神；因為他從起初揀選了你們，叫你們因信真道，又被聖靈感動，成為聖潔，能以得救」（2:13）。古抄本以大寫字母連寫，ΑΠΑΡΧΗΝ 與 ΑΠΑΡΧΗΣ 只差最後一個字母。問題有兩層：第一，原文是「從起初」還是「初熟的果子」？第二，神的揀選與人「因信真道」的責任怎樣同時成立？<\/p>"],["異文：「從起初」（和合本所跟）","","<p><strong>誰這樣讀：<\/strong>Treg、RP 與 NIV 等，和合本「從起初」跟的是這一讀。理由是：全句在講揀選，「從起初」順理成章，這使我們想起「從創立世界以前，在基督裡揀選了我們」（弗 1:4）；而且帖撒羅尼迦人並不是馬其頓第一批信主的人，腓立比在先，說他們是「初熟的果子」似乎不合。<\/p><p><strong>難處：<\/strong>保羅講永恆的揀選，習慣說「創立世界以前」，「從起初」這種說法在他的書信裡沒有別的例子；而「初熟的果子」卻是他常用的字。<\/p>"],["異文：「初熟的果子」（SBLGNT、NA28）","","<p><strong>誰這樣讀：<\/strong>SBLGNT、NA28、WH 與許多近代學者。理由是：保羅常用 ἀπαρχή，例如以拜尼土「是歸基督初結的果子」（羅 16:5）；「初熟的果子」不一定是時間上的第一批，也可以是一地收成的開端與保證——一間才建立幾個星期、被逼迫的小教會，竟是神在那座城裡收成的頭一份。<\/p><p><strong>難處：<\/strong>「揀選你們作初熟的果子，得救」在句法上稍顯擁擠；抄本證據兩邊都有份量，學者至今仍有分歧。<\/p>"],["神學：揀選與人的責任——改革宗與循道衛理宗的讀法","","<p><strong>誰這樣讀：<\/strong>改革宗傳統讀成無條件的揀選——神從起初揀選，人的相信是揀選的果子；循道衛理宗與許多阿米念傳統讀成預知的揀選或在基督裡的群體揀選——神揀選「在基督裡的人」，人藉著信進入。兩派都抓住這一節的同一件事：揀選與「因信真道」寫在同一句裡，下一節還有「藉我們所傳的福音召你們」（2:14）。<\/p><p><strong>難處：<\/strong>兩派都要面對經文沒有替我們調和的張力；保羅自己並不覺得需要調和，他用揀選來感謝、安慰，不用來推算誰在誰不在。<\/p>"],["【三】本講義站在哪裡","","<p><strong>異文：本講義略傾向 SBLGNT 的「初熟的果子」，但照和合本「從起初」講不算錯——兩個意思都在保羅的神學裡，安慰一樣深。<\/strong>揀選與人的責任：回指以弗所書第 1 章議題，本章不另立說法。<\/p><p>本章的落點是保羅用揀選的方式：放在「但我們」之後，對著一間受驚的教會說「主所愛的」——揀選是錨，不是籬笆。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論「從起初」或「初熟的果子」，不論你屬哪一個神學傳統，這一節都說：在一切消息出現以前，神已經愛了你、選了你、呼召了你。<\/p><p>你不必先解開揀選與自由的奧祕，才能確信自己屬主。主耶穌說：「到我這裡來的，我總不丟棄他」（約 6:37）。<\/p>"]],"con":[],"say":"本講義的立場：2:13 異文並陳，略傾向 SBLGNT「初熟的果子」，照和合本「從起初」講不算錯；揀選與人的責任回指以弗所書第 1 章議題。揀選在本章是給受驚之人的錨，不是畫線排除人的籬笆。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有人長期擔心「我是不是被揀選的」，一聽到揀選就焦慮到失眠；也可能有人因為家人還沒信主，害怕他們「不在名單上」。不要用揀選來推算誰得救、誰不得救，也不要用它嚇唬人。陪焦慮的人讀 2:13–14：揀選與「藉福音呼召」連在一起，他今天能聽見福音、還在意這件事，本身就是神在呼召的記號；對擔心家人的人，鼓勵他繼續為家人禱告、傳福音。"},{"id":"ISS02_9","t":"2:15「口傳的……信上寫的……都要堅守」——聖傳與惟獨聖經？","r":"2:15；3:6；提後 3:16；太 15:3","ch":[2],"why":"2:15「凡所領受的教訓」原文是 παραδόσεις（傳下來的東西），保羅分兩路：口傳的、信上寫的。今天「口傳的」在哪裡？天主教與東正教以此說明聖傳與聖經並列，改教傳統主張使徒的教訓已寫進新約。另一方面，在許多教會裡，這一節也被拿來要求會眾對規矩、傳統或領袖的話照單全收——這一層的誤用，往往比宗派之爭更直接傷人。","pos":[["【一】經文問的是甚麼","","<p>「所以，弟兄們，你們要站立得穩，凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守」（2:15）。「教訓」原文 παραδόσεις，同一個字在主耶穌口中是負面的：「你們為甚麼因著你們的遺傳犯神的誡命呢」（太 15:3）。分別在源頭：是使徒交付的，還是人加上的。問題是：使徒「口傳的」教訓今天在哪裡？誰有權柄說這就是使徒的教訓？<\/p>"],["聖傳：使徒的口傳教訓延續在教會的聖傳裡，與聖經並列","","<p><strong>誰這樣讀：<\/strong>天主教會（如梵蒂岡第二次大公會議《天主的啟示》教義憲章所述，聖傳與聖經構成同一個信仰寶庫）與東正教會。理由是：2:15 明說有「口傳的」與「信上寫的」兩路；新約正典本身也是教會在聖傳中辨認出來的；使徒的口頭教導，透過主教的傳承、禮儀與大公會議延續下來。<\/p><p><strong>難處：<\/strong>2:15 的「口傳的」是帖撒羅尼迦人親耳從保羅聽到的，可以拿保羅本人核對（3:17 的筆跡）；後世的傳統是否就是當年那份口傳，需要別的論證，而歷代傳統之間也有彼此不一致之處。<\/p>"],["惟獨聖經：使徒的口傳教訓已經寫進新約，聖經是最終權威","","<p><strong>誰這樣讀：<\/strong>宗教改革傳統，今天的福音派大多持守。理由是：使徒口傳與書寫的是同一個福音，使徒離世後，可以核對的只剩寫下來的；「聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的」（提後 3:16）。改教家並沒有丟掉信經與教父，「惟獨聖經」是說傳統有價值，但在聖經之下、要被聖經檢驗。<\/p><p><strong>難處：<\/strong>若把「惟獨聖經」講成「只要我和我的聖經」，就丟掉了歷代教會的智慧，也容易讓每一個人的解釋都自成權威，或讓某一位領袖的解釋悄悄變成新的傳統。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在改教「惟獨聖經」的立場：使徒的教訓今天在聖經裡；同時尊重持守聖傳的天主教與東正教弟兄姊妹，不在講台上攻擊。<\/strong><\/p><p>本講義要特別守住另一條線：2:15 的教訓是使徒的教訓，不是教會的規矩、宗派的傳統，也不是牧者或任何領袖個人的話；不用「都要堅守」壓制提問與察驗（紅線八）。保羅離開帖撒羅尼迦的下一站，庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11）。本講義的全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩個傳統都同意：使徒交付的福音是信仰的根基；耶穌基督死而復活、必再來，是不可讓的。爭的是這份交付今天藉著甚麼途徑到我們手上。<\/p><p>對你今天最要緊的，是 2:15 那個動作：抓緊。不是抓緊最新的消息，也不是抓緊某一個人的話，是抓緊已經交付下來、你可以打開來核對的那一本書。<\/p>"]],"con":[],"say":"本講義的立場：站在改教「惟獨聖經」的立場——使徒的教訓今天在聖經裡，同時尊重持守聖傳的弟兄姊妹；2:15 的教訓不等於教會規矩、宗派傳統或領袖的話，不用「堅守」壓制提問。本講義的全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。","care":"會眾席上可能有來自天主教家庭的人、與天主教徒結婚的人，聽到聖傳與惟獨聖經會覺得被迫在家人和信仰之間選邊；也可能有曾在教會裡因為提問被說成「不順服」「不堅守教訓」而受傷離開的人。不要在講台上嘲諷任何宗派，也不要用 2:15 要求會眾不准問。對前者，陪他看見兩邊共同持守的福音；對後者，向他道歉，並讓他知道在這裡可以問。"},{"id":"ISS03_1","t":"3:1「好叫主的道理快快行開」——為宣教士與牧者代禱要禱告甚麼？","r":"3:1--2；3:3","ch":[3],"why":"教會的代禱單上，為傳道人與宣教士求的，多半是身體健康、出入平安、經費充足。這些都該求；可是保羅在一封寫給受逼迫教會的信裡，先求的竟是「道」能跑起來。這一題關係到會眾怎樣看待自己和宣教團隊的關係：我們是在為一個人的生活禱告，還是在一同參與一場福音的奔跑？","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，我還有話說：請你們為我們禱告，好叫主的道理快快行開，得著榮耀，正如在你們中間一樣，」（3:1）保羅的請求有兩個 ἵνα（hina）子句：先是主的道理 τρέχῃ καὶ δοξάζηται（trechē kai doxazētai），「跑起來、得著榮耀」；再是「也叫我們脫離無理之惡人的手」（3:2）。問題是：這兩個請求的次序有沒有意義？今天為傳道人禱告，應該照這個次序嗎？<\/p>"],["福音優先說（先求道，再求人）","","<p>這個讀法強調次序：保羅把道的奔跑放在自己的安全前面，因為他知道自己只是送信的人。今天的代禱也應當先求福音在那個城市、那個族群裡跑得開，求人心被打開、求真道得著榮耀，再為工人的保護與需要禱告。這樣的禱告讓會眾和宣教士站在同一條跑道上。<\/p><p><strong>難處：<\/strong>若只講次序，容易讓人以為為傳道人的身體、家庭、情緒禱告比較不屬靈；保羅自己在第二個請求裡就為自身的安全求了，而且他在別處也常提到自己的軟弱與需要。<\/p>"],["整全代禱說（道與人同等重要）","","<p>這個讀法指出兩個 ἵνα 是並列的：道跑得開，和工人被保護，在保羅心裡是同一件事——被逼迫的工人跑不動，道也就被攔阻。所以代禱要整全：為福音的果效，也為傳道人的家庭、健康、心理、安全與經費，因為一個被耗盡的工人，最後也會讓道停下來。<\/p><p><strong>難處：<\/strong>這個讀法若不小心，會讓代禱單又回到只有「平安健康」的清單，失去保羅那種把眼光放在福音本身的焦點；也可能讓會眾只關心傳道人過得好不好，卻不關心他所做的工有沒有在前進。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義照保羅的次序，但不取消第二個請求。<\/strong>先求主的道理快快行開、得著榮耀，再求工人脫離無理之惡人的手；兩者都要，次序幫我們把焦點放對。最重要的是第 3 節的轉折：「但主是信實的」（3:3）——保羅一說完人的惡，就把眼睛轉向主，代禱的人也一樣，不是把焦點放在攔阻有多大，而是放在主的信實。<\/p><p>實際的作法：每一封宣教士代禱信，先問「福音在那裡怎樣前進」，再問「你和家人需要甚麼」；也讓傳道人知道，他可以誠實寫出自己的軟弱。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這不是教義的分歧，是代禱的焦點。不論你先求哪一樣，主都聽禱告；可是當我們學會先求道跑起來，我們會發現自己不只是宣教士的支持者，也是福音奔跑裡的一員——這會讓禱告從義務變成參與。<\/p>"]],"con":[],"say":"本講義的立場：照 3:1--2 的次序代禱——先求主的道理快快行開、得著榮耀，再求工人被保護、需要得供應；兩者都要，焦點放在主的信實（3:3）。","care":"會眾裡有傳道人的家屬，也有曾經在宣教工場上耗盡而回來的人；他們聽到「先求道、再求人」，可能覺得自己的疲乏又一次被排到後面。牧者要清楚說：為工人的身心、家庭與安全禱告，同樣是保羅的禱告。不要說「為主擺上就不要計較」；會後去問一問那位回來的宣教士，他最需要被代禱的是甚麼，必要時協助他得到休息與專業的關顧。"},{"id":"ISS03_2","t":"3:3「脫離那惡者」——是指撒但，還是指凶惡？","r":"3:2--3；太6:13","ch":[3],"why":"和合本在 3:3 譯作「那惡者」，旁邊卻有小註「或譯：脫離凶惡」。有人因此覺得聖經翻譯不可靠；也有人把這一節講成凡事都要趕鬼，或反過來完全不提屬靈的爭戰。這一題關係到受逼迫、受攪擾的人怎樣理解主的保護，也關係到主禱文裡同樣的一句話。","pos":[["【一】經文問的是甚麼","","<p>「但主是信實的，要堅固你們，保護你們脫離那惡者。」（3:3）原文 ἀπὸ τοῦ πονηροῦ（apo tou ponērou），τοῦ πονηροῦ 在文法上可以是陽性「那惡者」，也可以是中性「凶惡、惡事」。同樣的片語出現在主禱文：「救我們脫離凶惡」（太 6:13），和合本在那裡取了中性。問題是：保羅在這裡想的是一個位格的敵人，還是一切的惡？<\/p>"],["位格說（那惡者＝撒但）","","<p>這個讀法注意上下文：第 2 章剛講完大罪人「是照撒但的運動」（2:9），而且保羅在帖前 2:18 說過撒但阻擋他；新約其他地方也用「那惡者」稱呼撒但（例如約壹 5:18--19）。所以 3:3 是說主保護信徒不被那惡者勝過，這與以弗所書講的屬靈爭戰同一條線。<\/p><p><strong>難處：<\/strong>緊接在前的 3:2 說的是「無理之惡人」（πονηρῶν ἀνθρώπων），用的是同一個字根的形容詞，指的是人；若 3:3 突然轉到撒但，轉得很快。而且若過度強調位格，容易讓人把每一個難處都歸給鬼。<\/p>"],["中性說（凶惡＝一切的惡）","","<p>這個讀法認為 3:3 是在回應 3:2：人的惡、逼迫、一切惡事，主都要保護你們脫離；和合本小註與主禱文的翻譯都支持這個可能。它的優點是把主的保護擴大到生活的每一個層面：謠言、逼迫、試探、自己裡面的惡。<\/p><p><strong>難處：<\/strong>中性讀法可能淡化新約清楚的屬靈爭戰的實際，讓人以為惡只是抽象的力量或環境；而帖後全卷又確實有一個位格的敵人在背後運作（2:9）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩讀並陳，偏向位格讀法，但不排除中性的涵義。<\/strong>從全卷看，2:9 的撒但與 3:3 的「那惡者」是同一個敵人；可是保羅的重點不在敵人是誰，而在保護的是誰：「主是信實的」，三個動詞的主詞都是主。屬靈爭戰的立場回指以弗所書立場四：真實、但不誇大；勝利不靠我們，靠一位一口氣就能勝的主（2:8）。<\/p><p>講台的落點：盯著惡的人，越看越怕；仰望主的人，越看越穩。不論是那惡者還是凶惡，都在主的保護之下。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩種讀法都在正統信仰之內，和合本把另一種讀法放在小註裡，正是誠實的翻譯；兩種讀法的共同點才是重點：不論是位格的敵人還是一切的惡事，主都是信實的，他要堅固你、保護你。你今晚可以安心睡覺。<\/p>"]],"con":[],"say":"本講義的立場：τοῦ πονηροῦ 兩讀並陳，偏向「那惡者」，不排除「凶惡」；重點是保護的主詞是主。屬靈爭戰回指以弗所書立場四，本章不另立說法。","care":"會眾裡有人長期被恐懼纏繞，晚上不敢關燈，或總覺得家裡的不順是被下了咒；也有人曾經被「趕鬼」的方式傷害過。牧者不要用「那惡者」加深他的恐懼，也不要嘲笑他的害怕；陪他讀 3:3 的三個動詞，一起禱告。若恐懼已經影響睡眠、工作與生活，溫柔地建議他同時尋求醫療與專業的協助，這不是缺乏信心。"},{"id":"ISS03_3","t":"3:6「不按規矩而行」——他們為甚麼不做工？","r":"3:6--7；3:11","ch":[3],"why":"保羅在前書只用一句話提醒「要警戒不守規矩的人」（帖前 5:14），到後書卻用了十節處理。這些人為甚麼不做工？答案影響我們怎樣講 3:6--15：如果是末日狂熱，問題在錯誤的末世觀；如果是倚賴恩主，問題在依附別人的愛心；如果是看輕勞動，問題在文化。不同的診斷，會開出不同的藥方。","pos":[["【一】經文問的是甚麼","","<p>「凡有弟兄不按規矩而行，不遵守從我們所受的教訓，就當遠離他。」（3:6）ἀτάκτως（ataktōs）原是軍隊用語：脫隊、不守隊形。3:11 說他們「甚麼工都不做，反倒專管閒事」。經文沒有直接說他們為甚麼不做工，學界因此提出三種解釋。問題是：哪一種最符合帖撒羅尼迦的處境？今天又該怎樣應用？<\/p>"],["末世狂熱說","","<p>這是最常見的讀法：第 2 章剛處理完「主的日子現在到了」的假消息（2:2），第 3 章就處理不做工的人，兩者很可能相連。既然主快來了，何必再做工？前書 4:11 叫人「親手做工」的上下文，也正是主的降臨。<\/p><p><strong>難處：<\/strong>第 3 章本身並沒有提到末日，保羅處理不做工的時候，訴諸的是自己的榜樣與從前的吩咐（3:7--10），沒有再談末世；而且 3:10 說這是保羅「在你們那裡的時候」就已經吩咐的，問題似乎在假消息出現之前就有了。<\/p>"],["倚賴恩主說","","<p>這個讀法從羅馬社會的「恩主與門客」制度看：門客每天早上到恩主家請安、跟著他、替他做些場面上的事，換取糧食與錢。有些信徒可能把富裕的弟兄當成新的恩主，靠著教會的愛心過日子，整天跟著跑，卻不做正經的工——這正好解釋「到處忙」的樣子。<\/p><p><strong>難處：<\/strong>這個解釋需要大量從社會史重建背景，經文本身沒有提到恩主或門客；而帖撒羅尼迦教會多半是勞動階層，是否有足夠的富人供養一群門客，也有疑問。<\/p>"],["看輕勞動說","","<p>希臘羅馬的上層文化看不起體力勞動，認為那是奴隸的事；有些信徒信主之後，可能覺得自己屬靈了，就不必再做手工。保羅特意用自己「辛苦勞碌，晝夜做工」（3:8）作榜樣，正是要翻轉這種看法。<\/p><p><strong>難處：<\/strong>帖撒羅尼迦的信徒多半本來就是做工的人，看輕勞動的上層價值觀未必是他們的主要問題；而且這個說法也解釋不了為甚麼問題在前後書之間突然變嚴重。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義三說並陳，認為它們可以同時成立。<\/strong>末世的騷動可能把本來就有的依附心態與輕看勞動放大了；三說的共同點是：<strong>他們把別人的愛心當成了自己的收入。<\/strong>所以保羅的藥方不是先辯論末世，而是三件平凡的事：安靜、做工、吃自己的飯（3:12）。本講義的全卷立場見議題「做工、懶惰與教會紀律」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。我們不知道確切的原因，但我們知道保羅的處理方式：先作榜樣，再吩咐，再勸戒，最後才是紀律，而且紀律的目的是挽回。不論原因是哪一個，今天的應用都一樣清楚：等候主的人，好好過今天。<\/p>"]],"con":[],"say":"本講義的立場：末世狂熱、倚賴恩主、看輕勞動三說並陳，可以同時成立；共同點是把別人的愛心當成自己的收入。本講義的全卷立場見議題「做工、懶惰與教會紀律」。","care":"會眾裡可能有人曾經因為末日預言辭了工作、賣了房子，如今生活陷入困境，心裡很羞愧；也有人長期靠家人或教會接濟，不知道怎樣重新開始。牧者不要拿這一題嘲笑他們「被騙了」，也不要公開舉例；私下陪他們一步一步重建生活，協助找工作或職訓資源。要分清楚：他們需要的是陪伴與實際的幫助，不是一句「不做工就不可吃飯」。"},{"id":"ISS03_4","t":"3:9「這並不是因我們沒有權柄」——傳道人該不該支薪？帶職與全職哪一個比較屬靈？","r":"3:8--9；徒18:3","ch":[3],"why":"有人拿 3:8--9 說傳道人應該學保羅，自己賺錢，不該靠教會養；也有人說全職才是真正的委身，帶職是次一等的事奉。這一題直接影響教會怎樣對待傳道人的薪資、退休與家庭，也影響許多帶職事奉的弟兄姊妹怎樣看自己。","pos":[["【一】經文問的是甚麼","","<p>「這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們。」（3:9）保羅在帖撒羅尼迦「辛苦勞碌，晝夜做工」（3:8），在哥林多也與亞居拉夫婦一同製造帳棚（〔背景〕徒 18:3）。問題是：保羅放下支薪的權利，是給所有傳道人的規定，還是在特定處境裡的特別選擇？<\/p>"],["帶職模式說","","<p>這個讀法認為保羅帶職做工是值得效法的模式：傳道人不成為教會的重擔，也不被金錢綁住，可以更自由地傳福音；今天的創啟地區宣教、職場宣教、帶職牧養，都在這個模式裡找到根據。帶職的人也更貼近會眾的生活。<\/p><p><strong>難處：<\/strong>經文明說保羅「有權柄」，他是放下，不是否定這個權柄；若把它變成規定，就把保羅的榜樣變成了律法，而且常常成為教會不願負擔傳道人生活的藉口。<\/p>"],["全職支薪說","","<p>這個讀法強調保羅自己在別處把原則說清楚：傳福音的靠著福音養生（林前 9:14），作工的得工價是應當的；教會有責任供應全職傳道人的生活，使他能專心祈禱、傳道。3:9 只說明保羅在帖撒羅尼迦為了作榜樣，選擇不用這個權柄。<\/p><p><strong>難處：<\/strong>若只強調支薪的權利，容易忽略保羅放下權柄背後的心——不成為別人的重擔、不讓福音被誤會成生意；也可能讓人覺得全職比帶職更屬靈。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不以 3:8--9 反對傳道人支薪，也不以此要求傳道人帶職。<\/strong>保羅「有」權柄，所以支薪是正當的；他「放下」，是因為在那個處境裡，放下更能作榜樣。這正是 321 說的「謙卑是放下權力回到本位」——不是沒有權力，是有，卻不抓住。帶職與全職都是主的呼召，沒有高下。本講義的全卷立場見議題「做工、懶惰與教會紀律」。<\/p><p>教會該問的不是「誰比較屬靈」，而是：我們的傳道人有沒有被合理地供應？我們的帶職同工有沒有被尊重與支持？<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這是事奉模式的問題，不是救恩的問題。重要的是動機：不論全職還是帶職，都是為了讓主的道理快快行開，不是為了自己的名或利。你可以尊重每一種呼召，也可以在自己的位置上，像保羅一樣不成為別人的重擔。<\/p>"]],"con":[],"say":"本講義的立場：保羅有權柄而放下，是為了作榜樣，不是立規定；不以 3:8--9 反對傳道人支薪，也不要求傳道人帶職。本講義的全卷立場見議題「做工、懶惰與教會紀律」。","care":"會眾裡有薪水微薄、不敢向教會開口的傳道人與他們的家人，也有被人暗示「帶職的不夠委身」的同工。牧者與執事會不要在講台上拿保羅的帳棚壓傳道人的薪資，也不要讓帶職的人覺得自己次一等。會後可以實際檢視：傳道人的薪資、保險與退休安排是否合理，帶職同工的時間與家庭是否被顧到。"},{"id":"ISS03_5","t":"3:10「若有人不肯做工，就不可吃飯」——失業、病弱、身障、年老、照顧者怎麼辦？基督徒該支持社會救助嗎？","r":"3:10；弗4:28；提前5:3--16","ch":[3],"why":"3:10 是全卷最常被引用、也最常被誤用的一節：有人拿它罵失業的人、領救濟的人，甚至用來反對一切社會福利。坐在會眾席上的，就有正在找工作的人、生病的人、身心障礙的人、年老的人、在家照顧家人的人。這一題不處理清楚，講台上的一句話就可能把他們推出教會。","pos":[["【一】經文問的是甚麼","","<p>「我們在你們那裡的時候，曾吩咐你們說，若有人不肯做工，就不可吃飯。」（3:10）關鍵在動詞 οὐ θέλει（ou thelei）：不肯、不願意，不是「不能」。3:11 接著說明這些人的樣子：「甚麼工都不做，反倒專管閒事。」問題是：這一節的對象是誰？它對「不能」做工的人說了甚麼？它可以用來決定今天的社會救助政策嗎？<\/p>"],["個人責任派","","<p>這一派強調工作倫理：神造人本來就要人做工（這使我們想起創 2:15），有能力的人應當負起自己的擔子，不可把別人的愛心當作收入；教會的幫助要有智慧，避免助長依賴。這一派也常提醒，長期無條件的接濟可能傷害受助者的尊嚴與能力。<\/p><p><strong>難處：<\/strong>若只講這一面，很容易忘記經文的限定詞「不肯」，把所有沒有收入的人都放進 3:10 裡；也容易把複雜的失業、疾病與社會結構問題，簡化成個人的懶惰。<\/p>"],["社會關懷派","","<p>這一派強調 3:10 只針對「不肯」的人，而保羅在別處清楚要求照顧「不能」的人：做工是為了「就可有餘分給那缺少的人」（弗 4:28），教會要救濟「那真無倚靠的寡婦」（提前 5:16）。所以基督徒應當支持合理的社會救助，教會本身也要成為照顧軟弱者的群體。<\/p><p><strong>難處：<\/strong>若只講這一面，可能淡化保羅對「不肯做工」的嚴肅處理，讓教會不敢對真正濫用愛心的人說話；也可能把經文直接等同於某一套政策主張。<\/p>"],["【三】本講義站在哪裡","","<p><strong>3:10 是給「不肯」的人的，不是給「不能」的人的。<\/strong>失業、疾病、身心障礙、年老、在家照顧家人、全職主婦——這些人不在 3:10 裡面；他們在「你們眾人彼此相愛的心也都充足」（1:3）裡面。不肯做工的不可吃飯，不能做工的教會要供應——兩句一起讀才是保羅。兩派其實都同意經文的核心：願意做工的要做工，不能做工的要被照顧。本講義不以這一節替任何政黨或政策背書。本講義的全卷立場見議題「做工、懶惰與教會紀律」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你正在失業、生病或照顧家人，請你聽清楚：這一節沒有在罵你。一個人的價值不在他的產值，你在神眼中的位置，不因為你這個月有沒有收入而改變。教會的桌子有你的位子。<\/p>"]],"con":[],"say":"本講義的立場：3:10 的「不肯」不是「不能」；不肯做工的不可吃飯，不能做工的教會要供應。不用這一節羞辱任何正在受苦的人，也不以它反對一切救助。本講義的全卷立場見議題「做工、懶惰與教會紀律」。","care":"會眾席上有正在失業的中年人、長期病痛的人、身心障礙的人、照顧失智父母或特殊需要孩子的人，他們很可能早就被親戚用這句話刺過。牧者講到這一節時，要明說「這不是在說你」；不要追問他們為甚麼還沒找到工作，不要對正在流淚的人說「你要有信心」。會後單獨關心，實際了解需要，協助連結教會的關懷基金或社會資源；若有長期無望感，協助尋求專業的協助。"},{"id":"ISS03_6","t":"3:11--12「專管閒事」「安靜做工」——拚搏文化、過勞、躺平與內捲，基督徒該站在哪裡？","r":"3:11--12；3:8；帖前4:11","ch":[3],"why":"華人社會一邊是「拚」的文化：加班到深夜、不敢先下班、把工作當作身分；另一邊是「躺平」：怎麼拚都一樣，乾脆不擠了。基督徒夾在中間，常常把晝夜做工聽成越累越屬靈，或把等候主聽成可以不必努力。3:11--12 的「安靜做工」正好對兩邊都說話。","pos":[["【一】經文問的是甚麼","","<p>「我們靠主耶穌基督吩咐、勸戒這樣的人，要安靜做工，吃自己的飯。」（3:12）這是對 3:11「甚麼工都不做，反倒專管閒事」的回答：ἐργαζομένους（ergazomenous）與 περιεργαζομένους（periergazomenous）是文字遊戲——不做工，卻到處忙。μετὰ ἡσυχίας（meta hēsychias）是「帶著安靜」。問題是：這個「安靜做工」對今天的過勞者與躺平者，各說了甚麼？<\/p>"],["工作倫理說（對躺平說話）","","<p>這個讀法強調 3:12 是命令：信徒要做工、吃自己的飯，不可藉屬靈理由逃避責任；對看見內捲而選擇躺平的人，經文提醒工作本身是神的託付，也是愛人的方式，不是只為了跟人比較。保羅自己「晝夜做工」（3:8），就是不讓福音因為懶散被輕看。<\/p><p><strong>難處：<\/strong>若只講這一面，很容易把「晝夜做工」當成標準，讓本來就過勞的人更不敢休息，忘了保羅做工的理由是「免得叫你們一人受累」，不是證明自己。<\/p>"],["安息與界線說（對過勞說話）","","<p>這個讀法強調「安靜」：ἡσυχία 是心不被攪動，與 2:2 的驚慌相反；拚到失去睡眠、健康與家庭的人，其實也是被一種焦慮推著走，和被末日消息推著走的人一樣不安靜。安息是神設立的節奏，基督徒的價值不在產值。這一派回指歌羅西書立場四：無己不是苦待己身。<\/p><p><strong>難處：<\/strong>若只講這一面，可能讓「安息」變成逃避責任的藉口，也可能忽略許多人過勞不是自己選的，是生計所迫，只叫他們「休息」並不實際。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為「安靜做工」同時對兩邊說話。<\/strong>對躺平的人，經文說「做工」：工作不是證明，是恩典，也是不成為別人重擔的愛。對內捲的人，經文說「安靜」：你的價值不在你的產值，你不必拚到半夜才算一個人。3:8 的晝夜做工不是過勞的榜樣，理由是「免得叫你們一人受累」——過勞最後把重擔轉給家人，正好走到這一節的反面。本講義的全卷立場見議題「做工、懶惰與教會紀律」；無己與過勞回指歌羅西書立場四。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這不是要你在拚與躺之間選一邊，而是讓主修直你的心（3:5）。等候主的人，今天會好好上班，也會好好睡覺——因為撐住世界的不是你，是那位信實的主。拚與躺都可能是驚慌的兩種樣子；安靜，才是信的樣子。<\/p>"]],"con":[],"say":"本講義的立場：「安靜做工」同時對躺平與內捲說話——要做工，也要安靜；3:8 不是過勞的榜樣，理由是不叫人受累。本講義的全卷立場見議題「做工、懶惰與教會紀律」，無己與過勞回指歌羅西書立場四。","care":"會眾裡有人因為長期過勞已經身體出狀況、婚姻緊繃，也有人因為職場挫折而失去動力，被家人說是懶。牧者不要拿 3:8 讚美過勞，也不要拿 3:10 責備失去動力的人；先聽他的處境，分辨是疲憊、是無望，還是逃避。對於長期無望、失眠或情緒低落的人，不要只說「靠主就好」，協助他尋求醫療與專業的協助。"},{"id":"ISS03_7","t":"3:13「行善不可喪志」——服事倦怠是屬靈失敗嗎？","r":"3:13；加6:9","ch":[3],"why":"教會裡最認真的人，往往最先倦怠：主日學老師、小組長、關懷同工、詩班、執事。他們累了，卻不敢說，因為怕被看成屬靈退步；有時候，講台上一句「行善不可喪志」正好壓在他們身上。這一題要分清楚：這一節是鼓勵，還是責備？","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，你們行善不可喪志。」（3:13）原文以 ὑμεῖς δέ（hymeis de）「但你們」起頭，把話從不做工的人轉向一直在做工的人。μὴ ἐγκακήσητε（mē enkakēsēte）是不要灰心、洩氣、在壞的處境裡軟下來；加 6:9 用同一個字：「我們行善，不可喪志；若不灰心，到了時候就要收成。」問題是：服事的人累了、灰心了，是不是屬靈失敗？<\/p>"],["屬靈操練說","","<p>這個讀法強調 3:13 是一個命令：喪志是信心的試煉，基督徒要靠著主持續行善，不要因為別人不做工就跟著停下；倦怠常常源於動機偏差——為人而做，而非為主而做；所以要回到主面前更新動機，重新得力。<\/p><p><strong>難處：<\/strong>這個讀法若用在已經耗盡的人身上，會變成第二層的重擔：他不只累，還被暗示是自己不夠屬靈；它也容易忽略倦怠常常有實際的原因：工作量不合理、沒有人分擔、身體與情緒的限制。<\/p>"],["牧養鼓勵說","","<p>這個讀法強調保羅的語氣：「弟兄們」是家人的稱呼，「不可喪志」本身就承認行善的人會累。保羅在前書也說要「勉勵灰心的人」（帖前 5:14）。所以 3:13 是轉過身扶起擺桌子的人，而教會回應的方式，應當是休息、分擔、陪伴，必要時協助尋求專業的幫助。<\/p><p><strong>難處：<\/strong>若只講鼓勵，可能忽略經文確實呼召人不要放棄行善，也可能讓人以為只要累了就可以完全撤退，而沒有處理自己裡面需要被主更新的地方。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為服事倦怠不是屬靈失敗；3:13 是鼓勵，不是鞭子。<\/strong>主耶穌也叫疲乏的門徒「同我暗暗地到曠野地方去歇一歇」（可 6:31）。不喪志的力量不是咬牙，而是 3:5 主把人的心引到基督的忍耐裡——真正一步也沒有喪志的，是基督自己。教會的責任是讓擺桌子的人不孤單：分擔、輪替、休息。本講義的全卷立場見議題「做工、懶惰與教會紀律」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你現在很累，那不證明你不愛主；它證明你一直在愛。請你歇一歇，讓別人接手一段，也讓主重新把你的心修直。到了時候，就要收成——那收成不靠你撐，靠信實的主。喪志不會讓你失去主的愛；在你最累的地方，他正親自給你平安。<\/p>"]],"con":[],"say":"本講義的立場：服事倦怠不是屬靈失敗；3:13 是轉過身鼓勵行善的人，教會的回應是分擔、休息與陪伴，必要時協助專業的幫助。本講義的全卷立場見議題「做工、懶惰與教會紀律」。","care":"會眾裡有長期撐著服事、家裡又有重擔的同工，也有因為倦怠而悄悄退下、心裡很羞愧的人。牧者不要用「行善不可喪志」催他回來，也不要公開點名誰退出了；私下去問他累在哪裡，具體替他接下一件事。若倦怠已經伴隨失眠、長期情緒低落或無望感，不要只說「你要有信心」，溫柔地陪他尋求專業的協助。"},{"id":"ISS03_8","t":"3:14--15「記下他，不和他交往……但不要以他為仇人」——教會紀律怎樣做才是挽回？","r":"3:14--15；3:6；太18:15--17","ch":[3],"why":"教會紀律是新約清楚的教導，卻也是最容易被濫用的一環：有的教會從不處理，讓傷害一再發生；有的教會把「不和他交往」變成冷暴力、公開羞辱、封鎖離開的人，甚至叫家人斷絕關係。這一題關係到教會能不能同時是聖潔的、也是安全的家。","pos":[["【一】經文問的是甚麼","","<p>「若有人不聽從我們這信上的話，要記下他，不和他交往，叫他自覺羞愧。但不要以他為仇人，要勸他如弟兄。」（3:14--15）σημειοῦσθε（sēmeiousthe）是標記、注意；μὴ συναναμίγνυσθαι（mē synanamignysthai）是不要混在一起；ἵνα ἐντραπῇ（hina entrapē）是叫他回頭看自己；νουθετεῖτε（noutheteite）是勸戒。問題是：這個紀律的對象、方式、目的與底線是甚麼？<\/p>"],["正式紀律派","","<p>改革宗、浸信會等傳統有清楚的紀律程序，常以主耶穌的話為步驟：先單獨指出，再帶一兩個人，再告訴教會（太 18:15--17）。這一派認為紀律是愛的表現，保護教會的見證，也給犯錯的人清楚的回轉之路；程序也能防止領袖任意處置人。<\/p><p><strong>難處：<\/strong>程序若變成冷冰冰的制度，容易忘了 3:15 的「弟兄」；歷史上也有群體以「禁絕」（shunning）切斷一個人的社交與家庭，把紀律變成控制成員的工具。<\/p>"],["牧養關懷派","","<p>這一派不設正式程序，以個別勸勉、陪伴、小組關懷為主，強調關係與時間，認為在華人「面子」文化裡，公開程序很容易變成羞辱；νουθετεῖτε 的勸戒本身就是一種持續的關係。<\/p><p><strong>難處：<\/strong>沒有程序，常常等於沒有處理：傷害一再發生，受害者得不到保護；而且非正式的處理更容易受人際關係與領袖好惡影響，反而不公平。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義以紀律的四個界線讀 3:14--15。<\/strong>① 對象：不聽從使徒教訓、而且不肯回轉的弟兄，在這一段就是不肯做工、專管閒事的人；不是提出疑問、有不同意見或離開教會的人。② 方式：減少一般的交往，不是公開羞辱、不是截圖點名、不是切斷家人。③ 目的：叫他自己回頭看，不是叫眾人羞辱他。④ 底線：「但不要以他為仇人，要勸他如弟兄」（3:15）。紀律的成功不是贏了一場爭論，是得回一個弟兄。本講義的全卷立場見議題「做工、懶惰與教會紀律」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經被教會用「紀律」的名義傷害過，請你知道：那不是 3:14--15 的樣子，經文本身就站在你這一邊。如果你在教會負責處理困難的人，也請你知道：紀律可以是愛，只要它從頭到尾都記得對方是弟兄。<\/p>"]],"con":[],"say":"本講義的立場：3:14 一定與 3:15 一起讀；紀律有四個界線——對象、方式、目的、底線，目的是挽回，底線是他仍是弟兄。本講義的全卷立場見議題「做工、懶惰與教會紀律」。","care":"會眾裡有人曾經被教會公開點名、被群組封鎖、被要求與家人斷絕往來，至今不敢再踏進教會；也有人是受害者，眼看加害者沒有被處理。牧者不要用這一題替過去的錯誤處置辯護，必要時要承認並道歉；不要追問受傷的細節，不要要求他立刻原諒。若涉及家庭傷害或性暴力，紀律不能取代法律與專業的協助，要先保護受害者的安全。"},{"id":"ISS03_9","t":"3:17「我的筆跡就是這樣」——偽名書信、正典與今天的假帳號，我們怎樣分辨真假？","r":"3:16--18；2:2；2:15","ch":[3],"why":"保羅在信末親筆簽名，是因為有人冒他的名寫信（2:2）。諷刺的是，近代有學者反過來主張帖後本身就是託名之作；而今天的群組裡，冒名的信更多了：假帳號、假名人語錄、AI 生成的見證。這一題連起正典的問題與每天手機上的分辨。","pos":[["【一】經文問的是甚麼","","<p>「我－保羅親筆問你們安。凡我的信都以此為記，我的筆跡就是這樣。」（3:17）保羅平常口述、由人代筆，最後親手寫幾行作記號 σημεῖον（sēmeion）。這是回應 2:2「有冒我名的書信」。問題有兩層：一、帖後真的是保羅寫的嗎？二、今天沒有保羅的親筆，我們怎樣分辨真假的訊息？<\/p>"],["保羅親筆說（傳統立場）","","<p>傳統認為帖後是保羅在哥林多所寫，約主後 50--51 年，在帖前之後數月。早期教會一致接受；兩封信的差異來自不同的處境：前書安慰憂傷的人，後書安定驚慌的人；3:17 的親筆記號，正是因為 2:2 有人冒名而特別強調。<\/p><p><strong>難處：<\/strong>這個立場需要回應兩封信語氣與末世描述的差異，也需要解釋為甚麼保羅說「凡我的信」都有記號，而現存的信並沒有都特別點出這件事。<\/p>"],["後人託名說","","<p>部分近代學者認為帖後是保羅之後的人託名所寫：理由是語氣較冷、結構與帖前高度相似像是模仿、末世觀與帖前「好像夜間的賊」不同，而 3:17 強調親筆，反而像是為了取信而寫。<\/p><p><strong>難處：<\/strong>一封譴責冒名書信（2:2）的信，自己卻是冒名之作，這在道德上與邏輯上都很難自圓其說；相似可以是同一作者在短時間內寫給同一教會；末世觀的差異也可以並讀（全卷議題「帖前與帖後的末世教導矛盾嗎？」）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在保羅所寫的傳統立場<\/strong>，公平陳列託名說的理由與回應；作者與年代的全卷立場見議題「作者、寫作地點與年代」。今天的應用回到全卷立場議題「真假訊息、使徒的教訓與聖經的權威」：使徒的筆跡今天就在聖經裡。<strong>分辨三問<\/strong>：這訊息與聖經的筆跡相合嗎？它讓我更愛主，還是更害怕？它讓我站穩，還是驚慌？教會的規矩、傳統、領袖的話，包括講台上的話，也都要放在這筆跡底下被察驗。<\/p>"],["【四】這件事該不該影響你的信心","","<p>作者的學術討論不該動搖你的信心——即使持託名說的學者，也承認這卷書在正典裡。但「聖經是不是我的準則」該影響你：在真假難辨的時代，平安來自主自己（3:16），分辨來自使徒的筆跡（3:17）。<\/p>"]],"con":[],"say":"本講義的立場：帖後是保羅親筆所寫，託名說公平陳列；今天的筆跡就是聖經，分辨三問是與筆跡相合嗎、讓我更愛主嗎、讓我站穩嗎。本講義的全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」、議題「作者、寫作地點與年代」。","care":"會眾裡有人曾經轉傳過假的末日訊息、被假帳號騙過奉獻，覺得自己很蠢；也有年長的弟兄姊妹分不清 AI 生成的影片。牧者不要嘲笑受騙的人，而是在小組裡實際教大家怎樣查證、怎樣對照經文；也有人在查經班第一次聽到託名說而動搖，先肯定他願意認真讀經，再陪他看證據，不要說「問這種問題就是不信」。"}],"terrain":{"points":[[0.792,46,4,"仍舊存忍耐和信心",null],[1.042,84,7,"從天上在火焰中顯現",null],[1.208,12,9,"永遠沉淪，離開主的面","bot"],[1.292,94,10,"要在他聖徒的身上得榮耀","top"],[1.588,26,2,"不要輕易動心，也不要驚慌",null],[1.706,4,4,"坐在神的殿裡，自稱是神","bot"],[1.941,92,8,"主耶穌要用口中的氣滅絕他",null],[2.235,96,13,"他從起初揀選了你們","top"],[2.639,88,3,"但主是信實的",null],[3.083,22,11,"甚麼工都不做，反倒專管閒事","bot"],[3.194,70,13,"你們行善不可喪志",null],[3.361,98,16,"願賜平安的主隨時隨事親自給你們平安","top"]]},"tracks":[{"gk":"ἀποκάλυψις／παρουσία","tr":"apokalypsis / parousia","gl":"顯現、顯露、降臨、降臨的榮光","code":"G0602","root":"ἀποκάλυψις——揭開、顯出來（動詞 ἀποκαλύπτω）；παρουσία——到場、駕臨（帝王巡幸用語）；ἐπιφάνεια——顯現的光輝。全卷 8 次，全部集中在 1:7 與第 2 章：兩個「顯露」的對決。帖撒羅尼迦前書的主角是主的「降臨」，本卷的主角是「顯露」——主的顯現，與大罪人的冒牌顯現","ins":"全卷第一個「顯」是主的：「主耶穌同他有能力的天使從天上在火焰中顯現」（1:7），ἀποκαλύψει——帷幕拉開，原本就在那裡的被看見了。2:1 換成 παρουσία，「我們主耶穌基督降臨」，這是帝王駕臨一座城的字。接著翻轉：同一個 ἀποκαλύπτω 被借給對手——「並有那大罪人，就是沉淪之子，顯露出來」（2:3）。但他的顯露是被管著的：「是叫他到了的時候才可以顯露」（2:6），時候不是他定的。2:8 一節之內三個字正面相遇：他「必顯露出來」，主卻用 ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ——「降臨的榮光」廢掉他。最後一站最諷刺：「這不法的人來」（2:9），原文 οὗ ἐστιν ἡ παρουσία——連「降臨」這個字他也冒用了；而他的降臨需要「異能、神蹟，和一切虛假的奇事」撐場面。真的降臨只要一口氣。兩個顯露，一真一假；分辨不靠看誰比較驚人，靠認得那一位的筆跡。","stops":[["1:7","主耶穌同他有能力的天使從天上在火焰中顯現","top"],["2:1","論到我們主耶穌基督降臨",""],["2:3","並有那大罪人，就是沉淪之子，顯露出來","bot"],["2:6","是叫他到了的時候才可以顯露",""],["2:8","那時這不法的人必顯露出來。主耶穌要用口中的氣滅絕他，用降臨的榮光廢掉他","top"],["2:9","這不法的人來，是照撒但的運動","bot"]]},{"gk":"ἀλήθεια ↔ ψεῦδος","tr":"alētheia ↔ pseudos","gl":"真理、真道 ↔ 誘惑、虛假、詭詐、錯誤、虛謊","code":"G0225","root":"ἀλήθεια——真理、真實；ψεῦδος——謊言、虛假；πλάνη——迷途、錯誤（走錯路）；ἀπάτη——欺騙、詭詐；ἐξαπατάω——徹底騙倒。全卷 8 次，全部擠在 2:3--13 十一節之內","ins":"這條線是一道往下的樓梯，最後一級被翻成往上。第一級是警告：「你們總不要被他誘惑」（2:3），ἐξαπατήσῃ——被徹底騙倒。第二級：「一切虛假的奇事」（2:9），ψεύδους——神蹟可以是真的神蹟，卻替謊言服務；所以分辨不能只看有沒有神蹟。第三級是全條的關鍵：「因他們不領受愛真理的心」（2:10），τὴν ἀγάπην τῆς ἀληθείας——問題不是沒聽過真理，是不愛它。第四級是後果：「神就給他們一個生發錯誤的心，叫他們信從虛謊」（2:11），πλάνης、τῷ ψεύδει——不愛真理的人，最後被交給自己選的謊言；次序是先 2:10 後 2:11，神沒有先叫人沉淪。第五級：「不信真理、倒喜愛不義」（2:12），愛錯了。然後 2:13 一個「但」，Ἡμεῖς δέ，同一個字翻上來：「叫你們因信真道」，πίστει ἀληθείας。八個字擠在十一節裡；真理與謊言的分界，最後落在一個人愛甚麼。","stops":[["2:3","人不拘用甚麼法子，你們總不要被他誘惑",""],["2:9","和一切虛假的奇事","bot"],["2:10","因他們不領受愛真理的心","top"],["2:11","神就給他們一個生發錯誤的心，叫他們信從虛謊","bot"],["2:12","使一切不信真理、倒喜愛不義的人都被定罪",""],["2:13","叫你們因信真道","top"]]},{"gk":"στηρίζω／στήκω ↔ σαλεύω","tr":"stērizō / stēkō ↔ saleuō","gl":"堅固、站立得穩、堅守、保護 ↔ 動心、驚慌；忍耐","code":"G4741","root":"στηρίζω——撐住、使穩固；στήκω——站住；κρατέω——緊抓；φυλάσσω——看守；反面 σαλεύω——搖晃（船在浪裡）、θροέω——驚慌（太 24:6 同字）；ὑπομονή——在重擔底下留下來。全卷 9 次","ins":"起點是一群已經在浪裡站著的人：「在所受的一切逼迫患難中，仍舊存忍耐和信心」（1:4），ὑπομονῆς——在重擔底下不走。可是逼迫沒有推倒他們，一則消息差一點推倒了：「不要輕易動心，也不要驚慌」（2:2），σαλευθῆναι 是船被浪打得左右搖，θροεῖσθαι 是主耶穌在橄欖山說「總不要驚慌」的同一個字。2:15 翻轉，命令不是「不要動」，是「要站、要抓」：στήκετε、κρατεῖτε——「你們要站立得穩……都要堅守」。接著主詞換了：「在一切善行善言上堅固你們」（2:17），στηρίξαι 是神做的。3:3 一節三個字：「但主是信實的，要堅固你們，保護你們」——πιστός、στηρίξει、φυλάξει，緊接在 3:2「人不都是有信心」後面：人的信會短缺，主的信實不會。最後一站回到起點的那個字：「並學基督的忍耐」（3:5），τὴν ὑπομονὴν τοῦ Χριστοῦ——1:4 帖撒羅尼迦人的忍耐，原來是借來的；真正在撐的是基督自己的忍耐。站得穩的人，是知道自己靠誰站的人。","stops":[["1:4","仍舊存忍耐和信心",""],["2:2","不要輕易動心，也不要驚慌","bot"],["2:15","你們要站立得穩……都要堅守","top"],["2:17","並且在一切善行善言上堅固你們",""],["3:3","但主是信實的，要堅固你們，保護你們","top"],["3:5","並學基督的忍耐",""]]},{"gk":"ἔργον／ἐργάζομαι／ἐνέργεια","tr":"ergon / ergazomai / energeia","gl":"工夫、運動、發動、做工、專管閒事","code":"G2041","root":"ἔργον——工作、工夫；ἐργάζομαι——做工；ἐνεργέω／ἐνέργεια——運作、發動（能量在裡面做工）；περιεργάζομαι——在工作周圍打轉，忙別人的事。全卷 10 次：信心的工、黑暗的運作、手的工","ins":"「工」在全卷有三種。第一種是信心的工：「一切因信心所做的工夫」（1:11），ἔργον πίστεως——信心是會動手的。第二種翻轉成黑暗的運作：「那不法的隱意已經發動」（2:7），ἐνεργεῖται；「是照撒但的運動」（2:9），ἐνέργειαν——惡也在上班。2:11 最難：「神就給他們一個生發錯誤的心」，原文是 ἐνέργειαν πλάνης——錯誤的運作；神任憑他們，讓他們自己選的錯誤在裡面運轉（先有 2:10 不愛真理）。2:17 回到光裡：「在一切善行善言上堅固你們」。第三種是手的工：保羅「辛苦勞碌，晝夜做工」（3:8），為的是「免得叫你們一人受累」；「若有人不肯做工，就不可吃飯」（3:10）——動詞是「不肯」。3:11 是一個文字遊戲：μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους，甚麼都不做，卻到處忙。最後一站是解藥：「要安靜做工，吃自己的飯」（3:12）。錯誤的末世觀會讓人停掉手上的工，卻忙著傳消息、管閒事；真盼望主來的人，用信心做今天的工。","stops":[["1:11","一切因信心所做的工夫","top"],["2:7","因為那不法的隱意已經發動","bot"],["2:9","是照撒但的運動","bot"],["2:11","神就給他們一個生發錯誤的心",""],["2:17","並且在一切善行善言上堅固你們",""],["3:8","倒是辛苦勞碌，晝夜做工","top"],["3:10","若有人不肯做工，就不可吃飯",""],["3:11","甚麼工都不做，反倒專管閒事","bot"],["3:12","要安靜做工，吃自己的飯","top"]]},{"gk":"ἐπιστολή＋παράδοσις＋παραγγέλλω","tr":"epistolē / paradosis / parangellō","gl":"書信、信、教訓、吩咐","code":"G1992","root":"ἐπιστολή——書信；παράδοσις——交付下來的教訓（傳統）；παραγγέλλω——下令、吩咐（軍中傳令）。全卷 10 次：一封假信開頭，一個真簽名結尾","ins":"全卷第一封「信」是假的：「有冒我名的書信，說主的日子現在到了」（2:2）。2:15 用一封真信回答一封假信：「凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守」——παραδόσεις 是交付下來的東西，不是自己發明的；今天「信上寫的」就在我們手上。第 3 章四次「吩咐」（παραγγέλλω，軍中傳令的字）：「你們現在是遵行我們所吩咐的」（3:4）；「我們奉主耶穌基督的名吩咐你們」（3:6，同一節還有 παράδοσιν）；「曾吩咐你們說」（3:10）；第四次旁邊放了另一個字——「吩咐、勸戒這樣的人」（3:12），命令旁邊是勸。3:14「我們這信上的話」，紀律的依據是使徒寫下來的，不是誰的意見。終點：「凡我的信都以此為記，我的筆跡就是這樣」（3:17）。從一封冒名信到一個親筆簽名——在訊息滿天飛的時候，分辨的方法是對筆跡。","stops":[["2:2","有冒我名的書信","bot"],["2:15","凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守","top"],["3:4","你們現在是遵行我們所吩咐的",""],["3:6","我們奉主耶穌基督的名吩咐你們……不遵守從我們所受的教訓",""],["3:10","曾吩咐你們說，若有人不肯做工，就不可吃飯",""],["3:12","我們靠主耶穌基督吩咐、勸戒這樣的人",""],["3:14","若有人不聽從我們這信上的話",""],["3:17","凡我的信都以此為記，我的筆跡就是這樣","top"]]}],"lesson":{"1":{"no":1,"vol":"《321帖撒羅尼迦後書講義》第一課·帖撒羅尼迦後書第一章","title":"一封寫給受苦者的信——留下、鬆綁、抬頭","chars":4930,"min":60,"deep":8,"dchars":1941,"tchars":1389,"blocks":[["h","一、一封寫給受苦者的信"],["p","弟兄姊妹平安。有一封信，大約在主後五十年，從哥林多寄出，往北走了好幾百里路，送進帖撒羅尼迦城裡一間不大的屋子。收信的是一小群做手藝、做小買賣的人，信主才一年左右。幾個月前，他們已經收到同一個人寫來的第一封信；這幾個月，日子沒有變好，反而更難了。所以這一封信一到，屋裡的人都圍過來，想知道信上寫了甚麼。"],["p","先看信封。「保羅、西拉、提摩太寫信給帖撒羅尼迦、在神－我們的父與主耶穌基督裡的教會。」（1:1）三個寄信的人，正是一年前一起在這座城裡傳福音、一起被趕出城的三個人。使徒行傳講義第 17 章講過：保羅在這裡只講了三個安息日，暴民就闖進耶孫的家，罪名是「這些人都違背凱撒的命令，說另有一個王耶穌」（徒 17:7）。當天夜裡，弟兄們把保羅和西拉送走了。屬靈的父母走了，留下來的人走不了，他們的家、他們的店都在這裡。"],["p","再看收信的地址。地上的地址是帖撒羅尼迦，一座有人要找他們麻煩的城；更深的地址是「在神我們的父與主耶穌基督裡」。浪打得到城裡，打不到父的手裡。信還沒開始講道理，地址已經先把錨扣好了。"],["p","現在請你想一想：如果今天要你寫一封信，或傳一則訊息，給一位正在受苦的人，一位剛被裁員的同事，一位官司纏身的朋友，一位在家裡受委屈的姊妹，你第一句會寫甚麼？我們常寫的是「加油」「會好起來的」「要有信心」。保羅第一句寫的，不是這些。"],["p","這一課，我們就像那間屋子裡的人一樣，一句一句聽這封信的第一章。照書信三問，先問第一問：帖撒羅尼迦人遇到甚麼？逼迫還在加重，城裡還有一則「主的日子已經到了」的消息在傳，那是下一課的事。這一章在原文幾乎是從第三節一口氣寫到第十節的一句長句。我們用三個字走完它：忍、公、榮。等候主的第一個姿勢，是抬頭。"],["d",["後書一開口說「我們該為你們常常感謝」，是不是保羅的語氣比前書冷淡、比較公事？","有學者這樣讀，因為「該」在原文是欠債、有義務的字，而前書只說「我們為你們眾人常常感謝神」。可是保羅緊接著說「這本是合宜的」，又說信心「格外增長」、愛心「充足」，一連用了兩個比平常多一點的字，看不出冷淡。比較好的讀法是：神做了該被感謝的事，不感謝就是欠著；這個「該」不是規定，是一種公道。這對今天很實際：感謝不是等心情好的時候才做，是看見神做事以後，人欠他的一句話。下一次你要寫信或傳訊息給一位正在受苦的人，可以學保羅，先寫出你在他身上看見神做成的一件事，再說其他的話。"]],["h","二、信的第一句：先感謝，再誇口"],["p","保羅第一句寫的是：「弟兄們，我們該為你們常常感謝神，這本是合宜的；因你們的信心格外增長，並且你們眾人彼此相愛的心也都充足。」（1:3）一間被逼迫、被假消息嚇到、還有人不肯做工的教會，他開口先感謝。他沒有假裝問題不存在，第二、三章會一件一件處理；可是他先看見神在他們身上做成的事。帶領的人最容易先看見破洞，保羅先看見長出來的東西。"],["p","「我們該」，原文是欠債的字。神做了該被感謝的事，不感謝，就是欠著。一個只在順境裡感謝的人，其實是在感謝環境；在逼迫裡還看得見信心在長，才是在感謝神。而且這是保羅前一封信禱告的答案：前書他求神「補滿你們信心的不足」（帖前 3:10），幾個月後，他看見信心「格外增長」，愛心「充足」到每一個人。代禱的人常常看不見結果，這一次，保羅看見了。"],["p","接著是誇口：「甚至我們在神的各教會裡為你們誇口，都因你們在所受的一切逼迫患難中，仍舊存忍耐和信心。」（1:4）請聽「仍舊」兩個字。浪已經在打，而且還沒有停，船還在。保羅沒有說他們的逼迫結束了，也沒有說他們很勇敢、不害怕；他說他們「存」，留在原地。受苦的人常常覺得自己很丟臉、很邊緣，在神的家裡，他們的忍耐卻被別處的教會拿來傳講。"],["p","然後是全章最難懂的一句：「這正是神公義判斷的明證，叫你們可算配得神的國；你們就是為這國受苦。」（1:5）照我們的直覺，好人受苦，正好證明神不公義。保羅把眼光倒過來：證據不是苦難本身，是苦難裡還站著的那一群人。根基只有一個月的新信徒，被圍、被告、被排擠，信心竟然還在長，這不是人撐得出來的。神正在保守他們，這就是神正在作審判官的證據：他看見了，他站在他們這一邊，他也會把事情做完。"],["p","「配得」也很容易聽歪，好像受夠了苦才換得到天國的門票。原文是被動的「被算為配得」，是神宣告，不是人掙來的。保羅在路司得也對門徒說過：「我們進入神的國，必須經歷許多艱難」（徒 14:22）。艱難是路上的風景，不是買路錢。受苦不是入場費，是一張照片，照出你已經屬於哪一國。"],["d",["我正在病痛或冤屈裡，這是不是表示神在審判我、懲罰我？","不是。1:5 的「明證」指的不是苦難本身，是在逼迫中仍舊站著的信心與愛心。帖撒羅尼迦人是「為這國受苦」，不是因為犯了錯被罰。聖經確實有因罪受管教的時候，可是不能反過來說每一個受苦的人都是犯了罪；約伯的朋友就是這樣說錯的。所以如果有人對你說「你受苦，是神在審判你」，請你知道這不是這一節的意思。另一方面，也不要拿這一節當擋箭牌：做錯事、被正當指正的時候，不能自稱是為主受逼迫。分辨的方法很簡單：這件苦是因為我跟從主而來的，還是因為我做錯了甚麼？前一種，主在你那一邊；後一種，回頭認錯，主也在那裡等你。"]],["h","三、原文亮光：留下來、鬆綁、那一張臉"],["p","這一章有三個原文字，每一個都會改變你讀信的聲音。"],["p","第一個字：ὑπομονῆς（hypomonēs），「忍耐」。它由兩個字根合成：「在底下」和「留下來」。意思是在重擔底下不走開。請想一根撐著老屋屋頂的柱子：颱風來的時候，它不是不受力，是受著力還站在原處。所以忍耐不是不痛，是痛著還留下來。1:4 的「你們正在忍受」是現在式，寫信的時候還在扛。如果你這一陣子撐得很辛苦，你沒有失敗；你今天還打開聖經，還坐在這裡，這就是「仍舊」。"],["p","第二個字：ἄνεσιν（anesin），和合本譯作「同得平安」。原意是鬆開：弓弦鬆下來，囚犯鬆了綁，病人終於喘一口氣，都用這個字。1:6 和 1:7 在原文是同一個動詞帶兩組人：給壓人的，壓；給被壓的，鬆綁。「壓」這個字根一連用了三次。請想一位挑了一整天擔子的挑夫，扁擔從肩上卸下來的那一口氣。審判的目的，就是把壓在受苦者肩上的重量拿開。而且是「與我們」同得，保羅把自己算在被壓的人裡面，不是站在岸上喊話。"],["p","第三組字：ὄλεθρον αἰώνιον（olethron aiōnion）ἀπὸ προσώπου τοῦ κυρίου（apo prosōpou tou kyriou），「永遠沉淪，離開主的面」（1:9）。ὄλεθρος 是毀壞；αἰώνιον 和「永生」的「永」是同一個字。可是這一節最重的字不是「火」，是「面」，就是一個人的臉。沉淪最深的地方，是離開主的面，是關係的斷絕。一個人一生對神說「不要管我」，最後，神尊重了他的選擇。"],["p","這一節幾乎逐字化用以賽亞書：「躲避耶和華的驚嚇和他威嚴的榮光」（賽 2:10）。在以賽亞書是耶和華，保羅放上的是主耶穌，這是全卷最強的基督論。永遠沉淪是永遠受苦，還是被消滅？本講義站在歷代教會的傳統讀法，也承認持條件不朽說的是福音派裡的弟兄，不採普救論；細節請看議題頁，課堂上不辯論。課堂上要記得的是另一件事：整封信「永遠」只出現兩次，另一次是神「開恩將永遠的安慰並美好的盼望賜給我們」（2:16）。神寫這封信，是為了第二個「永遠」。"],["d",["「永遠沉淪」到底是永遠受苦，還是最後被消滅？這件事會不會動搖我的信心？","歷代有不同的讀法。永刑說認為「永遠」和「永生」等長，離開主的面是持續的狀態，這是奧古斯丁以來的傳統，也是本講義的立場。條件不朽說認為「沉淪」是毀滅，永遠的是結果，不是過程；這是福音派內的少數立場，本講義不以異端稱之。普救論認為最後人人都得救，本講義不採用，因為這一節的「永遠」直接否定它。三種讀法的細節請看本章議題頁，全卷立場見議題「神的公義審判與永遠沉淪」。這件事不該動搖你的信心，因為兩種福音派讀法都同意最重要的一點：沉淪的核心是離開主的面。該被動搖的，反而是我們對失喪的人的冷漠。讀完這一節，最好的回應不是去辯論，是為一位還不認識主的家人指名禱告。"]],["h","四、伸冤在神，然後抬頭"],["p","「神既是公義的，就必將患難報應那加患難給你們的人」（1:6）。「既是」是前提，不是假設：不是「萬一神公義的話」，是神既然公義，這件事就一定發生。可是這一節最容易讀錯。錯讀的方向是：「等著瞧吧，欺負我們的人將來會很慘。」那樣讀，經文就成了復仇的快感，再往前一步，就成了詛咒仇敵的許可證。請一口氣讀到下一節：「也必使你們這受患難的人與我們同得平安。」（1:7）重心在後半句。"],["p","保羅在羅馬書說：「親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19）。伸冤在神，這句話要分兩半聽。第一半：伸冤在神，所以我不必報仇。我不必在群組裡把他的事一講再講，不必在心裡每天開一次庭。第二半：伸冤在神，所以我也不必假裝沒事。神既然要審判，就表示那件事真的錯了；你不必替傷害你的人說「沒關係」。受了暴力、詐騙、性侵害、職場霸凌的人，說出來、求助、報警、尋求法律的保護，都是正當的。保羅緊接著就說到在上掌權的：「他是神的用人，是伸冤的」（羅 13:4）。不報仇，是把劍放下；求公道，是把門打開，兩件事可以一起做。"],["p","那麼神甚麼時候把事情做完？「那時，主耶穌同他有能力的天使從天上在火焰中顯現」（1:7）。這浪有終點。保羅沒有給日期，主耶穌自己說過：「但那日子，那時辰，沒有人知道」（太 24:36）。我們不算日子，我們只知道那一天一定來，而且是主親自來。還有一個細節：施行報應的是主耶穌自己（1:8），那位為罪人死在十字架上的，就是將來坐在審判位上的那一位。審判在他手裡，比在任何人手裡都安全，包括比在我們自己手裡安全。1:8 說的是「不聽從」福音、還去打擊傳福音的人，不是一份要我們替別人對號入座的名單。"],["p","第九節是谷底，第十節一步跳上山頂：「這正是主降臨、要在他聖徒的身上得榮耀、又在一切信的人身上顯為希奇的那日子。」（1:10）主的榮耀照在哪裡？不在雲彩裡，在「他聖徒的身上」。一群被趕出會堂、被告官、只學了一個月真理的人，站到了最後。保羅還忍不住插一句：「我們對你們作的見證，你們也信了。」（1:10）他怕他們以為「一切信的人」是指更屬靈的別人，所以回頭說：包括你們。今天被人看輕的，那一天被人驚奇。"],["p","保羅的眼睛看到最遠的地方，馬上收回到今天：「因此，我們常為你們禱告，願我們的神看你們配得過所蒙的召」（1:11）。末世觀對了，果子不是更會算日子，是更會禱告。蒙召是一次的，配得過所蒙的召是一生的；而「看」你配得、「用大能成就」的，都是神。目標是：「叫我們主耶穌的名在你們身上得榮耀，你們也在他身上得榮耀，都照著我們的神並主耶穌基督的恩。」（1:12）榮耀是雙向的：耶穌得榮耀的地方，人也一起被抬起來。這一章從恩惠起頭，也在恩典收尾。"],["d",["基督徒可以盼望欺負我們的人受報應嗎？這樣想是不是不夠饒恕？","可以盼望公義，不可以享受報仇。詩篇和啟示錄裡都有受苦的人向神呼求「要到幾時」，聖經沒有責備他們，因為盼望神把錯的事扳正，是承認神是公義的。可是 1:6 一口氣接到 1:7，神審判的目的是把受苦的人鬆綁，不是讓我們看一場報仇戲；主耶穌也吩咐要為逼迫我們的人禱告。所以分辨在這裡：我盼望的是「惡被停止、受苦的人被接出來」，還是「他也嚐嚐我的痛」？前一種可以帶到神面前，後一種也可以帶到神面前，只是要誠實地交出去。饒恕不是假裝沒事，也不是不追究；饒恕是把報應的權柄交給神，我自己不再拿著它。至於饒恕需要多久，不要給自己或別人定期限。"]],["d",["從來沒有聽過福音的人怎麼辦？1:8 是說他們一定都要受報應嗎？","1:8 的上下文，是那些「加患難給你們的人」：聽了福音、拒絕了，還去逼迫傳福音的人。「不聽從」的反面不是「沒聽過」，是聽了不要。所以這一節不是在回答從來沒有機會聽福音的人怎樣，那是需要謹慎陳列的另一個問題，本章議題頁另有處理。講台上要避免兩頭：一頭說「沒聽過的人一定都下地獄」，用恐懼逼人去傳；另一頭說「反正神會處理，不必傳」。保羅傳福音不是因為怕，是因為神「願意萬人得救，明白真道」（提前 2:4）。今天可以做的一件事：寫下一位你身邊還沒有聽清楚福音的人，這一週為他禱告三次，再找一個自然的機會，說一說耶穌在你生命裡做了甚麼。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 1:6 讀成復仇的快感：「等著瞧，欺負我們的人將來會很慘」，甚至帶人禱告求仇敵受報應。1:6 一口氣接到 1:7，審判的目的是把受苦的人鬆綁，不是讓我們看一場報仇戲；寫這封信的保羅，自己說「不要自己伸冤」。"],["p","第二個偏差，是用「交給神」叫受害者閉嘴：被家暴、被性騷擾、被詐騙的人一開口，就被勸「不要記仇」「不要告」「要饒恕」。伸冤在神，是我不必報仇，不是我不可以說出來。把交給神講成閉嘴，等於讓欺負人的人繼續欺負下去。"],["p","第三個偏差，是拿 1:9 嚇人：用火湖的細節逼人決志，用地獄嚇孩子守規矩；或在喪禮、探訪中斷言某一位過世的人永遠的結局。1:9 的核心是離開主的面，而且要和 2:16 永遠的安慰一起讀；一個人最後一刻與神之間發生了甚麼，只有神知道。"],["p","第四個偏差，是把 1:5「配得」講成受苦的功德：越苦冠冕越大，所以不要求助，不要離開危險的處境。「被算為配得」是神的宣告，不是人賺來的；把受苦講成功德，會讓留在暴力關係裡的人以為離開就是失去冠冕。"],["p","第五個偏差，是把 1:7「從天上在火焰中顯現」配上國際新聞，推算主再來的年份，或點名某個政權、某個宗教領袖、某種科技就是 1:8 那些要受報應的人。保羅寫這封信，正是因為有人說主的日子到了；歷史上每一次算日子、點名都錯了，每一次都傷了人。"],["d",["被家人或教會的人傷害，報警或提告，算不算不屬靈、不饒恕？","不算。伸冤在神，意思是我不必自己報仇，不是我不可以說出來、不可以求助。保羅自己在腓立比被冤枉下監，第二天要求官長親自來領他出去；他也說在上掌權的「是神的用人」。神設立法律、官長和教會的保護，正是要讓受害的人用。實際上可以這樣做：第一，若有立即的危險，先保護自己和孩子，撥打當地的緊急電話。第二，找一位信得過的人說出來，像另一位牧者、輔導或社工。第三，需要的話，尋求法律諮詢。組長若在組裡聽見這樣的事，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。全卷立場見議題「神的公義審判與永遠沉淪」。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家醜不可外揚。很多華人家庭和教會，最怕的不是有人受傷，是事情傳出去。被丈夫打的妻子，被長輩欺負的晚輩，被同工佔便宜的姊妹，常常聽到同一句話：「為了大家好，不要鬧大。」再加上一句屬靈的「交給神吧」，傷口就被封起來了。可是 1:6 說神要審判，就表示那件事是真的錯了。保護受害的人，陪他求助，不是揚家醜，是愛。"],["p","第二個問題：喪禮上的那一個問題。很多弟兄姊妹的父母到過世都沒有信主。讀到 1:9，心裡最怕的一句是：「我爸爸現在在哪裡？」請不要讓任何人在棺木旁替他宣判，也不要用一句「他一定在天堂」把問題蓋過去。我們可以誠實地說：那是神的位子，審判在一位最公義、也最慈愛的主手裡。我們能做的，是好好哀哭，也為還活著的家人每天指名禱告。"],["d",["我的父母到過世都沒有信主，讀到 1:9 很難過，我該怎樣面對？","先容許自己難過。這不是信心不夠，是愛。1:9 是寫給受逼迫的人的安慰，不是寫來讓我們在棺木旁替人宣判的；一個人最後一刻與神之間發生了甚麼，只有神知道。所以不要讓任何人對你說「他一定在地獄」，你也不必勉強自己說「他一定在天堂」來壓住不安。你可以誠實地把這份不安帶到主面前，說：審判在你手裡，你是最公義、也最慈愛的。然後把這份愛轉向還活著的人：為兄弟姊妹、為兒女每天指名禱告。若喪親的哀傷很久都過不去，影響睡眠和工作，請找牧者或專業的哀傷輔導陪你走一段。小組長遇到這樣的組員，陪他哀哭，不急著給答案。"]],["h","七、活出321——讓人作人，讓神作神"],["p","信讀到這裡，我們才把國度321空中團契常說的一句話接上去：讓人作人，讓神作神。審判是神的位子，我回到人的位子：受了傷，就承認受傷；能求助，就求助；我做不了的那一份，留給那一位一定會來的主。想自己報仇，是離開本位，伸手去抓神的權柄；假裝沒事，是連人的位子也不肯站。"],["p","耶穌是我的榜樣：伸冤在神，他自己先走過。「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（彼前 2:23）他沒有回擊，也沒有假裝不痛。"],["p","聖經是我的準則：1:6 一定和 1:7 一起讀，1:9 一定和 2:16 一起讀。斷章取義的經文，最會傷人。"],["p","聖靈是我的引導：哪一件事該交給神，哪一件事該報警、該說出口，求聖靈給你分辨，也找一位成熟的弟兄姊妹一起分辨。"],["p","讓耶穌作王：把心裡那間每天開庭的法院關掉，把判決書交給要從天上顯現的那一位。也看清另一面：讓耶穌作王，不是讓欺負人的人繼續作王。"],["p","讓耶穌得著一切的榮耀：主的名「在你們身上得榮耀」，就在今天被冤枉卻不還手、很想在群組裡反擊卻先去禱告的那一刻。"],["p","建立屬神的體系：像保羅在各教會裡為受苦的人誇口，我們也把受苦肢體的名字帶進小組代禱；整理一份本地的法律扶助與輔導資源，讓受欺負的人知道門在哪裡，不讓任何一個人獨自面對。"],["h","八、四種心，那個名字還坐在哪裡"],["p","驕傲型的心，坐在審判席上。那個人的判決你早就寫好了，連刑期都算好了，嘴上說交給神，心裡還在等著看他倒楣。這一章請你從那張椅子上站起來：那是主耶穌的位子。"],["p","恐懼型的心，怕的是惡人永遠得逞，怕自己撐不到最後，也怕群組裡那些末日的消息。請聽 1:7：這浪有終點，而且是主親自來結束它。你不必算日子，只要抬頭。"],["p","羞恥型的心，覺得自己甚麼都沒有存住，只是每天還來；覺得被欺負是因為自己不夠好，說出來就丟臉。保羅卻在神的各教會裡為這樣的人誇口。你那一份「仍舊」，神看見了，那一天要成為主的榮耀照出來的地方。"],["p","受傷型的心，也許你今天就坐在傷害的現場裡。請聽清楚：神說那件事有關係。你不必勉強原諒，也不必假裝沒事；若你正處在危險裡，請告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:7–10，讀到「要在他聖徒的身上得榮耀」時停下來，說一句：主啊，我等你來；然後誠實告訴他今天最壓在你身上的一件事。"],["p","第二，把那個你一直放在心裡的名字寫在紙上，帶到主面前說：伸冤在你，我不報仇，我也不假裝沒事。"],["p","第三，如果你正在受傷害，這一週約一位信得過的人說出來；該報警的報警，該找法律諮詢或輔導的，打出第一通電話。"],["p","第四，選一位正在受苦的弟兄姊妹，像保羅那樣替他向神感謝，然後親口或寫一封短信告訴他：你的忍耐，神看見了，我也看見了。"],["p","第五，下一次在職場或群組裡被搶功、被誤會時，先停十秒，不在當下反擊；需要澄清的，用事實、平靜地說，然後照常把手上的工作做好。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神是公義的，他看見了；伸冤在他，所以我不必報仇，也不必假裝沒事。"],["p","我宣告：主耶穌必從天上顯現，這浪有終點；我不算日子，我抬頭等他。"],["p","我宣告：我的忍耐不是白白的；我被算為配得神的國，是因為恩典，不是因為我受夠了苦。"],["p","我宣告：主耶穌的名要在我身上得榮耀，我也要在他身上得榮耀，都照著神的恩。"],["d",["「把那個名字寫在紙上，帶到主面前」，這一週實際上要怎麼做？","可以分四步。第一，找一個安靜的時間和地方，例如星期二晚上睡前，在餐桌旁。寫下那個人的名字，或只寫你們的關係。第二，在名字下面誠實寫出他對你做了甚麼、你有多痛，不修飾，也不假裝已經好了。第三，讀 1:6–7，然後禱告：主啊，伸冤在你，我不報仇；我也不假裝沒事，求你給我勇氣去做該做的事。第四，在紙的最下面寫一件這一週你要做的事：也許是約一位信得過的人談，也許是打一通法律諮詢的電話，也許只是今天不在群組裡反擊。若寫的過程讓你非常難受，停下來，打電話給一位信得過的人，不必一個人寫完。"]],["h","十、結語"],["p","我們回到那間屋子。信讀到「這正是主降臨、要在他聖徒的身上得榮耀」的時候，屋裡很靜。逼迫明天還在，店也許還會再被砸，可是他們知道了一件事：這浪有終點，終點是榮耀。保羅沒有在信的第一章解釋為甚麼是他們、為甚麼是現在；他給他們的不是一個答案，是一張臉。那一位要從天上顯現的主，手上有釘痕，他知道被壓在地上是甚麼滋味。"],["p","所以這一課的焦點，不在那個欺負你的人將來會怎樣，不在主再來是哪一年，也不在我們有多會忍。焦點在那一張要轉過來向著你的臉。你不必更怕那一天，也不必更佩服誰，只要更愛這一位主，抬起頭來，等他。"],["p","我們一起低頭禱告。天父，謝謝你是公義的，你看見了每一個受壓的人。我們把心裡那個名字交給你，我們不報仇，也不假裝沒事；求你給正在受傷害的弟兄姊妹勇氣說出來，為他們預備安全的幫助。求你保守每一位仍舊存忍耐的人，叫主耶穌的名在我們身上得榮耀。我們抬起頭來等候你的兒子從天上顯現。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最能忍，是讓每一個人誠實說出一個還壓在身上的重量，也說出這一週要把它交給誰、要向誰求助；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是忍、公、榮。席上可能有正在受欺負、
