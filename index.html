受暴力、或剛失去親人的人，也可能有心裡一直在開庭的人；請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：忍耐是痛著還留下來；1:6 要和 1:7 一起讀；1:9 的核心是離開主的面。"],["n","1. ★ 說一次你收到一封信、一張卡片或一則訊息，正好在你最難的時候：是誰寄的？上面哪一句話你到今天還記得？"],["n","2. ★★★ 保羅說神審判，是要「也必使你們這受患難的人與我們同得平安」。請用一句話說：為甚麼 1:6 一定要和 1:7 一起讀？只讀 1:6 會讀出甚麼？"],["n","3. ★★ 1:9 最重的字是「面」，不是「火」。這和你以前聽到的地獄講法有甚麼不同？為甚麼一定要同時讀 2:16 的永遠的安慰？"],["n","4. ★★ 「伸冤在神，所以我不必報仇；伸冤在神，所以我也不必假裝沒事。」這兩句話，你比較常忘記哪一句？請舉一個家庭或職場的例子。"],["m","帶領提醒：第三題不展開永刑與條件不朽的辯論，指向議題頁；有人提到過世的家人，不替任何人斷言結局。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一個還壓在身上的重量或一個放不下的名字，從神是公義的出發，說出這一週要交給神的和要去求助的。"],["t","【看】看見自己"],["n","5. ★★★ 說出一個你到今天想起來胸口還會緊一下的人或事（可以只說關係）：那件事發生在哪一年？這幾年你比較像在心裡開庭，還是比較像假裝沒事？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:6–7 兩遍，第二遍讀到「同得平安」時停下來，說一句：神想從你肩上拿走的那個重量是甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你交不出去、或說不出口，卡在哪裡：怕交給神就等於算了、怕說出來被說不屬靈、怕家醜外揚，還是覺得自己活該？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「伸冤在主，我不報仇，我也不假裝沒事。」右手邊的人只回一句「主看見了」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要交給神的一個名字，和你要去求助或說出口的一件事：是對誰、星期幾、在哪裡、第一句話要說甚麼？"],["m","帶領提醒：這一化可能碰到被欺負、受暴力、詐騙或喪親的經驗。不追問細節，可以只說關係、不說名字；不要求任何人原諒誰，不對正在流淚的人說「你要有信心」。若有人說出正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天讀 1:7–10 抬頭等主、替一位受苦的人感謝並告訴他、在群組裡不反擊、把福音講給一個人聽。"],["n","10. ★★ 說出一位你知道正在受苦、受欺負或剛失去親人的弟兄姊妹，這一週哪一天你要打電話或寫短信給他？你要寫的第一句感謝是甚麼？"],["n","11. ★★ 說出一個你最容易被激怒的群組或場合，下一次被誤會或被搶功時，你停十秒以後要先做的一件事是甚麼？"],["n","12. ★ 我們小組可以為哪一間正在受逼迫的教會，或哪一位受苦的肢體，固定代禱一個月？由誰負責每週提醒？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要陪他走的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：主看見了你的忍耐，他一定會來。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，神是公義的，所有被壓的、被冤枉的，他都看見了。第二句，耶穌自己先被冤枉、被釘死，他要再來，把壓在人身上的重量拿開。第三句，所以你不必自己報仇，也不必假裝沒事，可以抬起頭來等他。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多忍耐」這類答案；正在受傷害的組員，這一週的功課就是找到安全和幫助，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要交給神的那個重量是甚麼，要去陪的那一個人是誰。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位正在職場、學校或家裡受欺負的人，求主保護他，給他找到幫助的勇氣；一間在世界某處為信仰受逼迫的教會，求主叫他們仍舊存忍耐和信心；一位剛失去親人的弟兄姊妹，求主親自安慰他。"],["p","散會以前，確認紙上寫了三樣：要交給神的那個名字、要去求助或說出口的那一件事、你的那個「2」。下次帶來對。"]]},"2":{"no":2,"vol":"《321帖撒羅尼迦後書講義》第二課·帖撒羅尼迦後書第二章","title":"站，不是坐——驚、氣、錨","chars":5093,"min":60,"deep":8,"dchars":1726,"tchars":1400,"blocks":[["h","一、教會門口的一段對話"],["p","弟兄姊妹平安。主日早上九點半，教會門口。美玲姊妹站在台階下，手機舉得比平常高。她看見秀蘭走過來，第一句話不是早安：「秀蘭，你看這一則，是我們家族群組裡轉來的。說有人得了異象，主的日子已經開始了，再不準備就來不及。」"],["p","秀蘭接過手機，滑了很久，最後一行是紅字：請轉給你愛的人。她把手機還回去，問：「你看完，心裡怎麼樣？」美玲說：「昨天晚上我兩點才睡著。我一直想，我是不是錯過了甚麼。我媽年紀大了，要不要先轉給她，叫她有個準備？」"],["p","秀蘭沒有馬上回答。過了一會兒她說：「我年輕的時候也收過這種東西。我有一個表哥，那一年把工作辭了，說反正沒有以後了。後來那一天平平安安地過去，他再也沒有回教會。我不是笑他，他是真的愛主，才那麼認真。只是到現在，我還是很捨不得他。」"],["p","美玲低下頭：「那你是說，這些都是假的？」秀蘭說：「我不知道寫這一則的人是誰。我只知道，主一定會來。可是讓我兩點睡不著的，應該不是他。我們先別轉，進去吧，今天剛好讀帖撒羅尼迦後書第二章。」"],["p","以上這段對話是想像的，名字也不是真的。可是你我的手機裡大概都收過這樣的訊息；有人是轉的人，有人是睡不著的人，也許有人就是秀蘭的那位表哥。"],["p","這一課我們走完帖撒羅尼迦後書第二章，用三個字：驚、氣、錨。照書信三問，先問第一問：帖撒羅尼迦人遇到甚麼？一間保羅只講了三個安息日就被趕走的教會，逼迫一天比一天重；然後一則消息傳進來：主的日子已經到了。"],["h","二、一則消息、三個來源、兩個路標"],["p","保羅回信，第一筆不是更正日期，是先提醒他們要見的是誰：「弟兄們，論到我們主耶穌基督降臨和我們到他那裡聚集」（2:1）。「聚集」原文是 ἐπισυναγωγῆς，全本新約只用兩次，另一次在希伯來書：「你們不可停止聚會」（來 10:25）。越覺得那日子近，越不可以一個人晃。被提在大災難之前還是之後，各派讀法不同，都是弟兄，請看全卷立場議題「主的日子、被提與大罪人」；可是沒有一派說，主來了卻把屬他的人忘了。"],["p","接著是全卷那一句命令：「我勸你們：無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌。」（2:2）三個來源排得很整齊。有靈，就是今天的「有人得了異象」；有言語，就是「聽說某某講的」；有冒我名的書信，就是群組裡那一則不知道誰寫的、卻掛了一個大名字的文章。保羅沒有說聖靈不會感動人，他在前一封信說過：「但要凡事察驗」（帖前 5:21）。從聖靈來的，不怕被察驗。"],["p","「現在到了」，原文是完成式 ἐνέστηκεν：已經到了、已經在這裡了。請留意這個口氣。帖撒羅尼迦人怕的不是來不及，是以為自己已經被留下了。被搖動的不只是一張時間表，是「我還是不是屬他的」。今天的假訊息最常用的，也是這種口氣：你已經落後了，要趕快。"],["p","然後保羅給了兩個路標：「因為那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來。」（2:3）路標不是倒數計時器。路標的用處，是讓人知道還沒到，可以安心走路。前書醫的是怠慢，後書醫的是躁進；兩封合讀，才是警醒又安靜。"],["p","第五節是一句很溫柔的話：「我還在你們那裡的時候，曾把這些事告訴你們，你們不記得嗎？」（2:5）「告訴」原文是未完成式，常常說。所以這不是責備，是喚醒：他們不是沒學過，是一則消息進來，把學過的蓋住了。保羅不再教新東西，只說：想起來。"],["d",["「我們到他那裡聚集」是不是講被提？我該相信災前被提，還是災後被提？","這一節的「聚集」和帖撒羅尼迦前書四章的「被提」是同一件事，各派都同意；爭的是時間：在大災難之前、之中、忿怒之前，還是之後。四說都有敬虔的弟兄姊妹持守，都相信主必親自、看得見地再來。本講義不替教會決定被提的時間，各派的理由與難處放在本章議題頁，全卷立場見議題「主的日子、被提與大罪人」。請不要用被提觀分小組，也不要用「你會被留下」催人決志。這一節給你的，是各派共同的安慰：那一天不是把你丟下的日子，是把你招聚到他那裡的日子。"]],["d",["群組裡轉來一則末日訊息，我要怎樣分辨，又要不要回應？","可以照三步走。第一，先不轉，放二十四小時；保羅說的是不要「很快地」被搖動，慢下來本身就是順服。第二，用三個問題察驗：這則訊息和聖經的筆跡相合嗎，有沒有推算年份、點名某人某物是大罪人？它讓我更愛主，還是更害怕？它讓我站穩，還是驚慌、急著叫人做決定？三問有一問不過，就不轉。第三，若要回應，私下回應，不當眾更正。若訊息叫人辭職、賣房、離家，請盡快告訴小組長或牧者。全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。"]],["h","三、原文亮光：動心、攔阻的、站穩"],["p","這一章的原文，我們只拆三組字。它們正好排成一條路：先被搖動，再知道惡被攔著，最後站住。"],["p","第一組字：σαλευθῆναι 和 θροεῖσθαι，「動心」和「驚慌」。σαλευθῆναι 是講船的，船被一個浪打得一歪；後面還跟著「從理智」三個字，意思是被浪從清醒的地方打出去。θροεῖσθαι 是現在式：浪已經過去了，心還在晃。而這個字不是保羅發明的，主耶穌在橄欖山上說：「總不要驚慌」（太 24:6），正是同一個字。使徒處理末日恐慌，沒有新招，只是把主的話再說一次。保羅也沒有說人永遠不可以心裡一跳；「輕易」原文是很快地。收到訊息，心裡一跳，這是人；一跳就轉出去，就是很快地被搖動了。"],["p","第二組字：τὸ κατέχον，「那攔阻的」。「現在你們也知道，那攔阻他的是甚麼，是叫他到了的時候才可以顯露。」（2:6）下一節換成陽性的 ὁ κατέχων，好像一股力量背後有一個位格。攔阻的是誰？教父多讀成羅馬帝國，也有人讀成政府與法治、聖靈與教會、福音的傳揚、神自己的主權，各家都是弟兄。可是決定性的字是「你們也知道」：帖撒羅尼迦人知道，因為保羅當面講過；我們手上少了那一頁。最誠實的回答只有一句：他們知道，我們不知道。"],["p","這一個「不知道」，反而是治末日恐慌的藥。主耶穌自己畫了線：「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道」（太 24:36）。連子都說不知道，任何推算到年份的圖表，就已經越過了這條線。攔阻的名字我們不知道，這個字的動作卻很清楚：邪惡被攔著，要等「到了的時候」。那個時候是他的，卻不是他定的。像一隻被拴著的狗，鍊子多長不在牠手裡。"],["p","第三個字：στήκετε，「站穩」。「所以，弟兄們，你們要站立得穩，凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守。」（2:15）它是現在命令式：繼續站著。2:2 的船被浪打歪，2:15 的腳站定了，全卷「搖動與堅固」就在這兩個字之間翻過來。站穩靠甚麼？不是靠一張更準的末日圖表，是靠「所領受的」。2:2 有一封假的信，2:15 是真的那一封；今天，使徒信上寫的就在我們手裡，就是聖經。新消息不能拿來檢驗舊教訓，舊教訓要拿來檢驗新消息。"],["p","可是這一個字也要小心講。2:15 的「教訓」是使徒交付的教訓，不是教會的規矩、宗派的傳統，也不是牧者或哪一位領袖個人的話。保羅離開帖撒羅尼迦，下一站是庇哩亞，那裡的人「天天考查聖經，要曉得這道是與不是」（徒 17:11）。站得穩的人不怕問問題，因為他知道自己站在甚麼上面。"],["d",["「攔阻的」到底是誰？本講義為甚麼不給一個答案？","因為保羅說的是「你們也知道」。帖撒羅尼迦人知道，因為保羅在他們中間時當面講過；我們手上沒有那一頁口頭教導。教會兩千年來至少有六種讀法：羅馬帝國與皇帝，這是最早的讀法；政府與法治；聖靈或聖靈藉著教會；福音的傳揚與保羅；天使長米迦勒；神自己的主權。本講義不定於一說，詳見本章議題頁與全卷立場議題「主的日子、被提與大罪人」。可是有兩件事經文說得很清楚：邪惡被攔著，那人要等「到了的時候」才能顯露，那時候不是他自己定的；而且連子也不知道那日子。承認不知道，不是信心軟弱，是誠實；害怕常常來自以為自己必須知道一切。"]],["h","四、一面鏡子、一口氣、一扇還開著的門"],["p","現在我們走到全卷最低的地方：「他是抵擋主，高抬自己，超過一切稱為神的和一切受人敬拜的，甚至坐在神的殿裡，自稱是神。」（2:4）這是一張四級的梯子：先抵擋，站到神的對面；再高抬，把自己抬過一切；然後坐下，坐進神的殿；最後開口，說我就是。這條路在聖經第一頁就有了，蛇對人說：「你們便如神能知道善惡」（創 3:5）。大罪人不是新發明，是人類最古老的那個念頭長到了盡頭。"],["p","讀到這一節，最大的試探是馬上替他找一張臉。兩千年來這張臉被貼過很多次，每一次都貼錯了，都有人受傷。所以我們不替任何人、政權、宗教、教派或科技貼這張臉；保羅自己也沒有貼。他接著說：「因為那不法的隱意已經發動」（2:7）。已經，在保羅寫信的那一天，也在每一顆不肯讓神作主的心裡。2:4 不是一張通緝令，是一面鏡子。我不會坐進耶路撒冷的聖殿，可是我可能在晚飯桌上坐上神的位子：這個家我說了算，我的判斷不准人問。讀完這一節，該問的不是「他是誰」，是「我今天坐在哪裡」。"],["p","從最低的 2:4 只走四節，就到了這一句：「主耶穌要用口中的氣滅絕他，用降臨的榮光廢掉他」（2:8）。大罪人花了一整節爬上神的殿，主耶穌只吹了一口氣。保羅化用了以賽亞書「以嘴裡的氣殺戮惡人」（賽 11:4），像看一場已經知道比分的球賽，中間落後幾分，你會安靜地看完。"],["p","接下來兩節一定要照次序讀。先讀這一句：「因他們不領受愛真理的心，使他們得救」（2:10）。那一份愛真理的心，是神送到門口的禮物，目的是使人得救；是人沒有開門。然後才讀：「故此，神就給他們一個生發錯誤的心，叫他們信從虛謊」（2:11）。這使我們想起羅馬書的「神任憑他們」（羅 1:24）：神把人自己選的交還給他。所以這一節不可以拿來說「某某離開教會，就是神給了他錯誤的心」。一位正在懷疑、正在掙扎的人讀到這裡，該聽見的是：門還開著。還在掙扎的人，正是還沒有關門的人。"],["p","然後第十三節的頭兩個字，原文 Ἡμεῖς δὲ，「但我們」，整個畫面翻過來了：「主所愛的弟兄們哪，我們本該常為你們感謝神；因為他從起初揀選了你們」（2:13）。前面十節讓你知道浪有多大，這一節讓你知道船是誰的。這一章結束在一個禱告裡：「安慰你們的心，並且在一切善行善言上堅固你們。」（2:17）善行善言，就是普通的日子裡好好做事、好好說話。保羅把眼睛從末日拉回今天的廚房和工作桌。"],["d",["大罪人是一個人還是一個體制？我們能不能從新聞裡把他認出來？","讀法有幾種：末日一位具體的人物，多數教父與今天多數前千禧年派這樣讀；歷史上一再出現的原型；一個體制；或原型一再出現、最後有一位總結者。改教家曾把它指認為教皇制度，本講義只陳列，不採用。可是不論哪一種讀法，都沒有給我們一份從新聞裡對號的名單。兩千年來這個名字被安在許多君王、領袖、宗教和科技上，每一次都錯了，每一次都有人因此賣房、辭職、離開教會。保羅說「不要被誘惑」，最常見的誘惑恰恰是自以為已經認出大罪人。2:7 說「不法的隱意已經發動」，所以等候主的人該警醒的，不是新聞裡的哪一張臉，是今天在自己心裡運行的那一點高抬自己。全卷立場見議題「主的日子、被提與大罪人」。"]],["d",["我的家人離開了教會，是不是神給了他「生發錯誤的心」，他已經沒救了？","不是。請先讀 2:10，再讀 2:11。次序是：神先把「愛真理的心」送到門口，目的是「使他們得救」；人不領受，神才尊重他的選擇，讓他得到他要的。這是對長期、決意拒絕真理的人的審判，不是給我們拿來替任何一個人下結論的標籤。我們看不見一個人心裡最後的選擇，神看得見；彼得說主「不願有一人沉淪，乃願人人都悔改」（彼後 3:9）。何況有人離開，是被教會傷了，或在懷疑裡掙扎。你能做的是：每天指名為他禱告；不在家族聚會裡用經文評論他；保持關係，讓他知道門還開著。還在掙扎的人，正是還沒有關門的人。全卷立場見議題「神的公義審判與永遠沉淪」。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是算日子、排時間表：把新聞一條一條對號，推出一個年份，或在講台和小組裡掛一張排到年份的末日圖表。主耶穌說連子也不知道，保羅說「你們也知道」，我們手上少了一頁。假裝有一張完整的圖表，不是更屬靈，是越線。"],["p","第二個偏差，是替大罪人找一張臉：把 2:3–4 對號到某一位現存的人物、某一個政權或國家、某一個宗教或教派、某一種科技。每一次指認都錯了，都傷了人，也讓福音被人當成陰謀論。2:4 是拿來照自己的鏡子。"],["p","第三個偏差，是用末日恐嚇人：時候不多了，再不奉獻、再不決志就來不及；世界越來越亂，要囤糧、要逃離城市。保羅的第一句話是「不要輕易動心，也不要驚慌」，最後一句是「你們要站立得穩」。這一章的果效是忍耐，不是恐慌；聽完的人應該睡得更好，不是更糟。"],["p","第四個偏差，是把 2:11 單獨拿出來，說神隨意叫某些人沉淪，或拿來論斷離開教會、正在懷疑的人：「他走了，就是神任憑他了。」次序是 2:10 在先，神的原意是「使他們得救」。把 2:11 單獨讀，會讓一位正在掙扎的人以為門已經關上。"],["p","第五個偏差，是用 2:15「都要堅守」要求會眾對教會的規矩、宗派的傳統或領袖個人的話照單全收，把提問和察驗說成不順服。那是把人的話放上使徒的位子，正是 2:4 那把椅子的小號版本。一間健康的教會，弟兄姊妹問「這句話聖經哪裡說的」，會被感謝，不會被記下來。"],["d",["「凡所領受的教訓都要堅守」，是不是說我不可以質疑牧師或長老的話？","不是。2:15 的「教訓」是使徒交付的教訓，就是今天寫在聖經裡的；它不是教會的規矩、宗派的傳統，也不是任何一位牧者或領袖個人的話。保羅把「信上寫的」和 2:2 那封冒名的信對照：重點是源頭可以核對。帖撒羅尼迦的下一站庇哩亞，人們天天考查聖經，看保羅講的是與不是，被稱為賢良。所以問「這句話聖經哪裡說的」，是尊重聖經，不是不順服。問的方式可以溫和，私下帶著聖經問。天主教與東正教弟兄姊妹持守聖傳，本講義站在惟獨聖經，並尊重他們；全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族群組裡的轉傳。轉末日訊息最多的，常常是我們最愛的長輩；他轉，是因為怕我們沒有準備。晚輩不是不敢說，就是當眾更正，讓長輩沒面子。保羅回信的次序值得學：先提醒他要見的是誰，再談那則消息。私下打一通電話，先問長輩最近睡得好不好、在怕甚麼，然後約他這個主日一起坐。被陪著的人，比被糾正的人更容易站穩。"],["p","第二個問題：家裡那把「我說了算」的椅子。很多華人家庭裡，父親或長輩的話不准問，孩子一問就是「大人講話，小孩別插嘴」；這種文化帶進教會，就變成領袖的話不准問。2:4 照出來的，不只是末日的那一位，也是飯桌上、會議桌上那把椅子。尊重長輩是聖經的教導，可是讓耶穌作王，就是那把椅子上坐的不是我，也不是任何一位人；家人和弟兄姊妹在我面前，要敢說「我有一個問題」。"],["h","七、活出321——站，不是坐"],["p","321 常說：焦點在耶穌，不在自己、不在別人、不在環境。讀完這一章，我們加一句：也不在末日的時間表。321 也說，驕傲是離開本位抓住權力，想要代替神，2:4 那張梯子就是這句話的畫；無己不是去找出大罪人，是從那張梯子上自己走下來。我們的位子是站，不是坐。"],["p","耶穌是我的榜樣：門徒在船上喊救命的時候，經文說：「耶穌卻睡著了」（太 8:24）。他能睡，不是因為浪不大，是因為知道船在父的手裡；同一位主坦然說那日子連子也不知道，卻一點也不慌。"],["p","聖經是我的準則：2:15「信上寫的」就是我們手上的聖經。任何異象、講法、轉傳，都拿去對這個筆跡；舊教訓檢驗新消息，不是反過來。"],["p","聖靈是我的引導：2:13 說「被聖靈感動，成為聖潔」。2:2 那個「有靈」叫人驚慌，2:13 的聖靈叫人聖潔；真從聖靈來的，把人帶向聖潔和真理，不帶向恐慌，也不怕被察驗。"],["p","讓耶穌作王：要讓出來的位子有兩個。一個是掌握時間表的位子，那日子父自己定；一個是 2:4 那把椅子，在家裡、小組裡、公司裡「我說了算」的位子。真正的王一口氣就勝了，不需要我替他坐鎮。"],["p","讓耶穌得著一切的榮耀：2:14 說，神召我們「好得著我們主耶穌基督的榮光」。算得最準的人不得榮耀，一口氣就勝的那一位得榮耀。"],["p","建立屬神的體系：2:1 的「聚集」提醒我們，越是消息亂的時候，越不讓任何一個人一個人晃；小組要成為一個可以把害怕的訊息帶來一起讀、一起禱告的地方。2:5 保羅常常說，這是 321 的「3」，屬靈父母把基礎一再講給初信的人聽，讓他們有東西可以記得；而教訓是使徒的教訓，領袖要可以被察驗。"],["h","八、四種心，被浪打的時候"],["p","驕傲型的心，喜歡看得懂：我研究得最多、我早就看穿，或者在群組裡冷冷回一句「又來了」。轉傳的人和嘲笑的人，其實都站在「我知道」的位置上。這一章問你：你想知道那日子，是因為愛主，還是因為想比別人高一點？你家裡那把椅子，是誰坐著？"],["p","恐懼型的心，一則訊息就睡不著，怕自己被留下、怕家人來不及。請回到 2:13：在任何消息出現以前，你已經是「主所愛的」；這個完成式，不會被一則群組訊息改寫。你可以不知道日子，卻知道自己是誰的。"],["p","羞恥型的心，也許是那個曾經很認真轉過、甚至曾經在小組裡大聲講過一個日子的人。那一天過去了，你不好意思再開口，覺得自己被騙、也騙了人。保羅對受騙的帖撒羅尼迦人沒有嘲笑，他稱他們「主所愛的弟兄們」。你是因為愛主才那麼在意，現在可以抬起頭來，回到弟兄姊妹中間。"],["p","受傷型的心，也許你就是秀蘭的那位表哥：為了一個日子辭了工作、賣了房子，或和家人鬧翻；後來日子過去了，被人笑，也不敢再回教會。今天請聽清楚：你需要的是陪伴，不是嘲笑。教會欠你的，是一雙接住你的手。你不必一個人收拾那些損失，可以找一位信得過的人，慢慢說出來。"],["d",["我曾經因為一個末日預言辭了工作、賣了房子，現在很羞愧，不敢回教會，怎麼辦？","先請你聽一句話：你不必羞愧到不敢回來。帖撒羅尼迦人也被一則消息推倒過，保羅沒有嘲笑他們，他稱他們「主所愛的弟兄們」。你當初那麼認真，多半是因為愛主、怕被留下。實際上可以這樣走：第一，找一位信得過的牧者或弟兄姊妹，私下說出那段經歷，不必一次說完。第二，工作、住處或債務的損失，可以請教會陪你想下一步，必要時尋求專業協助。組長若在組裡聽見這樣的經歷，不嘲笑、不追問細節、不說「早就跟你講過」，會後單獨關心，陪他找下一步。全卷立場見議題「主的日子、被提與大罪人」。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，把分辨三問寫在手機備忘錄的第一頁：這則訊息和聖經的筆跡相合嗎？它讓我更愛主，還是更害怕？它讓我站穩，還是驚慌？這一週收到任何末日、災難、預言類的訊息，先放二十四小時，問完三問再決定。"],["p","第二，每天睡前讀 2:13–17，在「主所愛的弟兄們」那裡停下來，說出自己的名字，再把今天最讓你不安的一件事交給主，求他「安慰你們的心」。"],["p","第三，打一通電話給群組裡最常轉這類訊息的那位長輩，不糾正他，先問他最近睡得好不好、在怕甚麼，然後約他這個主日一起坐。"],["p","第四，這一週記下每一次你心裡說「這件事我說了算」的時刻：在晚飯桌、在小組、在公司。挑其中一次，向那個被你堵住嘴的人說：「你剛才想問甚麼？我聽。」"],["p","第五，想起一位曾經因為末日預言受傷、現在很少來聚會的人，這一週約他喝一杯茶，不談預言，只陪他，說一句：我們很想你。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：主耶穌一定會來；那日子惟獨父知道，我不必算，也不必驚慌。"],["p","我宣告：主耶穌一口氣就勝了；我躲在他後面，不替他坐鎮，也不替誰貼上大罪人的臉。"],["p","我宣告：我是主所愛的，神從起初揀選了我；一則消息改寫不了這件事。"],["p","我宣告：我要站立得穩，抓緊信上寫的；我從那把說了算的椅子上站起來，讓耶穌作王。"],["d",["家裡的長輩一直轉末日訊息，越勸越轉，我要怎樣回應才不傷他？","先把目標放對：不是贏這一場辯論，是陪他站穩。第一，不在群組裡當眾更正，華人長輩最受不了在全家面前沒面子。第二，私下打電話，先問人，不問訊息：最近睡得好嗎？看了這些，心裡怕不怕？第三，找一個時間和他一起讀 2:1–2 和 2:13，告訴他：主一定會來，可是保羅叫我們不要輕易動心；我們是主所愛的。第四，對他說「下次收到，先傳給我，我們一起看」。第五，這個主日去接他一起聚會。若訊息已經叫他想賣房、搬家或把積蓄交給人，請盡快請牧者一起關心。"]],["h","十、結語"],["p","我們回到教會門口。聚會散了，美玲又站在台階下，手機還在手上，那一則訊息也還在。她沒有轉，打開讀經的那一頁，找到 2:15。然後她打電話給媽媽，第一句話是：「媽，你最近睡得好嗎？禮拜天我來接你一起去教會。」"],["p","這一課的焦點，不在美玲學會了分辨，也不在秀蘭說得對，更不在我們終於知道攔阻的是誰。焦點在那一位：他一定會來，他一口氣就勝了，他從起初就揀選了你，他自己要安慰你的心。保羅在下一章還要說：「願賜平安的主隨時隨事親自給你們平安」（3:16）。你不必更怕世界，也不必更佩服誰算得準，只要更愛這一位主。"],["p","我們一起低頭禱告。天父，謝謝你，那日子在你手裡，連最大的浪也被你攔著，主耶穌一口氣就勝了。赦免我們想知道一切、想坐上那把說了算的椅子，也赦免我們嘲笑過那些被消息嚇壞的人。求你安慰今夜睡不著的人，接住曾經為了一個日子失去很多的人，讓他們回到你家裡來。使我們站立得穩，抓緊信上寫的，在一切善行善言上堅固我們，安靜地把今天的工做好，等候你兒子從天降臨。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰對末日懂得多，是讓每一個人說出一則曾經搖動自己的消息，也說出這一週要站穩、要陪伴的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是驚、氣、錨。席上可能有正被末日訊息嚇得睡不著的人，也可能有曾因預言辭職、賣房、離家而受傷的人；請先讀第一化與第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：不要很快地被搖動；攔阻的是誰我們不知道，但邪惡被管著；2:15 的教訓是使徒的教訓，不是人的規矩。"],["n","1. ★ 說一則你這輩子收過、後來發現是假的消息：是誰傳給你的？你當時信了幾分？後來怎麼知道是假的？"],["n","2. ★★★ 2:2 的三個來源「有靈、有言語、有冒我名的書信」，在今天的手機和教會裡各長甚麼樣子？請各舉一個例子，然後說出分辨三問。"],["n","3. ★★ 保羅說「你們也知道」，我們卻不知道攔阻的是誰。為甚麼承認「不知道」，反而能讓一個人比較不驚慌？請用一句話說。"],["n","4. ★★ 2:15 的「教訓」和教會的規矩、領袖個人的話，差別在哪裡？請說一個例子：哪一句常被當成「聖經說的」，其實是人的規矩？"],["m","帶領提醒：不在組裡討論「大罪人是誰」，有人提出現存的人物、政權、宗教或科技，溫和地帶回 2:4 的鏡子。席上若有人曾因末日預言受傷，不嘲笑、不說「早就知道是假的」，陪伴他，會後單獨關心。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出被消息搖動的時刻和自己坐上的那把椅子，並從「我是主所愛的」出發，說出這一週要站穩的一步。"],["t","【看】看見自己"],["n","5. ★★★ 說出最近一次你被一則消息搖動的時候：哪一天、在哪一個群組或場合、那則消息說了甚麼？你第一個動作是轉傳、搜尋、睡不著，還是禱告？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:13 和 2:16–17 兩遍，第二遍讀到「主所愛的弟兄們」時，換成你自己的名字。讀完說一句：神對你說的是甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 對照 2:4 那張梯子：你在家裡、小組或公司，哪一個地方最像坐在「我說了算」的椅子上？你不肯被人問，是怕失去面子、怕失去控制，還是曾經被人這樣對待過？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我是主所愛的，那日子在父手裡；這一週我不轉、不算、不慌。」左手邊的人只回一句「主一口氣就勝了」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要站穩的一步：收到哪一類訊息先放二十四小時，或向哪一位被你堵住嘴的家人、同事說「你剛才想問甚麼？我聽」——是誰、星期幾、在哪裡。"],["m","帶領提醒：這一化可能碰到長期焦慮、失眠、對未來的無望感，或曾因末日預言辭職、賣房、離家的傷。不嘲笑、不追問細節、不要求任何人原諒誰，不對正在流淚的人說「你要有信心」；陪伴他，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：寫下分辨三問、陪一位長輩、接回一位受傷的人、找出你的那個「2」。"],["n","10. ★★ 說出群組裡最常轉末日訊息的那位長輩的稱呼，這一週哪一天你要私下打電話給他，第一句要問甚麼？"],["n","11. ★★★ 說出一位曾經因為預言或末日訊息受傷、現在很少來聚會的人，這一週哪一天你要約他喝茶或吃飯？要約誰一起去？見面時你打算不談甚麼？"],["n","12. ★ 請當場在手機備忘錄寫下分辨三問，給旁邊的人看一眼，並說出你每天睡前讀 2:13–17 的時間。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：主一定會來，可是我們不必驚慌，因為我們是主所愛的。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，耶穌一定會再來，可是那一天沒有人知道，不必被算日子的訊息嚇到。第二句，世上的惡再大，也被神管著，耶穌一口氣就能結束它。第三句，神愛你，你可以平安地過好今天。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更有分辨力」這類答案。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要先放二十四小時的是哪一類訊息，我要陪的那一個人是誰。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位被害怕困住、睡不著的人，求主自己安慰他的心；一位曾為一個日子失去很多、不敢回教會的人，求主差人接住他；一位帶領小組或講台的人，求主保守他不坐上那把說了算的椅子。"],["p","散會以前，確認紙上寫了三樣：分辨三問、要陪的那一個人、你的那個「2」。下次帶來對。"]]},"3":{"no":3,"vol":"《321帖撒羅尼迦後書講義》第三課·帖撒羅尼迦後書第三章","title":"一位放下錐子的弟兄——禱、工、安","chars":4904,"min":60,"deep":8,"dchars":1789,"tchars":1414,"blocks":[["h","一、一位放下錐子的弟兄"],["p","弟兄姊妹平安。「我在帖撒羅尼迦做皮革，縫帳棚，也縫鞋。那年春天，有人在聚會裡站起來說，主的日子已經到了。我回到作坊，看著縫到一半的帳棚，心想，還縫它做甚麼？我把錐子放下了。」這是一位兩千年前的弟兄，他沒有名字留下來，這段獨白是照著經文想像的。"],["p","他接著說：「那以後，我每天傍晚到耶孫家吃飯，桌子是姊妹們擺的，餅是弟兄們用工錢買的。白天我也沒有閒著，我在城裡走，這一家聽消息，那一家傳消息；誰又說看見了異象，誰家的孩子還在做工，好像不信主快來。我覺得自己比誰都警醒。」"],["p","「直到有一天晚上，保羅的信從哥林多來了。有人在燈下一句一句念，念到『若有人不肯做工，就不可吃飯』，我把頭低下去。我等著下一句罵我，可是念到後來，我聽見的是『要勸他如弟兄』。我還是弟兄。」"],["p","獨白到這裡停下。這位弟兄很可能就坐在你我中間，只是今天他放下的不是錐子，是一份工作、一個學期、一段該做完的照顧；他手上一直沒停的，是手機。也許他不是別人，就是我們自己。"],["p","照書信三問，先問第一問：帖撒羅尼迦人遇到甚麼？逼迫還在加重，一則「主的日子現在到了」的消息把人推得搖晃，教會裡有人乾脆停工，反倒專管閒事。保羅寫到最後一章，沒有再講末世的圖表，他講的是今天的飯碗、今天那位不按規矩的弟兄。全卷三章是等候主的三個姿勢：第一章抬頭，第二章站穩，第三章往前走。"],["p","這一課照本章三個詞走：禱、工、安。先禱告，因為主是信實的；再做工，安靜地，不喪志；最後是平安，連那位被記下的弟兄也在裡面。"],["d",["帖撒羅尼迦人為甚麼不做工？真的是因為以為主要來了嗎？","經文沒有直接說原因，學者大致有三種讀法。第一，末世狂熱：2:2 有人說主的日子到了，有人覺得做工沒有意義，這和全卷的處境最貼近。第二，倚賴恩主：羅馬城市裡常有窮人依附富人過日子，信主以後轉而依附教會的愛心桌子。第三，看輕勞動：希臘文化裡體力活被看作低賤。三種可能同時存在，本講義不必選邊。重要的是保羅的處理不是查清楚他們的動機，而是給同一劑藥：安靜做工，吃自己的飯。今天一個人停工的原因也常常是好幾種纏在一起，我們不必先替他下結論，先陪他回到工作台前。本講義的全卷立場見議題「做工、懶惰與教會紀律」。"]],["h","二、先禱告，因為主是信實的"],["p","保羅要下很重的吩咐以前，先開口求人：「弟兄們，我還有話說：請你們為我們禱告，好叫主的道理快快行開，得著榮耀，正如在你們中間一樣，」（3:1）寫信的人是使徒，收信的是一間只聽他講過三個安息日的年輕教會。服事的人也在浪裡，也需要被代禱。"],["p","請留意他求的次序。「行開」原文是跑，主的道被寫成一位跑者。我們為傳道人禱告，常常只求出入平安；這當然要求，第二句保羅就求了：「也叫我們脫離無理之惡人的手；因為人不都是有信心。」（3:2）可是他先求道能跑起來，再求跑腿的人被保護。「無理」原意是不在其位、出格。"],["p","這一節最後一個字是信，下一節第一個字也是信。人的信會短缺，然後保羅說：「但主是信實的，要堅固你們，保護你們脫離那惡者。」（3:3）原文 πίστις（pistis）緊貼著 πιστὸς（pistos）。這一節三個動詞，主詞全是主：主是信實的，主要堅固，主要保護。錨不是綁在船員腰上，是扎在海底的石頭裡。「那惡者」旁邊和合本有小字：或譯脫離凶惡；兩種讀法都通，落點一樣，保護我們的是主。"],["p","那位放下錐子的弟兄，問題不是不夠屬靈，是太怕。怕到不敢再縫一針，彷彿縫下去就是不信。保羅給的不是更多末世消息，是一位信實的主。人越盯著惡，越慌；越看主的信實，越能把手伸回工作台。"],["p","這一點今天很具體。一位姊妹說，她每天睡前滑一小時的預言影片，越看越睡不著，第二天上班整個人是空的。後來她把那一小時換成讀這三節經文，再為一位在遠方的宣教士禱告。消息沒有變少，她的心卻安靜了。保羅的次序是先看主，再看浪。"],["p","接著兩句很軟的話：「我們靠主深信，你們現在是遵行我們所吩咐的，後來也必要遵行。」（3:4）等一下要讀紀律，可是紀律不是從懷疑開始，是從信任開始。再一句：「願主引導你們的心，叫你們愛神，並學基督的忍耐！」（3:5）「引導」是把路修直。和合本的「學」字原文沒有，只說基督的忍耐。忍耐不先是一門功課，是一個地方，基督已經在裡面走完全程，我們是被引進去，在那裡面學。"],["p","還要說清楚一件事。第四節的「吩咐」、第六節的「教訓」、第十四節的「信上的話」，都是使徒的教訓，今天就寫在聖經裡。它不是某間教會的內規、某個宗派的傳統，也不是哪一位領袖的話，包括今天站在前面講的我。帖撒羅尼迦的下一站庇哩亞，那裡的人天天考查聖經。堅守使徒的教訓，是鼓勵你打開聖經察驗，不是禁止你發問。"],["d",["「保護你們脫離那惡者」到底是指撒但，還是指凶惡？","兩種讀法原文都通。τοῦ πονηροῦ 可以是陽性，指那惡者；也可以是中性，指凶惡，所以和合本旁邊有小字：或譯脫離凶惡。這使我們想起主禱文的末句，也有同樣的兩種讀法。上下文支持兩者都在：第二章剛講過撒但的運動，第二節又說到無理之惡人。落點才是重點：保護我們的是主。所以讀這一節，不必凡事都說是鬼在攪擾，因而不處理實際的問題；也不必把批評教會的人、家裡不信的人貼上惡人的標籤。主的保護是叫人站穩，不是叫人到處找敵人。屬靈爭戰的分寸，回指以弗所書立場四。"]],["d",["教會說要「堅守所受的教訓」，那我對同工會的決定有疑問，還可以提出來嗎？","可以，而且應該用正當的方式提出來。帖後的教訓、吩咐、信上的話，指的是使徒的教訓，今天就寫在聖經裡；它不是教會的內規、宗派的傳統，也不是哪一位領袖個人的話。帖撒羅尼迦的下一站庇哩亞，那裡的人天天考查聖經，路加稱讚他們賢於帖撒羅尼迦人。所以分辨的問題只有一個：這件事聖經怎麼說？你可以帶著經文、帶著尊重，私下先找負責的同工談；不在群組裡發洩，也不因為有疑問就被當作不按規矩而行。一個健康的教會，領袖會歡迎會眾打開聖經察驗，連講台上的話也一樣。本講義的全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。"]],["h","三、原文亮光：不肯、專管閒事、不可喪志"],["p","第六節起，保羅換成軍中傳令的口氣：「弟兄們，我們奉主耶穌基督的名吩咐你們，凡有弟兄不按規矩而行，不遵守從我們所受的教訓，就當遠離他。」（3:6）「不按規矩而行」原文 ἀτάκτως（ataktōs），是行軍時脫隊的士兵。可是請聽，他仍被叫作弟兄。然後保羅指著自己：「也未嘗白吃人的飯，倒是辛苦勞碌，晝夜做工，免得叫你們一人受累。」（3:8）他的手藝是縫帳棚，和開場那位弟兄同一行。"],["p","這一節最容易被華人讀成越累越屬靈，所以請聽保羅自己給的理由：免得叫你們一人受累。他做工，是為了不成為別人的重擔。一個人若過勞到把擔子轉給配偶、孩子和醫院的病床，正好走到第八節的反面；歌羅西書講義講過，無己不是苦待己身。第九節他又說：「這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們。」（3:9）有權柄卻放下，這不是反對傳道人支薪，是作一個模子。"],["p","第一個字：οὐ θέλει（ou thelei），不肯。「我們在你們那裡的時候，曾吩咐你們說，若有人不肯做工，就不可吃飯。」（3:10）θέλω 是願意、想要。保羅沒有寫不能做工，也沒有寫找不到工作，他寫的是有能力、有機會，卻不願意。那張桌子是弟兄姊妹用辛苦錢擺出來的，這句話保護的是擺桌子的人。所以投了一百封履歷還沒回音的人、病了的人、身心障礙的人、年老的人、在家照顧孩子或長輩十年沒有薪水的人，都不在這一節裡。不肯做工的不可吃飯，不能做工的教會要供應；同一位保羅說做工是「就可有餘分給那缺少的人」（弗 4:28）。兩句一起讀，才是保羅。"],["p","第二個字：περιεργαζομένους（periergazomenous），專管閒事。「因我們聽說，在你們中間有人不按規矩而行，甚麼工都不做，反倒專管閒事。」（3:11）「做工」是 ἐργαζομένους（ergazomenous），「管閒事」是同一個字前面加上「周圍」。甚麼工都不做，卻在周圍到處做工。開場那位弟兄不是太閒，是太忙，忙錯了地方。今天的版本是群組亮了一整天，末日消息、別人的婚姻，轉了又轉，手上的工一直沒動。保羅開的藥很平凡：「要安靜做工，吃自己的飯。」（3:12）吩咐旁邊還放了勸戒。安靜，是 2:2 驚慌的反面。"],["p","第三個字：μὴ ἐγκακήσητε（mē enkakēsēte），不可喪志。「弟兄們，你們行善不可喪志。」（3:13）原文前面有「但你們」，保羅轉過身，對那些一直在擺桌子的人說話。這個字是在壞處境裡洩了氣、軟下來。請聽：「不可喪志」本身就承認了，行善的人會喪志。保羅知道你累了，所以這一節不是鞭子。服事倦怠不是屬靈失敗；倦怠的人先需要休息與陪伴，有時需要專業的協助。主耶穌自己說：「你們來，同我暗暗地到曠野地方去歇一歇。」（可 6:31）"],["d",["我失業半年了，每次聽到「不做工就不可吃飯」都很難受，這一節是在說我嗎？","不是。請先聽原文：οὐ θέλει 是不肯，不是不能。保羅處理的是有能力、有機會，卻不願意做工，反倒在別人生活裡打轉的人；這句話保護的是那些用辛苦錢擺桌子的人，不是用來打那些正需要桌子的人。你正在找工作，那份找本身就是工。同一位保羅說做工是為了有餘分給缺少的人，又吩咐教會照顧真無倚靠的人；不能做工的，教會要供應。所以你可以放心接受弟兄姊妹的幫助，不必覺得羞愧。也請照顧好自己的心，若低落已經影響吃飯和睡眠，請找牧者或專業的人談一談。全卷立場見議題「做工、懶惰與教會紀律」。"]],["d",["服事好多年，最近一點力氣都沒有，是不是我的屬靈生命出了問題？","不一定，而且這一節正是為你寫的。μὴ ἐγκακήσητε 這個命令本身就承認：行善的人會累、會洩氣。保羅是轉過身鼓勵擺桌子的人，不是責備他們。主耶穌也帶累壞的門徒去曠野歇一歇。可以這樣走：第一，對一位信得過的牧者或同工說出來，不必假裝沒事。第二，真的放下一段時間的事工，讓別人接手，這不是逃兵。第三，檢查睡眠、身體與家庭，必要時尋求醫療或專業協助，這也是愛惜主給你的身體。第四，回到 3:3，撐住教會的是主，不是你。加 6:9 說到了時候就要收成，收成有時候，不是每天。無己不是苦待己身，回指歌羅西書立場四。"]],["h","四、記下他，也記下筆跡"],["p","然後是整段最難的兩節：「若有人不聽從我們這信上的話，要記下他，不和他交往，叫他自覺羞愧。」（3:14）請不要在這裡停，下一節緊緊接上：「但不要以他為仇人，要勸他如弟兄。」（3:15）只讀上一節，它就成了冷暴力、公開點名、切斷家人、封鎖離開的人的藉口；讀到下一節，它才是保羅。"],["p","紀律有四條界線，都在這兩節裡。對象：不聽從使徒信上的話、一直不肯回轉的人，在這一段就是那位不肯做工、專管閒事的弟兄；不是提出疑問的人，不是意見不同的人，也不是受了傷離開的人。方式：「不和他交往」原文是不混在一起，減少一般往來，不再配合他脫隊的生活，不是截圖公告。目的：「自覺羞愧」原文 ἐντραπῇ（entrapē），是他自己轉身回頭看，不是眾人一起羞辱他。底線：他仍是弟兄，教會仍要對他說話。"],["p","想像一個家。一個成年的兒子，有能力工作卻不肯做，天天在家裡惹事。智慧的父母不會把他鎖在門外，也不會在親戚的飯局上數落他；可是他們會停下來，不再替他付所有的帳，讓他看見自己的處境。母親每天晚上還是留一盞燈。退後一步，是為了讓他轉身，不是為了讓他消失。主耶穌說：「他若聽你，你便得了你的弟兄」（太 18:15）。紀律的成功，不是贏了一場爭論，是得回一個弟兄。"],["p","這裡還有一個原文字。「記下他」是 σημειοῦσθε（sēmeiousthe）；三節以後保羅說「凡我的信都以此為記」，那個「記」是 σημεῖον（sēmeion），同一個字根。教會記下一個人，是為了挽回他；保羅記下自己的名字，是為了保護教會。兩個記號，都為了愛。"],["p","接著是全卷地勢最高的一節：「願賜平安的主隨時隨事親自給你們平安！願主常與你們眾人同在！」（3:16）一封寫給驚慌的人的信，最高點是平安。「親自」是主自己；給平安的不是一張正確的末世圖表，是主本身。「眾人」，包括第十四節那位被記下的弟兄。教會可以和一個人保持距離，卻不能把他從禱告裡除名。"],["p","最後保羅從代筆的人手上接過筆：「我－保羅親筆問你們安。凡我的信都以此為記，我的筆跡就是這樣。」（3:17）2:2 說有冒他名的書信，他的對策很樸素：認得我的筆跡。今天使徒的筆跡就在我們手上，就是這本聖經。群組轉來的末日消息、自稱得了啟示的人、轉了十手的見證，拿去對一對；教會的規矩與領袖的話，也要放在這筆跡底下被察驗。書信三問的第三問落在這裡：今天的群組、職場和教會的飯桌。"],["d",["教會真的要處理一位不肯回轉的弟兄，具體該怎麼做才不變成排斥？","照 3:14--15 的四條界線，並配合主耶穌在太 18:15--17 的次序。第一，確認對象：是不聽從聖經的清楚教導、而且一再不肯回轉的人，不是發問的人、意見不同的人或受傷離開的人。第二，先單獨去，再帶一兩位，次序不跳；每一步都溫和、具體、有經文。第三，方式是減少一般往來、不再配合他脫隊的生活，例如不再替他付應付的帳；不點名、不截圖、不叫他的家人跟他斷絕。第四，指定一兩位持續關心他的人，讓他知道門沒有關。第五，定期一起禱告，記得目標是得回一位弟兄。若事情牽涉傷害或違法，先保護受害者、走正當途徑，那不是閒事。全卷立場見議題「做工、懶惰與教會紀律」。"]],["d",["現在網路上很多經文圖、見證影片和預言訊息，怎樣用「筆跡」來分辨？","3:17 的筆跡，今天就是整本聖經。可以問三個問題。第一，它與筆跡相合嗎？不是看有沒有附經文出處，冒名的信最喜歡借使徒的名字；要看它說的和聖經整體的內容與精神合不合。第二，它讓我更愛主，還是更驚慌？2:2 說不要輕易動心，也不要驚慌；凡是靠恐懼推你轉傳的，先停一停。第三，它讓我站穩，還是被推著走？這一卷的落點是安靜做工，不是囤糧、算日子。實際做法：收到這類訊息，先不轉；查一查來源，讀一讀相關的經文；拿不準就問牧者。本講義的全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 3:10 羞辱失業、病弱、身心障礙、年老、在家照顧家人的人，或拿它反對一切救助，暗示領補助的都是懶人。原文是不肯，不是不能；這句話保護擺桌子的人，不是用來打最需要桌子的人。"],["p","第二個偏差，是把 3:8 的晝夜做工講成同工的標準：不休假才是忠心，越累越屬靈。保羅的理由是免得叫人受累，把自己累垮、把擔子轉給家人，正是第八節的反面。"],["p","第三個偏差，是只讀 3:14 不讀 3:15，在群組裡截圖、在講台上點名、叫家人跟他斷絕往來，或把「不和他交往」用在發問的人、意見不同的人、受傷離開的人身上。那不是紀律，是排斥。"],["p","第四個偏差，是把「從我們所受的教訓」講成教會規矩、宗派傳統或領袖個人的話，說不聽同工會就是不按規矩而行，用堅守教訓壓下提問。使徒的教訓今天在聖經裡，連講台也要被它察驗。"],["p","第五個偏差，是把 3:13 當鞭子，對倦怠、低落的同工說你這是屬靈退步、再撐一下就好。保羅是轉身鼓勵擺桌子的人；倦怠需要的是休息、陪伴，必要時是專業的協助，不是多一句責備。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：一個人的價值，是不是等於他的產值？華人很會拚，從小聽到大的是不勞無獲。教會裡也容易把有薪水的工叫工作，把照顧失智父親、陪孩子復健叫沒在做事。3:10 落在這裡要說清楚兩件事：有能力的人要負自己的擔子，這是尊嚴；不能做工的人不因此少一分價值，教會的桌子有他的位子。失業的弟兄去投一封履歷，在家照顧長輩的姊妹按時餵一頓飯，在主面前也是安靜做工。"],["p","第二個問題：家醜不可外揚，和勸他如弟兄。華人教會碰到一位脫隊的弟兄，常常走兩個極端：一是誰都不說，怕傷和氣，大家在背後議論，卻沒有人當面去；一是一說就鬧大，群組裡傳開，最後他和全家一起離開。保羅給的是第三條路：有人負責、當面、溫和地勸，退後一步卻不放手。這需要勇氣，也需要愛。"],["h","七、活出321——往前走的人，靠主的信實"],["p","經文先說完了它的話，321 才在這裡接上。國度321空中團契常說：焦點在耶穌，不在自己、不在別人、不在環境；這一卷再加一句，也不在末日的時間表。"],["p","耶穌是我的榜樣：3:5 說的是基督的忍耐。他在拿撒勒做了多年木匠，安安靜靜吃自己的飯；他說「我父做事直到如今，我也做事。」（約 5:17）他也帶累壞的門徒去歇一歇。做工與安息都在他身上。"],["p","聖經是我的準則：3:17 的筆跡就是我們的準則。讀 3:10 要讀到「不肯」，讀 3:14 要讀到 3:15；任何聲音，包括講台，都放在這筆跡底下。"],["p","聖靈是我的引導：3:5 求主引導人的心，把彎了的路修直。被末日消息嚇過、被服事耗盡過的心，求聖靈帶回神的愛和基督的忍耐裡。"],["p","讓耶穌作王：讓出兩個位置。一個是「我來撐住一切」的位置，3:3 的主詞是主；一個是審判者的位置，3:15 不准把弟兄當仇人。可以自己檢查：這一週，我在哪一件事上還在替主撐天，或替主判人？"],["p","讓耶穌得著一切的榮耀：3:1 先求主的道得著榮耀；3:9 保羅有權柄卻放下，人看見的是主，不是使徒的派頭。建立屬神的體系：3:12 每個人安靜做工，擺桌子的人不被吃垮，3:14--15 紀律有界線、有目的；人比事重要。920 的那個 2，有時正是那位不按規矩而行的人。"],["h","八、四種心，回到工作台前的四種腳步"],["p","驕傲型的心，擺了很久的桌子，開始覺得自己有資格判斷誰配吃飯，看那位脫隊的弟兄越看越像仇人。這一章對你說：「但不要以他為仇人」。撐住這個家的不是你，是信實的主。"],["p","恐懼型的心，就是開場那位放下錐子的弟兄：怕主來時自己手上還拿著工具，於是甚麼都不敢做，只敢一直看消息。請聽 3:3，主是信實的，要堅固你。安靜把今天的工做好，正是信他的樣子。"],["p","羞恥型的心，也許你失業很久，也許你病了、老了，或在家照顧人沒有收入，一聽到 3:10 就抬不起頭。請聽清楚：這一節說的是不肯，不是不能。你不在這一節裡，你在「眾人」裡，教會的桌子有你的位子。"],["p","受傷型的心，也許你曾被教會用「不和他交往」對待過，或服事到耗盡時被說成屬靈退步。那不是保羅的意思。3:15 說你是弟兄，3:13 是主看見你的疲乏。你可以先休息，可以找一位信得過的人陪你，必要時尋求專業的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上開始工作以前，先讀 3:3，說一句：今天撐住我的是你，不是我。然後把手機翻過來，先做完一件份內的工。"],["p","第二，找出你最常專管閒事的那一個地方：一個群組、一段別人的家務事。這一週選三天，把那三十分鐘拿回來，做一件拖了很久的工。"],["p","第三，照 3:1 為一位牧者或宣教士禱告：先求主的道快快行開，再求他脫離無理之惡人的手；寫一句短訊告訴他你求了甚麼。"],["p","第四，想一位一直在擺桌子的同工，這一週替他接下一件具體的事，讓他可以歇一歇。"],["p","第五，想一位很久沒有出現的弟兄姊妹，不在群組裡談他，親手寫一張卡片或打一通電話：我想起你，你仍是我的家人。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：人的信會短缺，但主是信實的；他要堅固我，保護我脫離那惡者。"],["p","我宣告：我要安靜做工，吃自己的飯；我的價值不在產值，在那位信實的主。"],["p","我宣告：我行善不喪志；累了，我可以在主面前歇一歇，再往前走一步。"],["p","我宣告：我不以弟兄為仇人；賜平安的主隨時隨事親自給我平安。"],["d",["「把專管閒事的三十分鐘拿回來」這個練習，具體要怎麼做？","四個步驟。第一，先看一週的紀錄：手機的螢幕使用時間，或簡單回想，你花最多時間追的是哪一個群組、哪一段別人的家務事。第二，寫下一件屬於你份內、拖了很久的工：一份報告、一頓為家人煮的飯、一封該回的信、一份履歷。第三，選三天，把那三十分鐘的手機放到另一個房間，開始前讀 3:12，然後只做那一件事。第四，做完以後向主說一句謝謝，不必向人炫耀。若你發現自己的問題剛好相反，份內的工多到沒有休息，就把那三十分鐘拿來真正休息；3:8 說免得叫人受累，這也是安靜做工。"]],["h","十、結語"],["p","我們回到那位放下錐子的弟兄。照著經文想像，第二天天還沒亮，作坊的門被推開了。他拿起那張縫到一半的帳棚，坐下來，縫了第一針。沒有人在旁邊鼓掌，只是傍晚到耶孫家的時候，他手裡多了一條自己買的餅。"],["p","可是這一課的焦點，不在那位弟兄回頭得多漂亮，也不在保羅多能做工。焦點在這一章撐住一切的那一位：「但主是信實的」，他叫我們「行善不可喪志」，他「隨時隨事親自給你們平安」，而他的話有筆跡可對，「我的筆跡就是這樣」。真正一步也沒有喪志的，是基督自己；我們是被引進他的忍耐裡，在那裡面學。"],["p","我們一起低頭禱告。信實的主，我們承認，有時我們怕得放下手上的工，有時又累得想放棄桌子，有時把一位弟兄看成了仇人。謝謝你，人的信會短缺，你卻信實。求你堅固失業的、生病的、照顧家人的，讓他們知道你的桌子有他們的位子；求你給疲乏的同工真正的安息；也求你讓我們成為去勸他如弟兄的人。願賜平安的主，隨時隨事親自給我們平安。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰比較勤快，是讓每一個人說出自己放下的那一把錐子、忙錯的那一個地方，也說出這一週回到工作台前的那一步；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是禱、工、安。席上可能有正在失業、生病、照顧家人的人，有服事到倦怠的同工，也可能有曾被教會排斥過的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：主是信實的，所以可以安靜做工；3:10 是不肯不是不能；紀律有四條界線，3:14 一定讀到 3:15。"],["n","1. ★ 開場那位弟兄放下了錐子。你人生裡有沒有一段時間，因為害怕或灰心，把該做的工放下了？那是甚麼工、哪一年？"],["n","2. ★★★ 3:2 說人不都是有信心，3:3 接著說但主是信實的。這兩句緊貼在一起，對一個怕自己撐不到底的人有甚麼意思？"],["n","3. ★★ 請用自己的話說出不肯和不能的分別，再說一說：為甚麼這句話保護的是擺桌子的人？教會怎樣同時讀兩句？"],["n","4. ★★ 紀律的四條界線是對象、方式、目的、底線。請各舉一個例子，說明怎樣的做法越過了界線，變成排斥或冷暴力。"],["m","帶領提醒：談到 3:10 時，不讓任何人說輕看失業、病弱、身障、年老或照顧家人者的話；談到紀律時，不點名組裡或教會裡任何一個人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己忙錯地方或累過頭的那一處，在「但主是信實的」裡聽見神怎樣撐住他，並說出這一週回到工作台前的那一步。"],["t","【看】看見自己"],["n","5. ★★★ 上一週，你花最多時間關心、轉傳、議論的是誰的事？那段時間裡，哪一件你份內的工被擱在一旁？或者，你是不是那個累到快撐不住的擺桌子的人？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:3 兩遍，第二遍把「你們」換成你自己的名字。讀完說一句：你聽見主怎樣看你、怎樣撐住你？"],["t","【想】想通關卡"],["n","7. ★★★ 你回不到工作台前，或停不下來休息，卡在哪裡：怕主來時自己還在做事、怕被看成沒用、覺得教會要靠你撐，還是曾經被人當成仇人？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「撐住我的，不是我，是信實的主。」左手邊的人只回一句「你仍是我們的弟兄（姊妹）」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你回到工作台前的那一步：星期幾、幾點、做哪一件份內的工；若你是累過頭的人，改寫下你要休息的那一段時間，和你要交給誰接手的那一件事。"],["m","帶領提醒：這一化可能碰到失業、病弱、照顧家人、服事倦怠、被教會排斥的經驗。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也絕不拿 3:10 或 3:13 去催人。若有人說出長期的低落或無望，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一段拿回來的時間、一位要代禱的牧者或宣教士、一位要勸他如弟兄的人。"],["n","10. ★★ 說出這一週哪三天、哪一個時段，你要把專管閒事的三十分鐘拿回來，做哪一件拖了很久的工？"],["n","11. ★ 照 3:1 的次序，說出一位你要為他禱告的牧者或宣教士的名字，以及你要先為他求的那一句，和你哪一天要傳短訊告訴他。"],["n","12. ★★ 說出一位一直在擺桌子的同工，這一週你要替他接下哪一件具體的事，哪一天、在哪裡交接？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，有時正是那位很久沒有出現、或脫了隊的人。當場說出他的名字，說出這一週哪一天、用甚麼方式向他分享：主是信實的，你仍是我的家人。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一群人以為世界末日到了，就不上班，整天傳消息。第二句，有人寫信告訴他們，神是信實的，所以可以安安靜靜把今天的工做好，累了也可以歇一歇。第三句，你不必被各種消息推著走，也不必靠產值證明自己，有一位主隨時要給你平安。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更勤快」「我會少滑手機」這類答案；若那位要關心的人曾傷害組員，不勉強接近，改由別人去。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週回到工作台前的那一步，或要休息的那一段，是甚麼。"],["p","然後彼此代禱，為三種人指名禱告：一位正在失業、生病或照顧家人的人，求主讓他知道桌子有他的位子；一位服事到倦怠的同工，求主給他真正的安息與同伴；一位脫隊的弟兄姊妹，求主讓你成為勸他如弟兄的人。"],["p","散會以前，確認紙上寫了三樣：拿回來的那段時間、要代禱的那位牧者、你的那個「2」。下次帶來對。"]]}}}</script>

      '答案其實就在經文裡。'
    ],
    /* 五步驟：{k} 是「看」「聽」「想」「講」「行」，{t} 是內容 */
    step: [
      '這一步是「{k}」。{t}',
      '接下來我們「{k}」。{t}',
      '「{k}」這一步：{t}',
      '先來「{k}」。{t}',
      '我們「{k}」。{t}'
    ],
    /* 收尾 */
    wrap: [
      '我們來收尾。',
      '最後，我們把這一段收起來。',
      '到這裡，我們收個尾。',
      '讓我們把這一段收在一起。'
    ],
    /* 表格：畫面上是表，耳朵裡是一段話 */
    table: [
      '這裡有一張表，我用說的帶你看過一遍。',
      '接下來這一段本來是一張表，我把它讀成一段話。',
      '這一段我整理成了表格，用聽的是這樣。',
      '底下是一張對照表，我一列一列說。'
    ],
    /* 條列 */
    list: [
      '這裡有幾點。',
      '底下分成幾點來看。',
      '這一段有幾點。',
      '我列了幾點。'
    ],
    /* 引用經文 */
    quote: [
      '經上說：',
      '聖經這樣說：',
      '我們來讀這一節：',
      '這一節是這樣寫的：'
    ],

    /* ── 開始、暫停、停止、接續 ──────────────────────────────────
     * 這四件事本來沒有聲音：按下去就開始唸，按停就沒聲了。
     * 少了這一句話，聽的人不知道自己在哪裡——尤其是「從書籤繼續」，
     * 冷不防從半路唸起，耳朵會以為前面漏掉了。
     *
     * 一位牧者不會這樣帶人。他會說「我們接著上次停的地方」。
     * ------------------------------------------------------------- */

    /* 開始：{t} 是這一課的名字 */
    start: [
      '我們一起來讀{t}。',
      '{t}。我們開始。',
      '來，我們讀{t}。',
      '我們從{t}開始。',
      '{t}，我們一起聽。'
    ],
    /* 開始，可是不知道叫什麼名字 */
    startBare: [
      '我們開始。',
      '來，我們一起來讀。',
      '我們一起來讀這一段。',
      '好，我們開始讀。'
    ],
    /* 指定從第幾段開始：{n} 段序，{t} 標題 */
    startAt: [
      '我們從第{n}段開始，{t}。',
      '這一次從第{n}段起，{t}。',
      '我們直接來到第{n}段，{t}。',
      '從第{n}段讀起。{t}。',
      '我們從第{n}段往下讀，{t}。'
    ],
    /* 指定從第幾段開始，可是那一段沒有標題 */
    startAtBare: [
      '我們從第{n}段開始。',
      '這一次從第{n}段起。',
      '我們直接來到第{n}段。',
      '從第{n}段讀起。'
    ],
    /* 接著上次停的地方：{n} 段序 */
    resume: [
      '我們接著上次停的地方，從第{n}段繼續。',
      '上一次讀到第{n}段，我們從那裡接下去。',
      '我們回到第{n}段，接著往下讀。',
      '接著剛才停下來的地方，第{n}段。',
      '我們從第{n}段再往下走。'
    ],
    /* 暫停 */
    pause: [
      '我們先停在這裡。',
      '先停一下。',
      '到這裡先歇一口氣。',
      '我們暫時停在這裡。'
    ],
    /* 停止 */
    stop: [
      '今天先讀到這裡。',
      '我們就讀到這裡。',
      '這一段先停在這裡。',
      '好，我們先到這裡。'
    ]
  };

  /* 表格與條列讀出來的零件。
   *
   * 這一組本來寫死在程式裡，英文版於是唸成
   * 「What follows was laid out as a table. 先看「x」，y。」——
   * 一半英文一半中文，而且所有測試都過，因為沒有人驗長相。
   *
   * 凡是會被唸出來或看到的字，一律要能換掉。 */
  var W = {
    rowFirst: ['先看', '我們先看', '第一個'],
    rowMid: ['再看', '接著', '然後', '再來', '接下來'],
    rowLast: ['最後'],
    cols: '這張表有{n}欄：{list}。',
    row2: '{link}「{label}」，{value}。',      // 兩欄表
    rowN: '{link}「{label}」：{parts}。',      // 三欄以上
    pair: '{col}是{value}',
    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

  function title_(t) {
    return String(t == null ? '' : t).replace(/[。．.\s]+$/, '');

  function start(title, i) {
    var t = title_(title);
    if (!t) return pick('startBare', i);
    return fill(pick('start', i), { t: t });
  }

  function startAt(n, title, i) {
    var t = title_(title);
    var v = { n: num(n), t: t };

    return fill(pick('startAt', i), v);
  }

  function resume(n, i) {

  }

  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────

   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  function blocks(md) {

        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push({ k: 'table', head: head, rows: rows });
        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;
      }
      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

  /* 行內：粗體、行內碼。斜體不做——`*` 跟條列的記號同一個，
     分不乾淨的時候寧可原樣留著，也不要把句子拆壞。 */
  function inlineHTML(t) {
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');

  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
         十點全部報數，聽的人會累。 */
      var ww = w();
      var head = j < 2 ? fill(ww.itemFirst, { n: num(j + 1) })
               : (j === b.items.length - 1 ? ww.itemLast
                  : fill(pick('item', i + j), { n: num(j + 1) }));
      out.push(head + t + (/[。！？.!?]$/.test(t) ? '' : ww.end));
    }
    return out.join('');
  }

  /* 整段 Markdown → 適合唸出來的純文字。
     opt.drop：一個 fn(text)->text，唸之前還要拿掉的東西
     （例如括號裡的經文出處：REF321.dropParenRefs）。 */
  function speech(md, opt) {
    opt = opt || {};
    var bs = blocks(md), out = [], i, b, t;
    var base = opt.i || 0;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'table') { out.push(tableSpeech(b, base + i)); continue; }
      if (b.k === 'list') { out.push(listSpeech(b, base + i)); continue; }
      if (b.k === 'h') {
        t = inlineText(b.t);
        /* 「一、神的呼召」這種本身帶序號的標題，序號交給模板去說 */
        var m = t.match(/^([一二三四五六七八九十\d]+)[、．.]\s*(.+)$/);
        out.push(m ? section(m[2], m[1], base + i) : section(t, null, base + i));
        continue;
      }
      if (b.k === 'quote') {
        out.push(pick('quote', base + i) + inlineText(b.t));
        continue;
      }
      t = inlineText(b.t);
      /* 已經有句末標點的不補。冒號、分號、頓號也算——
         「三個立場：」後面接一張表，補成「三個立場：。」很難聽。 */
      if (t) out.push(t + (/[。！？；：、，,.:;!?」』）)]$/.test(t) ? '' : '。'));
    }
    var s = out.join('\n');
    if (opt.drop) { try { s = opt.drop(s); } catch (e) {} }
    return s;
  }

  /* ── 掛上 ─────────────────────────────────────────────────────────── */

  function init(c) {
    C = ext(ext({}, DEF), c || {});
    /* words 給了就跟預設合併——英文版只想換幾個零件時不必整組重寫 */
    C.words = ext(ext({}, W), (c && c.words) || {});
    if (c && c.templates) {
      for (var k in c.templates) {
        if (c.templates.hasOwnProperty(k)) T[k] = c.templates[k];
      }
    }
    return API;
  }

  var API = {
    init: init,
    lead: lead, section: section, numbered: numbered, step: step,
    deeper: deeper, deeperAnswer: deeperAnswer, wrap: wrap,
    start: start, startAt: startAt, resume: resume, pause: pause, stop: halt,
    html: html, speech: speech,
    blocks: blocks, cn: cn, num: num,
    templates: T,
    setSeed: function (n) { cfg().seed = n | 0; },
    version: '1.1.0'
  };
  return API;
})();

var SAGE321 = (function () {
  'use strict';

  /* v2.0.0（2026-10）：從《321互動聖經》v2.18 移植回核心——
   *   · sysExtra：回答對象／回答長度接在 App 的人設後面
   *   · followups：最新一則成功的回答底下出現追問鈕，一鍵替使用者送出
   *   · 回答被截斷（stop_reason＝max_tokens／length）就自動接著寫完，最多再接 4 次
   *   · 新回答進來時把較早的長回答收起來，頂列「收合」一次收合全部；
   *     展開／收合只改那一則的 class，不重畫整個對話，才不會打斷朗讀
   *   · 每則回答多了「分享」與「做成美圖」
   *   · reask()：切換回答長度時，用新長度把最後一個問題重新回答（取代、不疊加）
   */
  var DEF = {
    worker: '',
    model: 'claude-sonnet-4-6',
    maxTokens: 1600,
    history: 12,
    timeoutMs: 60000,
    longChars: 240,
    maxCont: 4,
    el: 'xz',
    name: '小智',
    emoji: '✨',
    tagline: '陪讀 · 解經 · 禱告',
    hello: '',
    system: null,
    sysExtra: null,        // fn() -> 接在系統提示後面（回答對象、長度）
    quicks: null,
    followups: null,       // fn() -> [[圖示, 短標, 完整追問句], …]
    controls: null,        // fn() -> html（頂列下方的設定列，由 App 畫）
    store: null,
    chapter: null,
    rich: true,
    speechClean: null,
    linkify: null,
    onSpeak: null,
    onCard: null,          // fn(text, question)
    onShare: null,         // fn(text, question)；沒給就用 navigator.share／剪貼簿
    shareTail: '',
    toast: null,
    onChange: null,
    labels: {
      hello: '陪你讀經的小幫手。',
      caveat: '我不是聖靈，也不能代替你的牧者——有疑問，還是要回到聖經，並找真實的屬靈同伴談。',
      placeholder: '問小智…', send: '送出', clear: '清空', close: '✕',
      thinking: '正在想…',
      more: '展開全文 ▾', less: '收合 ▴',
      speak: '🔊', save: '☆ 收藏', saved: '★ 已收藏', del: '刪除',
      share: '↗ 分享', card: '🖼 美圖', copied: '已複製，可以貼上分享',
      foldAll: '收合', foldedAll: '已收合所有長回答', foldNone: '目前沒有需要收合的回答',
      cont: '小智還在接著寫…', contAsk: '請從中斷的地方直接接著寫完，不要重複前面已經寫過的內容，也不要加開場白。',
      fuT: '追問：',
      didSave: '已加入收藏', didUnsave: '已取消收藏', didDel: '已刪除',
      offline: '目前沒有網路，小智暫時陪不了你。',
      slow: '小智等候得有點久，先暫停一下。',
      down: '小智暫時連不上線，請稍後再試。',
      comfort: '別忘了——最好的同伴是聖靈與神的話，你隨時可以直接向主傾心吐意。',
      empty: '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？',
      exportTitle: '# 小智收藏', exportFile: 'sage-saved.md'
    }
  };

  var C = null;
  var XZ = { open: false, msgs: [], busy: false };

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escA(s) {
    return String(s == null ? '' : s).replace(/'/g, '&#39;').replace(/"/g, '&quot;')
      .replace(/\n/g, ' ').slice(0, 300);
  }
  function L(k) { return (C && C.labels && C.labels[k]) || DEF.labels[k] || ''; }
  function toast(m) { if (C && C.toast) C.toast(m); }
  function saved() { return (C.store && C.store.get && C.store.get()) || []; }
  function keep() { if (C.store && C.store.save) C.store.save(); if (C.onChange) C.onChange(); }
  function link(html) {
    if (!C.linkify) return html;
    try { return C.linkify(html); } catch (e) { return html; }
  }
  function nl(text) { return esc(text).split('\n').join('<br>'); }
  function body(text) {
    if (C.rich !== false && typeof NAR321 !== 'undefined' && NAR321.html) {
      try { return NAR321.html(text); } catch (e) {}
    }
    return nl(text);
  }
  function toSpeech(text) {
    var t = String(text == null ? '' : text);
    if (typeof NAR321 !== 'undefined' && NAR321.speech) {
      try { t = NAR321.speech(t); } catch (e) {}
    }
    if (C.speechClean) { try { t = C.speechClean(t); } catch (e) {} }
    return t;
  }
  function plainOf(text) {
    if (typeof NAR321 !== 'undefined' && NAR321.text) {
      try { return NAR321.text(text); } catch (e) {}
    }
    return String(text || '').replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/^>\s?/gm, '').replace(/^\s*[-*]\s+/gm, '・').replace(/\|/g, ' ');
  }
  function isLong(m) {
    return !!(m && m.role === 'assistant' && !m.cont && String(m.text || '').length > C.longChars);
  }
  function qOf(i) {
    for (var p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user') return XZ.msgs[p].text;
    return '';
  }

  /* ── 送出與接收 ───────────────────────────────────────────────── */

  function open() { XZ.open = true; draw(); }
  function close() {
    XZ.open = false;
    var el = document.getElementById(C.el);
    if (el) el.className = el.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ');
  }
  function push(role, text, extra) {
    var m = { role: role, text: text };
    if (extra) ext(m, extra);
    XZ.msgs.push(m);
    return m;
  }

  function send(text) {
    var t = text;
    if (t == null) {
      var i = document.getElementById('xzin');
      t = (i && i.value) || '';
      if (i) i.value = '';
    }
    t = String(t).replace(/^\s+|\s+$/g, '');
    if (!t || XZ.busy) return;
    XZ.open = true;
    push('user', t);
    draw(); call();
  }
  function pick(q) { send(q); }

  function ask(quote, note, tmpl) {
    XZ.open = true;
    var q = (tmpl || C.askTemplate || function (s, n) {
      return '我讀到這一句：\n「' + s + '」\n' + (n ? n + '\n' : '') +
             '請幫我更明白這句話，並幫助我活出來。';
    })(String(quote || '').slice(0, 300), note || '');
    if (XZ.busy) { draw(); return; }
    push('user', q);
    draw(); call();
  }

  /* 切換回答長度：把最後一組問答拿掉，用同一個問題重新問一次 */
  function reask() {
    if (XZ.busy) return false;
    var ui = -1, i;
    for (i = XZ.msgs.length - 1; i >= 0; i--) if (XZ.msgs[i].role === 'user') { ui = i; break; }
    if (ui < 0 || ui === XZ.msgs.length - 1) return false;
    var q = XZ.msgs[ui].text;
    XZ.msgs.splice(ui);
    push('user', q);
    draw(); call();
    return true;
  }

  function truncated(text, stop) {
    if (stop === 'max_tokens' || stop === 'length') return 'sure';
    if (stop) return '';
    var x = String(text || '').replace(/\s+$/, '');
    if (x.length < 280) return '';
    if (/[。！？.!?」』）)”"…~|]$/.test(x) || /(阿們|阿门|amen\.?)$/i.test(x)) return '';
    return 'guess';
  }
  function join(acc, piece) {
    piece = String(piece || '').replace(/^\s*(好的|好|OK|Okay|Sure)[，,。.!！]?\s*/i, '');
    var max = Math.min(40, acc.length, piece.length), k;
    for (k = max; k >= 4; k--) {
      if (acc.slice(-k) === piece.slice(0, k)) { piece = piece.slice(k); break; }
    }
    var head = piece.replace(/^\s+/, '');
    if (/^(#{1,6} |>|---)/.test(head)) return acc.replace(/\s+$/, '') + '\n\n' + head;
    if (/^([-*] |\d+[.)] |\|)/.test(head)) return acc.replace(/\s+$/, '') + '\n' + head;
    return acc + piece;
  }

  function post(sys, msgs, cb) {
    var ctrl = null, timer = null, done = false;
    try { if (window.AbortController) ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, C.timeoutMs);
    function fin(out, why, stop) {
      if (done) return; done = true;
      if (timer) clearTimeout(timer);
      cb(out, why, stop);
    }
    fetch(C.worker, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model: C.model, max_tokens: C.maxTokens, system: sys, messages: msgs })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      var t = '';
      if (data && data.content && data.content.length) {
        t = data.content.filter(function (b) { return !b.type || b.type === 'text'; })
          .map(function (b) { return b.text || ''; }).join('\n');
      } else if (data) {
        t = data.reply || data.text || data.message ||
          (data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '') || '';
      }
      var stop = (data && (data.stop_reason || data.finish_reason ||
        (data.choices && data.choices[0] && data.choices[0].finish_reason))) || '';
      fin(String(t).replace(/^\s+|\s+$/g, ''), '', stop);
    })['catch'](function (e) {
      fin('', (e && e.name === 'AbortError') ? 'slow' : 'down', '');
    });
  }

  function foldOld() {
    var last = -1, i;
    for (i = 0; i < XZ.msgs.length; i++) if (XZ.msgs[i].role === 'assistant') last = i;
    for (i = 0; i < XZ.msgs.length; i++) {
      var m = XZ.msgs[i];
      if (isLong(m)) m.col = (i !== last);
    }
  }

  function call() {
    XZ.busy = true; draw();
    var off = false;
    try { off = (navigator.onLine === false); } catch (e) {}
    if (off) {
      push('assistant', L('offline') + '\n' + L('comfort'));
      XZ.busy = false; return draw();
    }
    var hist = [], i, src = XZ.msgs.slice(-C.history);
    for (i = 0; i < src.length; i++) {
      if (src[i].cont) continue;
      hist.push({ role: src[i].role, content: src[i].text });
    }
    while (hist.length && hist[0].role !== 'user') hist.shift();
    var sys = (C.system ? C.system() : '');
    if (C.sysExtra) { try { sys += C.sysExtra() || ''; } catch (e) {} }
    var m = null, n = 0;

    function finish(acc, why) {
      if (m) XZ.msgs.splice(XZ.msgs.indexOf(m), 1);
      if (acc) push('assistant', acc, { ok: true });
      else push('assistant', (why === 'slow' ? L('slow') : (why ? L('down') : L('empty'))) + '\n' + L('comfort'));
      XZ.busy = false;
      foldOld();
      draw();
    }
    function step(acc, why, stop) {
      if (!acc) return finish('', why);
      var tr = truncated(acc, stop);
      if (!tr || n >= (tr === 'sure' ? C.maxCont : 1)) return finish(acc, '');
      n++;
      if (!m) m = push('assistant', acc, { cont: true }); else m.text = acc;
      draw();
      post(sys, hist.concat([{ role: 'assistant', content: acc }, { role: 'user', content: L('contAsk') }]),
        function (out, w2, st2) {
          if (!out) return finish(acc, '');
          step(join(acc, out), '', st2);
        });
    }
    post(sys, hist, function (out, why, stop) { step(out, why, stop); });
  }

  /* ── 收藏、刪除、分享 ─────────────────────────────────────────── */

  function savedIdx(i) {
    var a = XZ.msgs[i];
    if (!a) return -1;
    var arr = saved(), j;
    for (j = 0; j < arr.length; j++) if (arr[j].a === a.text) return j;
    return -1;
  }
  function star(i) {
    var a = XZ.msgs[i];
    if (!a) return;
    var arr = saved(), k = savedIdx(i);
    if (k >= 0) {
      arr.splice(k, 1); keep(); draw();
      return toast(L('didUnsave'));
    }
    arr.unshift({
      q: qOf(i), a: a.text,
      ch: (C.chapter ? C.chapter() : 0) || 0,
      at: (new Date()).getTime()
    });
    keep(); draw(); toast(L('didSave'));
  }
  function drop(i) {
    XZ.msgs.splice(i, 1);
    if (i > 0 && XZ.msgs[i - 1] && XZ.msgs[i - 1].role === 'user') XZ.msgs.splice(i - 1, 1);
    draw(); toast(L('didDel'));
  }
  function unstar(i) {
    var arr = saved();
    arr.splice(i, 1); keep();
    toast(L('didDel'));
  }
  function share(i) {
    var m = XZ.msgs[i]; if (!m) return;
    var q = qOf(i);
    if (C.onShare) return C.onShare(m.text, q);
    var t = (q ? q + '\n\n' : '') + plainOf(m.text) + (C.shareTail ? '\n\n' + C.shareTail : '');
    try {
      if (navigator.share) { navigator.share({ text: t })['catch'](function () {}); return; }
    } catch (e) {}
    try {
      navigator.clipboard.writeText(t).then(function () { toast(L('copied')); }, function () {});
    } catch (e) {}
  }
  function card(i) {
    var m = XZ.msgs[i]; if (!m || !C.onCard) return;
    C.onCard(m.text, qOf(i));
  }
  function exportMd(opt) {
    opt = opt || {};
    var arr = saved(), t = (opt.title || L('exportTitle')) + '\n\n', i;
    for (i = 0; i < arr.length; i++) {
      var x = arr[i];
      t += '## ' + new Date(x.at).toLocaleDateString() +
           (x.ch ? '　' + (opt.chapterLabel ? opt.chapterLabel(x.ch) : '第 ' + x.ch + ' 章') : '') + '\n\n';
      if (x.q) t += '**Q:** ' + x.q + '\n\n';
      t += x.a + '\n\n---\n\n';
    }
    try {
      var b = new Blob([t], { type: 'text/markdown' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = opt.file || L('exportFile');
      a.click();
    } catch (e) {}
    return t;
  }

  /* ── 面板 ─────────────────────────────────────────────────────── */

  function fuHtml(m, i) {
    if (!C.followups || m.role !== 'assistant' || !m.ok || m.cont || XZ.busy || i !== XZ.msgs.length - 1) return '';
    var l = [];
    try { l = C.followups() || []; } catch (e) { l = []; }
    if (!l.length) return '';
    var h = '<div class="xzfu"><span class="xzfut">' + esc(L('fuT')) + '</span>', k;
    for (k = 0; k < l.length; k++) {
      h += '<button class="xzfuc" onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' +
        esc(l[k][2]) + '">' + esc(l[k][0] + ' ' + l[k][1]) + '</button>';
    }
    return h + '</div>';
  }

  function bubble(m, i) {
    if (m.role !== 'assistant') {
      return '<div class="xzm user">' + nl(m.text) + '</div>';
    }
    if (m.cont) {
      return '<div class="xzm assistant" id="xzm' + i + '"><div class="xzt">' + link(body(m.text)) + '</div>' +
        '<div class="xzcont">' + esc(L('cont')) + '</div></div>';
    }
    var long = isLong(m);
    var col = long && m.col !== false;
    var sav = savedIdx(i) >= 0;
    return '<div class="xzm assistant" id="xzm' + i + '">' +
      '<div class="xzt ' + (col ? 'clip' : '') + '">' + link(body(m.text)) + '</div>' +
      (long ? '<button class="xzmore" onclick="SAGE321.fold(' + i + ')">' +
        esc(col ? L('more') : L('less')) + '</button>' : '') +
      (m.ok ? '<div class="xzact">' +
      (C.onSpeak ? '<button onclick="SAGE321.speak(' + i + ')">' + esc(L('speak')) + '</button>' : '') +
      '<button class="' + (sav ? 'on' : '') + '" onclick="SAGE321.star(' + i + ')">' +
      esc(sav ? L('saved') : L('save')) + '</button>' +
      '<button onclick="SAGE321.share(' + i + ')">' + esc(L('share')) + '</button>' +
      (C.onCard ? '<button onclick="SAGE321.card(' + i + ')">' + esc(L('card')) + '</button>' : '') +
      '<button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button>' +
      '</div>' : '<div class="xzact"><button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button></div>') +
      fuHtml(m, i) + '</div>';
  }

  /* 只改這一則——不重畫整個對話，正在朗讀的那一則才不會斷 */
  function fold(i) {
    var m = XZ.msgs[i];
    if (!m || !isLong(m)) return;
    m.col = (m.col === false);
    var el = document.getElementById('xzm' + i);
    if (!el) return draw();
    var t = el.querySelector('.xzt'), b = el.querySelector('.xzmore');
    if (t) t.className = 'xzt' + (m.col ? ' clip' : '');
    if (b) b.textContent = m.col ? L('more') : L('less');
    if (m.col) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
  function foldAll() {
    var n = 0, i;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { XZ.msgs[i].col = true; n++; }
    if (!n) return toast(L('foldNone'));
    draw(true);
    toast(L('foldedAll'));
  }
  function speak(i) {
    var m = XZ.msgs[i];
    if (m && C.onSpeak) C.onSpeak(toSpeech(m.text), C.name);
  }

  function draw(keepScroll) {
    var el = document.getElementById(C.el);
    if (!el) {
      el = document.createElement('div');
      el.id = C.el; el.className = 'xz';
      document.body.appendChild(el);
    }
    el.className = ('xz ' + (XZ.open ? 'on' : '')).replace(/\s+$/, '');
    if (!XZ.open) return;
    var oldB = document.getElementById('xzb'), oldTop = oldB ? oldB.scrollTop : 0;
    var inp = document.getElementById('xzin'), typed = inp ? inp.value : '';

    var bd = '', i;
    if (XZ.msgs.length) {
      for (i = 0; i < XZ.msgs.length; i++) bd += bubble(XZ.msgs[i], i);
    } else {
      bd = '<div class="xzhi"><b>' + esc(L('iam') || ('我是' + C.name + '。')) + '</b><br>' +
        esc(C.hello || L('hello')) + '<br>' +
        '<span class="xs muted">' + esc(L('caveat')) + '</span></div>';
    }
    var quicks = '';
    if (!XZ.msgs.length && C.quicks) {
      var qs = [];
      try { qs = C.quicks() || []; } catch (e) { qs = []; }
      if (qs.length) {
        quicks = '<div class="xzq">';
        for (i = 0; i < qs.length; i++) {
          quicks += '<button onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' + esc(qs[i]) + '">' +
            esc(qs[i]) + '</button>';
        }
        quicks += '</div>';
      }
    }
    var ctl = '';
    if (C.controls) { try { ctl = C.controls() || ''; } catch (e) { ctl = ''; } }
    var anyLong = false;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { anyLong = true; break; }

    el.innerHTML =
      '<div class="xzmask" onclick="SAGE321.close()"></div>' +
      '<div class="xzcard">' +
      '<div class="xzh"><b>' + esc(C.emoji + ' ' + C.name) + '</b>' +
      '<span class="xs muted" style="flex:1">' + esc(C.tagline) + '</span>' +
      (anyLong ? '<button class="ico" onclick="SAGE321.foldAll()">' + esc(L('foldAll')) + '</button>' : '') +
      (XZ.msgs.length ? '<button class="ico" onclick="SAGE321.clear()">' + esc(L('clear')) + '</button>' : '') +
      '<button class="ico" onclick="SAGE321.close()">' + esc(L('close')) + '</button></div>' +
      (ctl ? '<div class="xzctl">' + ctl + '</div>' : '') +
      '<div class="xzb" id="xzb">' + bd + quicks +
      (XZ.busy && !(XZ.msgs.length && XZ.msgs[XZ.msgs.length - 1].cont)
        ? '<div class="xzm assistant xzwait">' + esc(C.name + L('thinking')) + '</div>' : '') +
      '</div>' +
      '<div class="xzf">' +
      '<input id="xzin" placeholder="' + esc(L('placeholder')) + '"' +
      ' onkeydown="if(event.key===\'Enter\'&&!event.isComposing)SAGE321.send()">' +
      '<button class="btn pri" onclick="SAGE321.send()">' + esc(L('send')) + '</button>' +
      '</div></div>';
    var ni = document.getElementById('xzin');
    if (ni && typed) ni.value = typed;
    setTimeout(function () {
      var b = document.getElementById('xzb');
      if (!b) return;
      b.scrollTop = keepScroll ? oldTop : b.scrollHeight;
    }, 30);
  }

  function clear() { XZ.msgs = []; draw(); }

  function init(cfg) {
    C = ext(ext({}, DEF), cfg || {});
    C.labels = ext(ext({}, DEF.labels), (cfg && cfg.labels) || {});
    if (!C.worker) throw new Error('SAGE321.init 需要 worker');
    return API;
  }

  var API = {
    init: init,
    open: open, close: close, clear: clear,
    ask: ask, send: send, pick: pick, reask: reask,
    star: star, drop: drop, unstar: unstar, savedIdx: savedIdx,
    share: share, card: card,
    fold: fold, foldAll: foldAll, speak: speak, draw: draw,
    exportMd: exportMd,
    saved: saved,
    msgs: function () { return XZ.msgs; },
    isOpen: function () { return !!XZ.open; },

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  async function aiRaw(sys, ask, ms, maxT) {

    for (let a = 0; a <= waits.length; a++) {

      try {
        const r = await fetch(SVC.xz, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: SVC.model, max_tokens: maxT || 1600, system: sys, messages: [{ role: 'user', content: ask }] }),
          signal: ac ? ac.signal : undefined
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const d = await r.json().catch(() => null);
        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');
        else if (d) out = d.reply || d.text || d.message || '';
        if (!out) why = T('回覆是空的', 'empty reply');
        clearTimeout(tm);

      } catch (e) {
        clearTimeout(tm);
        why = (e && e.name === 'AbortError') ? T('逾時', 'timeout') : ((e && e.message) ? String(e.message) : 'network');
        if (a === waits.length) break;
        await new Promise(rs => setTimeout(rs, waits[a]));
      }
    }
    return { out: String(out || '').trim(), why };
  }

${st}請用繁體中文。只回傳 JSON，不要任何說明、不要 markdown 圍欄：{"r":[{"t":"人物","h":["提示1","提示2","提示3"],"a":"答案","alt":["別名"],"v":"3","e":"亮點"}]}`;

  function plParse(text) {
    let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const st = s.indexOf('{'); if (st < 0) return null;
    s = s.slice(st);
    try { return JSON.parse(s.slice(0, s.lastIndexOf('}') + 1)); } catch (e) {}
    const m = s.match(/"(q|r)"\s*:\s*\[/); if (!m) return null;
    let i = m.index + m[0].length; const items = [];
    while (i < s.length) {
      while (i < s.length && s[i] !== '{') i++;
      if (i >= s.length) break;
      let depth = 0, inStr = false, es = false, j = i;
      for (; j < s.length; j++) {
        const c = s[j];
        if (inStr) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;

      try { items.push(JSON.parse(s.slice(i, j + 1))); } catch (e) {}

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function vOf(v) {

  function normQuiz(list, src, k) {

      const as = String(x.a).trim();
      const ai = /^[A-Da-d]$/.test(as) ? 'abcd'.indexOf(as.toLowerCase()) : (as === '' ? NaN : +x.a);

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

  const PUN = /[\s，。、；：？！「」『』（）《》〈〉“”‘’—…·,.;:?!"'()\[\]\-–]/g;
  function normV(x) {

    const q = normV(text);
    if (q.length < 4 || !D || !D.txt) return null;
    const head = q.slice(0, 30), tail = q.slice(-30);
    const order = [];
    const N = GX.NCH();
    if (hint >= 1 && hint <= N) order.push(hint);
    for (let c = 1; c <= N; c++) if (c !== hint) order.push(c);
    for (const c of order) {
      const vs = D.txt[c] || [];
      let joined = '', starts = [];
      vs.forEach(v => { starts.push(joined.length); joined += normV(v); });
      const i = joined.indexOf(head);
      if (i < 0) continue;
      let j = joined.indexOf(tail, i);
      if (j < 0) j = i + head.length - 1; else j = j + tail.length - 1;
      let a = 0, b = 0;
      for (let k = 0; k < starts.length; k++) { if (starts[k] <= i) a = k; if (starts[k] <= j) b = k; }
      return { ch: c, v: a + 1, v2: b + 1 };
