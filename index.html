<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321帖撒羅尼迦後書講義">
<meta name="application-name" content="321帖撒羅尼迦後書講義">
<meta name="description" content="321帖撒羅尼迦後書講義：全書三章逐節原文解經、講章逐字稿與321生命應用。">
<title>321帖撒羅尼迦後書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);

  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"在他聖徒的身上得榮耀","sub":"忍、公、榮","lv":"A","arc":"榮","sec":[["1:1--2","保羅、西拉、提摩太寫信給帖撒羅尼迦：問安"],["1:3--4","我們該為你們常常感謝神：信心增長、愛心充足、患難中的忍耐"],["1:5--10","這正是神公義判斷的明證：主從天上顯現的那日子"],["1:11--12","因此，我們常為你們禱告：配得過所蒙的召"]],"serm":{"pts":[["患難中的忍耐","1:3--5","「仍舊存忍耐和信心」——逼迫沒有停，他們的信心反而格外增長；保羅說：這受苦本身，正是神公義判斷的明證"],["伸冤在神","1:6--10","「神既是公義的」——受苦的人不必自己報仇，也不必假裝沒事；主必從天上顯現，在他聖徒的身上得榮耀"],["名在你們身上得榮耀","1:11--12","「叫我們主耶穌的名在你們身上得榮耀」——今天怎樣活，才配得過所蒙的召？榮耀是雙向的：他在我們身上，我們在他身上"]]},"q":"你有沒有一個名字，到今天一想起來，胸口還會緊一下？也許是那個在公司裡搶走你功勞、後來升了職的人；也許是那個騙走你父母養老錢、換了名字又開一間公司的人；也許是那個在學校裡天天欺負你孩子、老師卻說「小孩子玩玩而已」的同學。\n你試過兩種辦法。一種是在心裡一遍一遍演練報復的劇本；另一種是被教會的人勸「交給神吧」，然後把話吞回去，假裝已經沒事。兩種都沒有讓你睡得比較好。\n這一章要問的是：一位必從天上顯現的主，會怎樣改變你看那個名字的眼睛？你是要低著頭記帳，還是可以抬起頭來等他？","truth":"帖撒羅尼迦人「在所受的一切逼迫患難中，仍舊存忍耐和信心」（1:4）——神是公義的，他看見了，主耶穌必從天上顯現，把受患難的人鬆綁，並要在他聖徒的身上得榮耀。\n所以等候主的人不必自己報仇，也不必假裝沒事；可以抬起頭來，今天就讓主的名在自己身上得榮耀。","mv":{"t":"這正是主降臨、要在他聖徒的身上得榮耀、又在一切信的人身上顯為希奇的那日子。","r":"帖後1:10"},"card":["這一章在講等候主的第一個姿勢——抬頭（榮）。一間只聽了三個安息日福音、屬靈父母就被趕出城的教會，逼迫還在加重；保羅沒有叫他們低頭忍下去，也沒有叫他們回擊，而是叫他們把眼睛抬到最遠的地方：主耶穌要從天上顯現，「要在他聖徒的身上得榮耀」（1:10）。全章拎起來就是一句：浪還在打，但這浪有終點，終點是榮耀。","這一章幾乎每一個重要的動詞，主詞都是神。是神叫他們的信心格外增長，所以保羅說「該」感謝神，不是該稱讚他們；是神把他們「算為配得」；是神「既是公義的」，就必把受患難的人接出來；是主耶穌親自顯現，親自施行報應；是神「看你們配得過所蒙的召，又用大能成就」（1:11）。受苦的人覺得自己被丟在一邊，這一章卻說：整件事從頭到尾都在神手裡。","1:10「顯為希奇」，原文 θαυμασθῆναι（thaumasthēnai），是被驚奇、被讚嘆的意思，而且是被動式——被讚嘆的是主，地點卻在「一切信的人身上」。帖撒羅尼迦的鄰居看這群人，只覺得他們很傻：為一個被釘死的猶太人，連工作、家人、城裡的名聲都賠上。那一天，同一群人要成為全宇宙驚嘆主的地方。這改變今天的讀法：你現在被笑的那一份忠心，不會白白過去；那天被驚奇的，不是你多能撐，是主在你身上做成的事。","這一章照出兩種受傷的我。一種是心裡的法官：我替那個人寫好判決，連刑期都算好了，每天在腦子裡開一次庭，嘴上說交給神，心裡還在等著看他倒楣。另一種是消失的受害者：被欺負了，因為怕被說不屬靈、不饒恕，就假裝沒事，連一句「我受傷了」都不敢說。前一種搶了神審判的位子，後一種連人的位子都不肯站；兩種都還沒有把眼睛抬到那一位要來的主身上。","「也必使你們這受患難的人與我們同得平安」（1:7）。1:4 保羅說他們正在「忍受」，原文 ἀνέχεσθε（anechesthe）是現在式——今天還在扛。全章最該被記住的，是 1:7 那個小小的「同」字：鬆綁的那一天，不是你一個人等到的，是和保羅、西拉、提摩太，和歷代一切受苦的聖徒一起得的。審判在這一章不是一場給旁觀者看的報仇戲，是一隻手把壓在你背上的重量拿開，再扶你和弟兄姊妹一同站起來。","這一週做一件事：把那個名字寫在紙上，帶到主面前，誠實地說出他對你做了甚麼、你有多痛——不修飾、不假裝已經好了。然後照羅 12:19 把「報應」交出去，卻不把「求助」交出去：該報警的報警，該找法律諮詢的去找，該對輔導或信得過的長輩說的，這一週約他談。最後在這張紙的下面，寫一句你今天可以讓主的名得榮耀的小事——一次不在群組裡反擊、一次照常把工作做好。","最終整合：帖撒羅尼迦，耶孫的家，幾個月以後的一個晚上。\n門板上還留著那一夜被撞開的裂痕。那一夜，一群市井匪類闖進來，找不到保羅，就把耶孫拖去地方官那裡，最後交了保狀才被放回來。\n現在屋裡坐滿了人。有人的店被砸過，有人的父母不再跟他說話，有人上個月才埋葬了一位弟兄。\n提摩太從哥林多帶回一封信。讀信的人念到「仍舊存忍耐和信心」，坐在角落的一位老婦人搖了搖頭——她覺得自己甚麼都沒有存住，只是每天還來。\n信繼續讀下去：神既是公義的……也必使你們這受患難的人……同得平安。\n屋子很靜。有人想到了那一夜，有人想到了法庭上的那個官。\n然後讀信的人放慢了聲音：「這正是主降臨、要在他聖徒的身上得榮耀、又在一切信的人身上顯為希奇的那日子」（1:10）。\n接著是一句好像寫給她一個人的話：「我們對你們作的見證，你們也信了」（1:10）。\n那位老婦人抬起頭來。\n她不再看門上的裂痕，也不再看地上。她看著窗外帖撒羅尼迦灣上方的天空——那裡，有一天主要親自顯現。\n她沒有變得更勇敢。逼迫明天還在。\n只是她知道了一件事：她每天還來的這一份「仍舊」，那一天會成為主的榮耀照出來的地方。\n這就是等候主的第一個姿勢：不是低頭記帳，也不是咬牙裝沒事，是抬頭。"],"self":"這一章照出來的「有己」，是一張不肯交出去的審判席：我記得每一筆帳、每一句傷人的話，在心裡反覆判他的刑，連禱告都變成控訴——說是等神伸冤，其實是要神照我的判決執行，而且要快，最好讓我看見。\n有己也會穿上屬靈的衣服：為了被看成成熟、饒恕、不記仇，我把傷口藏起來，把該求的幫助也一起吞下去，好像不痛才配得神的國。兩種都把眼睛留在自己和那個人身上，沒有抬起來看那一位要來、而且必定公義的主。","t321":{"k":"耶穌是我的榜樣：這一章「伸冤在神」的樣子，耶穌在受難那一天活給我們看。彼得後來回想說：「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主」（彼前 2:23）。他沒有假裝不痛——他在客西馬尼大聲哀哭；他也沒有回擊——他把審判交給父。他甚至在十字架上為釘他的人禱告。1:7 說將來從天上顯現、施行報應的就是這一位主：他是審判者，也是先被不公義對待過的人。學他，是誠實地痛、不還手，把結局交託給一位公義的父。","g":"讓耶穌作王：這一章要人讓出來的位置，是審判席。1:5 說他們「為這國受苦」——這個國有王，判決是王的事，不是我的事。讓耶穌作王，是把心裡那間每天開庭的法院關掉，把判決書交給要從天上顯現的那一位；同時也看清另一面：讓耶穌作王不是讓欺負人的人繼續作王。王把報應留給自己，卻把人間的法律、官長、教會的保護留給受害的人用（這使我們想起羅 13:4）。可以自己檢查：這一週，那個名字在我心裡，坐在被告席上，還是已經交到王的手裡？","p":"建立屬神的體系：第 1 章給的不只是一個人的盼望，也是一群人的活法。第一，教會彼此誇口——保羅在「神的各教會裡」為帖撒羅尼迦人誇口（1:4），一間受苦的教會的忍耐，成了別的教會的見證；今天我們也要把別處受苦肢體的故事講出來、為他們禱告。第二，愛心要「充足」到受害的人身邊：陪他去報案、去法律扶助、去輔導，不讓他一個人面對。第三，像保羅「常為你們禱告」（1:11）——有一群人固定為受逼迫、受欺負的人指名代求。這樣的一群人，在主來以前，就已經讓他的名在他們身上得榮耀。"},"grp":["【一、破冰】說一個你小時候被冤枉的記憶：是誰冤枉你？最後有沒有人替你說清楚？那一刻（或那一直沒有來的一刻）你心裡是甚麼感覺？","【二、扎心】經文說：「神既是公義的，就必將患難報應那加患難給你們的人」（1:6）。說出一個到今天想起來還會痛的名字（可以只說關係，不必說名字）：那件事發生在哪一年、在哪裡？你這幾年對他的處理方式，比較像在心裡開庭，還是比較像假裝沒事？","【三、福音】讀 1:7：「也必使你們這受患難的人與我們同得平安」——審判的目的是把受苦的人鬆綁。如果那位要來審判的主，就是先為你被冤枉、被釘死的那一位，你會怎樣重新看你自己的傷？說出一句你想對他說、卻一直不敢說的話。","【四、行動】說出這一週你要做的一件具體的事：哪一天、在哪裡、對誰——也許是把那個名字寫下來帶到主面前禱告；也許是打一通電話給法律扶助、輔導或一位信得過的長輩；也許是陪一位正被欺負的朋友去處理。也說出一件這一週你要讓主的名在你身上得榮耀的小事。","【五、代禱】為三種人指名禱告：一位正在職場、學校或家裡被欺負、被詐騙或被冤枉的人，求主保護他，也給他找到幫助的勇氣；一間在世界某處正為信仰受逼迫的教會，求主叫他們「仍舊存忍耐和信心」；一位傷害過你或你所愛的人的人，求主叫他悔改——不是因為你已經不痛了，是因為審判在主手裡。"],"prac":{"main":"這一週，把審判席交還給主，抬起頭來，照常讓他的名在你今天的生活裡得榮耀。","items":["對神：每天早上讀 1:7–10，讀到「要在他聖徒的身上得榮耀」時停下來，說一句：「主啊，我等你來。」然後誠實地告訴他今天最壓在你身上的一件事；晚上回想：今天有沒有一刻，我是抬起頭來看主，而不是低頭看那個人？","對自己：這七天，每當你發現自己在心裡重演一場報復、或替某人宣判，就記下時間、場合和那個名字；每當你發現自己把傷吞回去、假裝沒事，也記下來。週末把兩張單子帶到主面前：前一張交給那按公義審判人的主，後一張求主給你勇氣說出來、去求助。","對人：選一位你知道正在受欺負、被詐騙或被冤枉的人，這一週主動聯絡他：一通電話、一頓飯、陪他去一次該去的地方（警局、律師、輔導）。不要先勸他饒恕，先陪他把話說完。","對生活：在職場或群組裡，下一次被搶功、被誤會、被冷言冷語時，先停十秒，不在當下反擊；需要澄清的，用事實、平靜地說，需要申訴的，走正當管道。然後照常把手上的工作做好——那位要來的主看重今天的忠心，不只看重那一天的結果。","對使命：在小組或教會提一個具體安排——為一間受逼迫的教會固定代禱一個月；或整理一份本地的法律扶助、輔導與保護資源，讓受欺負的弟兄姊妹知道去哪裡求助。也為一位還不認識主的家人或同事每天指名禱告，求主在那一天也在他身上「顯為希奇」。"]},"safe":["① 把 1:6「必將患難報應那加患難給你們的人」講成復仇的快感：「等著瞧，欺負我們的人將來會很慘」，甚至帶會眾為仇敵禱告受報應、詛咒他們。","1:6 這一句沒有在 1:6 結束，一口氣接到 1:7「也必使你們這受患難的人與我們同得平安」——審判的目的是把受苦的人鬆綁，不是讓受苦的人看一場報仇戲；寫這封信的保羅，自己也說「不要自己伸冤」（羅 12:19），主也吩咐「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44）（紅線三；全卷立場見議題「神的公義審判與永遠沉淪」）。","檢驗標準：會眾聽完，心裡升起的是等著看別人倒楣的快感，還是被主看見、可以鬆一口氣的平安？","② 用「伸冤在神」「交給神」叫受害者閉嘴：被家暴、被性騷擾、被詐騙、被霸凌的人一開口，就被勸「不要記仇」「不要告」「要饒恕」。","伸冤在神的意思是我不必報仇，不是我不可以說出來、不可以求助；保羅自己在腓立比要求官長親自來領他出監（徒 16:37），神也設立在上掌權的「是神的用人，是與你有益的」（羅 13:4）。把交給神講成閉嘴，等於讓欺負人的人繼續欺負下去（紅線三；全卷立場見議題「神的公義審判與永遠沉淪」）。","檢驗標準：一位正在受害的弟兄姊妹聽完，是更敢報警、求助、說出真相，還是更覺得說出來就是不屬靈？","③ 用 1:9「永遠沉淪」恐嚇人：在佈道會上描寫火湖的細節逼人決志，或在主日學用地獄嚇孩子守規矩。","1:9 是寫給受逼迫的人的安慰，不是講台上的鞭子；它的核心是「離開主的面」——失去關係，而不是一幅恐怖畫面；而且整封信的另一個「永遠」是 2:16「永遠的安慰並美好的盼望」，神寫這封信是為了第二個「永遠」（紅線四；全卷立場見議題「神的公義審判與永遠沉淪」）。","檢驗標準：你講 1:9 的時候，有沒有同一篇讀到 2:16？聽完的人，是因為怕地獄而發抖，還是因為看見主的面而想回家？","④ 在喪禮、追思禮拜或探訪中，引 1:8–9 斷言某一位過世的人「沒有信主，所以永遠沉淪了」，或反過來保證「他一定在天堂」。","一個人最後一刻與神之間發生了甚麼，只有神知道；審判是主耶穌自己顯現時的事（1:7–8），不是我們在棺木旁替他宣判的。在喪禮上斷言結局，會把哀傷的家人推得更遠，也把神的位子搶到自己手裡（紅線四；全卷立場見議題「神的公義審判與永遠沉淪」）。","檢驗標準：你在喪禮上講完，家屬記得的是一位安慰哀哭的主，還是一句對他們所愛的人的判決？","⑤ 把 1:7「從天上在火焰中顯現」講成時間表：用這一章配上國際新聞推算主再來就在某一年，或點名某個政權、宗教領袖、某種科技就是 1:8 那些要受報應的人。","保羅寫這封信，正是因為有人說「主的日子現在到了」（2:2）；主自己說「但那日子，那時辰，沒有人知道」（太 24:36）。歷史上每一次算日子、點名都錯了，每一次都傷了人，也讓教會的見證受虧損（紅線一；全卷立場見議題「主的日子、被提與大罪人」）。","檢驗標準：你講完，會眾是更想轉傳一則末日訊息、對號入座，還是更安靜地把今天的工做好、等候主？","⑥ 把 1:5「叫你們可算配得神的國」講成「受夠了苦才配進天國」，或把受苦講成功德：「你越苦，將來的冠冕越大，所以不要求助、不要離開危險的處境」。","καταξιωθῆναι 是被動式，「被算為配得」，是神的宣告，不是人賺來的；受苦是一張照片，照出你已經屬於哪一國，不是入場費（回指加拉太書立場二；議題見議題「1:5『叫你們可算配得神的國』」）。把受苦講成功德，會讓留在暴力關係裡的人以為離開就是失去冠冕。","檢驗標準：一位正在受苦的人聽完，是更確定自己已經屬於神，還是更覺得要繼續忍受傷害才配得救？","⑦ 把 1:5「神公義判斷的明證」講成「你受苦，是神在審判你」；或把一切苦難都說成為主受的逼迫，拿來抵擋正當的檢討。","保羅說明證是「在逼迫裡仍舊站著」的信心與愛心，不是苦難本身；帖撒羅尼迦人是「為這國受苦」，不是因為犯錯受罰。前一種講法會把受害者再傷一次，後一種會讓做錯事、被正當批評的人自稱受逼迫（議題見議題「1:5『這正是神公義判斷的明證』」）。","檢驗標準：你講完，一位正在病痛或冤屈中的人會不會以為神在罰他？一位被正當指正的同工，會不會拿這一節當擋箭牌？","⑧ 用處境取消原則，或把處境硬搬：「那是一世紀受羅馬逼迫的人，跟我們今天的冷言冷語無關」；或反過來把每一個不同意你的同事、家人都講成 1:6「加患難給你們的人」。","書信三問要走完：處境是一間只聽了三個安息日福音、被暴民圍家、被告官的教會；原則是神是公義的，主必顯現；今天的落點是每一個被欺負、被冤枉的人——但不是每一個讓我不舒服的人都是逼迫者（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你講完，會眾分得清「被欺負」和「被意見不同」嗎？他們第一個想到的，是要讓主得榮耀，還是要把誰歸進仇敵那一邊？","⑨ 把 1:8「不認識神和那不聽從……福音的人」講成「沒有聽過福音的人一定都下地獄」，用來嚇人去傳福音；或講成「反正神會處理，不必傳」。","1:8 的上下文是那些「加患難給你們的人」——拒絕福音、逼迫信徒的人；從來沒有聽過的人怎樣，是需要謹慎陳列的議題，不是講台上一句定案（議題見議題「1:8『不認識神和那不聽從……福音的人』」）。兩頭講偏，一頭把傳福音變成恐嚇，一頭把它變成不必要。","檢驗標準：會眾聽完，是因為怕而去傳，還是因為「不願有一人沉淪」（彼後 3:9）的那一顆心而去傳？","⑩ 把 1:9「離開主的面」的永刑說和條件不朽說講成正統與異端之爭，在講台上點名某位持條件不朽說的牧者是假師傅；或反過來講成「最後人人都得救」。","本講義站在歷代教會的永刑說，承認條件不朽說是福音派內的少數立場、不以異端稱之，不採普救論；講台一句帶過，指向議題頁（議題見議題「1:9『永遠沉淪』」；全卷立場見議題「神的公義審判與永遠沉淪」）。在講台上把這一題變成辯論，會讓會眾記得的是誰對誰錯，而不是主的面。","檢驗標準：你講完，會眾記得的是一個神學派別的名字，還是「離開主的面」有多重、「見他的面」有多好？","⑪ 講 1:10「在他聖徒的身上得榮耀」時，把「聖徒」講成少數特別屬靈、特別會忍的人；或把 1:11「配得過所蒙的召」講成「做得不夠就會失去呼召」。","保羅特別插一句「我們對你們作的見證，你們也信了」（1:10）——信主才一年左右的帖撒羅尼迦人就在「一切信的人」裡面；1:11 是保羅的禱告，主詞是神「看」、神「用大能成就」，最後「都照著我們的神並主耶穌基督的恩」（1:12）（議題見議題「1:11『配得過所蒙的召』」）。","檢驗標準：一位剛信主、常常跌倒的人聽完，是更確定自己也在那一天的榮耀裡，還是更怕自己不夠格？"]},{"n":2,"t":"你們要站立得穩","sub":"驚、氣、錨","lv":"A","arc":"穩","sec":[["2:1--2","不要輕易動心，也不要驚慌：主的日子現在到了嗎"],["2:3--5","那日子以前，必有離道反教的事：大罪人"],["2:6--12","那攔阻他的是甚麼：不法的隱意與主口中的氣"],["2:13--15","他從起初揀選了你們：所以要站立得穩"],["2:16--17","將永遠的安慰並美好的盼望賜給我們：禱告"]],"serm":{"pts":[["一則消息","2:1--5","「說主的日子現在到了」——有靈、有言語、有冒我名的書信；保羅的第一句話是「不要輕易動心，也不要驚慌」"],["一口氣","2:6--12","「主耶穌要用口中的氣滅絕他」——我們不知道攔阻的是誰，卻知道誰掌權；大罪人「高抬自己」（2:4）的那一面鏡子，先照自己"],["站穩","2:13--17","「你們要站立得穩」——船穩不穩，不看浪多大，看錨扣在誰身上：神從起初揀選，主耶穌親自安慰"]]},"q":"半夜十二點，家族群組又跳出一則訊息：一長串新聞、幾張圖、一個推算出來的年份，最後一行是紅字：「請轉給你愛的人。」你的手指停在轉傳鍵上，心跳得比平常快。\n也許你不是會轉的人，你是那個看完就睡不著的人；也許你是那個早就看穿、在群組裡冷冷回一句「又來了」的人；也許你曾經為了這樣一個日子辭過工作、跟家人鬧翻，後來那一天平平安安地過去，你再也不敢提。\n這一章要問的是：一個真心等候主的人，聽見「主的日子已經到了」的時候，是先轉、先怕、先算，還是先站穩？讓你站得住的，是一張更準的時間表，還是一位你已經認識的主？","truth":"主的日子還沒有到，在那以前邪惡會增長，卻一直被管著；主耶穌一口氣就結束它，而神從起初就揀選了所愛的人（2:8、13）。\n所以等候主的人不必驚慌，也不必算日子；他要做的是站住，抓緊已經領受的使徒教訓，讓主自己安慰他的心，在一切善行善言上堅固他。","mv":{"t":"所以，弟兄們，你們要站立得穩，凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守。","r":"帖後2:15"},"card":["這一章在講等候主的第二個姿勢——站穩。第一章叫人抬頭，看主從天上顯現；第三章叫人往前走，把今天的工做好；這一章夾在中間，處理那一刻：一則「主的日子現在到了」的消息打過來，船開始晃。保羅不給時間表，給一個命令：「不要輕易動心，也不要驚慌」（2:2），最後落在「你們要站立得穩」（2:15）。全章就是從驚到穩的那一段路。","這一章的主詞，在最暗的地方也是神。連大罪人的出場都被管著——「是叫他到了的時候才可以顯露」（2:6）；主耶穌不必打仗，「要用口中的氣滅絕他」（2:8）。神從起初揀選、藉福音呼召、要人得著主耶穌基督的榮光（2:13–14）；主自己和父神愛了我們，已經把「永遠的安慰並美好的盼望」賜下來（2:16）。人在這一章裡會被騙、會驚慌、會忘記；神沒有一次缺席。","2:1「我們到他那裡聚集」，原文 ἐπισυναγωγῆς（episynagōgēs），全本新約只出現兩次，另一次在希伯來書：「你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉，既知道那日子臨近，就更當如此」（來 10:25）。同一個字，一頭是那日子我們被招聚到主那裡，一頭是今天我們不停止聚在一起。這改變今天的讀法：治末日驚慌的，不是一個人關在房間裡研究圖表，是繼續和弟兄姊妹坐在一起；越覺得那日子近，越不可以一個人晃。","這一章照出我們很少承認的一件事：我想知道那日子，常常不是因為愛主，是因為怕失控。知道日期，我就能準備、能掌握、能比別人早一步；不知道，我就慌。於是有人拚命轉傳，有人拚命研究，有人拚命嘲笑轉傳的人——三種人都把自己放在「我看得懂」的位置上。保羅卻說「你們不記得嗎」（2:5）：我們缺的往往不是新資料，是忘了早已領受的主。","「你們要站立得穩，凡所領受的教訓……都要堅守」（2:15）。「堅守」原文 κρατεῖτε（krateite），是用手抓緊。全章最該被記住的，是手的轉向：2:2 那一隻停在轉傳鍵上、被每一則消息牽著走的手，到了 2:15，抓住的是已經交付下來的使徒教訓。站得住的人不是抓得最多，是抓對了東西；抓對了，第二天再來一則消息，手就不會跟著晃。","這一週，把分辨三問寫在手機的備忘錄第一頁：這則訊息和聖經的筆跡相合嗎？它讓我更愛主，還是更害怕？它讓我站穩，還是驚慌？收到任何末日、災難、預言類的訊息，先放二十四小時再決定要不要轉。再做一件事：打一通電話給最常在群組轉這類訊息的那位長輩，不糾正他，先問他最近睡得好不好、在怕甚麼，然後約他這個主日一起坐。","最終整合：深夜的客廳。燈已經關了，只剩手機亮著。\n他是教會裡最熟悉末世圖表的那位弟兄。群組裡有人問「大罪人到底是誰」，他已經打好一大段，從但以理書一路排到今天的新聞，只差把最後那個名字填上去。\n他按下傳送之前，手機自動鎖屏了。\n螢幕一黑，變成一面鏡子。鏡子裡沒有別人，是他自己的臉。\n他忽然想起晚飯時的事。太太說了一句不同的意見，他放下筷子：「這個家，我說了算。」孩子問了一個問題，他說：「大人講話，小孩別插嘴。」小組裡有人問他那張圖表的根據，他笑了一下，沒有回答——那個人後來就不太來了。\n他把手機翻過來，又看見那一節：「他是抵擋主，高抬自己，超過一切稱為神的和一切受人敬拜的，甚至坐在神的殿裡，自稱是神」（2:4）。\n抵擋。高抬。坐下。自稱。四級梯子，他沒有爬到殿裡，可是他在自己的客廳，已經坐上了那把椅子。\n「因為那不法的隱意已經發動」（2:7）。原來不只在新聞裡，也在這張沙發上。\n他把打好的那一大段，一個字一個字刪掉。\n然後往下讀：主耶穌只要一口氣。再往下：「但我們」——主所愛的弟兄們哪。\n那一夜，大罪人仍然沒有臉。可是他看清楚了另一張臉：一個想坐在神位子上、卻仍然被愛的人。\n他從椅子上站起來，走進房間，對還沒睡的太太說：「晚飯那句話，我說錯了。」\n那是他這些年來，站得最穩的一次。"],"self":"這一章照出來的「有己」，第一種長得很屬靈：我要知道日子、知道是誰、知道下一步，因為知道了，我就不必倚靠任何人，也比別人站得高一點；不知道，我就慌，就轉，就要別人陪我一起怕。\n第二種藏得更深：在那一則訊息之外，我在自己的家、小組、公司裡，已經坐上了一把「我說了算」的椅子，不准人問、不准人不同意——我一邊找大罪人的臉，一邊沒有發現自己正在爬那張梯子。","t321":{"k":"耶穌是我的榜樣：這一章的「不要驚慌」，耶穌在加利利海上活給我們看。「海裡忽然起了暴風，甚至船被波浪掩蓋；耶穌卻睡著了」（太 8:24）。門徒喊「我們喪命啦」，他醒來先問「你們這小信的人哪，為甚麼膽怯呢」（太 8:26），然後斥責風和海。他能睡，不是因為浪不大，是因為他知道船在父的手裡；同一位主也坦然說那日子「子也不知道」，卻一點也不慌。學他，是在不知道一切的時候，仍然安穩地把今天交給父——浪照樣打，人可以不跟著晃。","g":"讓耶穌作王：這一章要人讓出來的位置有兩個。第一個是「掌握時間表」的位置——那日子，父自己定；我放下非知道不可的心，承認大罪人的出場、邪惡的長度，都不是我管的，也不是他自己定的。第二個是 2:4 那把椅子：在家裡、小組裡、職場裡「我說了算」的位子。真正的王一口氣就勝了（2:8），不需要我替他坐鎮；讓耶穌作王，是從那把椅子上自己站起來，回到「站立得穩」的位置——站，不是坐。可以自己檢查：這一週誰問我一個問題時，我最想說「不必問」？","p":"建立屬神的體系：這一章給一群人三樣東西。第一是聚集（2:1 的 ἐπισυναγωγῆς）：越是消息亂的時候，越不讓任何一個人一個人晃——小組要成為一個可以把害怕的訊息帶來一起讀、一起禱告的地方。第二是教訓的傳遞（2:5、2:15）：保羅三個安息日裡「常常說」，321 的「3」是屬靈父母把基礎一再講給初信的人聽，讓他們有東西可以「記得」。第三是可以被察驗的領袖：教訓是使徒的教訓，不是哪一位領袖的話；一間健康的教會，弟兄姊妹可以像庇哩亞人那樣問「這道是與不是」，而不被看成不順服。"},"grp":["【一、破冰】說一則你這輩子收過、後來發現是假的消息：是誰傳給你的？你當時信了幾分？後來怎麼知道是假的？","【二、扎心】經文說：「說主的日子現在到了，不要輕易動心，也不要驚慌」（2:2）。說出最近一次你被一則消息搖動的時候——哪一天、在哪一個群組或場合、那則消息說了甚麼？你當時第一個動作是轉傳、搜尋、睡不著，還是禱告？","【三、福音】讀 2:13：「主所愛的弟兄們哪……他從起初揀選了你們」。在任何消息出現以前，神已經愛了你、選了你。如果這是真的，下一次那則讓你害怕的訊息進來，你可以對自己說哪一句話？請用你自己的話說出來。","【四、行動】說出一位你知道常被末日或災難訊息嚇到、或曾經因此受傷的人（名字或關係）。這一週哪一天、用甚麼方式（電話、探訪、吃一頓飯）去陪他？你打算先問他甚麼，而不是先糾正他甚麼？","【五、代禱】為三種人指名禱告：一位正在被焦慮、失眠或對未來的恐懼困住的人，求主自己安慰他的心（2:17）；一位曾經因為一個預言日子辭職、賣房或與家人決裂、如今不敢回教會的人，求主差人去接住他；一位帶領小組或講台的人，求主保守他不坐上那把「說了算」的椅子，讓弟兄姊妹在他面前敢提問。"],"prac":{"main":"這一週，不轉、不算、不慌；抓緊已經領受的，站在主所愛的位置上。","items":["對神：每天睡前讀 2:13–17，在「主所愛的弟兄們」那裡停下來，說出你的名字：「主啊，我是你所愛的。」再把今天最讓你不安的一則消息或一件事交給他，求他「安慰我的心」。","對自己：這七天，每當你想知道「到底甚麼時候」「到底是誰」，就記下來，問自己：我想知道，是因為愛主，還是因為怕失控？也記下每一次你心裡說「這件事我說了算」的時刻——在家裡、在小組、在公司。週末把兩張單子帶到主面前。","對人：找一位你曾經在群組裡嘲笑過、或冷冷回過「又來了」的人，私下向他說一句溫和的話；或為晚飯桌、會議桌上曾經不准人問的一句話，向那個人道歉。","對生活：收到任何末日、災難、預言類訊息，一律先放二十四小時，用分辨三問檢查過再決定；同時把晚上滑手機的時間減少三十分鐘，換成讀一章新約，讓「信上寫的」比群組裡的消息先進到心裡。","對使命：這個主日帶一位最近很少來聚會、或正在害怕的人一起來，坐在他旁邊；或在小組提議用一次聚會，一起讀帖撒羅尼迦後書第二章，讓每個人把最近收到的末日訊息帶來，一起用聖經察驗。"]},"safe":["① 照「兆頭」推算主再來的年份，或在講台上掛一張排到年份的末日時間表、教人算日子。","保羅寫這一章，正是叫人不要被「已經到了」的消息推著走；主耶穌自己畫了線：「但那日子，那時辰，沒有人知道」（太 24:36）。保羅說「你們也知道」（2:6）——我們手上少了他口頭講過的那一頁，假裝有一張完整的圖表，就是越過了這條線（紅線一；全卷立場見議題「主的日子、被提與大罪人」）。","檢驗標準：你講完，有沒有讀到太 24:36 與 2:5–6？會眾記得的是一個年份，還是一位一定會來的主？","② 把 2:3–4 的「大罪人」點名、對號入座：某一位現存的領袖、某一個政權或國家、某一個宗教或教派、某一種科技（晶片、疫苗、條碼、數位貨幣、人工智慧）。","兩千年來每一次指認都錯了，每一次都傷了人，也讓福音被人當成陰謀論；改教家曾指認教皇制度，本講義只陳列這段歷史，不採用、不轉述為攻擊。2:4 在本章是拿來照自己的鏡子，不是通緝令（紅線一；全卷立場見議題「主的日子、被提與大罪人」）。","檢驗標準：你講完 2:4，會眾心裡浮出來的是某一個人的臉，還是自己在家裡坐的那把椅子？","③ 用末日恐嚇人：「時候不多了，再不奉獻、再不決志就來不及」「世界越來越亂，我們要囤糧、逃離城市」，叫會眾帶著恐慌回家。","保羅的第一句話是「不要輕易動心，也不要驚慌」（2:2），最後一句是「你們要站立得穩」（2:15）；中間主耶穌只用一口氣就結束最大的浪（2:8）。用恐慌推動的奉獻與決志，是把福音的果效從忍耐換成了害怕（紅線二）。","檢驗標準：會眾聽完，是更平安地等候主，還是更害怕世界？這一週他們的睡眠會更好，還是更糟？","④ 嘲笑曾經因為末日預言辭工作、賣房子、與家人決裂的人，把他們當成講台上的反面笑話。","他們多半是因為愛主、怕被留下，才那麼在意；帖撒羅尼迦人害怕的也正是自己被錯過。嘲笑會讓受傷的人更不敢回教會，也讓會眾學到「看穿別人」比「接住別人」更屬靈（全卷立場見議題「主的日子、被提與大罪人」）。","檢驗標準：如果那位弟兄姊妹就坐在台下，他聽完是覺得被接住，還是被羞辱了一次？","⑤ 把 2:11「神就給他們一個生發錯誤的心」講成神隨意叫某些人沉淪，或拿來論斷離開教會、正在懷疑的人：「他走了，就是神任憑他了，沒救了。」","次序是 2:10 在前：先「不領受愛真理的心」，而那份心原本是要「使他們得救」；神把人自己選的交還給他。把 2:11 單獨拿出來，會讓一位正在掙扎的人以為門已經關上（紅線五；全卷立場見議題「神的公義審判與永遠沉淪」）。","檢驗標準：你有沒有把 2:10 和 2:11 一起讀？一位正在懷疑信仰的人聽完，是更想回來，還是更絕望？","⑥ 用 2:15「凡所領受的教訓……都要堅守」要求會眾對教會的規矩、宗派的傳統或領袖個人的話照單全收；把提問和察驗說成不順服。","2:15 的教訓是使徒交付的教訓，今天在聖經裡；保羅離開帖撒羅尼迦的下一站，庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），被稱為賢良。用「堅守教訓」壓住提問，是把人的話放上使徒的位子——正是 2:4 那把椅子的小號版本（紅線八；全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」）。","檢驗標準：在你的教會，一位弟兄姊妹問「這句話聖經哪裡說的」，會被感謝，還是被記下來？","⑦ 把 2:2「有靈」講成「凡說聖靈感動、看見異象的都是假的」，或反過來把任何「我得了啟示」都當成神的話照做。","保羅沒有否定聖靈的引導，2:13 正是「被聖靈感動，成為聖潔」；他要的是察驗——「但要凡事察驗」（帖前 5:21）。一頭講偏會澆滅聖靈，一頭講偏會讓「有靈」的消息比使徒的教訓更有分量（全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」）。","檢驗標準：會眾聽完，手上有沒有一個可以拿來察驗的方法——與聖經相合嗎、叫人更愛主嗎、叫人站穩嗎？","⑧ 只講處境、取消原則：「那是一世紀帖撒羅尼迦人的恐慌，跟我們無關」；或只搬原則、不看處境：把 2:3–12 當成今天新聞的逐條解碼。","書信三問要走完：處境是一間只受教三個安息日、正被逼迫、又被一則消息推倒的教會；原則是那日子以前有次序、一切都被管著、神揀選了你們；今天的落點是每一個轉傳末日訊息的群組，和每一個在夜裡睡不著的人（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你講完，會眾知道這段經文和他今晚手機裡那則訊息有甚麼關係嗎？判斷的理由有沒有講出來？","⑨ 把被提的時間講成信仰的試金石：「只有災前被提才合乎聖經」「相信災後被提的就是信心不夠」，或在講台上攻擊別的千禧年觀。","2:1 的「到他那裡聚集」各派讀法不同，災前、災中、忿怒前、災後各有敬虔的弟兄姊妹；他們都相信主必親自、看得見地再來。把一派講成唯一，會讓教會為一張時間表分裂（紅線一；全卷立場見議題「主的日子、被提與大罪人」；議題見議題「2:1『我們到他那裡聚集』」）。","檢驗標準：一位持不同被提觀的弟兄姊妹聽完，是覺得仍是弟兄，還是覺得自己被趕出去了？","⑩ 把 2:8「用口中的氣滅絕他」講成得勝主義或爭戰動員：「我們要起來對抗那些不法的人」，把會眾帶向敵視某一群人。","滅絕的主詞是主耶穌，不是教會；保羅給帖撒羅尼迦人的命令是「站立得穩」，不是出擊。這使我們想起賽 11:4，那是王的審判，不是人的武器。把主一口氣的勝利講成我們的戰鬥，會把無己戰勝撒但講成有己的自義（回指以弗所書立場四）。","檢驗標準：會眾聽完，是更安靜地躲在一位一口氣就勝的主後面，還是更想找一個對手？","⑪ 把 2:13「從起初揀選了你們」講成「反正選定了，怎麼活都無所謂」，或拿來分「我們是選民、他們不是」。","同一節說揀選是「叫你們因信真道，又被聖靈感動，成為聖潔」，下一節是藉福音呼召，再下一節是「站立得穩」；揀選是安慰受驚的人，不是讓人鬆懈，也不是畫線把人排除在外（回指以弗所書第 1 章議題；議題見議題「2:13『他從起初揀選了你們』」）。","檢驗標準：會眾聽完，是更確信自己被愛、也更想活出聖潔，還是更會判斷別人是不是被揀選的？","⑫ 把 2:9「異能、神蹟和一切虛假的奇事」講成「凡有神蹟醫治的都是撒但」，或反過來「有神蹟就一定是神」。","保羅說的是「虛假的奇事」與「不義的詭詐」，分辨的標準是真理，不是能力的大小；一頭講偏會讓正在為病人禱告的弟兄姊妹被定罪，一頭講偏會讓人追著奇事跑（全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」）。","檢驗標準：會眾聽完，是更會問「這合不合真理、叫不叫人愛主」，還是只會問「有沒有能力」？"]},{"n":3,"t":"你們行善不可喪志","sub":"禱、工、安","lv":"A","arc":"行","sec":[["3:1--5","請你們為我們禱告：主是信實的"],["3:6--10","凡有弟兄不按規矩而行：效法我們的榜樣"],["3:11--13","要安靜做工，吃自己的飯：行善不可喪志"],["3:14--15","但不要以他為仇人，要勸他如弟兄：紀律與挽回"],["3:16--18","願賜平安的主隨時隨事親自給你們平安：親筆"]],"serm":{"pts":[["主是信實的","3:1--5","「但主是信實的」——人不都是有信心，主卻信實；他要堅固你們，引導你們的心，學基督的忍耐"],["安靜做工","3:6--13","「要安靜做工，吃自己的飯」——不肯做工的，忙著管閒事；真盼望主來的人，今天好好上班；行善的人也會累，所以「不可喪志」"],["勸他如弟兄","3:14--18","「但不要以他為仇人，要勸他如弟兄」——紀律的目的是挽回；全卷最後一句是平安，最後一筆是保羅的筆跡"]]},"q":"你的教會裡，大概都有這三個人。一個在群組裡最活躍，轉末日訊息、轉別人的家務事，一天亮幾十次，自己手上的工卻一直沒動；一個每次聚會前一小時就到，擺椅子、煮咖啡、追蹤沒來的人，做了十年，最近夜裡開始問：我做這些到底有甚麼用？\n第三個人，好幾個月沒有出現了。大家在背後說他，卻沒有人寫一個字給他。\n這一章要問的是：一個等候主的人，面對這三個人——也面對自己其實就是其中一個——要怎樣往前走，不驚慌、不喪志，也不把一位弟兄變成仇人？","truth":"人不都是有信心，「但主是信實的」（3:3）；所以等候主的人不必驚慌，可以安靜做工、吃自己的飯，「你們行善不可喪志」（3:13），連對脫隊的弟兄也是退後一步，卻不放手。\n撐住這一切的不是我們的力氣，是「願賜平安的主隨時隨事親自給你們平安」（3:16）；而主的話有筆跡可對——「我的筆跡就是這樣」（3:17），我們不必被任何冒名的聲音推著走。","mv":{"t":"弟兄們，你們行善不可喪志。","r":"帖後3:13"},"card":["這一章是等候主的第三個姿勢：往前走。第 1 章抬頭，看主從天上顯現；第 2 章站穩，不被一則消息推倒；第 3 章把腳放到今天的路上——為主的道路禱告，靠著主的信實，安靜做工、吃自己的飯，行善不喪志，對脫隊的弟兄退後一步卻不放手，最後在主親自給的平安裡，認出使徒的筆跡。等候主的人不是站在原地看天，是一步一步往前走，直到他來。","這一章最重的動詞，都歸給主。主的道理自己會跑，會得著榮耀；主是信實的，他要堅固、要保護；主引導人的心，把彎了的路修直，通向神的愛和基督的忍耐；最後，賜平安的主親自給平安，而且常與眾人同在。保羅敢下很重的吩咐，是因為他先把這間教會交在這位主手裡——紀律不是人在管人，是主在保守他自己的家，連那位被記下的弟兄，也還在他的祝福裡。","第 12 節「要安靜做工」，原文 μετὰ ἡσυχίας（meta hēsychias），「帶著安靜」。ἡσυχία 不是不准說話，是心裡不被攪動、安定下來的狀態。放回全卷，它正好站在 2:2「不要輕易動心，也不要驚慌」的對面：被末日消息攪動的人，最先失去的不是信仰的知識，是安靜——於是他不做工，到處管閒事。這改變今天的讀法：安靜不是閉嘴，是驚慌的反面；一個人能把今天的工安安穩穩做完，就是他信主是信實的證據。","這一章照出來的我，常常落在兩個極端。一個是忙錯了地方：在群組裡、走廊上、別人的婚姻和孩子身上很勤快，自己份內那份平凡的工卻一拖再拖，還替自己找了屬靈的理由。另一個是累過了頭：桌子擺久了，心裡開始記帳，看那位不做事的人越看越像仇人。兩個極端有一個共同點：我的眼睛離開了主的信實，落在人的身上。","「但不要以他為仇人，要勸他如弟兄。」（3:15）整段紀律最重的吩咐，最後一個字是「弟兄」。前面的遠離、記下、不和他交往，都是退後的動作；這一句把方向轉回來——退後，是為了再走近。教會可以停止配合一個人脫隊的生活，卻不可以停止把他當家人。一間教會怎樣對待它最難處理的那一個人，就顯明它是不是基督的家。","這一週，找出一件你在「專管閒事」的事——一個你每天花最多時間追的群組、一段你一直在議論的別人的家務事。把那段時間拿回來，安靜地做完一件拖了很久、屬於自己份內的工：一份報告、一頓為家人煮的飯、一封該回的信。做完以後，親筆寫一張卡片給一位很久沒有出現的弟兄姊妹，不問他為甚麼不來，只寫：我想起你，你仍是我的家人。","最終整合：帖撒羅尼迦，耶孫的家，傍晚。\n桌子已經擺好了。擺桌子的是一位寡婦，她擺了好幾年，最近手有一點抖。\n門邊坐著一個年輕人。自從有人說主的日子到了，他就沒有再回作坊；這幾個月，他吃的是這張桌子上的餅。\n信從哥林多來，有人在燈下一句一句念。\n念到「人不都是有信心」，耶孫抬頭看了看那扇門——暴民曾經在那裡拍打過。念到「但主是信實的」，屋裡有人輕輕吐了一口氣。\n念到「不肯做工」，年輕人低下頭。念到「你們行善不可喪志」，寡婦停下手，用圍裙擦了擦眼睛。\n念到「勸他如弟兄」，坐在年輕人旁邊的老人沒有挪開，把手放在他的肩膀上。\n念到「隨時隨事親自給你們平安」，燈芯爆了一下，沒有人說話。\n最後幾行，字跡變了——大一些，歪一些。耶孫從木箱裡拿出前一封信，兩張並排放在燈下：是他，是保羅的手。\n「願我們主耶穌基督的恩常與你們眾人同在！」眾人——門邊那一個，也在裡面。\n第二天天還沒亮，作坊的門被推開了。年輕人站在門口，手裡拿著自己的工具，\n沒有說話，只是往前走了一步。"],"self":"這一章照出來的「有己」，第一個樣子是忙錯了地方：保羅用 περιεργαζομένους（periergazomenous）說那些人「到處做工」——我在別人的事上很勤快，有很多意見、很多轉傳，輪到自己份內那份平凡的工，卻替自己找了屬靈的理由：主快來了、我在服事、我在禱告。\n第二個樣子更隱密，藏在很勤快的人身上：我擺了很久的桌子，就開始覺得自己有資格判斷誰配吃飯；看那位脫隊的弟兄，眼裡只剩下仇人的輪廓。前一種是不肯做工的有己，後一種是做太多工的有己——兩種都把自己放在中間，忘了撐住這個家的，是那位信實的主。","t321":{"k":"耶穌是我的榜樣：3:5 原文說的是基督的忍耐，不是一門功課，是他自己走過的路。他在拿撒勒做了多年的木匠，安安靜靜吃自己的飯；他說「我父做事直到如今，我也做事。」（約 5:17）他也知道停下來，對疲乏的門徒說「你們來，同我暗暗地到曠野地方去歇一歇。」（可 6:31）——做工與安息都在他身上。到了最後一晚，他明知猶大要出賣他，仍然替他洗腳、與他同席；「他既然愛世間屬自己的人，就愛他們到底。」（約 13:1）沒有一步喪志，也沒有把任何一個人當成仇人——這就是基督的忍耐。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是「我來撐住一切」的位置：3:3 的主詞是主——主是信實的，主要堅固、主要保護；行善的人喪志，常常是因為偷偷坐上了這個位置，以為教會的明天要靠自己。第二個是審判者的位置：3:9 保羅有權柄，卻放下不用，回到僕人的本位；3:15 他不准教會把脫隊的人當仇人。定一個人最後結局的，是王，不是同工會。可以自己檢查：這一週，我在哪一件事上，還在替主撐天，或替主判人？","p":"建立屬神的體系：經文先說完它的話——3:12 要每一個人安靜做工、吃自己的飯，體系不靠少數人養多數人，也不讓擺桌子的人被吃垮；3:14--15 的紀律有對象、有方式、有目的、有底線，目的是挽回，底線是他仍是弟兄。321 的「人比事重要」在這裡最具體：紀律處理的是一件事，面對的是一個人。所以一個團契要問：誰在擺桌子，有沒有人替他分擔？誰脫隊了，有沒有人負責勸他？誰不能做工，我們的桌子有沒有他的位子？920 的那個 2，有時正是那位不按規矩而行的人。"},"grp":["【一、破冰】你做過最「安靜」的一份工是甚麼——洗碗、折衣服、整理倉庫、抄寫、照顧植物？做那件事的時候，你心裡是甚麼感覺？","【二、扎心】「甚麼工都不做，反倒專管閒事。」（3:11）想一想上一個星期，你花最多時間關心、轉傳、議論的，是誰的事？那段時間裡，有哪一件你自己份內的工，被你擱在一旁？說出它的名字。","【三、福音】「但主是信實的，要堅固你們，保護你們脫離那惡者。」（3:3）說一個時刻：哪一年、在哪裡，你的信心已經撐不住，後來回頭看，才知道是主自己把你撐住的？那件事，今天怎樣幫助一位正在喪志的人？","【四、行動】說出一位很久沒有出現的弟兄姊妹的名字，以及這一週哪一天、用甚麼方式（一張親筆卡片、一頓飯、一次探訪）讓他知道他仍是家人；再說出一位一直在「擺桌子」的同工，你這一週要替他接下哪一件具體的事。","【五、代禱】為三種人指名禱告：一位正在失業、生病、照顧家人而覺得自己沒有用的人，求主讓他知道教會的桌子有他的位子；一位服事多年、正在喪志的同工，求主給他真正的休息與同伴；一位已經離開群體、或正在脫隊的弟兄姊妹，求主保守他，也求主讓你成為那個去勸他如弟兄的人。"],"prac":{"main":"這一週，往前走一步：靠著主的信實，安靜做完自己的工，不喪志，也不放掉任何一位弟兄。","items":["對神：每天早上讀 3:3 與 3:16，用一句話告訴主：「今天撐住我的是你，不是我。」晚上把一天裡讓你驚慌或灰心的一件事說給主聽，然後讀 3:5，求他把你的心引到神的愛和基督的忍耐裡。","對自己：攤開這一週的時間，誠實地分成三欄：份內的工、別人的事、真正的休息。若「別人的事」最多，選一段拿回來做自己的工；若「份內的工」多到沒有休息，請記得 3:8 是「免得叫你們一人受累」，安排一段真正的休息，必要時向牧者或專業的人說出你的疲乏。","對人：想一位你心裡已經把他當成「麻煩人物」的弟兄姊妹。這一週先為他禱告三次，然後用一句真誠的話和他說話，不是在群組裡、也不是在背後說他。若你在教會裡負責處理他的事，先問自己：我們的目標是挽回他，還是擺脫他？","對生活：在職場或家裡，挑一件你一直敷衍的平凡工作，這一週安安靜靜把它做好，不求被看見。若你正在失業、生病或照顧家人，你的「工」也許是投一封履歷、按時吃藥、陪家人走一段路——在主面前，那也是安靜做工。","對使命：照 3:1 為一位宣教士或你的牧者禱告，先求「主的道理快快行開」，再求他脫離無理之惡人的手；這一週寫一封短訊給他，告訴他你為他求了甚麼。若你的團契有關懷基金，想一想你能否讓它更多照顧「不能」做工的人。"]},"safe":["① 用 3:10「若有人不肯做工，就不可吃飯」羞辱失業、病弱、身心障礙、年老、在家照顧孩子或長輩的人：「聖經說不做工就不可吃飯」。","原文 οὐ θέλει 是「不肯」，不是「不能」；保羅處理的是有能力、有機會卻不願意做工、反倒專管閒事的人。把這一節丟向正在受苦的人，等於拿使徒保護擺桌子之人的話，去打那些最需要桌子的人（紅線六；全卷立場見議題「做工、懶惰與教會紀律」）。","檢驗標準：一位失業半年、或在家照顧失智父母、或坐輪椅的弟兄姊妹聽完，是覺得被定罪，還是清楚知道這一節不是在說他，教會的桌子有他的位子？","② 把 3:10 講成反對一切社會救助、反對教會設關懷基金，或在講台上暗示「領補助的都是懶人」。","同一位保羅叫人做工，是「就可有餘分給那缺少的人」（弗 4:28），也吩咐教會救濟那真無倚靠的寡婦（提前 5:3--16）；不肯做工的不可吃飯，不能做工的教會要供應——兩句一起讀才是保羅。","檢驗標準：會眾聽完，是更願意在照顧軟弱的人上有份，還是多了一句拒絕伸手的經文？","③ 把 3:8「晝夜做工」講成同工、傳道人、職場基督徒的標準：越累越屬靈，不休假才是忠心。","保羅自己給的理由是「免得叫你們一人受累」（3:8）——做工是為了不成為別人的重擔；一個人的過勞若最後把重擔轉給配偶、孩子和醫院，正好走到這一節的反面（回指歌羅西書立場四：無己不是苦待己身）。","檢驗標準：一位已經長期睡眠不足、家人很久見不到他的同工聽完，是更愧疚地再撐下去，還是聽見主准他休息？","④ 只讀 3:14「要記下他，不和他交往」，不讀 3:15：在群組裡截圖公告、在講台上點名、叫他的家人跟他斷絕往來、全教會一起對他冷暴力。","同一句話接著說「但不要以他為仇人，要勸他如弟兄」（3:15）；μὴ συναναμίγνυσθαι 是減少一般的混在一起，不是羞辱；ἐντραπῇ 是他自己回頭看，不是眾人把羞辱加在他身上（紅線七；全卷立場見議題「做工、懶惰與教會紀律」）。","檢驗標準：被處理的那個人，三個月後回想這件事，記得的是有人一直勸他如弟兄，還是被一整間教會當成了仇人？","⑤ 把 3:14 的對象擴大到提出疑問的人、意見不同的人、受傷而離開教會的人，用「不和他交往」封鎖他們、禁止會友跟他們吃飯。","經文的對象是「不聽從我們這信上的話」、而且在這一段裡就是不肯做工、專管閒事、拒不回轉的弟兄；把紀律用在發問者和離開者身上，就是排斥，會讓整個群體學會用沉默保住位置。","檢驗標準：一位對教會某個決定有疑問、或曾經離開過的人聽完，是知道自己仍然可以被接納，還是更確定自己已經被排除在外？","⑥ 把 3:6「從我們所受的教訓」、3:14「信上的話」講成教會的規矩、宗派的傳統或領袖個人的話：「不聽同工會就是不按規矩而行」，並用「要堅守教訓」壓下會眾的提問與察驗。","這裡的教訓是使徒的教訓，今天就寫在聖經裡；帖撒羅尼迦的下一站庇哩亞，那裡的人「天天考查聖經」（徒 17:11）——連講台上的話也要放在使徒的筆跡底下被察驗（紅線八；全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」）。","檢驗標準：會眾聽完，是更敢打開聖經自己查考、提出問題，還是更不敢對領袖說一個「為甚麼」？","⑦ 用 3:9「這並不是因我們沒有權柄」反對傳道人支薪，或說帶職的比全職的屬靈；反過來，也用它逼傳道人「學保羅」去兼差，教會就不必負擔。","保羅說的是他「有」權柄卻放下，是為了作榜樣，不是立一條規矩；他在別處說傳福音的可以靠福音養生（林前 9:14）。帶職與全職都是主的呼召，兩者都可以忠心，也都可以變成驕傲。","檢驗標準：一位全職的傳道人和一位帶職的同工一起聽完，是彼此更尊重，還是一個覺得自己被拿來比較、另一個覺得自己比較高尚？","⑧ 把 3:13「行善不可喪志」當鞭子，責備服事倦怠、情緒低落的同工：「你這是屬靈退步」「再撐一下就好了」。","ἐγκακήσητε 這個字本身就承認行善的人會累、會洩氣；保羅是轉過身鼓勵擺桌子的人，不是責備他們；倦怠需要的是休息、陪伴，必要時是專業的協助，不是多一句責備（全卷立場見議題「做工、懶惰與教會紀律」）。","檢驗標準：一位已經在服事裡耗盡的人聽完，是更自責，還是第一次覺得自己的疲乏被主看見，也被教會接住？","⑨ 把 3:11「專管閒事」拿來叫人不要過問傷害與不義：有人發現家暴、性騷擾、財務不清，說出來就被責備「不要管閒事」。","περιεργαζομένους 說的是不做自己的工、在別人生活裡打轉；保護受害者、向有權責的人舉報、尋求法律協助，是愛鄰舍，不是閒事。把這一節用來壓下揭露，會讓教會變成傷害最安全的藏身處。","檢驗標準：一位手上握著傷害證據、正在猶豫要不要說出來的人聽完，是更不敢開口，還是知道教會會陪他走正當的途徑？","⑩ 把 3:12「安靜做工」講成員工不可爭取應得的工資、不可投訴不公平的待遇、遇到違法加班也要「安靜」。","μετὰ ἡσυχίας 的安靜是心不被攪動，是 2:2 驚慌的反面，不是對不義閉嘴；保羅自己被不公平地對待時，也曾提出自己羅馬公民的身分。安靜做工和用正當途徑爭取公道可以同時成立。","檢驗標準：一位在職場被長期剝削的弟兄姊妹聽完，是覺得信主就得吞下去，還是學會在主裡心裡安靜、同時用正當的方式保護自己和同事？","⑪ 把 3:2「無理之惡人」套在批評教會的人、離開教會的人、或家裡不信的人身上；把 3:3「那惡者」講成凡事都是鬼在攪擾，於是不處理實際的問題。","保羅說的是在哥林多攔阻福音、逼迫使徒的人；而主的保護是叫人站穩，不是叫人到處找敵人（屬靈爭戰回指以弗所書立場四）。把每一個困難都歸給那惡者，會讓人逃避自己該做的修補。","檢驗標準：會眾聽完，是更信靠主的保護、更願意面對自己該負的責任，還是更習慣替身邊的人貼上「惡人」的標籤？","⑫ 用處境取消原則：「3:10 是第一世紀懶人的問題，跟今天無關」；或反過來，把 3:10 直接搬成某一套現代社會福利政策的標準答案，在講台上替某個政黨背書。","書信三問要走完：處境是一間被末日消息攪亂、有人把別人的愛心當成自己收入的教會；原則是有能力的人負自己的擔子、群體照顧不能的人、紀律為了挽回。今天落在哪裡，判斷的理由要說出來（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有說清楚，這個原則今天落在你的教會和你的職場是甚麼樣子，而不是只丟出一個政治口號或一句「古代的事」？","⑬ 把 3:17「我的筆跡就是這樣」講成：訊息裡只要附了經文出處，就是可靠的，可以放心轉傳。","冒名的書信最喜歡借用使徒的名字；今天的假訊息、假帳號、AI 生成的名人見證，也常常掛著經節。對筆跡是對整本聖經的內容與精神，不是對一個出處標記（全卷立場見議題「真假訊息、使徒的教訓與聖經的權威」）。","檢驗標準：會眾聽完，下一次收到一則附著經文的末日訊息時，是直接轉傳，還是會先問：它與聖經相合嗎？它讓我更愛主，還是更驚慌？","⑭ 把這一章講成 321 的插圖：先講「人比事重要」「謙卑是放下權力回到本位」，再拿 3:9、3:15 去對號入座，經文只剩下例句。","次序是經文先講：人的信會短缺，主卻信實；有能力的人安靜做工；脫隊的人被勸如弟兄；平安是主親自給的；然後 321 才在末端接上（鐵律五）。","檢驗標準：會眾聽完，記住的是一組 321 的口號，還是那位信實、親自給平安的主？"]}],"txt":{"1":["保羅、西拉、提摩太寫信給帖撒羅尼迦、在神－我們的父與主耶穌基督裡的教會。","願恩惠、平安從父神和主耶穌基督歸與你們！","弟兄們，我們該為你們常常感謝神，這本是合宜的；因你們的信心格外增長，並且你們眾人彼此相愛的心也都充足。","甚至我們在神的各教會裡為你們誇口，都因你們在所受的一切逼迫患難中，仍舊存忍耐和信心。","這正是神公義判斷的明證，叫你們可算配得神的國；你們就是為這國受苦。","神既是公義的，就必將患難報應那加患難給你們的人，","也必使你們這受患難的人與我們同得平安。那時，主耶穌同他有能力的天使從天上在火焰中顯現，","要報應那不認識神和那不聽從我主耶穌福音的人。","他們要受刑罰，就是永遠沉淪，離開主的面和他權能的榮光。","這正是主降臨、要在他聖徒的身上得榮耀、又在一切信的人身上顯為希奇的那日子。我們對你們作的見證，你們也信了。","因此，我們常為你們禱告，願我們的神看你們配得過所蒙的召，又用大能成就你們一切所羨慕的良善和一切因信心所做的工夫，","叫我們主耶穌的名在你們身上得榮耀，你們也在他身上得榮耀，都照著我們的神並主耶穌基督的恩。"],"2":["弟兄們，論到我們主耶穌基督降臨和我們到他那裡聚集，","我勸你們：無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌。","人不拘用甚麼法子，你們總不要被他誘惑；因為那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來。","他是抵擋主，高抬自己，超過一切稱為神的和一切受人敬拜的，甚至坐在神的殿裡，自稱是神。","我還在你們那裡的時候，曾把這些事告訴你們，你們不記得嗎？","現在你們也知道，那攔阻他的是甚麼，是叫他到了的時候才可以顯露。","因為那不法的隱意已經發動，只是現在有一個攔阻的，等到那攔阻的被除去，","那時這不法的人必顯露出來。主耶穌要用口中的氣滅絕他，用降臨的榮光廢掉他。","這不法的人來，是照撒但的運動，行各樣的異能、神蹟，和一切虛假的奇事，","並且在那沉淪的人身上行各樣出於不義的詭詐；因他們不領受愛真理的心，使他們得救。","故此，神就給他們一個生發錯誤的心，叫他們信從虛謊，","使一切不信真理、倒喜愛不義的人都被定罪。","主所愛的弟兄們哪，我們本該常為你們感謝神；因為他從起初揀選了你們，叫你們因信真道，又被聖靈感動，成為聖潔，能以得救。","神藉我們所傳的福音召你們到這地步，好得著我們主耶穌基督的榮光。","所以，弟兄們，你們要站立得穩，凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守。","但願我們主耶穌基督和那愛我們、開恩將永遠的安慰並美好的盼望賜給我們的父神，","安慰你們的心，並且在一切善行善言上堅固你們。"],"3":["弟兄們，我還有話說：請你們為我們禱告，好叫主的道理快快行開，得著榮耀，正如在你們中間一樣，","也叫我們脫離無理之惡人的手；因為人不都是有信心。","但主是信實的，要堅固你們，保護你們脫離那惡者。","我們靠主深信，你們現在是遵行我們所吩咐的，後來也必要遵行。","願主引導你們的心，叫你們愛神，並學基督的忍耐！","弟兄們，我們奉主耶穌基督的名吩咐你們，凡有弟兄不按規矩而行，不遵守從我們所受的教訓，就當遠離他。","你們自己原知道應當怎樣效法我們。因為我們在你們中間，未嘗不按規矩而行，","也未嘗白吃人的飯，倒是辛苦勞碌，晝夜做工，免得叫你們一人受累。","這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們。","我們在你們那裡的時候，曾吩咐你們說，若有人不肯做工，就不可吃飯。","因我們聽說，在你們中間有人不按規矩而行，甚麼工都不做，反倒專管閒事。","我們靠主耶穌基督吩咐、勸戒這樣的人，要安靜做工，吃自己的飯。","弟兄們，你們行善不可喪志。","若有人不聽從我們這信上的話，要記下他，不和他交往，叫他自覺羞愧。","但不要以他為仇人，要勸他如弟兄。","願賜平安的主隨時隨事親自給你們平安！願主常與你們眾人同在！","我－保羅親筆問你們安。凡我的信都以此為記，我的筆跡就是這樣。","願我們主耶穌基督的恩常與你們眾人同在！"]},"blk":{"1":[{"a":1,"z":2,"star":1,"grk":"<p lang=\"grc\">Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·<\/p><p lang=\"grc\">χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.<\/p>","lit":"<p>保羅和西爾瓦努和提摩太，給帖撒羅尼迦人的教會，在神我們的父和主耶穌基督裡；<\/p><p>恩典給你們和平安，從父神和主耶穌基督。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος<\/td><td>Paulos kai Silouanos kai Timotheos<\/td><td>保羅和西爾瓦努和提摩太<\/td><td>三人同署名，與帖前 1:1 相同<\/td><\/tr><tr><td>Σιλουανὸς<\/td><td>Silouanos<\/td><td>西爾瓦努<\/td><td>羅馬名；使徒行傳作 Σιλᾶς<\/td><\/tr><tr><td>τῇ ἐκκλησίᾳ Θεσσαλονικέων<\/td><td>tē ekklēsia Thessalonikeōn<\/td><td>帖撒羅尼迦人的教會<\/td><td>以人稱教會，不以城稱<\/td><\/tr><tr><td>ἐν θεῷ πατρὶ ἡμῶν<\/td><td>en theō patri hēmōn<\/td><td>在神我們的父裡<\/td><td>教會更深的地址<\/td><\/tr><tr><td>χάρις ὑμῖν καὶ εἰρήνη<\/td><td>charis hymin kai eirēnē<\/td><td>恩典給你們，和平安<\/td><td>先恩典，後平安；3:16 平安收尾<\/td><\/tr><\/table>","gram":"<p><strong>三個名字，一個聲音。<\/strong>Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος（Paulos kai Silouanos kai Timotheos）——與帖前 1:1 一字不差。保羅寫給帖撒羅尼迦的兩封信都是三人同署名；全章大量的第一人稱複數（1:3、4、7、10、11）不只是修辭，是三個曾一起在帖撒羅尼迦受過苦的人一起說話。<\/p><p><strong>◆ 和合本「西拉」，原文是 Σιλουανὸς（Silouanos）。<\/strong>這是羅馬名 Silvanus（西爾瓦努）。保羅書信一律用這個名字（林後 1:19；帖前 1:1；彼前 5:12 也作 Σιλουανοῦ（Silouanou））；路加在使徒行傳一律寫 Σιλᾶς（徒 15:22、40；17:4、10）。多數學者認為是同一個人的兩個名字：Σιλᾶς（Silas） 是他閃族名字的希臘寫法，Σιλουανὸς（Silouanos） 是發音相近的羅馬名——他和保羅一樣是羅馬公民（徒 16:37）。也有少數學者懷疑是兩個人，但兩人的行蹤完全重疊，此說難立。和合本統一譯作「西拉」，讓讀者一眼認出就是使徒行傳那位同伴，是好的譯法；原文只是多了一層：保羅在信上寫的是他的正式名字。<\/p><p>收信人是 τῇ ἐκκλησίᾳ Θεσσαλονικέων（tē ekklēsia Thessalonikeōn），「帖撒羅尼迦人的教會」——以人稱，不以城稱。接著 ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ（en theō patri hēmōn kai kyriō Iēsou Christō） 只用一個介系詞 ἐν（en） 管住兩個名字：父與主耶穌並列，同為教會存在的所在。保羅不必論證耶穌是神，他把耶穌放在父的旁邊，就已經說了。<\/p>","exp":"<p>〔背景〕徒 17:1--10（使徒行傳講義第 17 章）<\/p><p>本系列使徒行傳講義第 17 章講過這間教會怎樣出生：保羅「一連三個安息日，本著聖經與他們辯論」（徒 17:2），有人信了，也引來了暴民；弟兄們「隨即在夜間打發保羅和西拉往庇哩亞去」（徒 17:10）。三個安息日，大約一個月，屬靈的父母就被迫離開。這封信寫給一間根基最短、逼迫最早的教會。<\/p><p>「保羅、西拉、提摩太寫信給帖撒羅尼迦、在神－我們的父與主耶穌基督裡的教會」（1:1）。三個名字一起出現，本身就是一句話：服事不是一個人的英雄故事。保羅需要西拉，也需要年輕的提摩太；一起被趕出城的人，現在一起寫信。這是 235 裡的「2」——屬靈的同伴。<\/p><p>這間教會有兩個地址。地上的地址是帖撒羅尼迦，一座有人要抓他們的城；更深的地址是「在神我們的父與主耶穌基督裡」。浪打得到城裡，打不到父的手裡。整封信後面要講逼迫、講假消息、講不按規矩的人，第一節先把船錨扣好。<\/p><p>「願恩惠、平安從父神和主耶穌基督歸與你們」（1:2）。這是保羅一貫的問安，可是寫給一群被消息嚇得心神不寧的人，「平安」就不是客套。全卷最後的願望又回到這兩個字（3:16）——平安從主來，不從局勢好轉來。<\/p>"},{"a":3,"z":3,"star":2,"grk":"<p lang=\"grc\">Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,<\/p>","lit":"<p>感謝，我們欠著要獻給神，常常為了你們，弟兄們，正如這是相稱的，因為你們的信心格外地增長，並且你們眾人中每一個人向著彼此的愛滿溢出來，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Εὐχαριστεῖν ὀφείλομεν<\/td><td>Eucharistein opheilomen<\/td><td>感謝，我們欠著<\/td><td>ὀφείλω 是欠債的字；2:13 再現<\/td><\/tr><tr><td>καθὼς ἄξιόν ἐστιν<\/td><td>kathōs axion estin<\/td><td>正如這是相稱的<\/td><td>ἄξιος 字族本章第一次<\/td><\/tr><tr><td>ὑπεραυξάνει ἡ πίστις ὑμῶν<\/td><td>hyperauxanei hē pistis hymōn<\/td><td>你們的信心格外增長<\/td><td>ὑπέρ＋αὐξάνω，新約只此一次<\/td><\/tr><tr><td>πλεονάζει ἡ ἀγάπη<\/td><td>pleonazei hē agapē<\/td><td>愛滿溢出來<\/td><td>回應帖前 3:12 的禱告<\/td><\/tr><tr><td>ἑνὸς ἑκάστου πάντων ὑμῶν<\/td><td>henos hekastou pantōn hymōn<\/td><td>你們眾人中每一個人的<\/td><td>一個都沒漏<\/td><\/tr><tr><td>εἰς ἀλλήλους<\/td><td>eis allēlous<\/td><td>向著彼此<\/td><td>愛的方向<\/td><\/tr><\/table>","gram":"<p><strong>◆ 1:3–10 是一條長句。<\/strong>SBLGNT 從 1:3 的 Εὐχαριστεῖν（Eucharistein） 一路寫到 1:10 的 ἐν τῇ ἡμέρᾳ ἐκείνῃ（en tē hēmera ekeinē） 才落句點：感謝（1:3）→ 結果是誇口（1:4，ὥστε（hōste））→ 這是公義審判的明證（1:5）→ 因為神是公義的（1:6，εἴπερ（eiper））→ 主從天上顯現（1:7–8）→ 不聽從的人受刑（1:9）→ 主來得榮耀（1:10）。中文必須斷句，原文卻是一口氣：保羅的感謝，是一路感謝到那日子的。<\/p><p>Εὐχαριστεῖν ὀφείλομεν（Eucharistein opheilomen）：ὀφείλομεν（opheilomen） 是「欠」的字，像欠了債要還。2:13 又用一次（Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν（Hēmeis de opheilomen eucharistein））。有學者據此說後書語氣比前書冷淡、比較公事；但緊接的 καθὼς ἄξιόν ἐστιν（kathōs axion estin） 說明保羅不是勉強——<strong>神做了該被感謝的事，不感謝就是欠著。<\/strong>ἄξιος（axios） 字族本章出現三次（1:3 ἄξιόν（axion）、1:5 καταξιωθῆναι（kataxiōthēnai）、1:11 ἀξιώσῃ（axiōsē））。<\/p><p>兩個動詞都是現在式，都比平常的字「多」一點：ὑπεραυξάνει（hyperauxanei） 在 αὐξάνει（auxanei） 前面加了 ὑπέρ（hyper），「長過頭」；πλεονάζει（pleonazei） 是「多到滿出來」。這正對著前書的兩個禱告：「補滿你們信心的不足」（帖前 3:10），與「又願主叫你們彼此相愛的心，並愛眾人的心都能增長，充足」（帖前 3:12）——前書求的，後書看見了。帖前 1:3 是信、愛、望三件；這裡是信與愛，接著 1:4 是 ὑπομονῆς（hypomonēs）：盼望在逼迫裡長成了忍耐。<\/p>","exp":"<p>「弟兄們，我們該為你們常常感謝神，這本是合宜的」（1:3）。這是一間被逼迫、被假消息嚇到、還有人不做工的教會，保羅開口卻先感謝。他沒有假裝問題不存在，第 2、3 章會一件一件處理；但他先看見神在他們身上做成的事。帶領的人最容易先看見破洞，保羅先看見長出來的東西。<\/p><p>「我們該」三個字值得停一下。感謝不只是心情好的時候才有的反應，是神做了事以後，人欠他的一句話。一個只在順境裡感謝的人，其實是在感謝環境；在逼迫裡還看得見信心在長，才是在感謝神。<\/p><p>他們長在哪裡？「因你們的信心格外增長，並且你們眾人彼此相愛的心也都充足」（1:3）。信心像樹往上長，愛心像水往外滿。逼迫沒有讓他們縮成一團、各保各的，反而讓愛滿出來，流到每一個人——原文是「你們眾人中的每一個人」，一個都沒有漏掉。在苦難裡，最先枯乾的往往是彼此的關心；這間教會反過來。<\/p><p>保羅在前書為這兩件事禱告過，幾個月後看見了答案。代禱的人常常看不見結果，這一次保羅看見了。這也是 321 說的 920 最好的樣子：愛不是一兩個人撐著，是每一個人都往彼此流。<\/p>"},{"a":4,"z":4,"star":2,"grk":"<p lang=\"grc\">ὥστε αὐτοὺς ἡμᾶς ἐν ὑμῖν ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,<\/p>","lit":"<p>以致我們自己在你們身上誇口，在神的各教會裡，為了你們的忍耐和信心，在你們一切的逼迫和你們正在忍受的患難之中；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὥστε αὐτοὺς ἡμᾶς<\/td><td>hōste autous hēmas<\/td><td>以致我們自己<\/td><td>結果子句；「連我們自己」<\/td><\/tr><tr><td>ἐγκαυχᾶσθαι<\/td><td>enkauchasthai<\/td><td>在……裡誇口<\/td><td>新約只此一次<\/td><\/tr><tr><td>ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ<\/td><td>en tais ekklēsiais tou theou<\/td><td>在神的各教會裡<\/td><td>教會連著教會<\/td><\/tr><tr><td>ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως<\/td><td>hyper tēs hypomonēs hymōn kai pisteōs<\/td><td>為你們的忍耐和信心<\/td><td>一個冠詞管兩個名詞<\/td><\/tr><tr><td>ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν<\/td><td>en pasin tois diōgmois hymōn<\/td><td>在你們一切的逼迫中<\/td><td>複數：不只一次<\/td><\/tr><tr><td>αἷς ἀνέχεσθε<\/td><td>hais anechesthe<\/td><td>你們正在忍受的<\/td><td>現在式：還沒停<\/td><\/tr><\/table>","gram":"<p>ὥστε（hōste） 帶出結果：信心長、愛心滿，結果是 αὐτοὺς ἡμᾶς ἐν ὑμῖν ἐγκαυχᾶσθαι（autous hēmas en hymin enkauchasthai），「連我們自己都在你們身上誇口」。αὐτοὺς（autous） 帶強調：通常是別人替教會傳揚（帖前 1:8–9 各處的人都在傳說），這一次是寫信的人自己忍不住。ἐγκαυχᾶσθαι（enkauchasthai） 新約只此一次，由「在……裡」與 καυχάομαι（kauchaomai） 合成。<\/p><p>誇的內容是 ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως（hyper tēs hypomonēs hymōn kai pisteōs）：一個冠詞 τῆς（tēs） 管住兩個名詞，忍耐與信心是一件事的兩面。πίστεως（pisteōs） 可讀為「信心」，也可讀為「忠信」；在逼迫的上下文，兩個意思都在——信得住，也守得住。ὑπομονῆς（hypomonēs） 由「在底下」與「留下」兩個字根合成：<strong>在重擔底下不走開。<\/strong><\/p><p>ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν（en pasin tois diōgmois hymōn kai tais thlipsesin）：διωγμός（diōgmos） 是有人追著打的逼迫，θλῖψις（thlipsis） 是被壓的苦；兩個都是複數。αἷς ἀνέχεσθε（hais anechesthe） 是現在式：不是過去的事，是寫信的時候還在忍。本卷追蹤 στηρίζω（stērizō）／στήκω（stēkō） ↔ σαλεύω（saleuō） 從這裡起站：「站穩」這個字還沒有出現（要等到 2:15），站穩的人已經在了。<\/p>","exp":"<p>〔背景〕徒 17:5--9（使徒行傳講義第 17 章）<\/p><p>帖撒羅尼迦的逼迫，從第一個月就開始。「但那不信的猶太人心裡嫉妒，招聚了些市井匪類，搭夥成群，聳動合城的人闖進耶孫的家」（徒 17:5），找不到保羅，就把耶孫拖到地方官面前。罪名很重：「這些人都違背凱撒的命令，說另有一個王耶穌」（徒 17:7）。保羅走了，留下來的人沒有走。這封信寫的時候，那股壓力還在。<\/p><p>「都因你們在所受的一切逼迫患難中，仍舊存忍耐和信心」（1:4）。「仍舊」兩個字把整幅畫說出來：浪已經在打，而且沒有停，船還在。這是全卷主軸的起點。保羅沒有說他們的逼迫結束了，也沒有說他們很勇敢、不害怕；他說他們「存」——留在原地，不走開。<strong>忍耐不是不痛，是痛著還留下來。<\/strong><\/p><p>保羅還做了一件事：「我們在神的各教會裡為你們誇口」（1:4）。在哥林多、在別處，他把這群受苦的弟兄姊妹當作見證來講。受苦的人常常覺得自己很失敗、很邊緣；在神的家裡，他們的忍耐卻被看見、被傳講。教會是連著教會的，一處受苦，別處記念。<\/p><p>這給今天一個很實在的提醒：一個在職場被排擠、在家裡因信仰被為難的弟兄姊妹，需要聽見有人替他向神感謝、在弟兄中間提起他。不是叫他再撐一下，是讓他知道：他的忍耐，神看見，教會也看見。<\/p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,<\/p>","lit":"<p>這是神公義審判的明證，為要你們被算為配得神的國，你們也正是為這國受苦；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἔνδειγμα<\/td><td>endeigma<\/td><td>明證、看得見的證據<\/td><td>新約只此一次；總結 1:4<\/td><\/tr><tr><td>τῆς δικαίας κρίσεως τοῦ θεοῦ<\/td><td>tēs dikaias kriseōs tou theou<\/td><td>神公義的審判<\/td><td>本章「公義」字根一串字的第一個<\/td><\/tr><tr><td>εἰς τὸ καταξιωθῆναι ὑμᾶς<\/td><td>eis to kataxiōthēnai hymas<\/td><td>為要你們被算為配得<\/td><td>被動：是神算的<\/td><\/tr><tr><td>τῆς βασιλείας τοῦ θεοῦ<\/td><td>tēs basileias tou theou<\/td><td>神的國<\/td><td>受苦所朝的方向<\/td><\/tr><tr><td>ὑπὲρ ἧς καὶ πάσχετε<\/td><td>hyper hēs kai paschete<\/td><td>你們也正為這國受苦<\/td><td>現在式；καί：也<\/td><\/tr><\/table>","gram":"<p>ἔνδειγμα（endeigma） 前面沒有動詞，也沒有冠詞，文法上是同位語：它總結 1:4 整件事——你們在一切逼迫中仍舊存忍耐和信心，「這」就是明證。所以證據不是逼迫本身，而是<strong>在逼迫中被保守的信心<\/strong>。字根 δείκνυμι（deiknymi） 是「指給人看」：神的公義在帖撒羅尼迦是看得見的，看得見的地方，就是這群人還站著。<\/p><p>τῆς δικαίας κρίσεως τοῦ θεοῦ（tēs dikaias kriseōs tou theou） 開啟本章「公義」字根的一串字：1:5 δικαίας（dikaias）、1:6 δίκαιον（dikaion）、1:8 ἐκδίκησιν（ekdikēsin）、1:9 δίκην（dikēn）。四個字串成一條「公義」的線，是 1:5–10 的骨幹。<\/p><p>εἰς τὸ καταξιωθῆναι ὑμᾶς（eis to kataxiōthēnai hymas） 有兩種讀法：一、目的——受苦是「為了使」你們配得，好像苦難是入國的資格；二、結果或證明——在受苦中「被算為、被宣告為」配得。καταξιόω（kataxioō） 是被動，施動者是神；新約另兩次（路 20:35；徒 5:41）也都是「被看為配得」，不是「賺到」。本講義取第二讀：<strong>國不是靠受苦買來的，受苦顯出他們本來就屬這國<\/strong>（回指加拉太書立場二：稱義是因信，不是靠行為）。ὑπὲρ ἧς καὶ πάσχετε（hyper hēs kai paschete） 的 καὶ（kai） 是「也」：保羅自己為這國受苦，你們也是。<\/p>","exp":"<p>「這正是神公義判斷的明證」（1:5）。這一句初讀很難懂：受苦怎麼會證明神公義？照一般人的直覺，好人受苦正好證明神不公義。保羅把眼光倒過來。<\/p><p>他看的不是苦難本身，是苦難裡的人。一群根基只有一個月的新信徒，被暴民圍、被告官、被鄰居排擠，竟然信心格外增長、愛心滿溢、仍舊存忍耐。這不是人自己撐得出來的，是神在他們裡面做工。<strong>神正在保守他們，這就是神正在作審判官的證據<\/strong>：他看見了，他站在他們這一邊，他也會把事情做完。<\/p><p>「叫你們可算配得神的國；你們就是為這國受苦」（1:5）。「配得」很容易聽歪，好像受夠了苦才換得到天國的門票。原文是被動的「被算為」：是神宣告他們配得，不是他們自己掙得。受苦不是入場費，是一張照片，照出他們已經屬於哪一國。保羅在路司得也對門徒說過：「我們進入神的國，必須經歷許多艱難」（徒 14:22）。艱難是路上的風景，不是買路錢。<\/p><p>這裡的 321 是觀點的改變：從暫時的觀點，換成永恆的觀點。同一場逼迫，用今天的眼光看是失敗與損失；用神國的眼光看，是一張證明你屬於誰的照片。換了觀點，苦沒有變輕，人卻不再被它定義。<\/p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν<\/p><p lang=\"grc\">καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθʼ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπʼ οὐρανοῦ μετʼ ἀγγέλων δυνάμεως αὐτοῦ<\/p>","lit":"<p>既然在神那裡這是公義的：以患難回報那些壓迫你們的人，<\/p><p>並以鬆綁回報你們這些受壓迫的人，與我們一同，在主耶穌從天上同他能力的天使顯現的時候，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εἴπερ<\/td><td>eiper<\/td><td>既然確實<\/td><td>前提，不是假設<\/td><\/tr><tr><td>δίκαιον παρὰ θεῷ<\/td><td>dikaion para theō<\/td><td>在神那裡是公義的<\/td><td>神自己的標準<\/td><\/tr><tr><td>τοῖς θλίβουσιν ὑμᾶς θλῖψιν<\/td><td>tois thlibousin hymas thlipsin<\/td><td>給壓你們的人以壓<\/td><td>同一字根：以壓還壓<\/td><\/tr><tr><td>ὑμῖν τοῖς θλιβομένοις ἄνεσιν<\/td><td>hymin tois thlibomenois anesin<\/td><td>給被壓的你們以鬆綁<\/td><td>同一個動詞的另一頭<\/td><\/tr><tr><td>μεθʼ ἡμῶν<\/td><td>meth' hēmōn<\/td><td>與我們一同<\/td><td>保羅也在受壓的人中<\/td><\/tr><tr><td>ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ<\/td><td>en tē apokalypsei tou kyriou Iēsou<\/td><td>在主耶穌顯現的時候<\/td><td>追蹤一第一站<\/td><\/tr><tr><td>ἀπʼ οὐρανοῦ μετʼ ἀγγέλων δυνάμεως αὐτοῦ<\/td><td>ap' ouranou met' angelōn dynameōs autou<\/td><td>從天上，同他能力的天使<\/td><td>看得見的、從上而下<\/td><\/tr><\/table>","gram":"<p><strong>◆ εἴπερ（eiper）：前提，不是假設。<\/strong>εἴπερ（eiper） 字面是「如果真的」，但這裡（如同羅 8:9、17）說話的人並不懷疑條件：「既然在神那裡這是公義的」。和合本「神既是公義的」譯得準。所以 1:6–7 不是「萬一神公義的話」，是從神的本性推出必然的結果。<\/p><p>句子的骨架是一個不定詞 ἀνταποδοῦναι（antapodounai） 帶兩組受詞，左右對稱：<\/p><blockquote><p>τοῖς θλίβουσιν ὑμᾶς θλῖψιν（tois thlibousin hymas thlipsin）——給壓你們的人：壓<\/p><p>ὑμῖν τοῖς θλιβομένοις ἄνεσιν（hymin tois thlibomenois anesin）——給被壓的你們：鬆綁<\/p><\/blockquote><p>θλίβω（thlibō） 一個字根連用三次（θλίβουσιν（thlibousin）、θλῖψιν（thlipsin）、θλιβομένοις（thlibomenois））：同一個「壓」，在審判那天分成兩個方向。ἄνεσις（anesis） 原是「放鬆、鬆開」，弓弦鬆下來、囚犯鬆了綁、病人得喘息，都用這個字。和合本「同得平安」是意譯，原文更具體：<strong>壓在身上的重量被拿開。<\/strong>μεθʼ ἡμῶν（meth' hēmōn）「與我們一同」：保羅把自己算在受壓的人裡面，不是站在岸上喊話。<\/p><p>「報應」有兩種讀法：一、同態報復——受害者盼望看見仇敵受同樣的苦，甚至可以替神詛咒仇敵；二、<strong>伸冤在神<\/strong>——審判是神的職分，受害者把它交給神，自己不報仇。ἀνταποδοῦναι（antapodounai） 的主詞是神，不是教會；保羅在羅馬書引申 32:35，用的正是同一個字根 ἀνταποδώσω（antapodōsō）：「伸冤在我，我必報應」（羅 12:19）。本講義取第二讀（全卷立場議題「神的公義審判與永遠沉淪」）。<\/p><p>時間落在 ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ（en tē apokalypsei tou kyriou Iēsou）。ἀποκάλυψις（apokalypsis） 是「揭開帷幕」：主不是那時才存在，是那時不再被遮蓋。這是本卷追蹤 ἀποκάλυψις（apokalypsis）／παρουσία（parousia） 的第一站；第 2 章另有一個「顯露」（2:3 的 ἀποκαλυφθῇ（apokalyphthē））——大罪人的顯露，與主的顯現，兩個帷幕，一真一假。<\/p>","exp":"<p>「神既是公義的，就必將患難報應那加患難給你們的人」（1:6）。這一句最容易讀錯，也最需要讀對。錯讀的方向是：「等著看吧，那些欺負我們的人將來會很慘。」那樣讀，經文就成了復仇的快感，甚至成了詛咒仇敵的許可。<\/p><p>可是這一句還沒有讀完。下一節緊接著：「也必使你們這受患難的人與我們同得平安」（1:7）。原文是同一個動詞帶兩組受詞，一口氣說完——<strong>審判與平安是同一件事的兩面。<\/strong>神審判，不是為了出一口氣，是為了把壓在受苦者身上的重量拿開。一個被霸凌的孩子最需要的，不是看見霸凌的人被打，而是有一位老師走進來，把壓在他身上的那隻手拿開。1:6–7 的重心，在後半句。<\/p><p>所以保羅給受害者的，不是報仇的權利，是不必報仇的自由。「親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19）。<strong>伸冤在神，所以我不必報仇；伸冤在神，所以我也不必假裝沒事。<\/strong>這兩句要一起說。「交給神」不是「不准說」：受了暴力、詐騙、侵害的人，說出來、求助、報警、尋求法律的保護與公道，都是正當的；保羅自己說在上掌權的「是神的用人，是伸冤的」（羅 13:4）。把審判交給神，與向人求助並不衝突。<\/p><p>「那時，主耶穌同他有能力的天使從天上在火焰中顯現」（1:7）。這浪有終點。逼迫不會無限期地打下去，有一天帷幕拉開，主親自出現。保羅沒有給日期，只給確定：那一天一定來，而且是主親自來。這是 321「讓人作人，讓神作神」最實際的落點：審判的位子是神的，我回到人的位子——受了傷，就承認受傷；能求助，就求助；我做不了的那一份，留給那位一定會來的主。<\/p>"},{"a":8,"z":8,"star":1,"grk":"<p lang=\"grc\">ἐν φλογὶ πυρός, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,<\/p>","lit":"<p>在火的火焰中，把報應給那些不認識神的人，和那些不聽從我們主耶穌福音的人；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐν φλογὶ πυρός<\/td><td>en phlogi pyros<\/td><td>在火的火焰中<\/td><td>SBLGNT 讀法；異文作「火焰的火」<\/td><\/tr><tr><td>διδόντος ἐκδίκησιν<\/td><td>didontos ekdikēsin<\/td><td>施行報應<\/td><td>屬格分詞，回指主耶穌<\/td><\/tr><tr><td>τοῖς μὴ εἰδόσι θεὸν<\/td><td>tois mē eidosi theon<\/td><td>給那些不認識神的<\/td><td>εἰδόσι 是 οἶδα 的分詞：不認識<\/td><\/tr><tr><td>τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ<\/td><td>tois mē hypakouousin tō euangeliō<\/td><td>給那些不聽從福音的<\/td><td>現在式：持續地拒絕<\/td><\/tr><tr><td>τοῦ κυρίου ἡμῶν Ἰησοῦ<\/td><td>tou kyriou hēmōn Iēsou<\/td><td>我們主耶穌的<\/td><td>福音屬於主耶穌<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別 1:8。<\/strong>SBLGNT 作 ἐν φλογὶ πυρός（en phlogi pyros），「在火的火焰中」，跟 Tregelles；WH、NA28 與拜占庭傳統（RP）作 πυρὶ φλογός（pyri phlogos），「在火焰的火中」。兩種讀法只是兩個名詞的位置對調，抄本支持互有長短。φλογὶ πυρός（phlogi pyros） 是七十士譯本描寫荊棘火焰的熟語（徒 7:30 也作 ἐν φλογὶ πυρὸς（en phlogi pyros）），抄寫的人容易照熟悉的片語改，所以有學者認為較不熟的 πυρὶ φλογός（pyri phlogos） 可能較早；SBLGNT 則取另一邊。本講義判斷：意思毫無差別，和合本「在火焰中」兩讀都合；原文欄照 SBLGNT。<\/p><p>διδόντος ἐκδίκησιν（didontos ekdikēsin） 是屬格分詞，回指 1:7 的 τοῦ κυρίου Ἰησοῦ（tou kyriou Iēsou）：<strong>施行報應的是主耶穌。<\/strong>這使我們想起「耶和華必在火中降臨……以火焰施行責罰」（賽 66:15）：以賽亞書在火中降臨的是耶和華，保羅沒有標明引用，卻讓主耶穌站進了耶和華的經文。<\/p><p>受報應的有兩組描寫，各帶一個冠詞：τοῖς μὴ εἰδόσι θεὸν（tois mē eidosi theon） 與 τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ（tois mē hypakouousin tō euangeliō）。前一句使我們想起「願你將忿怒傾在不認識你的列國中」（耶 10:25）。有人讀為兩群人（外邦人與猶太人），多數學者讀為同一群人的兩個描寫（希伯來詩的平行）。本講義取後者：上下文指的正是那些「加患難給你們的人」（1:6）——不是沒有機會聽，是聽了、拒絕、還逼迫傳的人。<\/p>","exp":"<p>「要報應那不認識神和那不聽從我主耶穌福音的人」（1:8）。這一節要放回它的上下文讀。保羅不是在向世界公布一份地獄名單，是在安慰一群被欺負的人：那些闖進耶孫的家、把弟兄拖去見官的人，不是沒有人管。<\/p><p>所以審判的對象被描寫成「不聽從」的人。聽從的反面不是「沒聽過」，是聽了不要。從來沒有機會聽福音的人怎麼辦，是另一個問題，本章議題頁另外處理；這一節講的是拒絕光、還去打擊拿著光的人。今天讀它，不是為了替別人對號入座，是讓受欺負的人知道，有人記得這筆帳。<\/p><p>還有一個細節：施行報應的是主耶穌自己。那位為罪人死的，就是將來審判的那一位。這讓審判不再冷冰冰——審判者是最明白人、也最愛人的那一位。<strong>審判在他手裡，比在任何人手裡都安全<\/strong>，包括比在我們自己手裡安全。<\/p>"},{"a":9,"z":9,"star":3,"grk":"<p lang=\"grc\">οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,<\/p>","lit":"<p>這些人要付出刑罰——永遠的毀壞，離開主的面，也離開他力量的榮耀，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οἵτινες<\/td><td>hoitines<\/td><td>這些人，正是這種人<\/td><td>性質關係代名詞<\/td><\/tr><tr><td>δίκην τίσουσιν<\/td><td>dikēn tisousin<\/td><td>要付出刑罰<\/td><td>τίνω 新約只此一次：付代價<\/td><\/tr><tr><td>ὄλεθρον αἰώνιον<\/td><td>olethron aiōnion<\/td><td>永遠的毀壞<\/td><td>與 2:16「永遠的安慰」對照<\/td><\/tr><tr><td>ἀπὸ προσώπου τοῦ κυρίου<\/td><td>apo prosōpou tou kyriou<\/td><td>離開（或：從）主的面<\/td><td>兩讀<\/td><\/tr><tr><td>ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ<\/td><td>apo tēs doxēs tēs ischyos autou<\/td><td>離開他力量的榮耀<\/td><td>賽 2:10 七十士譯本同一組字<\/td><\/tr><\/table>","gram":"<p><strong>◆ 1:9 與以賽亞書第 2 章。<\/strong>ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ（apo prosōpou tou kyriou kai apo tēs doxēs tēs ischyos autou） 與七十士譯本賽 2:10（又見 2:19、21）幾乎逐字相同；七十士譯本在「面」之後多了 τοῦ φόβου（tou phobou），作 ἀπὸ προσώπου τοῦ φόβου κυρίου（apo prosōpou tou phobou kyriou）。和合本賽 2:10 作「躲避耶和華的驚嚇和他威嚴的榮光」（賽 2:10）。以賽亞書的「主」是耶和華，保羅這裡的「主」是 1:7–8 的主耶穌。這使我們想起賽 2:10，保羅沒有標明引用；但他讓耶穌站在耶和華的位置上，這是全卷最強的基督論。<\/p><p>ἀπὸ προσώπου（apo prosōpou） 有兩讀：一、分離——「離開主的面」（和合本、多數英譯）；二、來源——「從主面前發出的」毀壞，近於以賽亞書人們「躲避」耶和華的那一幕。本講義隨和合本以第一讀為主，因為下一節的對照是主「在他聖徒的身上得榮耀」：一邊是離開他的面，一邊是在他面前。第二讀也不必排除——毀壞正是從那張面發出的光。<\/p><p><strong>◆ ὄλεθρον αἰώνιον（olethron aiōnion） 的三種讀法。<\/strong>ὄλεθρος（olethros） 在新約共四次（林前 5:5；帖前 5:3；提前 6:9；本節），意思是毀壞、敗壞，不必然是「不再存在」；αἰώνιον（aiōnion） 與「永生」是同一個字（太 25:46 κόλασιν αἰώνιον（kolasin aiōnion）……ζωὴν αἰώνιον（zōēn aiōnion））。<\/p><blockquote><p><strong>一、永刑說（有知覺的永遠刑罰）<\/strong>：αἰώνιον（aiōnion） 與永生等長；「離開主的面」是持續的狀態。奧古斯丁以來的傳統，絕大多數福音派與天主教。<\/p><p><strong>二、條件不朽說（滅絕說）<\/strong>：ὄλεθρος（olethros） 是毀滅，永遠的是結果，不是過程；不朽是神賜給得救者的。部分福音派學者持守（如斯托得曾表示傾向）。<\/p><p><strong>三、普救論<\/strong>：最後萬人都得救。<strong>本講義不採用<\/strong>——本節的「永遠」與 2:10–12 都直接否定它。<\/p><\/blockquote><p>本講義站在歷代教會的傳統讀法（永刑說），同時承認條件不朽說是福音派內的少數立場，不以異端稱之（全卷立場議題「神的公義審判與永遠沉淪」）。全卷 αἰώνιος（aiōnios） 只有兩次：本節的 ὄλεθρον αἰώνιον（olethron aiōnion），與 2:16 的 παράκλησιν αἰωνίαν（paraklēsin aiōnian）——方向完全相反。<\/p>","exp":"<p>「他們要受刑罰，就是永遠沉淪，離開主的面和他權能的榮光」（1:9）。這是全章地勢最低的一節，也是最常被拿來嚇人的一節。讀它之前，先記得它寫給誰：寫給受逼迫的人，讓他們知道惡不會永遠得逞。它不是講台上用來恐嚇人的鞭子。<\/p><p>這一節最重的字不是「火」，是「面」。沉淪的核心是「離開主的面」——關係的斷絕。聖經最大的福氣是見主的面：「也要見他的面」（啟 22:4）；最深的失落，是永遠離開那張面。<strong>地獄最深的痛是沒有神。<\/strong>一個人一生都說「不要神管我」，最後神尊重了他的選擇——這是 1:9 最沉重的地方。<\/p><p>永遠沉淪是永遠受苦還是被消滅，歷代有不同的讀法；本講義站在傳統讀法，也承認持另一種讀法的是福音派內的弟兄。這件事不該動搖人的信心；該被動搖的，是我們對失喪的人的冷漠。保羅寫這一節，心裡沒有幸災樂禍；他在別處說，神「願意萬人得救，明白真道」（提前 2:4）。<\/p><p>所以讀 1:9 一定要同時讀 2:16。全卷只有兩個「永遠」：一個是永遠沉淪，一個是「開恩將永遠的安慰並美好的盼望賜給我們」（2:16）。神寫這封信，不是為了第一個「永遠」，是為了第二個。<strong>傳福音不是嚇人進天堂，是邀請人回到神的面前。<\/strong><\/p><p>牧養上有兩條底線。不用地獄恐嚇孩子，不拿火湖當管教的工具。在喪禮與探訪中，不斷言任何一位已故的人的永遠結局；那是神的位子，不是我們的。我們能做的，是讓還活著的人看見一位不願人離開他面的神。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<p lang=\"grc\">ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφʼ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.<\/p>","lit":"<p>當他來的時候，要在他的聖徒身上得榮耀，並在一切已經信了的人身上被驚奇——因為我們向你們的見證被信了——在那日子。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὅταν ἔλθῃ<\/td><td>hotan elthē<\/td><td>當他來的時候<\/td><td>時間子句，接回 1:7<\/td><\/tr><tr><td>ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ<\/td><td>endoxasthēnai en tois hagiois autou<\/td><td>在他的聖徒身上得榮耀<\/td><td>ἐν：在……裡、藉著<\/td><\/tr><tr><td>θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν<\/td><td>thaumasthēnai en pasin tois pisteusasin<\/td><td>在一切信了的人身上被驚奇<\/td><td>不定過去：已經信了<\/td><\/tr><tr><td>ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφʼ ὑμᾶς<\/td><td>hoti episteuthē to martyrion hēmōn eph' hymas<\/td><td>因為我們給你們的見證被信了<\/td><td>插入句<\/td><\/tr><tr><td>ἐν τῇ ἡμέρᾳ ἐκείνῃ<\/td><td>en tē hēmera ekeinē<\/td><td>在那日子<\/td><td>留到長句最後<\/td><\/tr><\/table>","gram":"<p>ὅταν ἔλθῃ（hotan elthē） 把時間接回 1:7 的顯現：長句在這裡轉身，從受刑的人轉到主自己。兩個被動不定詞平行：ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ（endoxasthēnai en tois hagiois autou） 與 θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν（thaumasthēnai en pasin tois pisteusasin）。ἐνδοξάζομαι（endoxazomai） 新約只見於本章（1:10、12）。ἐν（en） 可讀為「在……中間」（主在聖徒的聚集中得榮耀），也可讀為「在……身上、藉著」（榮耀從聖徒身上反照出來）；和合本取後者，本講義從之——<strong>主的榮耀要從他百姓的身上照出來。<\/strong><\/p><p>這使我們想起「他在聖者的會中，是大有威嚴的神」（詩 89:7），七十士譯本作 ὁ θεὸς ἐνδοξαζόμενος ἐν βουλῇ ἁγίων（ho theos endoxazomenos en boulē hagiōn），正是同一個動詞；又使我們想起「我必因你得榮耀」（賽 49:3）。舊約裡在聖者中得榮耀的是耶和華，這裡是主耶穌。<\/p><p>ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφʼ ὑμᾶς（hoti episteuthē to martyrion hēmōn eph' hymas） 是插入句，打斷了主句：保羅寫到「一切信的人」，忍不住回頭補一句——這包括你們，我們的見證你們信了。ἐν τῇ ἡμέρᾳ ἐκείνῃ（en tē hēmera ekeinē） 被留到整條長句最後，像一扇門關上：從 1:3 起的那一口氣，落在「那日子」。七十士譯本賽 2:11、17 也一再用 ἐν τῇ ἡμέρᾳ ἐκείνῃ（en tē hēmera ekeinē），與 1:9 的化用同出一章。<\/p>","exp":"<p>「這正是主降臨、要在他聖徒的身上得榮耀、又在一切信的人身上顯為希奇的那日子」（1:10）。全章從谷底一步跳上山頂：上一節是離開主的面，這一節是主來到他百姓中間。本章的章題就出自這裡。<\/p><p>留意榮耀照出來的地方：不在天上的雲彩裡，在「他聖徒的身上」。主再來那一天，令人驚奇的不只是主的威榮，還有他在一群平凡人身上做成的事——一群被趕出會堂、被告官、只學了一個月真理的人，竟然站到了最後。畫家的榮耀，不掛在他的簽名上，掛在畫上；我們就是那幅畫。<\/p><p>這給受苦的人一個新的眼光。帖撒羅尼迦人今天被當作城裡的麻煩人物；那一天，他們是主的榮耀顯出來的地方。今天被看輕的，那天被驚奇。這不是叫人默默忍受不公，而是讓人在不公裡知道：自己真正的價值，不由加害的人來定。<\/p><p>保羅還插了一句：「我們對你們作的見證，你們也信了」（1:10）。這一句很溫柔。他好像怕他們以為「一切信的人」是指別人、指更屬靈的人，所以特別說：包括你們。那一天被主的榮耀照亮的人當中，有這群只聽了三個安息日福音的人。信，不在乎時間長短，在乎信的是誰。<\/p><p>第 1 章是「榮」，等候主的第一個姿勢是抬頭。浪還在打，抬頭的人看見浪的盡頭有光。但主耶穌自己作了界線：「但那日子，那時辰，沒有人知道」（太 24:36）。保羅只說那日子必來，沒有給日期；我們要做的不是算日子，是抬頭。<\/p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,<\/p><p lang=\"grc\">ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.<\/p>","lit":"<p>為此，我們也常常為你們禱告，好叫我們的神算你們配得那呼召，並在能力中成全一切良善的心願和信心的工作，<\/p><p>好叫我們主耶穌的名在你們身上得榮耀，你們也在他身上，照著我們的神和主耶穌基督的恩典。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εἰς ὃ<\/td><td>eis ho<\/td><td>為此<\/td><td>接回 1:10 的目標<\/td><\/tr><tr><td>ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως<\/td><td>hina hymas axiōsē tēs klēseōs<\/td><td>好叫他算你們配得那呼召<\/td><td>ἄξιος 字族第三次<\/td><\/tr><tr><td>πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης<\/td><td>plērōsē pasan eudokian agathōsynēs<\/td><td>成全一切良善的心願<\/td><td>人的心願由神成全<\/td><\/tr><tr><td>ἔργον πίστεως ἐν δυνάμει<\/td><td>ergon pisteōs en dynamei<\/td><td>信心的工作，在能力裡<\/td><td>追蹤 ἔργον 第一站<\/td><\/tr><tr><td>ὅπως ἐνδοξασθῇ τὸ ὄνομα<\/td><td>hopōs endoxasthē to onoma<\/td><td>好叫那名得榮耀<\/td><td>1:10 的動詞再現<\/td><\/tr><tr><td>καὶ ὑμεῖς ἐν αὐτῷ<\/td><td>kai hymeis en autō<\/td><td>你們也在他身上<\/td><td>榮耀是雙向的<\/td><\/tr><tr><td>κατὰ τὴν χάριν<\/td><td>kata tēn charin<\/td><td>照著恩典<\/td><td>一切的根據<\/td><\/tr><\/table>","gram":"<p>εἰς ὃ（eis ho）「為此」接回 1:10：既然那日子主要在聖徒身上得榮耀，為此我們禱告。禱告的內容是一個 ἵνα（hina） 子句帶兩個動詞 ἀξιώσῃ（axiōsē） 與 πληρώσῃ（plērōsē），主詞都是 ὁ θεὸς ἡμῶν（ho theos hēmōn）。<strong>算你們配得的是神，成全的也是神。<\/strong>ἀξιόω（axioō） 是本章 ἄξιος（axios） 字族第三次（1:3、5、11）：從「感謝是合宜的」，到「被算為配得神的國」，到「配得過所蒙的召」。<\/p><p>εὐδοκίαν ἀγαθωσύνης（eudokian agathōsynēs） 的 εὐδοκία（eudokia） 是「心之所願」，可指神的美意，也可指信徒對良善的渴望。因為與 ἔργον πίστεως（ergon pisteōs） 平行（兩者都是信徒的事），多數解經家讀為後者，和合本「你們一切所羨慕的良善」也這樣讀。ἔργον πίστεως（ergon pisteōs） 與帖前 1:3 同一個片語（「因信心所做的工夫」），是本卷追蹤 ἔργον（ergon）／ἐργάζομαι（ergazomai） 的第一站——第 3 章要談做工，起點是信心的工夫，不是焦慮的勞碌。ἐν δυνάμει（en dynamei） 放在最後：工夫是在神的能力裡做成的。<\/p><p>1:12 ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν（hopōs endoxasthē to onoma tou kyriou hēmōn Iēsou en hymin） 接著 καὶ ὑμεῖς ἐν αὐτῷ（kai hymeis en autō）：主的名在你們身上，你們在他身上——榮耀是雙向的。結尾 κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ（kata tēn charin tou theou hēmōn kai kyriou Iēsou Christou） 只有一個冠詞 τοῦ（tou）：有學者據此讀為「我們的神兼主耶穌基督」，像多 2:13 那樣；多數學者認為「主耶穌基督」是專名，本來可以不帶冠詞，仍讀為父與子兩位。本講義從和合本讀為兩位，同時指出：恩典同出於父與子，這本身已經把耶穌放在神的一邊。<\/p>","exp":"<p>「因此，我們常為你們禱告，願我們的神看你們配得過所蒙的召」（1:11）。保羅的眼睛剛從那日子收回來，馬上落在今天。末世觀如果是對的，最直接的果效不是更會算日子，是更會禱告、更想今天活得配得上。<\/p><p>「配得過」不是要靠自己的表現去換得蒙召。呼召是神先給的；保羅求的是神「看」他們配得——由神自己來確認、來成全。孩子一出生就有了家裡的姓，父母還會一路陪他長成配得上這個姓的人。<strong>蒙召是一次的，配得過所蒙的召是一生的。<\/strong><\/p><p>保羅求的第二件事：「又用大能成就你們一切所羨慕的良善和一切因信心所做的工夫」（1:11）。心裡想行的善，手上因信心在做的工，神都用大能使它完成。這對服事的人是很大的安慰：做工的是我們，成全的是神。不必靠自己硬撐到過勞；做得成的，是他的大能。<\/p><p>目標是：「叫我們主耶穌的名在你們身上得榮耀，你們也在他身上得榮耀」（1:12）。這就是 321 說的「讓耶穌得著一切的榮耀」。但保羅多說了半句：你們也在他身上得榮耀。榮耀耶穌，不是把人踩扁來抬高他；耶穌得榮耀的地方，人也被抬起來。像月亮照亮夜空，月亮自己也因此被看見——光是太陽的，美卻是兩個的。<\/p><p>最後一句把一切釘在根上：「都照著我們的神並主耶穌基督的恩」（1:12）。受苦中被算為配得，是恩；善行得以成全，是恩；那日子在主裡得榮耀，也是恩。第 1 章從恩惠起頭（1:2），也在恩典收尾。<\/p>"}],"2":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπʼ αὐτόν,<\/p><p lang=\"grc\">εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε διʼ ἐπιστολῆς ὡς διʼ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ κυρίου<\/p>","lit":"<p>但我們請求你們，弟兄們，論到我們主耶穌基督的降臨，和我們被聚集到他那裡，<\/p><p>要你們不要很快地從理智上被搖動，也不要驚慌，無論是藉著靈，或藉著言語，或藉著好像出於我們的書信，好像主的日子已經來到了。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἐρωτῶμεν<\/td><td>Erōtōmen<\/td><td>我們請求<\/td><td>和合本「我勸」；朋友之間的請求口吻<\/td><\/tr><tr><td>τῆς παρουσίας<\/td><td>tēs parousias<\/td><td>降臨、親臨<\/td><td>追蹤一：主的「到場」<\/td><\/tr><tr><td>ἡμῶν ἐπισυναγωγῆς ἐπʼ αὐτόν<\/td><td>hēmōn episynagōgēs ep' auton<\/td><td>我們被聚集到他那裡<\/td><td>新約只見於此與來 10:25<\/td><\/tr><tr><td>σαλευθῆναι<\/td><td>saleuthēnai<\/td><td>被搖動<\/td><td>船被浪打；追蹤三的「搖動」端<\/td><\/tr><tr><td>ἀπὸ τοῦ νοὸς<\/td><td>apo tou noos<\/td><td>從理智<\/td><td>被搖得離開了清醒的心思<\/td><\/tr><tr><td>θροεῖσθαι<\/td><td>throeisthai<\/td><td>驚慌<\/td><td>太 24:6 主耶穌用的同一個字<\/td><\/tr><tr><td>ἐνέστηκεν<\/td><td>enestēken<\/td><td>已經來到<\/td><td>完成式；cu89t 註腳「現在：或譯就」<\/td><\/tr><\/table>","gram":"<p><strong>2:1--2 是一句話：一個請求，接一個目的。<\/strong>Ἐρωτῶμεν δὲ ὑμᾶς（Erōtōmen de hymas） 是「我們請求你們」，不是發號施令；保羅對一間受驚的教會，先用朋友的口吻。請求的內容由 εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς（eis to mē tacheōs saleuthēnai hymas apo tou noos） 帶出：冠詞不定詞表目的。<\/p><p>2:1 的主題片語 ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπʼ αὐτόν（hyper tēs parousias tou kyriou hēmōn Iēsou Christou kai hēmōn episynagōgēs ep' auton） 只用了一個冠詞 τῆς（tēs），把「主的降臨」和「我們的聚集」綁成同一件事的兩面。ἐπισυναγωγή（episynagōgē） 在新約只出現兩次，另一次是來 10:25 的「聚會」；動詞形 ἐπισυνάξουσιν（episynaxousin） 是太 24:31 天使把選民「都招聚了來」。這個聚集就是帖前 4:17 的被提，各派都同意；爭議在時間。<strong>被提四說<\/strong>：災前被提（時代論前千禧年派，也是許多華人教會最熟悉的一說）；災中被提（少數前千禧年派）；忿怒前被提（近代部分前千禧年學者）；災後被提（歷史前千禧年派，無千禧年與後千禧年派也把聚集放在主唯一一次的降臨）。四說都相信主必親自、看得見地再來，本講義不替教會決定。<\/p><p>2:2 兩個動詞，時態不同。σαλευθῆναι（saleuthēnai） 是不定過去被動，「一下子被搖動」，像船被一個浪打歪；ἀπὸ τοῦ νοὸς（apo tou noos） 說被搖離的是理智、清醒的心思。μηδὲ θροεῖσθαι（mēde throeisthai） 是現在式，「持續處在驚慌裡」：一個浪過去了，心還在晃。θροεῖσθαι（throeisthai） 正是主耶穌在橄欖山說「總不要驚慌」的字（太 24:6 作 μὴ θροεῖσθε（mē throeisthe））。<\/p><p>消息的三個來源用三個 μήτε（mēte） 排開：μήτε διὰ πνεύματος（藉著靈：有人說得了啟示）、μήτε διὰ λόγου（藉著言語：傳話、講道）、μήτε διʼ ἐπιστολῆς ὡς διʼ ἡμῶν（好像出於我們的書信）。最後一個 ὡς（hōs） 可能管三樣，也可能只管書信；不論哪一樣，都冒用了使徒的權威。<\/p><blockquote><p>◆ cu89t 註腳 2:2：「現在」或譯「就」。原文 ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ κυρίου（hōs hoti enestēken hē hēmera tou kyriou）——ἐνέστηκεν（enestēken） 是 ἐνίστημι（enistēmi） 的完成式，保羅在別處用這個字的分詞指「現在的事」（羅 8:38 ἐνεστῶτα（enestōta））。所以這不是「主的日子快到了」，是<strong>「主的日子已經到了、已經在這裡了」<\/strong>。帖撒羅尼迦人怕的不是來不及準備，是以為自己已經錯過了。另，RP 作 ἡμέρα τοῦ Χριστοῦ（hēmera tou Christou），和合本「主的日子」跟批判本。<\/p><\/blockquote>","exp":"<p>〔太〕太 24:4--6（馬太福音講義第 24 章）<\/p><p>馬太福音講義第 24 章講過橄欖山講論：門徒問「甚麼時候」，主耶穌第一句答的是「你們要謹慎，免得有人迷惑你們」（太 24:4），接著說「總不要驚慌」（太 24:6）。保羅寫 2:2，用的是主耶穌的字。<strong>使徒處理末日恐慌，沒有發明新方法，只是把主的話再說一次。<\/strong><\/p><p>帖撒羅尼迦人遇到甚麼？一則消息：「主的日子現在到了」。原文是完成式，意思是「已經到了」。想想他們的處境：逼迫一天比一天重（1:4），前書又說過主的日子要「好像夜間的賊一樣」（帖前 5:2）。賊既然已經來過，主卻沒有來接我們，那麼我們是不是被留下了？這不是好奇，是恐懼。被搖動的不只是時間表，是他們的得救確據。<\/p><p>保羅回應的第一筆，不是更正日期，而是先提醒他們要見的是誰：「論到我們主耶穌基督降臨和我們到他那裡聚集」（2:1）。主的降臨與我們的聚集，被一個冠詞綁在一起——那一天不是丟下你們的日子，是把你們招聚到他那裡的日子。被提的時間各派有不同看法，但沒有一派說主要來，卻把屬他的人忘了。<\/p><p>然後是全卷的命令：「不要輕易動心，也不要驚慌」（2:2）。「輕易」原文是「很快地」。保羅沒有說「永遠不要有感覺」，他說的是不要被第一個浪就打離了理智。三個來源——有靈、有言語、有冒我名的書信——就是今天的「有弟兄得了異象」「聽說某某牧師講」「群組轉傳」。自稱「有靈」的，不一定是聖靈；保羅在前書已經說過：「但要凡事察驗」（帖前 5:21）。<strong>聖靈的引導，從來不怕被察驗。<\/strong><\/p><p>所以一則末日訊息進來的時候，先不急著轉傳，先問：它把我帶到主耶穌面前，還是帶到恐懼面前？一個真正的消息會叫人抬頭等主；一個假的消息會叫人低頭算日子。帖撒羅尼迦後書第 2 章，就從這一個「慢一點」開始。<\/p>"},{"a":3,"z":3,"star":2,"grk":"<p lang=\"grc\">μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ἀνομίας ὁ υἱὸς τῆς ἀπωλείας,<\/p>","lit":"<p>不要讓任何人用任何方式欺騙你們；因為若不是那背叛先來，並且那不法的人被顯露出來，就是那沉淪之子——<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>μή τις ὑμᾶς ἐξαπατήσῃ<\/td><td>mē tis hymas exapatēsē<\/td><td>不要讓任何人欺騙你們<\/td><td>追蹤二第一站<\/td><\/tr><tr><td>κατὰ μηδένα τρόπον<\/td><td>kata mēdena tropon<\/td><td>用任何方式<\/td><td>3:16「隨事」是同一個字<\/td><\/tr><tr><td>ἡ ἀποστασία<\/td><td>hē apostasia<\/td><td>那背叛<\/td><td>冠詞：他們已經聽過的那一件<\/td><\/tr><tr><td>πρῶτον<\/td><td>prōton<\/td><td>先<\/td><td>次序，不是日期<\/td><\/tr><tr><td>ὁ ἄνθρωπος τῆς ἀνομίας<\/td><td>ho anthrōpos tēs anomias<\/td><td>不法的人<\/td><td>SBLGNT；RP 作 ἁμαρτίας<\/td><\/tr><tr><td>ὁ υἱὸς τῆς ἀπωλείας<\/td><td>ho hyios tēs apōleias<\/td><td>沉淪之子<\/td><td>約 17:12 同一個片語<\/td><\/tr><\/table>","gram":"<p><strong>2:3 開頭是一道禁令，後面是一個沒有寫完的句子。<\/strong>μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον（mē tis hymas exapatēsē kata mēdena tropon）：μή（mē） 加不定過去假設語氣，「連一次都不要讓人騙了」。κατὰ μηδένα τρόπον（kata mēdena tropon） 的 τρόπος（tropos），到 3:16 變成「隨時隨事」的 ἐν παντὶ τρόπῳ（en panti tropō）——<strong>沒有任何方式能騙你，因為主在每一個方式裡給你平安。<\/strong><\/p><p>接著 ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον（hoti ean mē elthē hē apostasia prōton）……只有條件，沒有結論。保羅寫到一半就轉去描寫那人，結論要讀者自己補；和合本補成「那日子以前」，是正確的意思：除非先有這些事，主的日子不會來。保羅給的是<strong>次序<\/strong>，不是日期。<\/p><p>ἡ ἀποστασία（hē apostasia） 有冠詞，是帖撒羅尼迦人聽過的那一件。讀法有三：① 教會內大規模的背道（多數釋經者；這使我們想起太 24:12 不法增多、愛心冷淡）；② 世界對神公然的叛逆（字在七十士譯本常指政治或宗教的叛亂，許多學者兼採①②）；③ 教會的「離去」，即被提（少數時代論者，取字根「離開」的延伸義；多數學者不接受）。本講義取①②。<\/p><blockquote><p>◆ 經文鑑別 2:3：SBLGNT 作 ὁ ἄνθρωπος τῆς ἀνομίας（ho anthrōpos tēs anomias）「不法的人」（西乃抄本、梵蒂岡抄本等）；RP 與拜占庭傳統作 ἁμαρτίας（hamartias）「罪的人」，和合本「大罪人」跟的是這一讀。到了 2:8，和合本又照原文 ὁ ἄνομος（ho anomos） 譯作「不法的人」——<strong>和合本在 2:3 與 2:8 用了兩個名字，指同一位。<\/strong>本講義判斷：取 ἀνομίας（anomias）。抄寫者把罕見的說法換成常見的「罪」較容易，反過來難；而且 2:7 τῆς ἀνομίας（tēs anomias）、2:8 ὁ ἄνομος（ho anomos） 前後呼應，這一段的關鍵字是「不法」——不受任何法管、自己就是法——不是一般的「罪」。<\/p><\/blockquote><p>那人是誰？讀法有四，各寫誰這樣讀：① 末日一位具體的人物，就是約翰書信說的「那敵基督的」（愛任紐以來的多數教父、今天多數前千禧年派）；② 歷史上一再出現的原型，從安提阿古四世、卡利古拉到尼祿（部分歷史批判學者與無千禧年派）；③ 一個體制：改教家曾把它指認為教皇制度——這是歷史事實，本講義只陳列，不採用，也不是拿來攻擊天主教的弟兄姊妹；④ 前兩者兼有：原型一再出現，最後有一位總結者（許多福音派釋經者）。ὁ υἱὸς τῆς ἀπωλείας（ho hyios tēs apōleias） 是希伯來式說法，「屬於沉淪的」，主耶穌在約 17:12 用同一個片語說猶大：<strong>他的結局寫在他的名字裡。<\/strong><\/p>","exp":"<p>〔太〕太 24:4--5（馬太福音講義第 24 章）<\/p><p>「人不拘用甚麼法子，你們總不要被他誘惑」（2:3）。保羅回答「主的日子已經到了」的方法，不是給一張新的時間表，而是說：還沒有，因為有兩件事還沒發生。這兩件事是路標，不是倒數計時器。路標的用處，是讓人知道自己還沒到，不必慌。<\/p><p>前書說主的日子「好像夜間的賊一樣」（帖前 5:2），後書說「那日子以前，必有……」。兩封信不矛盾，是兩種藥。前書醫的是怠慢：不要以為還早；後書醫的是躁進：不要以為已經到了。<strong>一個人只聽前書會打瞌睡，只聽後書會開始算日子；兩封合讀，才是警醒又安靜。<\/strong><\/p><p>那人有兩個名字。「不法的人」說他的本質：他不是犯了幾條法，是不承認有任何法在他之上。「沉淪之子」說他的去處：故事還沒開始，結局已經寫好。保羅先報結局，再描寫他的狂妄，讀的人就不會被他的狂妄嚇倒。<\/p><p>兩千年來，這個名字被安在尼祿、穆罕默德、教皇、拿破崙、希特勒身上，近年又被安在晶片、條碼、數位貨幣和各種政治人物身上。<strong>每一次都錯了，每一次都有人因此賣房子、辭工作、離開教會。<\/strong>這不是保羅寫這節的目的。他說「不要被誘惑」，最常見的誘惑，恰恰是自以為已經認出大罪人。本講義不替任何人、政權、宗教或科技貼上這個名字；保羅自己也沒有貼。<\/p>"},{"a":4,"z":4,"star":3,"grk":"<p lang=\"grc\">ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.<\/p>","lit":"<p>那抵擋又高抬自己、超過一切被稱為神的或被敬拜之物的，以致他坐進神的殿裡，展示他自己就是神。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὁ ἀντικείμενος<\/td><td>ho antikeimenos<\/td><td>那抵擋的<\/td><td>現在分詞：一直站在對面<\/td><\/tr><tr><td>ὑπεραιρόμενος<\/td><td>hyperairomenos<\/td><td>高抬自己<\/td><td>中間語態：自己把自己抬上去；林後 12:7 同字<\/td><\/tr><tr><td>ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα<\/td><td>epi panta legomenon theon ē sebasma<\/td><td>超過一切稱為神的或受敬拜的<\/td><td>σέβασμα 與徒 17:23 雅典「所敬拜的」同字<\/td><\/tr><tr><td>εἰς τὸν ναὸν τοῦ θεοῦ<\/td><td>eis ton naon tou theou<\/td><td>進神的殿<\/td><td>ναός：內殿、至聖所<\/td><\/tr><tr><td>καθίσαι<\/td><td>kathisai<\/td><td>坐下<\/td><td>坐：王的姿勢<\/td><\/tr><tr><td>ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός<\/td><td>apodeiknynta heauton hoti estin theos<\/td><td>展示自己就是神<\/td><td>現在分詞：不停地展示<\/td><\/tr><\/table>","gram":"<p><strong>2:4 是一條往上爬的梯子，四級。<\/strong>ὁ ἀντικείμενος καὶ ὑπεραιρόμενος（ho antikeimenos kai hyperairomenos） 兩個分詞共用一個冠詞：抵擋與高抬是同一個人的兩面——對神是站在對面，對自己是往上抬。ὑπεραιρόμενος（hyperairomenos） 是中間語態，「把自己抬到上面」；新約只有另一處用它，就是保羅說自己：「免得我過於自高」（林後 12:7）。連使徒都需要一根刺來防備這個動詞。<\/p><p>ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα（epi panta legomenon theon ē sebasma）：λεγόμενον（legomenon）「被稱為」帶一點保留，那些神只是被叫作神；σέβασμα（sebasma） 是受敬拜之物，保羅在雅典說「觀看你們所敬拜的」（徒 17:23），用的是同一個字。ὥστε（hōste） 引出結果：αὐτὸν εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι（auton eis ton naon tou theou kathisai），「以致他坐進神的殿」。ναός（naos） 不是整個聖殿院落，是內殿；坐，是王與審判者的姿勢。最後 ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός（apodeiknynta heauton hoti estin theos），現在分詞，他不停地展示、證明自己是神。RP 在「坐」前加 ὡς θεὸν（hōs theon），和合本跟批判本，不譯。<\/p><p>舊約的語言很濃，但都沒有標明引用，一律是「這使我們想起」：「自高自大，超過所有的神」（但 11:36）；「我是神；我在海中坐神之位」（結 28:2）；主耶穌自己也說過「那行毀壞可憎的」站在聖地（太 24:15）。<\/p><p><strong>「殿」的三種讀法<\/strong>：① 將來重建的耶路撒冷聖殿，字面的殿（多數時代論前千禧年派）；② 比喻：坐上神的位子、篡奪敬拜（許多改革宗與歷史釋經者，取結 28:2 的意象）；③ 教會：保羅在林前 3:16 用 ναός（naos） 指信徒群體（部分教父與改教家）。本講義不定於一說；三種讀法共同的核心，是一個受造的人坐上了只屬於神的位子。<\/p>","exp":"<p>〔太〕太 24:15（馬太福音講義第 24 章）<\/p><p>這是全卷地勢的最低點。馬太福音講義第 24 章講過「那行毀壞可憎的」站在聖地，主耶穌只用了一句。保羅多出來的第一筆，是那人的<strong>心理<\/strong>：「他是抵擋主，高抬自己，超過一切稱為神的和一切受人敬拜的，甚至坐在神的殿裡，自稱是神」（2:4）。<\/p><p>看那四級梯子。先是抵擋，站到神的對面；再是高抬，把自己抬過一切；然後是坐下，進到神的殿裡；最後是自稱，對眾人宣告「我就是」。這條路在聖經第一頁就有了。蛇對人說：「你們便如神能知道善惡」（創 3:5）。推羅王說：「我是神；我在海中坐神之位」（結 28:2）。大罪人不是新發明，是人類最古老的那個念頭長到了盡頭。<\/p><p>所以讀 2:4，最大的試探是馬上去找一張臉，套在某個政治人物或某個宗教領袖身上。保羅沒有這樣做，他在 2:7 說「那不法的隱意已經發動」（2:7）——已經，在當時，也在每一個時代的人心裡。約翰也說：「現在已經有好些敵基督的出來了」（約壹 2:18）。<strong>2:4 不是一張通緝令，是一面鏡子。<\/strong><\/p><p>321 說：驕傲是離開本位抓住權力，離開人的本位抓住神的權力，想要代替神。2:4 是這句話最濃縮的一幅畫，一個字不差。我不會坐進耶路撒冷的聖殿，但我可能在家裡坐上神的位子：我說了算，我的時間表就是神的時間表，我的判斷不必被任何人質疑。我可能在服事裡坐上去：台上的位子、決定權、「沒有我不行」。<strong>大罪人的反面，不是找出大罪人的人，是一個讓耶穌作王、自己回到本位的人。<\/strong>讀完這一節，該問的不是「他是誰」，是「我今天坐在哪裡」。<\/p>"},{"a":5,"z":5,"star":1,"grk":"<p lang=\"grc\">οὐ μνημονεύετε ὅτι ἔτι ὢν πρὸς ὑμᾶς ταῦτα ἔλεγον ὑμῖν;<\/p>","lit":"<p>你們不記得嗎？我還在你們那裡的時候，就常常把這些事告訴你們。<\/p>","key":"","gram":"<p><strong>2:5 是一個期待「是」的修辭問句。<\/strong>οὐ μνημονεύετε（ou mnēmoneuete）……用 οὐ（ou） 起頭，問的人預期對方答「記得」：你們當然記得。這一節的主詞忽然從全信的「我們」變成單數的「我」：ἔτι ὢν πρὸς ὑμᾶς ταῦτα ἔλεγον ὑμῖν（eti ōn pros hymas tauta elegon hymin）。在這封三人署名的信裡，保羅本人的聲音只冒出來兩次，一次在這裡，一次在 3:17 的親筆簽名——都和「真的是我說的」有關。<\/p><p>ἔλεγον（elegon） 是未完成式，「常常說、一再地說」：在帖撒羅尼迦那段很短的日子裡，末世不是一次的講題，是反覆教過的功課。ἔτι ὢν（eti ōn） 是現在分詞，「還在的時候」，對照後來被迫離開。這一節與 2:6 的 οἴδατε（oidate） 是全段的鑰匙：<strong>保羅講過，他們聽過，我們沒有聽過。<\/strong>我們手上的是一封信的後半段對話，前半段的口頭教導沒有留下來。<\/p>","exp":"<p>〔背景〕徒 17:1--4（使徒行傳講義第 17 章）<\/p><p>使徒行傳講義第 17 章講過帖撒羅尼迦的建立：「保羅照他素常的規矩進去，一連三個安息日，本著聖經與他們辯論」（徒 17:2），接著暴民闖進耶孫的家，弟兄們連夜把保羅送走。前後不過幾個星期。可是就在這麼短的時間裡，保羅已經把主的再來、那日子以前的事，一再講給這群剛信主的人聽。<strong>末世論不是給資深信徒的高級課程，是初信的人最早需要的安慰。<\/strong><\/p><p>「你們不記得嗎？」這句話不是責備，是喚醒。帖撒羅尼迦人不是沒學過，是一則消息進來，把學過的蓋住了。改變觀念最常斷在這裡：聽過、信過，到了浪打來的那一刻，忘了。所以保羅不再教新東西，只說：想起來。<\/p><p>這一節也教我們謙卑。奧古斯丁讀到這裡，坦白說他完全不知道保羅指的是甚麼。這不是失敗，是誠實。帖撒羅尼迦人記得的那一頁，我們沒有；把這一頁的空白承認下來，比假裝手上有一張完整的末日圖表，更忠於經文。<\/p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ἑαυτοῦ καιρῷ·<\/p>","lit":"<p>而現在，那攔阻的，你們是知道的，為要叫他在他自己的時候被顯露出來。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>καὶ νῦν<\/td><td>kai nyn<\/td><td>而現在<\/td><td>時間的「現在」，或語氣的「至於」<\/td><\/tr><tr><td>τὸ κατέχον<\/td><td>to katechon<\/td><td>那攔阻的（中性）<\/td><td>2:7 換成陽性 ὁ κατέχων<\/td><\/tr><tr><td>οἴδατε<\/td><td>oidate<\/td><td>你們知道<\/td><td>帖撒羅尼迦人知道；我們不知道<\/td><\/tr><tr><td>εἰς τὸ ἀποκαλυφθῆναι αὐτὸν<\/td><td>eis to apokalyphthēnai auton<\/td><td>為要叫他被顯露<\/td><td>被動：顯露的時間不由他定<\/td><\/tr><tr><td>ἐν τῷ ἑαυτοῦ καιρῷ<\/td><td>en tō heautou kairō<\/td><td>在他自己的時候<\/td><td>被指定、被管著的時候<\/td><\/tr><\/table>","gram":"<p><strong>2:6 是全段最難的一節。<\/strong>καὶ νῦν τὸ κατέχον οἴδατε（kai nyn to katechon oidate）：τὸ κατέχον（to katechon） 是中性分詞，「那攔阻的東西」；下一節換成陽性 ὁ κατέχων（ho katechōn），「那攔阻的人」。同一個動詞，一中一陽，像是同一個力量有一個背後的位格，或一個體制有一個代表的人。κατέχω（katechō） 新約常見，多半是「抓住、持守」（2:15 的「堅守」是另一個字）；這裡是「攔住、壓住」。少數學者讀成「掌權、佔據」，指邪惡勢力本身，但多數不採。<\/p><p><strong>各家讀法<\/strong>（4.7 乙），每一種寫明誰這樣讀：<\/p><blockquote><p>① 羅馬帝國與皇帝：中性指帝國的秩序，陽性指在位的皇帝。特土良、屈梭多模等多數教父這樣讀，是最早、最常見的讀法。<\/p><p>② 政府與法治的普遍原則：把羅馬的讀法擴大到一切掌權者對罪惡的約束（許多改革宗與近代釋經者；這使我們想起羅 13:1--4）。<\/p><p>③ 聖靈，或聖靈藉著教會：中性對應 πνεῦμα（pneuma），陽性指聖靈的位格；聖靈連同教會被挪開，就是教會被提（多數主張災前被提的時代論前千禧年派）。<\/p><p>④ 福音的傳揚與保羅本人：福音必須先傳遍，陽性指那位宣教的使徒（加爾文讀作福音的傳揚；近代庫爾曼等讀作宣教與保羅）。<\/p><p>⑤ 天使長米迦勒：「保佑你本國之民的天使長米迦勒必站起來」（但 12:1）（部分近代學者）。<\/p><p>⑥ 神自己的主權：攔阻的終極是神，中性陽性都在說祂的管制（部分釋經者，常與其他讀法並用）。<\/p><\/blockquote><p>本講義的判斷：<strong>不定於一說。<\/strong>決定性的字是 οἴδατε（oidate），「你們知道」——帖撒羅尼迦人知道，因為 2:5 保羅當面講過；我們不知道。後半句 εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ἑαυτοῦ καιρῷ（eis to apokalyphthēnai auton en tō heautou kairō） 卻說得很清楚：ἀποκαλυφθῆναι（apokalyphthēnai） 是被動，「被顯露」；ἐν τῷ ἑαυτοῦ καιρῷ（en tō heautou kairō），「在他自己的時候」——那是一個被指定的時候。不管攔阻的是誰，那人的出場時間不由他自己決定。<\/p>","exp":"<p>〔太〕太 24:36（馬太福音講義第 24 章）<\/p><p>「現在你們也知道，那攔阻他的是甚麼」（2:6）。這一句讀到今天的我們，最誠實的回應是：帖撒羅尼迦人知道，我們不知道。六種讀法各有理由，也各有一批敬虔的弟兄姊妹。有人因為相信攔阻的是聖靈與教會，所以相信災前被提；有人相信是政府與法治，所以為在上掌權的禱告。這些都是福音派之內的讀法，都是弟兄。<\/p><p>保羅多出來的第二筆，就是這個「攔阻的」。它最大的意思不在名字，在動作：<strong>邪惡被攔著。<\/strong>大罪人想顯露，但要等「到了的時候」；那個時候是他自己的，卻不是他自己定的。像一隻被拴著的狗，叫得再兇，鍊子的長度不在牠手裡。<\/p><p>對帖撒羅尼迦人來說，這是很實際的安慰。他們每天面對的暴民與地方官，看起來沒有人管得住；保羅卻說，連那最終的不法者都要等一個被指定的時候。今天在逼迫、在不公義裡的人也一樣：惡看起來沒有邊，其實有一條線，畫線的不是惡人。<\/p><p>主耶穌自己為這件事畫了天花板：「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道」（太 24:36）。既然連子都說不知道，任何人拿出一張推算到年份的圖表，就已經越過了主耶穌畫的線。<\/p><p>所以講台上的落點只有一句：<strong>我們不知道攔阻的是誰，但我們知道誰掌權；我們不知道那日子是哪一天，但我們知道那天的結局。<\/strong>這一個「不知道」，交給會眾，不是削弱信心，反而是對抗末日恐慌最好的藥。人害怕，常常因為以為自己必須知道一切；信心卻是：我不知道，但我認識那位知道的。<\/p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.<\/p>","lit":"<p>因為那不法的奧祕已經在運行；只是那攔阻者現在攔阻著，直到他從中間被挪開。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὸ γὰρ μυστήριον<\/td><td>to gar mystērion
